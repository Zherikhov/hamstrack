name: Build

# Build + test on every push / PR. Publish the image on main and on release tags
# (the semver tags self-hosters pin to), then cut the matching GitHub Release.
# Deploying the owner's prod lives in a separate workflow (deploy.yml).
#
# `latest` is published by BOTH main pushes and stable release tags (HD-115).
# It used to be main-only, which made a release reach prod ONLY if the tag was
# pushed before the main build: the version is baked into the image, prod tracks
# `latest`, so a tag pushed second produced a correct `X.Y.Z` image nobody ever
# pulled while prod kept serving `<prev-tag>-<N>-g<sha>` (observed 2026-08-16).
# Publishing `latest` from tag builds too makes the push order irrelevant —
# whichever build finishes last stamps the same version, because `git describe`
# on a tagged commit returns the exact tag. Guard rails, see the `ver` step:
# a tag build moves `latest` only when the tagged commit is main's current tip
# (so tagging an OLD commit can never roll prod back) and only for stable tags
# (a `-rc1`/`-beta` tag still publishes its own semver image + a pre-release
# GitHub Release, but never touches `latest` and never deploys).
#
# Tag forms: BOTH `v0.12.6` and bare `0.12.6` are accepted — the repo carries
# both conventions, and a tag matching no filter publishes NOTHING silently
# (exactly what happened to 0.5.0 … 0.12.5: no image, no release). Everything
# downstream strips the leading `v`, so the two forms are interchangeable.
#
# `push` is deliberately NOT `branches: ["**"]`. It used to be, and every commit
# on a branch with an open PR was validated TWICE — measured on 2026-08-16:
# runs 40/41 both ran the full suite on 9ae88a5, runs 43/44 both on 6cab999,
# ~6 minutes each, identical work. Feature branches are covered by the
# `pull_request` trigger instead. Consequence to know about: a branch with NO
# open PR gets no CI until one is opened.
on:
  push:
    branches: [main]
    tags: ["v[0-9]*", "[0-9]*"]
  pull_request:
    branches: [main]
  # Manual rebuild of any ref without inventing a commit (Actions → Build → Run
  # workflow, pick main or a tag). Previously the only way to re-publish `latest`
  # was "Re-run all jobs" on an existing run, which requires that run to exist.
  # A dispatched run on main/a tag publishes the image and chains the deploy
  # exactly like a push does — see the `if:` on build-and-push and deploy.yml.
  workflow_dispatch:

# Supersede a run when its ref gets another push (typical during a PR review
# loop). NEVER on main or a tag: cancelling there would also cut the deploy
# chain (deploy.yml runs on `workflow_run` of a successful Build on main or on
# a release tag) and could abort a half-published image. Note this means a main
# Build and its release-tag Build are in DIFFERENT groups and run in parallel —
# they publish the same version string, and the `latest`-must-move-forward guard
# in `ver` below is what keeps a finish-order surprise from mattering.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # GitHub spins up a real PostgreSQL alongside the job
    # so our Spring Boot tests have an actual DB to connect to
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hamstrack_test
          POSTGRES_USER: hamstrack
          POSTGRES_PASSWORD: hamstrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: AgentChecklistFreshnessTest dates CLAUDE.md's rules against
                                # .claude/agents/, and on the default depth-1 clone every line blames to the
                                # boundary commit, so the comparison would pass for free (HD-304)

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # caches ~/.m2 between runs — much faster

      # ONE Maven invocation, not `package -DskipTests` followed by `test`.
      # frontend-maven-plugin is bound to `generate-resources` (pom.xml), which
      # every lifecycle run passes through — so two invocations downloaded Node
      # and ran `npm install` + `vite build` TWICE per job (~40-60s of pure
      # waste). `-Dfrontend.skip=true` is a real skip since HD-94, but it is NOT
      # the fix here and must stay OFF in CI: this job's `package` step is what
      # produces the JAR the image ships, so the SPA has to be built exactly
      # once. `verify` covers both: compile → test → package, with
      # the frontend built once. A compile error still fails before any test
      # runs, so the old "compile check first" fast-fail is preserved.
      #
      # SINCE HD-242 THIS COMMAND ALSO RUNS THE FRONTEND SUITE. There is no
      # separate `npm test` step here on purpose. `vitest run` had run on no
      # automated path at all — CI's only command was this one, and the three
      # frontend executions build the SPA (`tsc -b && vite build`) without
      # executing a single test, so a type error broke the build and a
      # behavioural regression did not. `src/licensing.test.ts`, the HD-194 seal
      # against the "open source" claim returning, could only ever fail a person
      # who remembered to type the command. The fix is a fourth execution in
      # pom.xml (`npm-test`, bound to the `test` phase) rather than a step here,
      # because a step here would leave `./mvnw verify` an incomplete gate that
      # everyone treats as a complete one — which is precisely how this hid.
      # Anything that runs the lifecycle now runs the suite; read the long
      # comment on that execution before changing this.
      #
      # WHAT TO LOOK FOR IN THIS STEP'S LOG. Three lines, all from the frontend
      # executions (`--- frontend:1.15.1:npm (npm-lint) ---`, then `(npm-test)`):
      #
      #   * `Test Files … / Tests …` — the COUNT. A test step that silently
      #     matched nothing is the failure mode being guarded here, and it looks
      #     identical to a green one everywhere except this line. An empty match
      #     is red (`vitest run` exits 1, verified by pointing the include glob at
      #     an empty directory) and `--passWithNoTests` is deliberately absent from
      #     the whole repo; since HD-301 a PARTIAL match is red too — the
      #     `[vitest-tree]` line from the guard below compares the modules this run
      #     executed against the test files git reports under src/main/frontend.
      #     So this line is now the DRIFT, which nothing enforces: 73 files going
      #     to 60 with all 60 executed is green and visible only here.
      #
      #   * `margin survey — testTimeout …ms, slowest …ms (…%)` — HD-240's
      #     standing report of the five slowest tests as a percentage of the
      #     timeout bound. It never fails a run; it is the number to READ. Every
      #     figure behind that bound was taken on a 12-core dev box (there,
      #     slowest ≈ 15-27%) using oversubscription as a stand-in for a runner
      #     nobody had ever measured — THIS log is the first real measurement of
      #     a GitHub-hosted runner. If the slowest test sits above ~50% here, the
      #     bound is sized for the wrong machine and wants revisiting; the one
      #     response that is not available is muting the suite, because a suite
      #     nobody runs is the state HD-242 exists to end and it would cost ~50s
      #     a build to stay in it.
      #
      #   * `[eslint] N files linted (floor 200) · … errors · … warnings ·
      #     … suppressed (HD-177)` — HD-300's witness, from the npm-lint
      #     execution. Same question as the first bullet, for the lint gate: a
      #     run that lints nothing exits 0 and reads exactly like a clean tree.
      #     `N` was 231 on 2026-09-11. The FLOOR IS DELIBERATELY SLACK — it fires
      #     on a collapse (an `ignores` that swallowed the tree takes N to single
      #     digits), not on the drift, so a change that takes 231 to 205 is GREEN,
      #     enforced by nothing, and visible only here. A drop toward the floor
      #     means an `ignores` or a target changed, not that the tree got smaller.
      #     The suppressed count is the HD-177 debt and may only go down; lint.mjs
      #     itself refuses it going up, so a rise cannot reach this line.
      #
      # EVERY automated suite here proves how much of its own tree it executed,
      # and refuses a run that cannot show it — the `test-tree-coverage-guard`
      # execution in pom.xml, one arm per suite. It exists because a green
      # `mvnw test` once reported four zeros over a plan missing whole packages,
      # and the only thing that noticed was a human remembering a different total
      # (HD-265); the SPA suite got the same guarantee in HD-301. The lines to
      # glance at are `[test-tree] all N test classes ... executed in this run`
      # and `[vitest-tree] all N test files ... executed in this run (M tests)`,
      # and the step after this one puts both counts in the job summary. Each arm
      # disarms itself honestly and prints which switch did it — and NOT on the
      # same switches: `-Dtest=` narrows surefire only and leaves the vitest arm
      # answerable, `-Dfrontend.skip=true` is the reverse. That is why the image
      # build in build-and-push (`package -DskipTests`, which reaches both)
      # neither pays for either suite nor is refused by either arm.
      #
      # COST: measured +45-70s per non-skipped build on a dev box (see pom.xml).
      # Local fast loops keep `-Dfrontend.skip=true`, which switches EVERY
      # frontend execution off together — it is bound at the plugin level, so a
      # new execution inherits it and no count here can go stale; the image build in `build-and-push`
      # pays nothing either, because its `package -DskipTests` skips a
      # `test`-phase frontend execution the same way it skips surefire.
      # DeployVerifyOracleTest (HD-299) brings up a scratch Compose project on the
      # runner's own daemon to read REAL containers back — a real `docker update
      # --memory` surviving a real `up -d`, which is HD-189's finding and which no
      # stub can establish. It deliberately never pulls: a test that pulls inside
      # its own body is a test that fails on a registry outage. So the image is
      # arranged HERE, as a step, and not left to the `postgres:16-alpine` service
      # container that happens to sit beside this job — that is a side effect of a
      # `services:` block somebody may re-version or drop, and the test's failure
      # mode when it goes is a SKIP, which is green. The pairing is enforced from
      # both ends: this step, and the test's own
      # ciCannotLoseTheRealDaemonAssertionToASkip, which refuses a skip whenever
      # CI/GITHUB_ACTIONS is set and separately refuses this line's absence.
      #
      # `image inspect || pull`, not a bare pull, for two reasons that are the same reason.
      # (1) A REGISTRY BLIP MUST NOT RED A BUILD over an image that is already on the disk —
      # and it usually is, because the `services:` block above made the runner pull this very
      # tag. (2) That is exactly why the cost is ~0s in practice — but the comment above says
      # not to RELY on that block, and relying on it for CORRECTNESS is what this step exists
      # to stop; relying on it for SPEED is fine, and the `||` is what keeps the two apart. If
      # the services block is ever re-versioned or dropped, this step starts actually pulling
      # (a few seconds) and nothing breaks.
      - name: Pull the image the real-daemon ops oracles run on
        run: docker image inspect postgres:16-alpine >/dev/null 2>&1 || docker pull postgres:16-alpine

      - name: Build and test (backend + frontend suites)
        run: ./mvnw -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/hamstrack_test
          DB_USERNAME: hamstrack
          DB_PASSWORD: hamstrack
          # Dummy value for tests only — JwtService requires >= 32 bytes (HMAC-SHA256)
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789

      # HD-301. How much of each tree the step above executed, without arithmetic
      # and without scrolling: one row per suite (jvm, vitest) with the executed
      # count, the tree count, the test count and the verdict.
      #
      # `if: always()` is the load-bearing part, and the run it is load-bearing FOR
      # is the one THIS GUARD failed: the counts matter most there, and a summary
      # written only on green is a summary nobody reads when it would help. It says
      # nothing about the other four red paths — a failure in compile, surefire,
      # npm-lint or npm-test aborts before the antrun step, so no summary is written
      # and the fallback below is all there is. Both arms disarm honestly and say so
      # in their row, so a `disarmed by …` line here is information, not a hole.
      #
      # The fallback REFUSES rather than notes. It used to `echo` and exit 0, which
      # made it a note in a place nobody looks; the one case where it fires on an
      # otherwise-green job is the guard having been switched off in place
      # (-Dmaven.antrun.skip=true, now pinned in the pom) or its execution deleted —
      # precisely the case where nothing else goes red. On the four paths where a
      # suite already failed the job is red anyway, so this costs nothing there.
      - name: Test-tree counts in the job summary
        if: always()
        run: |
          if [ -f target/test-tree-summary.md ]; then
            cat target/test-tree-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            message="no test-tree summary was written: either a suite went red before the guard ran, or the guard itself was skipped or deleted. The step above separates them — if it is RED, read its failure and fix that; if it is GREEN, nothing compared either suite against its tree on this run and the guard is what to look at."
            echo "::error title=Test-tree guard did not run::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # Build the Docker image and push to GitHub Container Registry.
  # Gated on green tests; runs on main pushes, release tags and manual
  # dispatches of either — never on PRs (a PR must not publish an image).
  build-and-push:
    needs: build-and-test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # needed to push to ghcr.io

    # Published so `github-release` can name the exact image it extracts the JAR from
    # without re-deriving any part of that name. The tag branch of the `ver` step below is
    # one line (`${GITHUB_REF_NAME#v}`) and copying it here would be a second answer to
    # "which version is this build" the day somebody changes either copy — the repository
    # has already paid for that shape (`latest` moving, HD-115). One derivation, one value,
    # three times over:
    #
    #   * `version` — the asset FILENAME and the job summary. Not the pull reference.
    #   * `owner`   — the registry owner, lowercased ONCE (see the step).
    #   * `digest`  — the `sha256:…` of the manifest this job pushed. This is what the
    #     release job pulls by, and the reason is in the long comment on that step: a TAG
    #     is mutable and, for some tag shapes, is not even published by this run.
    outputs:
      version: ${{ steps.ver.outputs.version }}
      owner: ${{ steps.owner.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags so `git describe` resolves the version

      # Version source of truth is the git tag (pom.xml is a 0.0.0-DEV placeholder).
      # Tag build → the tag; any other build → nearest tag + commits since (or a sha).
      # The leading `v` is stripped in both branches, so `v0.12.6` and `0.12.6`
      # produce the identical APP_VERSION / image tags.
      #
      # Also decides whether THIS build may move the `latest` tag — the tag prod
      # pulls. main always may. A tag build may only when both hold:
      #   * the tag is stable (no `-`): pre-releases never reach prod;
      #   * the tagged commit is main's tip RIGHT NOW: `latest` must only ever
      #     move forward. Tagging an older commit — or main having moved on
      #     while the release built — would otherwise publish that older tree as
      #     `latest` and silently roll production back. The `X.Y.Z` / `X.Y`
      #     images and the GitHub Release are published either way, so a
      #     back-tag still gives self-hosters something to pin; it just does not
      #     touch prod. Read the printed reason in the job summary.
      - name: Determine app version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            T="${GITHUB_REF#refs/tags/}"
            V="${T#v}"
            git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main || true
            TIP=$(git rev-parse --verify --quiet refs/remotes/origin/main || true)
            HERE=$(git rev-parse HEAD)
            if [[ "$T" == *-* ]]; then
              LATEST=false; WHY="pre-release tag — publishes semver images only, no latest, no deploy"
            elif [[ -z "$TIP" ]]; then
              LATEST=false; WHY="could not resolve origin/main — refusing to move latest"
            elif [[ "$TIP" != "$HERE" ]]; then
              LATEST=false; WHY="tagged commit $HERE is not main's tip $TIP — latest would move backwards"
            else
              LATEST=true; WHY="tagged commit is main's tip"
            fi
          else
            V=$(git describe --tags --always 2>/dev/null || echo 0.0.0-dev)
            V="${V#v}"                                  # strip leading v for a clean dev version
            LATEST=true; WHY="default-branch build"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=\`$V\` · publish latest: \`$LATEST\` ($WHY)" >> "$GITHUB_STEP_SUMMARY"

      # `github.repository_owner` IS THE ACCOUNT LOGIN VERBATIM, AND THIS ACCOUNT'S LOGIN IS
      # `Zherikhov`. A registry reference must be lowercase — `docker pull
      # ghcr.io/Zherikhov/hamstrack:0.18` answers `invalid reference format: repository name
      # (Zherikhov/hamstrack) must be lowercase` (measured 2026-10-01) — and there is no
      # `toLower` in the GitHub expression language, so the fold happens here, in a shell, once
      # (`${var,,}`; `tr '[:upper:]' '[:lower:]'` is the other accepted form).
      #
      # It happens here rather than at the two use sites because of HOW the bug it fixes
      # hid. `docker/metadata-action` lowercases its `images:` input, so the raw expression was
      # correct in the one place that fed that action and WRONG in the one place that fed a bare
      # `docker pull` — the same seven characters, permitted or fatal depending on which key they
      # sat under. Folding at the source deletes that distinction instead of documenting it, and
      # leaves `WorkflowImageReferenceTest` one rule with no exclusion to keep alive: every
      # reference spells `ghcr.io/<this output>/hamstrack`, and this is the only place in
      # .github/workflows where the login is read.
      #
      # The equally important half: a LOCAL rehearsal of any step below that substitutes a
      # hand-typed `zherikhov` for this expression tests everything except the thing that was
      # broken. The expression layer is where the only defect lived.
      - name: Resolve the registry owner (lowercased)
        id: owner
        run: |
          set -euo pipefail
          # The login and its fold are ONE line on purpose: a reader, and
          # WorkflowImageReferenceTest, can then see them together, and no edit can leave the
          # raw login standing while the fold moves. `${var,,}` is bash's own lowercase
          # expansion (the default shell for a `run:` on ubuntu-latest).
          raw='${{ github.repository_owner }}'; name="${raw,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          [ "$raw" = "$name" ] || echo "Registry owner folded to lowercase: \`$raw\` -> \`$name\`" >> "$GITHUB_STEP_SUMMARY"

      # Required for the GitHub Actions cache below: the default `docker` driver
      # cannot export build cache, only the docker-container driver buildx sets
      # up here can. Without this step `cache-to: type=gha` silently does nothing.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by GitHub, no setup needed

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/hamstrack
          flavor: latest=false     # `latest` is controlled explicitly below (main + stable release tags)
          tags: |
            type=raw,value=latest,enable=${{ steps.ver.outputs.publish_latest }}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # `id:` is load-bearing, not decoration: it is what makes `steps.push.outputs.digest`
      # — the `sha256:…` of the manifest this push created — reachable as a job output, and
      # that digest is the only name for this image that cannot resolve to a different one
      # later. The action declares the output (`digest: Image digest` in its action.yml) and
      # sets it from the build result metadata (`src/main.ts`: `resolveDigest()` →
      # `core.setOutput('digest', …)`), both read at tag `v5` on 2026-10-01.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image rebuilds everything from scratch — `dependency:go-offline`,
          # npm install, vite build — a THIRD time per pipeline (~105s measured).
          # The Dockerfile is already layered so deps sit above `COPY src/`, but
          # a fresh runner has no local layer store to hit. `type=gha` gives it
          # one that survives between runs; mode=max also caches the discarded
          # build-stage layers, which is where all the slow work lives.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Cut the GitHub Release for a tag — gated on the image actually being
  # published, so a Release never advertises a version nobody can pull — and
  # attach the runnable JAR plus its SHA-256 (HD-321).
  # Re-running the workflow on the same tag updates the existing Release
  # instead of failing (the action is upsert-shaped).
  #
  # SINCE HD-321 THE CONVERSE IS TRUE AND IS NOT A BUG: a version can be pullable with no
  # Release. The JAR extraction below runs BEFORE the Release step, so a tag whose image
  # publishes and whose extraction then fails leaves the images on ghcr.io and cuts no
  # Release at all — and, because deploy.yml fires on `workflow_run` with
  # `conclusion == 'success'`, skips that tag's own deploy too. That is deliberate (a
  # correct checksum of a wrong JAR is worse than no asset), it is the one failure this
  # job adds, and it is written down as such in docs/release-checklist.md
  # § "What still fails (deliberately)" — the remedy is Actions → Build → Run workflow on
  # the same tag, which re-runs the extraction against the same digest.
  github-release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write           # creating a Release writes to the repo
      packages: read            # pulling the image the JAR is taken OUT of

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # THE JAR IS TAKEN OUT OF THE PUBLISHED IMAGE, not rebuilt and not taken from the
      # runner's `target/`. Three reasons, in order of how much they matter.
      #
      # (1) THE RUNNER'S JAR IS VERSIONED `0.0.0-DEV`. pom.xml carries that placeholder and
      #     the real version is injected INSIDE the image build (Dockerfile: ARG APP_VERSION
      #     → `versions:set`), so `build-and-test`'s artifact names and self-reports
      #     0.0.0-DEV. Publishing it against tag vX.Y.Z would ship an asset that denies its
      #     own version in the About dialog and in /api/meta. Measured on a locally built
      #     image: `--build-arg APP_VERSION=0.18.3-hd321` produced a JAR whose
      #     META-INF/build-info.properties reads `build.version=0.18.3-hd321`, and the
      #     released `0.18` image's JAR reads `build.version=0.18.2`.
      #
      # (2) BYTE-IDENTICAL TO WHAT THE CONTAINER RUNS, which is the whole diagnostic value
      #     of the bare-JAR path: "run the JAR directly to separate the application from its
      #     container" is only true of the same bytes. A rebuild here would be a different
      #     JAR (timestamps, build-info, dependency resolution) that merely claims to be the
      #     same one. Asserted by nothing and PROVEN per run by the digest comparison below.
      #
      # (3) It is taken from the image this job's `needs:` has already PUSHED — BY DIGEST, and
      #     that is the whole of the third reason rather than a detail of it. A TAG does not
      #     identify the image this run produced:
      #
      #       * it is mutable — `0.18` is a moving `{{major}}.{{minor}}` pointer that a later
      #         `0.18.3` build moves out from under this job;
      #       * and for some accepted tag shapes this run does not publish it at all. The
      #         trigger filter accepts a two-component tag, so `v0.18` is a legal tag; `ver`
      #         then yields `version=0.18`; `docker/metadata-action`'s `type=semver` cannot
      #         parse `0.18` and skips BOTH semver tags, so that run pushes no `0.18` image —
      #         while `ghcr.io/zherikhov/hamstrack:0.18` EXISTS, carrying some earlier
      #         release's bytes (`build.version=0.18.2` when this was written).
      #
      #         That run does NOT succeed quietly, which this bullet used to read as though it
      #         did. Two sub-cases: tagged at main's tip, the only surviving tag is `latest`
      #         (`type=sha` is off for a tag ref), so the run publishes `latest` and no
      #         version tag at all; tagged anywhere else, `steps.meta.outputs.tags` is EMPTY
      #         and `push: true` with no tags fails inside buildx — Build reds and this job
      #         never runs. Traced 2026-10-02 from the tag expressions above, not observed on
      #         a real run; pre-existing either way, and pulling by digest makes it moot.
      #
      #     Pull by tag and the identity check below cannot notice either case, because it
      #     compares the extracted file against the same file inside whatever it pulled: it is
      #     self-consistent by construction. It would have written a CORRECT CHECKSUM OF THE
      #     WRONG JAR and attached it to the Release. `needs.build-and-push.outputs.digest` is
      #     the `sha256:…` of the manifest that job pushed, so this reference has no name
      #     resolution left in it to be wrong — and it removes the malformed-reference case
      #     (an uppercase owner) from this step as a side effect, though the owner is folded
      #     at its source anyway because a digest reference still carries a repository name.
      #
      # The checksum exists because the image carries a provenance attestation in its OCI
      # index and a bare file on a Releases page carries nothing; without it this ticket
      # would ship a weaker artifact than the one the project already ships.
      #
      # WHAT THIS STEP CANNOT DO: it cannot prove the asset reached the Release. That is
      # `fail_on_unmatched_files` below, and the first observation of it is the first tag
      # cut after this change.
      - name: Take the JAR out of the image and checksum it
        env:
          # The owner is folded to lowercase once, in build-and-push; the digest is that job's
          # own push. `version` is used ONLY for the asset's filename — never to resolve bytes.
          IMAGE: ghcr.io/${{ needs.build-and-push.outputs.owner }}/hamstrack@${{ needs.build-and-push.outputs.digest }}
          JAR: hamstrack-${{ needs.build-and-push.outputs.version }}.jar
        run: |
          set -euo pipefail
          # An absent digest would make this `…/hamstrack@` and fail inside `docker pull` with
          # a reference-parse error that names neither this job nor the cause. The action sets
          # the output only when a digest resolves, so name the cause here instead.
          case "$IMAGE" in
            *@sha256:*) ;;
            *) echo "::error title=The pushed image has no digest::\
          build-and-push published no \`digest\` output, so this job has no way to name the \
          image that run produced and will not fall back to a mutable tag. Check that the \
          'Build and push Docker image' step still carries \`id: push\` and that the image \
          was pushed (reference was: $IMAGE)."
               exit 1 ;;
          esac
          docker pull -q "$IMAGE"
          # The digest of the file as it sits in the image, read by the image's own
          # sha256sum (busybox, present in eclipse-temurin:21-jre-alpine — verified).
          # --entrypoint, because the image's ENTRYPOINT is `java -jar app.jar`.
          inside=$(docker run --rm --entrypoint sha256sum "$IMAGE" /app/app.jar | cut -d' ' -f1)
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/app/app.jar" "$JAR"
          docker rm -v "$cid" >/dev/null
          outside=$(sha256sum "$JAR" | cut -d' ' -f1)
          if [ "$inside" != "$outside" ]; then
            echo "::error title=The published JAR is not the one in the image::\
          $JAR hashes $outside, /app/app.jar inside $IMAGE hashes $inside. The asset would \
          claim to be the container's own artifact while being a different file, so this \
          release publishes nothing until the copy is fixed."
            exit 1
          fi
          # `sha256sum`'s own format, so an operator checks it with `sha256sum -c <file>`
          # in the directory they downloaded into. Written AFTER the comparison: a checksum
          # of a file that failed the identity check would be a correct hash of a wrong JAR.
          sha256sum "$JAR" > "$JAR.sha256"
          {
            echo "Release asset \`$JAR\` ($(stat -c%s "$JAR") bytes)"
            echo ""
            echo "Taken from \`$IMAGE\` — the digest build-and-push pushed, so this line is the"
            echo "record of WHICH image the asset came out of. Nothing else in the run says it."
            echo ""
            echo "SHA-256 \`$outside\` — equal to \`/app/app.jar\` inside that image, so the"
            echo "asset and the container run the same bytes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create / update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # Auto-generated notes = merged PRs + new contributors since the
          # previous tag. Hand-written notes can be added in the UI afterwards;
          # a later re-run does NOT overwrite the body of an existing Release.
          generate_release_notes: true
          # `v1.0.0-rc1` / `0.13.0-beta` → pre-release, so `latest` on the
          # Releases page keeps pointing at the last stable tag.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The container-free install path (docs/self-hosting.md § Without Docker) tells a
          # reader to download these two. Before this change `gh release view` on v0.18.2
          # answered `"assets": []`, so that instruction would have named nothing.
          files: |
            hamstrack-${{ needs.build-and-push.outputs.version }}.jar
            hamstrack-${{ needs.build-and-push.outputs.version }}.jar.sha256
          # NOT the default. The default for an unmatched entry is a warning and a green
          # job, which is the one failure mode nobody would notice: a Release that cut
          # cleanly, published no JAR, and left the install path pointing at an absent file.
          # With this, a missing asset is a red release instead.
          fail_on_unmatched_files: true
