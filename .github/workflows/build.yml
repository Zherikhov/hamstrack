name: Build

# Build + test on every push / PR. Publish the image on main (rolling `latest`)
# and on release tags (the semver tags self-hosters pin to), then cut the
# matching GitHub Release. Deploying the owner's prod lives in a separate
# workflow (deploy.yml).
#
# Tag forms: BOTH `v0.12.6` and bare `0.12.6` are accepted — the repo carries
# both conventions, and a tag matching no filter publishes NOTHING silently
# (exactly what happened to 0.5.0 … 0.12.5: no image, no release). Everything
# downstream strips the leading `v`, so the two forms are interchangeable.
#
# `push` is deliberately NOT `branches: ["**"]`. It used to be, and every commit
# on a branch with an open PR was validated TWICE — measured on 2026-08-16:
# runs 40/41 both ran the full suite on 9ae88a5, runs 43/44 both on 6cab999,
# ~6 minutes each, identical work. Feature branches are covered by the
# `pull_request` trigger instead. Consequence to know about: a branch with NO
# open PR gets no CI until one is opened.
on:
  push:
    branches: [main]
    tags: ["v[0-9]*", "[0-9]*"]
  pull_request:
    branches: [main]

# Supersede a run when its ref gets another push (typical during a PR review
# loop). NEVER on main or a tag: cancelling there would also cut the deploy
# chain (deploy.yml runs on `workflow_run` of a successful Build on main) and
# could abort a half-published image.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # GitHub spins up a real PostgreSQL alongside the job
    # so our Spring Boot tests have an actual DB to connect to
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hamstrack_test
          POSTGRES_USER: hamstrack
          POSTGRES_PASSWORD: hamstrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # caches ~/.m2 between runs — much faster

      # ONE Maven invocation, not `package -DskipTests` followed by `test`.
      # frontend-maven-plugin is bound to `generate-resources` (pom.xml), which
      # every lifecycle run passes through — so two invocations downloaded Node
      # and ran `npm install` + `vite build` TWICE per job (~40-60s of pure
      # waste; `-Dfrontend.skip=true` cannot prevent it, the plugin has no
      # <skip> binding). `verify` covers both: compile → test → package, with
      # the frontend built once. A compile error still fails before any test
      # runs, so the old "compile check first" fast-fail is preserved.
      - name: Build and test
        run: ./mvnw -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/hamstrack_test
          DB_USERNAME: hamstrack
          DB_PASSWORD: hamstrack
          # Dummy value for tests only — JwtService requires >= 32 bytes (HMAC-SHA256)
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789

  # Build the Docker image and push to GitHub Container Registry.
  # Gated on green tests; runs on main pushes and on release tags — never on PRs.
  build-and-push:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # needed to push to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags so `git describe` resolves the version

      # Version source of truth is the git tag (pom.xml is a 0.0.0-DEV placeholder).
      # Tag build → the tag; any other build → nearest tag + commits since (or a sha).
      # The leading `v` is stripped in both branches, so `v0.12.6` and `0.12.6`
      # produce the identical APP_VERSION / image tags.
      - name: Determine app version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            T="${GITHUB_REF#refs/tags/}"
            echo "version=${T#v}" >> "$GITHUB_OUTPUT"
          else
            V=$(git describe --tags --always 2>/dev/null || echo 0.0.0-dev)
            echo "version=${V#v}" >> "$GITHUB_OUTPUT"   # strip leading v for a clean dev version
          fi

      # Required for the GitHub Actions cache below: the default `docker` driver
      # cannot export build cache, only the docker-container driver buildx sets
      # up here can. Without this step `cache-to: type=gha` silently does nothing.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by GitHub, no setup needed

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hamstrack
          flavor: latest=false     # `latest` is controlled explicitly below (rolling main, not releases)
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image rebuilds everything from scratch — `dependency:go-offline`,
          # npm install, vite build — a THIRD time per pipeline (~105s measured).
          # The Dockerfile is already layered so deps sit above `COPY src/`, but
          # a fresh runner has no local layer store to hit. `type=gha` gives it
          # one that survives between runs; mode=max also caches the discarded
          # build-stage layers, which is where all the slow work lives.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Cut the GitHub Release for a tag — gated on the image actually being
  # published, so a Release never advertises a version nobody can pull.
  # Re-running the workflow on the same tag updates the existing Release
  # instead of failing (the action is upsert-shaped).
  github-release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write           # creating a Release writes to the repo

    steps:
      - name: Create / update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # Auto-generated notes = merged PRs + new contributors since the
          # previous tag. Hand-written notes can be added in the UI afterwards;
          # a later re-run does NOT overwrite the body of an existing Release.
          generate_release_notes: true
          # `v1.0.0-rc1` / `0.13.0-beta` → pre-release, so `latest` on the
          # Releases page keeps pointing at the last stable tag.
          prerelease: ${{ contains(github.ref_name, '-') }}
