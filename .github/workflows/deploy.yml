name: Deploy to production

# Owner-only: continuous deploy of the rolling `latest` image AND of the
# repository-owned configuration for the built commit (HD-199 — what is synced is
# ops/deploy/synced-paths.txt, how it is applied is ops/deploy/apply-config.sh) to
# the hamstrack.com EC2 instance via AWS SSM (SSH port 22 is closed — see
# docs/ops-prod-hardening.md §3). Fires after a successful Build on main AND
# after a successful Build of a release tag (HD-115) — a tag build carries the
# same code but a different LABEL, and the label is baked into the image, so
# skipping it left prod serving `git describe` versions forever whenever the tag
# was pushed after main. Both now publish `latest`, so either push order lands
# the release on prod; see build.yml for the guard that stops a tag build from
# moving `latest` backwards.
# Forks won't deploy anywhere: without the AWS secrets this job just fails.
#
# `workflow_run` has no `tags:` filter — for a tag-triggered run `head_branch`
# holds the TAG NAME, so the release-tag globs below (same shapes as build.yml's
# push filter) are what lets those runs through. The job `if:` re-checks
# everything that filter cannot express.
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main, "v[0-9]*", "[0-9]*"]

# One deploy at a time. main and its release tag are separate concurrency groups
# in build.yml (by design — cancelling either would cut this chain), so their
# Builds can finish seconds apart and fire two deploys at the same host; two
# concurrent `docker compose up -d` in /opt/hamstrack would fight. Queue instead
# of cancelling: the second run re-pulls and is a no-op if `latest` did not move.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # - success: never deploy a red build.
    # - event push/workflow_dispatch: a `pull_request` Build can also carry
    #   head_branch `main` (a fork PR from its own main), and must never deploy.
    # - no `-` in the ref name: keeps pre-release tags (`v1.0.0-rc1`, `0.13.0-beta`)
    #   off production. `main` has no dash, stable tags have none.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
      && !contains(github.event.workflow_run.head_branch, '-')
    runs-on: ubuntu-latest

    # AWS instance ids are not secret (useless without credentials), so it's
    # pinned literally. This also avoids a subtle failure mode: a mistyped
    # secret is masked as *** in logs, so a wrong value looks correct, yet 403s
    # the SSM call against the exact-match IAM policy.
    env:
      INSTANCE_ID: i-019fe684b25ad831f

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # Fetch the repository tree for the commit that was BUILT, then hand it to the
      # applier that ships in that same tree (HD-199 / HD-122). Until this existed the
      # command was `pull` + `up -d` and copied nothing, so every file in /opt/hamstrack
      # was whatever a human last put there — on 2026-08-26 that was an 11 July compose
      # file, and two features released in 0.17.0 had never run.
      #
      # Four properties are load-bearing, and none of them is a preference:
      #   * BY COMMIT SHA, never a branch or a tag. A codeload tarball addressed by sha is
      #     content-addressed: a moved tag, a force-push or a repository rename cannot
      #     change what that URL returns. It is the same commit whose build produced the
      #     `latest` image this deploy pulls — but that is a statement about THIS run, not
      #     an invariant: APP_IMAGE_TAG in the box's .env can pin the image to an older
      #     tree, and the tag is mutable. The applier refuses that combination when the pin
      #     has MOVED since the last apply (a rollback in progress) unless it is given
      #     --allow-pinned (that run only, no re-stamp) or --adopt-pin (and re-stamp);
      #     THIS PIPELINE PASSES NEITHER, and must not — an unattended run is exactly the
      #     reader step 2b exists to stop. A pin that has held still is a steady state and
      #     proceeds. That check is where "config and image agree" is actually enforced —
      #     it was never enforced by fetching a sha.
      #   * --strip-components=1 flattens the tarball's top directory. NEVER hardcode its
      #     name — it is <repo>-<sha>/ and this repository has been renamed once already.
      #   * The staging directory is under /opt/hamstrack (same filesystem, so the
      #     applier's swap can be a rename) and PER INVOCATION via mktemp -d, not the fixed
      #     .sync it used to be: the fetch happens BEFORE apply-config.sh takes its flock,
      #     so a pipeline run and a hand run on a shared path would race — one `rm -rf
      #     .sync` deleting the tree the other was mid-copy from. The sweep removes staging
      #     directories a day old, which can only be the residue of a run that was killed.
      #   * THIS STRING CARRIES NO FILE LIST AND NO COMPOSE INVOCATION. What is synced is
      #     ops/deploy/synced-paths.txt; how it is applied is ops/deploy/apply-config.sh —
      #     both reviewable, both diffable, both from the tree being applied. That is what
      #     lets docs/ops-prod-hardening.md stop describing this command in prose.
      #
      # The repository is public, so codeload needs no token. If it is ever made private
      # this answers 404 and every deploy fails opaquely — the remedy is a PAT in the URL.
      - name: Deploy via SSM
        # The ref name goes through the environment and is NEVER interpolated into the
        # runner's shell: `${{ }}` is textual substitution, a ref may contain a quote, a
        # `$` or a backtick, and this runner holds the deploy credentials. The sha and the
        # repository below are interpolated because their character sets cannot express a
        # shell metacharacter; the ref name's can.
        env:
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "hamstrack deploy $HEAD_REF $HEAD_SHA" \
            --parameters 'commands=["set -euo pipefail",
          "cd /opt/hamstrack",
          "find /opt/hamstrack -maxdepth 1 -name \".sync-*\" -mtime +1 -exec rm -rf {} +",
          "SYNC=$(mktemp -d /opt/hamstrack/.sync-XXXXXX)",
          "curl -fsSL --proto =https --tlsv1.2 https://codeload.github.com/${{ github.repository }}/tar.gz/${{ github.event.workflow_run.head_sha }} | tar xz -C $SYNC --strip-components=1",
          "bash $SYNC/ops/deploy/apply-config.sh $SYNC /opt/hamstrack ${{ github.event.workflow_run.head_sha }}",
          "rm -rf $SYNC"]' \
            --query 'Command.CommandId' --output text)
          echo "Command: $CMD_ID"
          # `wait` polls until the command finishes; it exits non-zero on failure
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || FAILED=1
          # THIS LOG IS PUBLIC. The repository is public, so Actions logs are world-readable,
          # and root's stdout/stderr from the box is a continuous feed of production
          # filesystem state: the /opt/hamstrack layout, backup timestamps, the names of
          # drifted files. No secret is in that set today, and keeping it that way would
          # depend on every future line of two scripts printing only names — so on SUCCESS
          # this prints the status and nothing else. On FAILURE the bodies are printed,
          # because a red deploy nobody can read is a worse trade.
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          echo "Status: $STATUS"
          if [ -n "${FAILED:-}" ]; then
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json
          fi
          [ -z "${FAILED:-}" ]

      # What prod actually reports once it is back up. The HD-115 bug was a
      # WRONG LABEL on a right deployment, which nothing in this pipeline ever
      # looked at — so it survived until someone opened the About dialog. Polled
      # from the runner, not inside the SSM command, because `aws ssm wait
      # command-executed` gives up after ~100s and a slow app restart would then
      # fail an otherwise successful deploy. `continue-on-error` keeps this
      # purely informational: a flaky curl must never red a good deploy.
      - name: Report deployed version
        continue-on-error: true
        run: |
          for i in $(seq 1 12); do
            META=$(curl -fsS --max-time 10 https://hamstrack.com/api/meta) && break
            sleep 10
          done
          echo "prod /api/meta → ${META:-unavailable}"
          echo "prod \`/api/meta\` → \`${META:-unavailable}\`" >> "$GITHUB_STEP_SUMMARY"
