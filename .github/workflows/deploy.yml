name: Deploy to production

# Owner-only: continuous deploy of the rolling `latest` image to the
# hamstrack.com EC2 instance via AWS SSM (SSH port 22 is closed — see
# docs/ops-prod-hardening.md §3). Fires after a successful Build on main.
# Release-tag builds do NOT deploy here — prod already has that code from main.
# Forks won't deploy anywhere: without the AWS secrets this job just fails.
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    # AWS instance ids are not secret (useless without credentials), so it's
    # pinned literally. This also avoids a subtle failure mode: a mistyped
    # secret is masked as *** in logs, so a wrong value looks correct yet 403s
    # the SSM call against the exact-match IAM policy.
    env:
      INSTANCE_ID: i-019fe684b25ad831f

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "hamstrack deploy ${{ github.event.workflow_run.head_sha }}" \
            --parameters 'commands=["cd /opt/hamstrack && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker image prune -f"]' \
            --query 'Command.CommandId' --output text)
          echo "Command: $CMD_ID"
          # `wait` polls until the command finishes; it exits non-zero on failure
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || FAILED=1
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          [ -z "$FAILED" ]
