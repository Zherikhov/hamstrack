# Hamstrack — the CLOUD model, runnable on one host (HD-317).
#
# WHAT THIS IS FOR. Hamstrack ships one codebase in two deployment models, and the
# difference between them is a set of DEFAULTS rather than a fork — measured, not
# asserted: every behaviour the two models disagree about is reachable from either
# profile by setting one variable, and the only difference no variable can move is
# the `deployment` label on structured log lines. So this stack exists to let you
# run and evaluate the cloud model as it actually behaves, on a laptop or one
# server, with **no AWS account and no public DNS**. Object storage is MinIO, which
# speaks S3 and runs beside the app.
#
# WHAT THE CLOUD PROFILE CHANGES, all of it: attachments go to S3 rather than the
# container's disk; self-registration is open; first-login onboarding is on; the
# per-workspace storage quota is 10GB rather than 100GB; the CSP report sink is on.
# Every one of those is reachable from the `dc` profile by setting its variable —
# docs/cloud-mode.md has the table — so choose this stack when you want the cloud
# model's shape, not because it is the only way to a particular feature.
#
# The two profile files are NOT line-for-line twins, and one asymmetry is worth
# knowing: each declares some of those settings and leaves the rest at the base
# default in application.properties. Self-registration is declared only by the `dc`
# profile, so OPEN SIGNUP is what the base default gives — this stack, a run with no
# profile at all, and any third profile added later all get it unless somebody sets
# PUBLIC_SIGNUP_ENABLED=false.
#
# NOT the stack that runs hamstrack.com. That one is docker-compose.prod.yml: Caddy,
# a public certificate, real S3, an owner's AWS account. This is the model, not the
# deployment — see docs/cloud-mode.md.
#
# LICENCE, because this stack is the one that makes the question concrete: ELv2 lets
# you run either model for yourself and for your organisation. What it forbids is
# offering Hamstrack to third parties as a managed service. Running this is fine;
# selling access to it is not.
services:
  app:
    image: ghcr.io/zherikhov/hamstrack:${APP_IMAGE_TAG:-0.18}
    env_file:
      - path: .env
        required: false
    environment:
      # A LITERAL, like the dc stack's own: the directory declares the model, so a
      # `.env` cribbed from elsewhere cannot silently turn this into a dc instance.
      SPRING_PROFILES_ACTIVE: cloud
      DB_URL: jdbc:postgresql://postgres:5432/hamstrack
      DB_USERNAME: hamstrack
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env beside this file}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - openssl rand -base64 48}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL in .env beside this file}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env - your own, not one from these docs}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_STOP_GRACE_SECONDS: ${APP_STOP_GRACE_SECONDS:-30}
      # MinIO, reached on the compose network. `path-style` is required for it and
      # for every S3-compatible store that is not AWS; a region is required by the
      # SDK even where the store ignores it.
      #
      # STORAGE_TYPE is a LITERAL here, so this stack's `.env` cannot move it — the
      # variable is settable on any install, but not on this one: the endpoint,
      # credentials and bucket below all point at the MinIO container, and
      # STORAGE_TYPE=local in `.env` would leave them configured and unused while
      # attachments went to a container filesystem with no volume behind it. Want
      # local-disk storage? That is the DC stack, in ../dc/.
      STORAGE_TYPE: s3
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-hamstrack-attachments}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_PATH_STYLE: "true"
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env beside this file}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env - at least 8 characters}
    ports:
      # 0.0.0.0 by default so an operator on a VPS can reach it at all; set
      # APP_BIND=127.0.0.1 and tunnel before putting this on the internet, because
      # THIS MODEL HAS OPEN REGISTRATION and a public port means public signup.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    stop_grace_period: ${APP_STOP_GRACE_SECONDS:-30}s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/meta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hamstrack
      POSTGRES_USER: hamstrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env beside this file}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    shm_size: ${POSTGRES_SHM_SIZE:-64m}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamstrack -d hamstrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Refuses the `up` for the values MinIO itself refuses only once the stack already
  # looks like it is starting. It enforces a minimum length on both root credentials and it
  # does so by exiting FATAL at startup — measured on the pinned image, with a 7
  # character password: `Unable to validate credentials inherited from the shell
  # environment` and exit 1. That refusal names the variable, but nobody reads it:
  # `minio` carries `restart: unless-stopped`, so the FATAL becomes a restart loop,
  # the container never turns healthy, and `up -d --wait` sits there until the
  # timeout and then reports a DEPENDENCY it was waiting for rather than a value you
  # typed. A one-shot job with `restart: "no"` fails in seconds and names itself, so
  # the guide can point at `docker compose logs preflight`.
  #
  # This is why the check cannot live in `minio-bucket`: that job waits for minio to
  # be HEALTHY, which on a short password never happens, so it would never run.
  preflight:
    # The mc image, because it is already part of this stack - no third image to pull
    # to find out that a value is too short.
    image: quay.io/minio/mc:${MINIO_CLIENT_IMAGE_TAG:-RELEASE.2025-08-13T08-35-41Z}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env beside this file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env - at least 8 characters}
    mem_limit: ${MINIO_CLIENT_MEMORY_LIMIT:-128m}
    # `$$` is one literal `$` after Compose interpolation, so the shell gets ${#VAR}.
    # Both bounds are MinIO's own, from the HINT it prints when it refuses.
    entrypoint:
      - sh
      - -c
      - |
        if [ $${#MINIO_ROOT_USER} -lt 3 ]; then
          echo "MINIO_ROOT_USER is $${#MINIO_ROOT_USER} character(s). MinIO requires at least 3 and refuses to start below that. Set a longer MINIO_ROOT_USER in .env beside this file, then run the up again." >&2
          exit 1
        fi
        if [ $${#MINIO_ROOT_PASSWORD} -lt 8 ]; then
          echo "MINIO_ROOT_PASSWORD is $${#MINIO_ROOT_PASSWORD} character(s). MinIO requires at least 8 and refuses to start below that, which would otherwise look like a storage service that just never comes up. Set a longer MINIO_ROOT_PASSWORD in .env beside this file - openssl rand -base64 24 - then run the up again." >&2
          exit 1
        fi
        echo "preflight: MINIO_ROOT_USER and MINIO_ROOT_PASSWORD are long enough for MinIO"
    restart: "no"

  minio:
    image: quay.io/minio/minio:${MINIO_IMAGE_TAG:-RELEASE.2025-09-07T16-13-09Z}
    command: ["server", "/data", "--console-address", ":9001"]
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env beside this file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env - at least 8 characters}
    ports:
      # The console, for looking at what the app stored. NOT the API port: the app
      # reaches that on the compose network, and publishing object storage on a
      # public interface is a different decision from publishing the app.
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    mem_limit: ${MINIO_MEMORY_LIMIT:-512m}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Creates the bucket once and exits. The app REFUSES TO START without a bucket
  # name, but it does not create one, and a bucket that does not exist turns every
  # upload into a 500 long after the install looked successful. `depends_on:
  # service_completed_successfully` above is what makes that a startup-time fact.
  minio-bucket:
    image: quay.io/minio/mc:${MINIO_CLIENT_IMAGE_TAG:-RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env beside this file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env - at least 8 characters}
      BUCKET: ${STORAGE_S3_BUCKET:-hamstrack-attachments}
    # A ceiling even on a job that runs for two seconds and exits: the rule is that
    # every service this repository ships declares one (HD-152), because a container
    # with no limit sizes itself against HOST memory, and "it is short-lived" is an
    # argument about today's image rather than a property of the service.
    mem_limit: ${MINIO_CLIENT_MEMORY_LIMIT:-128m}
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$BUCKET" &&
        echo "bucket $$BUCKET is ready"
    restart: "no"

volumes:
  postgres_data:
  minio_data:
