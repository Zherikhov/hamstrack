# Observability stack — OPTIONAL, layered onto docker-compose.prod.yml.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d
#
# Phase 1 (this file, current): centralized logging — Loki (store) + Alloy
# (collector, reads every container's stdout via the docker socket) + Grafana
# (view). Phases 2+ add Prometheus + node/cadvisor/postgres exporters here.
#
# Design rules (see docs/design/observability-proposal.md):
#   * No service publishes a PUBLIC host port. Grafana binds 127.0.0.1 only so it
#     is reachable via an SSM port-forward from the host, never from the internet.
#   * Same compose project as the prod file, so everything shares the default
#     network and resolves each other by service name (loki, app, postgres…).
#   * Every service IN THIS FILE has a mem_limit — seven of them, summing to exactly
#     1024m — and each sits well inside it: ~466 MiB of actual RSS, verified on
#     production 2026-08-28 (HD-189). That is a property of THESE SEVEN SERVICES and
#     of nothing else. This line used to end "…so the stack can't OOM the box", which
#     was false twice over (HD-180): production runs this file layered onto
#     docker-compose.prod.yml, whose app, postgres and caddy were unbounded at the
#     time — and, more deeply, bounding every service prevents a HOST OOM only if the
#     ceilings also FIT. On the current t3.small they do not: with postgres and caddy
#     now bounded too, the composed deployment declares 2688 MiB of ceilings on
#     1909 MiB of RAM. A mem_limit is a ceiling and never a reservation, so a sum over
#     RAM is ordinary — but it is exactly why no file may claim the box is safe. The
#     arithmetic, the measured RSS behind each number and the division that becomes
#     true after HD-189's resize are at the top of docker-compose.prod.yml, which is
#     the file that describes the deployment. Read these ceilings per service; the sum
#     here is not a budget, and the sum there is not a guarantee.
#   * DC self-hosters opt in by adding the second -f; Cloud/prod always runs it.
services:
  loki:
    image: grafana/loki:3.4.2
    command:
      - -config.file=/etc/loki/loki-config.yml
      - -config.expand-env=true   # allow ${LOKI_RETENTION_PERIOD} substitution
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}   # 7 days
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    mem_limit: 256m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only docker socket: Alloy discovers containers and tails their logs
      # through the docker API. This is the highest-privilege grant in the stack —
      # a read-only mount limits it to reads; docker-socket-proxy is a hardening
      # follow-up (see spec §11).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    mem_limit: 128m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Only needed if you reverse-proxy Grafana under a sub-path; default is fine
      # for the SSM port-forward (localhost:3000).
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      # Alerting → email. The contact-point address is OBS_ALERT_EMAIL_TO; Grafana's
      # SMTP reuses your MAIL_* settings.
      #
      # REQUIRED, and deliberately fail-fast like GF_SECURITY_ADMIN_PASSWORD above: an
      # empty value does NOT mean "evaluate the rules but skip email". Grafana refuses the
      # whole alerting provisioning tree when the contact point has no address, so the
      # rules die with it - and then Grafana refuses to START, exits 1 and crash-loops
      # under restart: unless-stopped (measured on grafana:11.5.2: 7 restarts in 25s,
      # /api/health never answered). The trap is that `docker compose up -d` STILL EXITS 0
      # while that happens: the deploy reports success and only `docker compose ps` shows
      # the dead container. A default address is worse still: it was one, and every rule
      # delivered to a placeholder domain for months while the comment here claimed nothing
      # was being sent. Refusing at interpolation is the cheapest place to learn this,
      # because it happens before anything starts and the message below names the variable
      # AND the file it belongs in; Grafana's own error names neither - it names an
      # internal integration UID ("email" / hamstrack-email) in a log nobody is tailing.
      #
      # Know what the refusal costs, because every documented command layers this file
      # ONTO the app's compose file in a single invocation: the abort is not "the optional
      # stack stayed down", it is the whole command - `up -d`, and equally `down`, `stop`,
      # `ps` and `logs`. Compose resolves interpolation before it creates, changes or stops
      # anything, so nothing is modified and a running stack keeps running; it just cannot
      # be driven until the variable is set. GF_SECURITY_ADMIN_PASSWORD has had exactly
      # this property since day one.
      #
      # Evaluating without delivering IS possible - one layer up, at GF_SMTP_ENABLED
      # below, not here. A self-hoster with no SMTP sets this to any address they own and
      # GF_SMTP_ENABLED=false; the rules provision, evaluate and show state in Grafana.
      # What has no "off" is the contact point's address itself.
      OBS_ALERT_EMAIL_TO: ${OBS_ALERT_EMAIL_TO:?set OBS_ALERT_EMAIL_TO in .env to the address that should receive alerts - an empty value disables every alert rule, not just email delivery}
      # The delivery switch. false = the rules still provision and evaluate, Grafana just
      # sends nothing - the supported way to run dashboards and alerting on a host with no
      # SMTP, and the reason OBS_ALERT_EMAIL_TO above can be required without cost.
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-true}
      GF_SMTP_HOST: ${MAIL_HOST:-localhost}:${MAIL_PORT:-587}
      GF_SMTP_USER: ${MAIL_USERNAME:-}
      GF_SMTP_PASSWORD: ${MAIL_PASSWORD:-}
      # The SENDER is deliberately NOT fail-fast, though the argument above is about a
      # default address in a delivery path. Two reasons it does not carry over reversed:
      # (1) a wrong recipient is unobservable - Grafana records the notification as sent
      # and it lands where nobody looks, which is silence that reads as health - whereas a
      # wrong sender either gets rejected by the relay (a visible error on the contact
      # point, in Grafana's log) or arrives on an alert you did receive with a visibly odd
      # From; you learn either way. (2) MAIL_FROM is the APP's variable and this default
      # mirrors the app's own (application.properties: app.mail-from). A ${...:?} here
      # would make the observability file the strictest consumer of somebody else's
      # setting, refusing a configuration the app itself accepts, and would put an SMTP
      # variable back in the way of the no-SMTP self-hoster that GF_SMTP_ENABLED just
      # unblocked. If noreply@example.com is wrong for alerts it is equally wrong for
      # verification mail: fix it at MAIL_FROM, which is the one place that fixes both.
      GF_SMTP_FROM_ADDRESS: ${MAIL_FROM:-noreply@example.com}
      GF_SMTP_FROM_NAME: Hamstrack Alerts
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Loopback-only: NOT internet-exposed. Reach it with an SSM port-forward
      # (see docs/ops-prod-hardening.md §4). On a plain dev box, browse localhost:3000.
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
    mem_limit: 128m
    restart: unless-stopped

  # ── Phase 2: metrics ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 256m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.0
    command:
      - --path.rootfs=/host
      # Backup freshness (HD-187) is published as a .prom file written by the host
      # systemd unit hamstrack-backup.service. The bind mount below uses the SAME path
      # inside and outside the container ON PURPOSE: node-exporter prefixes some paths
      # with --path.rootfs and this directory resolves to the same host directory under
      # either behaviour, so the flag cannot be subtly wrong.
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    mem_limit: 64m
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 128m
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      # Reach the postgres compose service. Least privilege: set DB_MONITOR_USER/
      # DB_MONITOR_PASSWORD to a read-only pg_monitor role (see the self-hosting
      # guide for the CREATE ROLE SQL). If unset, it falls back to the app
      # DB_USERNAME/ DB_PASSWORD, so metrics still work out of the box.
      DATA_SOURCE_URI: "postgres:5432/hamstrack?sslmode=disable"
      DATA_SOURCE_USER: ${DB_MONITOR_USER:-${DB_USERNAME}}
      DATA_SOURCE_PASS: ${DB_MONITOR_PASSWORD:-${DB_PASSWORD}}
    depends_on:
      - postgres
    mem_limit: 64m
    restart: unless-stopped

volumes:
  loki_data:
  grafana_data:
  alloy_data:
  prometheus_data:
