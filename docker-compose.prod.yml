services:
  app:
    image: ghcr.io/${GITHUB_OWNER}/hamstrack:latest
    # All operator-facing config comes from .env — see .env.prod.example for the
    # full list. Defaults live in the app's application-{cloud,dc}.properties.
    env_file: .env
    environment:
      # Internal / switch values — set explicitly so they always win over .env.
      # Deployment model: cloud (S3 storage default) or dc (local disk default).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-cloud}
      # DB host is the compose service name; never overridable from .env.
      DB_URL: jdbc:postgresql://postgres:5432/hamstrack
    volumes:
      - attachments_data:/app/data/attachments   # used only when storage type = local
    healthcheck:
      # Public, unauthenticated endpoint; wget ships with the alpine JRE image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/meta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s   # give Spring Boot time to start before counting failures
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hamstrack
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d hamstrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"           # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # stores certificates (persisted across restarts)
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  attachments_data:
