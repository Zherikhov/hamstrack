# Provisioned alert rules. Each rule = a Prometheus query (refId A, instant) fed
# into a threshold expression (refId B, the condition). noDataState=OK keeps them
# quiet when a metric is absent (e.g. no traffic yet, or the app job is down in dev).
apiVersion: 1

groups:
  - orgId: 1
    name: hamstrack
    folder: Hamstrack
    interval: 1m
    rules:
      - uid: hamstrack-app-down
        title: AppDown
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Hamstrack app is down (up == 0 for the hamstrack-app job)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'up{job="hamstrack-app"}'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-postgres-down
        title: PostgresDown
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down (pg_up == 0)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'pg_up'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-high-error-rate
        title: HighErrorRate
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate above 5% for 5m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(http_server_requests_seconds_count{job="hamstrack-app",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{job="hamstrack-app"}[5m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-high-latency
        title: HighLatency
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "HTTP p95 latency above 1s for 10m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job="hamstrack-app"}[5m])) by (le))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-disk-filling
        title: DiskFilling
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Host filesystem below 15% free for 10m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'min(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: lt, params: [15] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-email-failures
        title: EmailFailures
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Outbound email failures in the last 15m"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(hamstrack_email_sent_total{outcome="failure"}[15m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-jvm-heap-pressure
        title: JVMHeapPressure
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage above 90% for 10m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(jvm_memory_used_bytes{job="hamstrack-app",area="heap"}) / sum(jvm_memory_max_bytes{job="hamstrack-app",area="heap"}) * 100'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [90] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query
