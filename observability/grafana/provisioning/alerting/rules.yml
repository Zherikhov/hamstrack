# Provisioned alert rules. Each rule = a Prometheus query (refId A, instant) fed
# into a threshold expression (refId B, the condition). noDataState=OK keeps them
# quiet when a metric is absent (e.g. no traffic yet, or the app job is down in dev).
#
# EVERY ANNOTATION IS A GO TEMPLATE, `summary:` INCLUDED. Grafana expands each
# annotation through text/template against its own `template.Data` before it renders
# or notifies, so a literal `{{` anywhere in the string is read as an expression
# rather than as text. An example command containing `{{.State.OOMKilled}}` fails
# with `can't evaluate field State in type template.Data` and THE WHOLE ANNOTATION
# IS LOST - not the offending fragment, the entire string - so the operator gets a
# template error at precisely the moment the guidance was meant to arrive, i.e. only
# ever when the rule fires. Write example commands that contain no `{{` at all
# (pipe `docker inspect` into `grep` and name the JSON field in prose) rather than
# escaping the braces into `{{"{{"}}`, which is unreadable in a file whose whole
# value is being readable under pressure. `{{ $labels.x }}` and `{{ $values.x }}`
# are the legitimate exception and must not be touched: those are the template's own
# variables and are meant to expand. YAML `#` comments are not templates and are
# safe - the braces quoted just above are the bug named, not an example to copy -
# but example COMMANDS in comments are written in the same no-braces form here
# anyway, because the way this arrives is a command lifted from a comment into a
# summary.
#
# FOUND IN PRODUCTION, three rules at once, not in review and not in CI:
# GrafanaProvisioningContractTest parses this YAML but does not render Go templates,
# so a broken annotation is valid YAML and ships green. The only symptom is one
# `msg="Error in expanding template"` line per rule per evaluation cycle in the
# Grafana log under `logger=ngalert.state.manager` - nothing fails, nothing is
# retried, and the alert still fires with no text.
apiVersion: 1

groups:
  - orgId: 1
    name: hamstrack
    folder: Hamstrack
    interval: 1m
    rules:
      - uid: hamstrack-app-down
        title: AppDown
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Hamstrack app is down (up == 0 for the hamstrack-app job)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'up{job="hamstrack-app"}'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-postgres-down
        title: PostgresDown
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down (pg_up == 0)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'pg_up'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-high-error-rate
        title: HighErrorRate
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate above 5% for 5m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(http_server_requests_seconds_count{job="hamstrack-app",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{job="hamstrack-app"}[5m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-high-latency
        title: HighLatency
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "HTTP p95 latency above 1s for 10m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job="hamstrack-app"}[5m])) by (le))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-disk-filling
        title: DiskFilling
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Host filesystem below 15% free for 10m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'min(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: lt, params: [15] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-email-failures
        title: EmailFailures
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          # NOT "outbound failures" any more: from HD-207/HD-208 this counter also covers mail
          # that never left the process, and "outbound" is a claim about a category that a new
          # member invalidated. Phrased as what the recipient experiences, which survives the
          # next cause being added.
          summary: "Email that did not reach its recipient in the last 15m"
          # `description` is Grafana's second standard annotation and is rendered in the alert
          # detail view and in notifications; `summary` alone is what a paged operator sees in
          # a list. The older rules in this file put their whole playbook in `summary` because
          # nothing else was being used — new explanatory text goes HERE, and the long-summary
          # rules below are the legacy shape rather than the pattern to copy.
          description: >-
            Two different causes land on the same counter, and failed_email is what tells them
            apart. A row with attempts >= 1 was TRIED and rejected by the SMTP host — look at the
            mail provider. A row with attempts = 0 whose last_error starts "NEVER ATTEMPTED" was
            never sent at all, and the bracketed token right after that prefix says which of the
            three ways it happened: [QUEUE_FULL] the mail queue was full, [POOL_SHUT_DOWN] the
            dispatch arrived while the pool was stopping, [SHUTDOWN_RESIDUE] a deploy's shutdown
            drain expired with it still queued. The second kind means the pool is
            saturated or a deploy landed on a backlog, not that the mail host is broken, and it is
            much more likely to succeed if re-driven.
            RUN THIS FIRST, it answers which one you have — the last_error prefix is what separates
            the never-attempted causes from each other, so it is grouped on:
            SELECT date_trunc('minute', created_at) AS minute, email_type, attempts = 0 AS never_attempted,
            left(last_error, 40) AS why, count(*)
            FROM failed_email WHERE created_at > now() - interval '30 minutes'
            GROUP BY 1, 2, 3, 4 ORDER BY 1 DESC;
            NOTE ON NOISE: this rule is `> 0` with `for: 0m`, so from HD-207 ANY DEPLOY THAT LANDS
            ON A NON-EMPTY MAIL QUEUE PAGES, where before it exited quietly and lost the queue
            instead. A single burst at a deploy timestamp, all never_attempted, all
            "NEVER ATTEMPTED [SHUTDOWN_RESIDUE]" in last_error, is that — it is real (those users
            were told to check an inbox nothing arrived in) but it is not an outage. A rate that
            continues after the deploy is, and a burst of [QUEUE_FULL] outside a deploy is the pool
            saturating rather than the mail host failing.
            The same tag is used for both on purpose: a mail that never left is still a mail that
            failed, and giving the drops a tag of their own would be a silent loss with this alert
            pointed away from it.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(hamstrack_email_sent_total{outcome="failure"}[15m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: hamstrack-jvm-heap-pressure
        title: JVMHeapPressure
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage above 90% for 10m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(jvm_memory_used_bytes{job="hamstrack-app",area="heap"}) / sum(jvm_memory_max_bytes{job="hamstrack-app",area="heap"}) * 100'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [90] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # ---------------------------------------------------------------------------
      # HD-189 — HOST memory. Two rules, naming two different failures: approaching
      # the wall, and already past it. Neither has ever fired; both are new signals
      # on a box that has never been under load, so each summary says what to DO.
      #
      # WHY THIS EXISTS AT ALL, given JVMHeapPressure above. That rule watches a
      # RATIO the JVM reports about itself, and it is blind to the failure that
      # actually threatens a small box: a heap ceiling larger than the machine. An
      # app container with NO mem_limit takes -XX:MaxRAMPercentage against HOST RAM,
      # so the JVM is entitled to a heap it can never be given, the kernel SIGKILLs a
      # victim (exit 137, no stack trace, nothing in any application log) long before
      # the ratio reaches 90%, and JVMHeapPressure stays green through the whole
      # thing — a rule watching heap used/max has nothing to say about a ceiling
      # the machine cannot honour. The measured figures behind this are deliberately
      # NOT restated in a shipped file: paired with the box they describe they read
      # as how much to force and how much room there is, and this repository is
      # public. They live in docs/ops-prod-hardening.md §5 and in the two design
      # docs that reason from them. A container limit is what CLOSES that gap (APP_MEMORY_LIMIT
      # / mem_limit, HD-199); these two rules are what SEE it, before and after.
      # Which state a box is in is a question for the box and never for a file:
      # `docker inspect hamstrack-app-1 | grep -i memory` — a `Memory` line (that is
      # `.HostConfig.Memory`) reading `0` is no limit, and a variable present in .env
      # is not a limit until a container reports one.
      #
      # 137 IS ANY SIGKILL (128 + 9), not the signature of an OOM kill: a docker stop
      # whose grace period expired and escalated, a docker kill, a kill -9 and a daemon
      # or Docker Desktop shutdown all produce it, and the kernel's OOM killer is one
      # member of that class rather than its identifier. The discriminator is the
      # `.State.OOMKilled` flag, which `docker inspect <container> | grep -i oomkilled`
      # prints; read 137 as proof
      # on its own and the cost is a false alarm — a box resized because it restarted,
      # or a memory leak hunted that does not exist. It is also why HostKernelOOMKill
      # below, which counts the kernel's own event, is the one rule here that no other
      # kind of kill can fake. Long form: docs/ops-prod-hardening.md §5.3.
      #
      # BYTES, NOT A PERCENTAGE, and that is the load-bearing choice. A percentage
      # stops meaning anything the moment the instance is resized: 90% of 1909 MB
      # and 90% of 4096 MB are different amounts of danger, and a resize is exactly
      # what HD-189 intends. The buffer a Linux box needs — GC headroom plus enough
      # page cache to keep Postgres off the disk — is roughly ABSOLUTE and does not
      # scale with the machine, so an absolute threshold survives the resize without
      # being re-derived. Same category-over-member rule the rest of the project
      # follows: a claim about what a box needs outlives a claim about what this box
      # has.
      #
      # Unaggregated on purpose, so a second host raises its own instance and the
      # `instance` label names it. DiskFilling's min() is aggregated for a different
      # reason — many filesystems per host, one memory figure per host.
      #
      # IDENTICAL IN dc AND cloud, as every rule in this file is: how much memory a
      # box has left is a property of the box, not of the plan, and node-exporter is
      # in the same optional stack either way. Two things in the summaries are
      # hosted-layout SPECIFICS rather than universals — the container name
      # `hamstrack-app-1` and the path `/opt/hamstrack/.env` — kept because a refusal
      # that names no command is one an operator cannot act on, and matching the
      # convention DeployImagePinned and ConfigDrift already set. A self-hoster
      # substitutes their own compose project name and env file; nothing here is
      # gated on a profile. Both thresholds are PROVISIONED, not environment-driven:
      # if 200 MiB or 128 MiB is wrong for your host, change it in this file — there
      # is no variable to set (same as MailDailyVolumeHigh below).
      - uid: hamstrack-host-memory-low
        title: HostMemoryLow
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Less than 200 MiB of host memory has been available for 10m - the kernel is close to choosing an OOM victim, and its victim dies silently on SIGKILL (exit 137, no stack trace, nothing in any application log). 137 is any SIGKILL, so on a container that has already exited it is the `.State.OOMKilled` flag - print it with `docker inspect <container> | grep -i oomkilled` - and not the exit code that says the kernel chose it. THRESHOLD DERIVATION, so it is not tuned away by the next person: 200 MiB is BELOW the 227 MiB 7-day minimum measured on production 2026-08-28, so this rule would not have fired once in that week and only fires when the box is worse than it has ever been. It is an absolute buffer rather than a percentage, so it still means the same thing after a resize. FIRST MOVES: `free -m` and `docker stats --no-stream` on the box to see what grew; then `docker inspect hamstrack-app-1 | grep -i memory`, where a `Memory` line (that is `.HostConfig.Memory`) reading `0` means the app container has no ceiling and its JVM sized its heap from HOST RAM, which is the shape of this failure, and setting APP_MEMORY_LIMIT in /opt/hamstrack/.env followed by `docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d` fixes it with no deploy and no merge. If the container limit is already set and honoured, the box is simply too small: resize it (HD-189) rather than shaving ceilings"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'node_memory_MemAvailable_bytes'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: lt, params: [209715200] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # The other half of the pair: not "approaching the wall" but "already past it".
      # Swap here is an emergency buffer and not a tier of memory — vm.swappiness=10,
      # so the kernel reaches for it reluctantly and sustained usage means RAM was
      # genuinely gone, not that a page was cold. That is also why this is a CAPACITY
      # signal rather than an incident one: the box SURVIVES, which is what the
      # swapfile was added for (production 2026-08-28: 1023 MB, persisted in
      # /etc/fstab and /etc/sysctl.d/99-hamstrack-swap.conf; ops-prod-hardening §5),
      # so it degrades instead of dying and the honest action is to resize rather
      # than to wake anybody. severity: warning for exactly that reason — a machine
      # that no longer fits its job is not an outage, and treating it as one trains
      # an operator to mute a folder that also carries AppDown.
      #
      # ~128 MiB rather than > 0: a Linux box parks a few MB of genuinely idle
      # anonymous pages in swap and never touches them again, and a rule that fires
      # on that is muted within a week. 15m rather than 10m because one burst — a
      # backup run, a deploy — can push pages out and recover on its own.
      #
      # THE ONE THING THIS RULE DEPENDS ON THAT IS NOT UNIVERSAL: how eagerly the
      # kernel swaps. "Sustained swap means RAM is gone" holds at a LOW swappiness —
      # the hosted box runs 10 — and weakens at the distro default of 60, where a
      # box with plenty of free memory will still page out cold anonymous pages and
      # sit above 128 MiB indefinitely. If `sysctl vm.swappiness` on your host says
      # 60, either lower it or raise the threshold in this file; do not leave a rule
      # standing that your kernel's normal behaviour keeps firing. The threshold is
      # provisioned, not environment-driven — this file is where it changes.
      #
      # An install with NO swap reports SwapTotal = SwapFree = 0, so the expression
      # is 0 and this rule is silently inert. That is correct and worth knowing: on
      # such a box HostMemoryLow above is the only rule watching this failure, and it
      # is also the only warning that box will ever get, because without swap the
      # same pressure arrives as a kill instead of as a slowdown.
      - uid: hamstrack-host-swap-in-use
        title: HostSwapInUse
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Over 128 MiB of swap has been in use for 15m. Swap is meant to be an emergency buffer here and not a memory tier, so at a low vm.swappiness (the hosted box runs 10) sustained use means RAM is already gone and the machine is trading latency to stay alive - it is not dying (that is HostMemoryLow), it no longer fits its job. Check `sysctl vm.swappiness` first: at the distro default of 60 a healthy box pages out cold anonymous memory too, and then this rule is mis-tuned rather than right. Expect slower p95 and longer GC pauses while this is true. FIRST MOVES: `free -m` and `docker stats --no-stream` to see which container grew, then choose between giving the app container a memory limit it may not currently have (APP_MEMORY_LIMIT in /opt/hamstrack/.env - an unlimited container sizes its JVM heap from HOST RAM, check with `docker inspect hamstrack-app-1 | grep -i memory`, where a `Memory` line - that is `.HostConfig.Memory` - reading `0` means no ceiling) and resizing the instance (HD-189). Do NOT turn swap off to make this quiet: without it the same pressure arrives as an OOM kill instead of as a warning"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [134217728] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # The third of the host-memory set, and the only one that reports the failure
      # itself. HostMemoryLow PREDICTS an OOM kill and HostSwapInUse describes the
      # state that precedes one; nothing else in this file says one HAPPENED. The
      # kernel's victim dies on SIGKILL and leaves exit 137 and NO stack trace, nothing
      # in any application log, no Java exception and no Loki line to search for — the
      # process is simply gone and Docker restarts it — so an alert on this counter
      # is the only thing that will ever tell an operator it occurred. Without it,
      # the evidence is a restarted container and a gap, which reads like a deploy.
      # And 137 alone would not settle it either way: EVERY SIGKILL exits 137, so a
      # stop that escalated or a kill -9 looks identical. That is exactly why this rule
      # reads node_vmstat_oom_kill — a counter of the kernel's own decision — instead of
      # an exit code, and why the summary sends the operator to .State.OOMKilled.
      #
      # THRESHOLD-FREE, which is the point: `> 0` on a counter of an event the
      # kernel already decided. There is no number here to tune away and none to
      # re-derive after a resize, and — unlike HostSwapInUse — it does not depend on
      # how eagerly the kernel swaps, so it is immune to the vm.swappiness caveat
      # documented on that rule. On a healthy box node_vmstat_oom_kill never moves
      # (production reads 0), so the rule is inert by construction rather than by
      # tuning.
      #
      # `for: 0m` DELIBERATELY, and the reasoning is different from every level-based
      # rule above. `for:` exists to require that a LEVEL persists, so that a spike is
      # not paged; this is a COUNTER OF A PAST EVENT, and an event does not become
      # more or less true by lasting. The 15m range window already provides the
      # persistence — the condition stays true for 15 minutes after the kill and then
      # clears itself — so a non-zero `for:` would only delay the notification of
      # something that is already over, and on the box that just OOM-killed something
      # it would be worse than that: a scrape gap (node-exporter is not immune to the
      # OOM killer either) resets a pending alert, so the one rule that must not miss
      # its event would be the one waiting for an uninterrupted run of evaluations.
      #
      # Unaggregated, like the two above: one counter per host, and the `instance`
      # label names which. Note the counter is HOST-WIDE and does not name the
      # victim; on current kernels a container killed at its OWN cgroup limit lands
      # in it too, which is wanted — once HD-199 delivers mem_limit, a limit set too
      # low reports itself here instead of as an unexplained restart loop.
      #
      # IDENTICAL IN dc AND cloud. Nothing here is layout-specific: no container
      # name, no env path, no threshold.
      - uid: hamstrack-host-kernel-oom-kill
        title: HostKernelOOMKill
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "The kernel OOM-killed at least one process on this host in the last 15m. This is not a prediction (that is HostMemoryLow) - it already happened, and it is invisible everywhere else: the victim dies on SIGKILL and leaves exit 137, no stack trace and no application log line, so a restarted container is the only trace. 137 by itself proves nothing - every SIGKILL exits 137 - which is why this rule counts the kernel's own event rather than an exit code, and why the checks below ask for OOMKilled. FIRST MOVES: `dmesg -T | grep -i -E 'killed process|out of memory'` names the victim and the moment; `docker ps -a` shows which container exited and with what code, and `docker inspect <container> | grep -i oomkilled` says whether it was ours: the `.State.OOMKilled` flag is what decides, and a 137 sitting next to `false` was some other SIGKILL. THEN: if the victim was the app container and it has no memory limit, its JVM sized its heap from HOST RAM and the box cannot honour that - set APP_MEMORY_LIMIT (see HostMemoryLow's summary for the exact apply step). If the limit IS set and the app was killed at it, the limit is too low for the workload rather than too high for the box: raise it, or resize (HD-189). If the victim was postgres or the observability stack, the box is oversubscribed and shaving one ceiling only moves the victim"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'increase(node_vmstat_oom_kill[15m])'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # A database statement was cancelled at DB_STATEMENT_TIMEOUT_MS (HD-151). This is the
      # ONLY rule that can surface the condition: the refusal is a deliberate 422, not a
      # fault, so HighErrorRate — which watches the 5xx ratio — stays green while an instance
      # refuses every report it is asked for.
      #
      # Rate-based, not > 0, and unlike RoleScopeViolation below that is deliberate: one 422
      # here is an ordinary user asking a large tenant for more than ten seconds of work, and
      # paging on that teaches an operator to ignore the rule. A SUSTAINED rate means the
      # instance has outgrown an index — or its heap, which 0.17.0 also bounded, and less
      # heap makes the same query slower. The route label names the endpoint; the WARN log
      # names the budget and the knob to turn.
      - uid: hamstrack-statement-budget-exceeded
        title: StatementBudgetExceeded
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "More than 5 database statements were cancelled at the statement budget in the last 15m"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(hamstrack_db_statement_budget_exceeded_total[15m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [5] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # HD-187. The backup job is a HOST systemd timer, not a container, so it emits nothing
      # to Loki and nothing to the app's metrics: its only channel to a person is the
      # node-exporter textfile it writes. Two rules, because a backup has two failures and only
      # one of them is loud — a dump that fails is over in seconds, while a dump that SUCCEEDS
      # and then fails to upload leaves a perfectly good file on the volume that is about to be
      # lost, with every local check green.
      #
      # BackupRunFailed is the fast one: the last run reported a stage failure, visible within
      # an hour. BackupStale is the slow, load-bearing one: nothing has landed off-box in 26
      # hours — which is the only rule that can see the run NOT HAPPENING AT ALL (a stopped
      # timer, a hung flock, a box that was down), a condition BackupRunFailed cannot detect
      # because a job that does not run reports nothing.
      #
      # BackupStale is deliberately NOT scoped to stage="upload". That series is never
      # written when the job runs with BACKUP_TARGET=local — the mode docs/self-hosting.md
      # offers a reader with no object store — so scoping to it left the entire DC
      # configuration with no rule that could see the timer stop, while that page promised
      # both rules "start working with no extra configuration". Unaggregated and per-stage,
      # so Grafana raises one instance per stage and the annotation can name which; on Cloud
      # the only change is that a fully stopped timer raises two instances instead of one.
      #
      # noDataState: OK is deliberate and has a cost. It keeps the rules dormant on an
      # install that runs the observability stack without the backup timer (the metric simply
      # does not exist there). The price is that DELETING the .prom file — or losing the
      # node-exporter bind mount — silences the alert instead of firing it. The installer
      # writes zero-timestamp sentinel STATE files, so the first run to execute at all
      # publishes a series that is instantly stale rather than a healthy-looking one; note
      # that the series itself appears only once the script has run once and emitted a .prom,
      # which is why installing the job ends with a manual run (ops-prod-hardening §6.3d) and
      # why confirming the series exists is a step of the restore drill.
      #
      # AN ANNOTATION IS RENDERED PER INSTANCE, SO IT MUST DESCRIBE EXACTLY ONE. These two
      # rules are unaggregated, so `stage` is already decided by the time the text renders.
      # The summary below used to interpolate the stage correctly and then append a legend
      # covering BOTH stages — the reader was told the right stage and then handed a
      # two-branch key to apply to themselves, the other branch guaranteed irrelevant to the
      # message it appeared in. Grouping makes that worse rather than redundant: policies.yml
      # groups by `alertname`, so a fully stopped timer puts BOTH stage instances in ONE
      # email and the legend was printed twice, once beside each stage it half-applied to.
      # Do not restate the reason as "one notification per instance" — that is a property of
      # the notification policy, not of this rule, and that policy already makes it false;
      # what holds is that the TEXT is expanded per instance. Found by HD-187's acceptance
      # test on a deliberately fired BackupStale; `if`/`eq`/`$labels` confirmed to expand
      # (not render literally) on the pinned grafana:11.5.2, one branch per stage. Branch on
      # $labels inside the template; never enumerate cases the instance has already settled.
      # The `else` makes the branch total, which is only truthful while `stage` has exactly
      # the two values hamstrack-backup.sh emits: a third one would be described as a missing
      # dump. If you add a stage to the .prom, add its arm here in the same commit.
      - uid: hamstrack-backup-stale
        title: BackupStale
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: 'Backup stage {{ $labels.stage }} has not succeeded in over 26 hours — {{ if eq $labels.stage "upload" }}nothing has landed off-box{{ else }}the job is not running at all{{ end }}; see journalctl -u hamstrack-backup on the host'
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'time() - hamstrack_backup_last_success_timestamp_seconds'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [93600] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # The `stage` label is the whole value of this alert — it is what tells "no dump was
      # taken" from "a good dump is on the box and only the upload failed", and those have
      # opposite first moves during an incident. It is only as truthful as the .prom, which
      # is why hamstrack-backup.sh's ExecStopPost handler stands down when the run's EXIT
      # trap already published: the handler can only say "both stages failed, size 0", and
      # it fires on every non-success result, so it used to relabel exactly the failure this
      # rule exists to distinguish.
      #
      # Its summary names the one stage its instance carries and stops there — the per-
      # instance rule above applies here too, and this text is what it looks like satisfied.
      - uid: hamstrack-backup-run-failed
        title: BackupRunFailed
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "The last Hamstrack backup run failed at stage {{ $labels.stage }} — see journalctl -u hamstrack-backup on the host"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'hamstrack_backup_last_status'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # A stored role_id failed the scope/ownership assertion (HD-127). No request can
      # create such a row — every write door resolves role ids through
      # RoleRepository.findAssignable(id, workspaceId, scope) — so any non-zero value is a
      # data-integrity bug (bad migration, hand-written UPDATE, or an authorization defect),
      # never load. Hence > 0 and for: 0m. The `source` label names the table; the matching
      # ERROR log names the role id.
      - uid: hamstrack-role-scope-violation
        title: RoleScopeViolation
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "A stored role_id failed the scope/ownership assertion in the last 15m"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(hamstrack_role_scope_violation_total[15m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # HD-199. The two rules below watch the DELIVERY of configuration rather than the
      # application: they are the only thing that proves the sync worked and keeps working.
      # The metrics come from the host systemd unit hamstrack-config-drift.service (and
      # from the tail of every apply-config.sh run) through node-exporter's textfile
      # collector, so they arrive under the Prometheus job `node`, exactly like the backup
      # metrics above and for the same reason: a deploy is not something the JAR can see.
      #
      # A drifted box is usually a DELIBERATE incident edit, so these are `warning` and not
      # `critical`: the job of the alert is to make sure the edit is un-done, not to wake
      # anybody. `.env` for durable, the file for temporary, a commit for permanent — and
      # this is what remembers the middle one.
      #
      # noDataState: OK has the same shape and the same price as the backup rules: it keeps
      # the pair dormant on an install that runs this stack without the drift timer, and it
      # means that DELETING the .prom silences the alert instead of firing it. The distinct
      # gap here is that apply-config.sh publishes at every deploy even when the timer is
      # NOT installed — so the series exists, looks healthy, and is only as fresh as the
      # last deploy. hamstrack_config_check_timestamp_seconds is what tells those two
      # states apart, and it is the whole reason that metric exists.
      #
      # AN ANNOTATION IS RENDERED PER INSTANCE, SO IT MUST DESCRIBE EXACTLY ONE. The query
      # is deliberately UNAGGREGATED, and it must stay that way: the summary branches on
      # $labels.scope, and any aggregation that drops the label — a max(), a sum(), a
      # count() — would render the branch against an instance with no scope and hand the
      # reader the wrong first move, or none. The scope is the only label that makes this
      # alert actionable. Each scope has a different first move, so the summary names one
      # and never a legend covering every scope at once. The `else` makes the branch total,
      # and its arm is installed-ops — which means an UNNAMED scope is described as an
      # uninstalled ops artefact and sends the reader to the wrong step. So: if you add a
      # scope to the .prom, add its arm here in the same commit. That has already been paid
      # once (edge-body-limit, HD-191). WHAT differs is in the journal and in the script's
      # stdout, never in a label.
      - uid: hamstrack-config-drift
        title: ConfigDrift
        condition: B
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: '{{ if eq $labels.scope "files" }}A synced file in /opt/hamstrack differs from the commit that was deployed — an edit made on the box, which the next deploy will overwrite. Re-deploy to restore it, or commit it{{ else if eq $labels.scope "containers" }}A container is running a service definition that is not the one on disk in /opt/hamstrack — the file was replaced and the stack was never brought up. Run the deploy again{{ else if eq $labels.scope "edge-body-limit" }}The deployed Caddyfile has no request_body/max_size block, so nothing bounds an upload before the app has read the whole body — a lane that spends no rate-limit budget. A deploy never syncs the Caddyfile: merge the block by hand (docs/ops-prod-hardening.md §2) and bring caddy up with `up -d`, not `restart`{{ else }}An ops artefact installed under /usr/local/bin or /etc/systemd/system differs from the copy in /opt/hamstrack/ops — a deploy places files and never installs them, so the install step in docs/ops-prod-hardening.md §6.3 is what closes this{{ end }}; journalctl -u hamstrack-config-drift names what differs'
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'hamstrack_config_drift'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # The un-pin reminder, as a mechanism rather than as a sentence in a checklist. An
      # emergency rollback is `APP_IMAGE_TAG=<version>` in /opt/hamstrack/.env — a file no
      # deploy touches, so the pin survives by construction and therefore cannot be undone
      # by forgetting. `for: 6h` is the point: a pin still in place after six hours is
      # either forgotten or has become the intended version, and both deserve a sentence to
      # a person. Unaggregated so the instance carries `tag` and the summary can name it.
      #
      # This metric says the tag is not `latest`; it does NOT say the deploy is blocked.
      # apply-config.sh refuses on the pin having MOVED (`.env` versus `.deployed-image-tag`),
      # so a box that pins by policy fires this rule while deploying perfectly happily. The
      # summary therefore gives BOTH outcomes an action — un-pin, or adopt the version with
      # one `--adopt-pin` run — because "it has become the intended version" left alone is
      # the state where deploys stay red for ever and nothing else says so.
      #
      # NOT `--allow-pinned`, and the difference is why there are two flags: that one
      # proceeds for a single run and deliberately leaves `.deployed-image-tag` alone, so an
      # operator who reaches for it at hour six — an urgent config fix during the very
      # incident this pin is holding — does not thereby tell the next unattended deploy that
      # a rolled-back image is the intended one. Adoption is the deliberate act, and this
      # summary is read by somebody tired.
      - uid: hamstrack-deploy-image-pinned
        title: DeployImagePinned
        condition: B
        for: 6h
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Production has been pinned to image tag {{ $labels.tag }} for six hours — APP_IMAGE_TAG is set in /opt/hamstrack/.env. Config delivery is refused while the pin disagrees with .deployed-image-tag, so every deploy is red until you un-pin OR adopt the pin. Un-pin it (set it to latest or remove the line) and `docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d`; or, if this version is now the intended one, adopt it by running the applier once by hand with --adopt-pin, which re-stamps the tag and lets deploys resume. If the rollback is still in progress and you only need one configuration change applied now, use --allow-pinned instead: it applies this run and does NOT re-stamp, so the next unattended deploy still refuses (docs/ops-prod-hardening.md §3)"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'hamstrack_deploy_image_pinned'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # ---------------------------------------------------------------------------
      # OUTBOUND MAIL ABUSE (HD-190, HD-202). The rules below are ORDERED BY VALUE, which
      # is the reverse of the order they would naturally be written in, and the ordering
      # is the finding rather than a convention. Read it before adding another one.
      #
      # THE RANKING RULE: a rule built on THROTTLE REFUSALS can only see an attacker who
      # HITS a ceiling. Anybody who reads the configured numbers and stays beneath them
      # trips no refusal at all and is invisible to every such rule. That is not a corner
      # case — for the auth mailers it is the OPTIMAL attack, because the way to hold a
      # victim's bucket full is to send exactly as slots age out, which is never refused.
      # So a refusal counter is always the weakest witness available, and a rule that
      # measures a QUANTITY (mail volume, acceptance ratio, concentration on one inbox) is
      # always the stronger one. Refusal rules come last here for that reason.
      #
      # Where a refusal is the ONLY thing a caller is ever told, the counter is also the
      # only evidence that exists at all — the auth mailers' uniform 200 means nobody
      # complains and nothing is logged. Weakest witness and sole witness at once, which is
      # why those two get both a normal and a low-threshold rule, plus a quantity rule that
      # does not depend on a refusal ever happening.
      #
      # None is `critical`. None of this is "the product is down", and paging an operator
      # for abuse trains them to mute the folder that also carries AppDown.
      # ---------------------------------------------------------------------------

      # RULE 1, the most valuable: the direct measurement of the loss, independent of
      # every ceiling. 500/day is a sixth of Hamstrack Cloud's 3000/month provider quota
      # (Resend's free tier), i.e. the month is gone in six days. THAT NUMBER IS OURS, NOT
      # YOURS: a self-hosted install on its own SMTP relay may have a far larger quota or
      # none at all, and 500/day may be an ordinary Tuesday there. If it is, edit the
      # threshold in this file (observability/grafana/provisioning/alerting/rules.yml) —
      # Grafana thresholds in this stack are provisioned, not environment-driven, so this
      # is the file to change and there is no variable to set.
      # A real onboarding week can approach it, which is exactly why
      # this is a warning that says GO AND LOOK rather than one that says act: the
      # domain-only INFO line ("mail send allowed: ... recipientDomain=") separates one
      # abuser mailing four hundred domains from one customer onboarding four hundred
      # colleagues at one domain, and Prometheus cannot, because no metric here may carry
      # an address or an id.
      - uid: hamstrack-mail-daily-volume-high
        title: MailDailyVolumeHigh
        condition: B
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "More than 500 emails sent in 24h - at Hamstrack Cloud's 3000/month provider quota that consumes the month in six days (self-hosted on your own relay, your quota may differ - the threshold lives in observability/grafana/provisioning/alerting/rules.yml), and the first symptom of running out is that new users silently stop receiving verification links. Do not change a ceiling yet: search the app logs for the line 'mail send allowed' and group by recipientDomain. Many unrelated domains with a low acceptance ratio is a spam run (see InviteVolumeUnaccepted); one domain is a customer onboarding, and the action there is to RAISE INVITE_MAX_PER_SENDER_PER_DAY, not to lower anything. The mail_send_events table answers 'which account' for the last INVITE_EVENT_RETENTION_DAYS days"
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(hamstrack_email_sent_total{outcome="success"}[24h]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [500] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # RULE 2, the discriminator - and the only rule here that sees an abuser who stays
      # under every ceiling. Real invitations get accepted; spam does not, and nothing
      # else in the metric surface separates the two.
      #
      # The `and on()` guard is what keeps it quiet: below 200 invitations in six hours
      # the expression returns no data and noDataState: OK holds, so a small instance
      # where two invitations went unanswered never fires.
      #
      # THE KNOWN FALSE POSITIVE, STATED SO IT IS NOT DISCOVERED: a genuine 300-person
      # onboarding started at 17:00 on a Friday shows a low acceptance ratio for hours.
      # The six-hour window and `for: 30m` absorb the ordinary version of that; the
      # Friday-evening version WILL fire, and the summary says so. A rule with a named,
      # explained false positive survives; one whose false positive is a surprise gets
      # muted within a week, which is the failure this rule exists to avoid.
      - uid: hamstrack-invite-volume-unaccepted
        title: InviteVolumeUnaccepted
        condition: B
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Over 200 invitations in 6h with under 10% accepted - a spam run looks exactly like this and a real onboarding does not, because real invitations get accepted. KNOWN FALSE POSITIVE: a genuine large onboarding started on a Friday evening also looks like this for a few hours, so check before acting. The check is one query - search the app logs for the line 'mail send allowed' and group by recipientDomain: many unrelated domains is abuse, one customer domain is an onboarding. The mail_send_events table names the account. If it is abuse, lower INVITE_MAX_PER_SENDER_PER_DAY and disable the account; if it is an onboarding, raise it"
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '(sum(increase(hamstrack_invites_accepted_total[6h])) / clamp_min(sum(increase(hamstrack_invites_sent_total[6h])), 1)) and on() (sum(increase(hamstrack_invites_sent_total[6h])) > 200)'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: lt, params: [0.1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # RULE 3, least valuable and still worth having: it catches the LOUD abuser, and
      # only the loud one. Listed last on purpose - anyone who builds only this rule has
      # built a monitor for the incompetent. The kind label is what makes it actionable,
      # because the three kinds mean three different things.
      - uid: hamstrack-invite-throttle-tripping
        title: InviteThrottleTripping
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Invitation ceilings refused more than 20 requests in 15m. READ THE kind LABEL: invite_sender_volume is bulk-shaped (one account sending a lot - check whether it is a customer onboarding before lowering anything); invite_recipient_cooldown is harassment-shaped (one account pressing invite at one address across workspaces); invite_recipient_daily is the sharpest, one address hit from SEVERAL accounts, which costs the attacker a mailbox per account and is almost never innocent. This rule cannot see an attacker who stays under the ceilings - MailDailyVolumeHigh and InviteVolumeUnaccepted are the ones that can"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(hamstrack_ratelimit_hit_total{kind=~"invite_.*"}[15m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [20] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # RULE 4 (HD-202): the loud version of an attack on the auth mailers, whose subject has
      # NO OTHER WITNESS. Every other throttle in the product tells its caller it fired, so a
      # user complaint is a second signal. The per-address ceilings on forgot-password and
      # resend-verification refuse in SILENCE - those endpoints must answer identically for a
      # registered and an unregistered address, so a throttled request gets the usual 200 and the
      # usual sentence and no log line. (POST /api/auth/register spends a THIRD budget of its own,
      # registration_verification, and does answer 429; it already discloses existence through its
      # own 409. It shared the verification budget until final review, which let anybody deny a
      # stranger's signup for free and in silence.)
      #
      # THE SELECTOR IS A NAMING CONVENTION, NOT A LIST. It used to name today's four kinds
      # explicitly, so a fifth silent mailer would have tripped nothing and no test would have
      # failed - silence squared, given that this counter is the only witness. Every
      # recipient-keyed RateLimitKind is now required to end in _recipient_cooldown,
      # _recipient_window or _recipient_daily, and MailThrottleCoverageTest asserts that every
      # policy's two kinds are matched by the regexes in THIS FILE. Adding a policy therefore
      # either lands inside these rules automatically or fails a test that says so.
      #
      # Read it in two directions: somebody is aiming reset mail at one address, AND somebody may
      # be keeping a named person from recovering their own account for the length of the window.
      - uid: hamstrack-auth-mail-throttle-tripping
        title: AuthMailThrottleTripping
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Per-address ceilings on reset/verification mail refused more than 20 requests in 15m, and ON TWO OF THE THREE ENDPOINTS NOBODY WAS TOLD - forgot-password and resend-verification answer 200 either way by design, so this counter is the only evidence that exists for them. READ THE kind LABEL: *_recipient_cooldown is repetition at one address (one a minute is the bound); *_recipient_window means an address has taken its whole window's allowance, which is both a mail flood aimed at a person AND a window in which that person cannot reset their own password (15m on reset, 1h on verification). THIS RULE ONLY SEES A NOISY ATTACKER. One who spends the cap exactly as slots age out is never refused and never appears here - MailRecipientConcentration is the rule that sees that one, and it is the failure mode the ceilings exist to bound. mail_send_events is where to find WHICH addresses; the metrics deliberately cannot carry one. If this is quiet and users report missing reset links, check MailRecipientConcentration first, then MailDailyVolumeHigh and the failed_email table"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(hamstrack_ratelimit_hit_total{kind=~".*_recipient_(cooldown|window|daily)"}[15m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [20] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # RULE 5 (HD-202 review): the SAME counter, a tenth of the threshold and a window
      # eight times as wide, restricted to the VOLUME kinds.
      #
      # Rule 4 answers "is somebody hammering an address right now" and needs a big number to
      # avoid firing on ordinary cooldown noise - a user pressing "send me a link" twice is a
      # legitimate _recipient_cooldown hit, and a busy instance produces a steady trickle of
      # them. A _recipient_*window*/*daily* hit is a different animal: it means one inbox has
      # taken its ENTIRE allowance for the period, which needs either sustained volume or
      # several senders. Ten of those in six hours is already abnormal on any instance size,
      # so this fires far earlier and far more quietly than rule 4 can.
      #
      # It is deliberately NOT a duplicate of rule 4 at a lower threshold: the kind selector
      # excludes the cooldown kinds, which are the noisy ones, and that is the whole reason the
      # threshold can come down this far. Same naming-convention selector, same test.
      - uid: hamstrack-mail-recipient-cap-reached
        title: MailRecipientVolumeCapReached
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "More than 10 per-recipient VOLUME refusals in 6h. Unlike a cooldown refusal, one of these means a single inbox took its whole allowance for the period - which needs sustained volume or several senders, and is abnormal at any instance size. READ THE kind LABEL, AND THE ENDPOINT IT NAMES DECIDES WHETHER ANYBODY WAS TOLD: invite_recipient_daily is one address invited from several accounts (costs the attacker a mailbox per account, almost never innocent, and the admin who tripped it got a 429); password_reset_recipient_window / verification_recipient_window mean an address has taken its whole reset or verification allowance, which is simultaneously a mail flood aimed at a person and a period in which that person cannot recover their own account - and on those two NOBODY WAS TOLD, because the refusal is silent by design and this counter is the entire record of it; registration_verification_recipient_window is register's own budget, which does answer 429, so there the refused caller knows and this rule is corroboration rather than sole evidence. Find WHICH addresses in mail_send_events (see docs/self-hosting.md); no metric here may carry one. If this is firing, also look at MailRecipientConcentration: an attacker who paces themselves trips that and not this"
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(hamstrack_ratelimit_hit_total{kind=~".*_recipient_(window|daily)"}[6h]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [10] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # RULE 6 (HD-202 review), and THE ONLY RULE IN THIS FILE THAT SEES THE ATTACK THE AUTH
      # CEILINGS WERE BUILT FOR. Every rule above it is built on refusals, and the
      # denial-of-recovery attacker is NEVER REFUSED: to keep a victim's bucket full they send
      # exactly at the rate slots age out, spaced past the cooldown, and every one of those
      # requests is ALLOWED. The only refusals such an attack generates are the victim's own
      # one or two attempts to reset their password - a couple of hits against thresholds in
      # the tens. Rules 4 and 5 therefore fire for the noisy shape and stay silent for the
      # quiet one, which is precisely the shape AuthMailProperties names as the failure mode.
      #
      # So this one measures a QUANTITY instead: how much anonymous auth mail went to the
      # single busiest recipient key in the last six hours. That number is true whichever
      # ceiling did or did not fire.
      #
      # WHY IT CARRIES NO ADDRESS, WHICH IS ALSO WHY IT CAN BE A METRIC AT ALL. A Grafana
      # alert carries its series labels into alert state and out through the email contact
      # point, so a recipient_key label here would MAIL RECIPIENT ADDRESSES to the operator.
      # The gauge answers "is somebody being targeted"; the SQL in the summary answers "who",
      # run against the database, where an address legitimately lives. This is the same reason
      # no other meter in this product carries an id or an address.
      #
      # max() and not sum(): every replica computes the same instance-wide number from the
      # same table, so the series are duplicates rather than shards.
      #
      # THE THRESHOLD, and the arithmetic that makes 20 a bound rather than a guess. The gauge's
      # query has NO email_type filter, so it sums all three anonymous budgets at one inbox. To
      # SUSTAIN a denial an attacker must keep a bucket full: 5/h for the registration bucket = 30
      # rows per 6h, the same 30 for resend-verification, and 20/h for the quarter-hour password
      # reset bucket = 120 per 6h. Every one of those exceeds 20, with 1.5x of margin on the
      # loosest - so the minimum traffic that holds somebody out of their own recovery cannot stay
      # under this rule. Meanwhile an honest inbox tops out at a handful in six hours (five per
      # window is already generous for "spam folder, typo, second device").
      #
      # WHAT IT DOES NOT CATCH, as the accepted cost: a hit-and-run. One capful fired once is five
      # rows, a quarter of the threshold, and it buys a full window of lockout - indistinguishable
      # here from a person with a typo and two devices. The refusal rules above see the burst
      # shape, this one sees the sustained shape, and a single cheap capful is seen by neither.
      #
      # On a self-hosted instance where 20 is wrong, this file is where to change it - Grafana
      # thresholds in this stack are provisioned, not environment-driven. The derivation above is
      # on AnonymousMailConcentration; move both or neither.
      #
      # noDataState/execErrState are NOT OK here. The default in this file is OK, and for almost
      # every rule that is right: a missing series means somebody did not deploy the thing being
      # watched, and paging them for it is noise. THE RULE FOR DEPARTING FROM IT IS A CATEGORY, NOT
      # A COUNT - any rule whose failure mode is ABSENCE rather than noise must treat NoData and
      # Error as firing states, because for such a rule "no series" is not "nothing is wrong", it is
      # "the thing that would have told you is gone". This rule qualifies because it is the sole
      # witness to an attacker who is never refused; MailConcentrationGaugeStale below qualifies for
      # the same reason one level up, and any future rule watching a single-witness signal joins
      # them. (An earlier version of this comment said this rule was the ONLY departure in the file,
      # and named its counterexample fourteen lines later.) See that rule for the third and quietest
      # shape, a gauge that is present and FROZEN.
      - uid: hamstrack-mail-recipient-concentration
        title: MailRecipientConcentration
        condition: B
        for: 15m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "One email address has received more than 20 anonymous auth emails (password reset / verification) in 6h. THIS IS THE ONE RULE THAT SEES AN ATTACKER WHO STAYS UNDER THE CEILINGS, and staying under them is the optimal play here: sending exactly as slots age out keeps a person locked out of their own password recovery indefinitely, is never refused, and shows up in no refusal metric. It is silent from the victim's side too - forgot-password answers 200 either way, so they are told a link was sent and it never arrives. NEXT STEP, and the metric cannot do it for you because no meter may carry an address: run against the database - SELECT recipient_key, email_type, count(*) FROM mail_send_events WHERE sender_user_id IS NULL AND created_at > now() - interval '6 hours' GROUP BY 1, 2 HAVING count(*) > 20 ORDER BY 3 DESC; Then block the source at the proxy - lowering AUTH_MAIL_MAX_PER_RECIPIENT_PER_WINDOW does NOT help, it shortens the victim's own allowance too"
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'max(hamstrack_mail_anonymous_recipient_max)'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [20] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # RULE 7 (HD-202 final review): THE WITNESS'S OWN WITNESS.
      #
      # hamstrack_mail_anonymous_recipient_max is refreshed on a five-minute schedule into a
      # last-write-wins AtomicLong. That makes its failure mode SILENT rather than absent: if the
      # query behind it starts erroring or timing out, the gauge does not vanish and does not go to
      # zero - it FREEZES at its last value, which on any healthy instance is a low one. Rule 6
      # then reads a frozen quiet number as a quiet instance, for ever. And the population that
      # makes that query slow is the flood rule 6 exists to detect, so the two failures correlate.
      #
      # AnonymousMailConcentration.refresh now catches and logs, and stamps
      # hamstrack_mail_anonymous_recipient_max_age_seconds only on a run that completed. That gauge
      # is evaluated at scrape rather than on the schedule, so it keeps RISING while the refresh is
      # broken - which is the property a rule can see and a frozen value is not.
      #
      # THE THRESHOLD is 1800s = six missed refreshes. The schedule is 300s, so this tolerates a
      # slow node, a redeploy and a couple of transient timeouts before it says anything. A fresh
      # process is not a special case and deliberately has no sentinel: the age counts from PROCESS
      # START until the first successful refresh, so 1800s + for:10m absorbs a deploy six times over
      # while an instance whose refresh NEVER succeeds still ages into this rule. It used to publish
      # -1 until the first success, which put "has never worked, not once" permanently BELOW this
      # threshold - so the state with the worst consequences (V25 not applied on an upgrade, a
      # persistent timeout, a permissions problem) was the one state neither this rule nor rule 6
      # could reach: the value stayed 0, the age stayed -1, both series existed so NoData/Error did
      # not help, and no rule in this file is Loki-backed, so the WARN that names the cause alerts
      # nobody.
      #
      # noDataState/execErrState are NOT OK, for the category reason given on rule 6: this rule's
      # failure mode is ABSENCE. It watches the watcher, so a missing or erroring series here means
      # the only signal that sees an unrefused attacker is unsupervised - which is exactly what an
      # operator must not read as calm.
      #
      # max() over replicas would hide a single broken node behind its healthy neighbours only if
      # the number were per-node; it is not - every replica runs the same instance-wide query, so a
      # node whose refresh is failing is a node whose age is rising, and min() would be the one that
      # hides it. max() is correct here for the opposite reason it is correct on rule 6.
      - uid: hamstrack-mail-concentration-gauge-stale
        title: MailConcentrationGaugeStale
        condition: B
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "hamstrack_mail_anonymous_recipient_max has not been refreshed for over 30 minutes, so MailRecipientConcentration is reading a FROZEN number and cannot be trusted. That gauge is the only signal that sees an attacker who stays under every ceiling and is therefore never refused, and it fails silent by construction: a failing or timing-out query leaves the last value in place rather than clearing it, and the last value is almost always a quiet one. Look for a WARN from AnonymousMailConcentration naming the cause. Most likely a statement timeout on the mail_send_events aggregate - check that idx_mail_send_events_anonymous (V25) exists, because without it that query scans the whole table and gets slower exactly as the flood it watches grows. Until this clears, run the mail_send_events query from MailRecipientConcentration's summary by hand"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'max(hamstrack_mail_anonymous_recipient_max_age_seconds)'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [1800] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # ────────────────────────────────────────────────────────────────────────────────
      # STORAGE QUOTA (HD-191). Four rules, and they are a set: the first says a tenant is
      # already stuck, the second says one is about to be, the third says the number the
      # quota is enforcing is not true, and the fourth says the third has stopped looking.
      #
      # NO RULE HERE CAN NAME A WORKSPACE, and that is a constraint on the metrics rather
      # than an oversight in the rules: no meter in this product carries a workspace id, a
      # user id or any tenant-identifying value, because a Grafana alert carries its series
      # labels into alert state and out through the email contact point. The "which
      # workspace" question is answered against the database, and each summary below
      # carries the query.
      # ────────────────────────────────────────────────────────────────────────────────

      # RULE 1: A TENANT IS BLOCKED AND NOBODY TOLD YOU.
      #
      # A quota refusal is a clean 409. It appears in no error rate, no 5xx panel and no log
      # anybody watches, so this counter is the ONLY signal that a workspace has stopped being
      # able to upload. Any sustained rate means somebody is hitting a wall right now.
      #
      # noDataState/execErrState STAY OK, and that is a decision rather than the default being
      # left in place. The category rule at MailRecipientConcentration says a rule whose failure
      # mode is ABSENCE must treat NoData as firing - and this rule's failure mode is not
      # absence. What it watches is a POSITIVE RATE on a counter Micrometer registers at boot,
      # so on a healthy instance the series is present and reads zero; "no series" here does not
      # mean the witness is gone, it means the application is not being scraped at all, which is
      # AppDown's job and would arrive here only as a second copy of that page. The rule one
      # level up - StorageDriftGaugeStale - is the one in the absence category, because a frozen
      # gauge is indistinguishable from a calm one, and it is set accordingly.
      - uid: hamstrack-storage-quota-refusals
        title: StorageQuotaRefusals
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Attachment uploads are being refused because a workspace has filled its storage quota, and have been for a quarter of an hour. This is a clean 409, so it shows up in no error rate and no log - this counter is the only thing that can tell you. The refusal deliberately prescribes no action to the person who sees it (they may hold no permission to delete anything, and the space may be in a project they cannot see), so somebody is stuck until an operator acts. NEXT STEP, and the metric cannot do it for you because no meter may carry a workspace id: run against the database - SELECT workspace_id, bytes_used, attachment_count FROM workspace_storage_usage ORDER BY bytes_used DESC LIMIT 20; then decide whether to raise STORAGE_QUOTA_WORKSPACE_BYTES or to ask that workspace's owners to free space, which they can do from Workspace settings then Storage. Raising the value takes effect on the next request and nothing is cached"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(hamstrack_storage_quota_refused_total[15m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # RULE 2: SOMEBODY IS ABOUT TO BE BLOCKED.
      #
      # Fires BEFORE rule 1, which is the entire point of having a threshold: a quota whose
      # first symptom is a refusal is a quota nobody could have planned around.
      #
      # max(), NEVER sum(). Every replica computes the same install-wide number from the same
      # table, so the series are duplicates rather than shards - summing them would multiply
      # the fill level by the replica count and page at a third of the real threshold. Same
      # division hamstrack_mail_anonymous_recipient_max uses, for the same reason.
      - uid: hamstrack-storage-fill-high
        title: StorageFillHigh
        condition: B
        for: 1h
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "The fullest workspace on this instance is over 90 percent of its storage quota. Nothing is refused yet - this fires before StorageQuotaRefusals on purpose, so there is time to act before somebody's upload fails. The number is install-wide and identical on every replica, so alert on max and never on sum. NEXT STEP: SELECT workspace_id, bytes_used, attachment_count FROM workspace_storage_usage ORDER BY bytes_used DESC LIMIT 20; The value is refreshed on the reconcile schedule rather than at scrape, so it is as old as the last pass - if it looks stale, check StorageDriftGaugeStale, which is watching exactly that"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'max(hamstrack_storage_quota_fill_max)'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0.9] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # RULE 3: THE QUOTA IS ENFORCING A NUMBER THAT IS NOT TRUE.
      #
      # workspace_storage_usage.bytes_used is maintained by a row trigger on
      # issue_attachments and is supposed to equal SUM(size_bytes) for the workspace at every
      # commit boundary - including through ON DELETE CASCADE, which is the whole reason it is
      # a trigger and not a service-level decrement. Drift is expected to be exactly zero, so
      # any value here is a real finding: something wrote or deleted attachment rows outside
      # the trigger (a restore, a hand-run DELETE, a bulk path), or the trigger is gone.
      #
      # 1 MiB rather than zero so that a pass which straddles a live upload does not page
      # anybody; the reconciler takes the same row lock an upload takes, so this should be
      # exact, and the tolerance is for the operator's sleep rather than for the mechanism.
      - uid: hamstrack-storage-usage-counter-drift
        title: StorageUsageCounterDrift
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "The stored per-workspace byte counter disagreed with the attachment rows it is supposed to equal by more than a megabyte, and the reconciler corrected it. That number is what the storage quota enforces, so while it was wrong some workspace was being refused uploads it should have been allowed, or allowed uploads past its ceiling. Drift is expected to be zero - the counter is maintained by a database trigger that follows every INSERT, DELETE and cascade - so this means rows moved outside it. Look for a WARN from WorkspaceStorageReconciler naming the size of the correction. Check that the trigger still exists by selecting tgname from pg_trigger for the issue_attachments relation; you are looking for trg_issue_attachments_storage_usage. If it is missing, the counter has been a one-way ratchet since it went, and the nightly pass is the only thing that has been fixing it"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'max(hamstrack_storage_drift_bytes)'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [1048576] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # RULE 4: THE WITNESS'S OWN WITNESS - the MailConcentrationGaugeStale shape, one feature
      # over.
      #
      # hamstrack_storage_drift_bytes and hamstrack_storage_quota_fill_max are both written by
      # the reconcile pass into last-write-wins AtomicLongs. Their failure mode is SILENT
      # rather than absent: a reconciler that stops running leaves both FROZEN at their last
      # values, which on any healthy instance are 0 and something calm - so rules 2 and 3 go
      # quiet together and read exactly like a clean instance. This is the only rule that can
      # tell the difference.
      #
      # 90000s = 25 hours, i.e. ONE missed daily pass, which tolerates a deploy and a slow
      # night. The age counts from PROCESS START until the first successful pass and has no
      # sentinel branch, so an instance whose reconciler never runs at all still ages into this
      # rule - the mistake that made "never worked, not once" permanently unalertable on the
      # mail gauge, avoided here by construction rather than by remembering. An EMPTY
      # STORAGE_QUOTA_RECONCILE_CRON therefore fires this rule on purpose: disabling the
      # witness is allowed and is not allowed to be silent.
      #
      # max() AND NOT min(), AND THE APP HAS TO COOPERATE FOR THAT TO WORK. Only one replica
      # gets the advisory lock each night; the others defer. A deferring replica STAMPS THE
      # GAUGE ANYWAY (WorkspaceStorageReconciler) precisely because this rule takes the max: a
      # replica that correctly stood aside is not stale, and without that stamp one node would
      # stamp while N-1 aged from process start, so this rule would fire on every multi-replica
      # install after 25h and never clear. An always-firing rule gets silenced, and silencing
      # THIS one removes the only detector of a genuinely dead reconciler. Do not "fix" that by
      # switching to min() instead: min() is satisfied by any single fresh replica, so one
      # restarted node would suppress this for 25h with nothing reconciling at all.
      #
      # noDataState/execErrState are NOT OK here, and the reason is the CATEGORY stated at
      # MailRecipientConcentration above: a rule whose failure mode is ABSENCE rather than
      # noise must treat NoData and Error as firing, because for such a rule "no series" is not
      # "nothing is wrong", it is "the thing that would have told you is gone". This rule is the
      # sole witness to a frozen gauge, and a frozen gauge is indistinguishable from a healthy
      # one - so an absent age series is exactly the state it exists to catch. It shipped at OK
      # and that was the rule opting out of a category its own file declares.
      - uid: hamstrack-storage-drift-gauge-stale
        title: StorageDriftGaugeStale
        condition: B
        for: 30m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The storage reconcile pass has not completed for over 25 hours, so hamstrack_storage_drift_bytes and hamstrack_storage_quota_fill_max are FROZEN rather than low, and StorageUsageCounterDrift and StorageFillHigh are both reading stale numbers that cannot be trusted. Two ordinary causes and they need different answers. Either the pass is failing - look for a WARN from WorkspaceStorageReconciler naming the exception - or STORAGE_QUOTA_RECONCILE_CRON was deliberately emptied, in which case this rule firing is the documented consequence of that choice and the fix is to set a cron or to silence this rule on purpose. The counter itself is unaffected either way: it is maintained by a database trigger, not by the pass, and the quota is still enforced against it"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'max(hamstrack_storage_drift_refreshed_at_age_seconds)'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [90000] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # ────────────────────────────────────────────────────────────────────────────────
      # EXPENSIVE-READ OCCUPANCY (HD-182)
      #
      # The bulkhead over the connection pool: every read that HOLDS a connection while it
      # works may hold at most EXPENSIVE_READ_MAX_IN_FLIGHT of a replica's connections at
      # once, so the rest of the API always keeps the difference. Today that is reports, HQL
      # search, saved filters, the storage breakdown and - since HD-174 - the PLANNING reads
      # (.../projects/*/backlog/**), which are the largest of them: one planning aggregate
      # holds ONE connection across up to 32 statements in a single read-only transaction,
      # and DB_STATEMENT_TIMEOUT_MS bounds each statement and not their sum. Read that list
      # as a CATEGORY: it grew once already, and the sentence that named its members was
      # false the day it did.
      #
      # A NEW SURFACE JOINS THIS SHARE RATHER THAN GETTING ITS OWN (ADR-0031), so this rule
      # keeps covering the whole bulkhead without a second kind, a second gauge or a second
      # ceiling an operator must size. The consequence to know when reading a page: planning,
      # reports and search now refuse EACH OTHER under saturation, so a firing here may be
      # caused by traffic on a different surface than the one whose users are complaining.
      #
      # ONE RULE, ON THE SURFACE-FULL KIND ONLY, AND THAT ASYMMETRY IS THE POINT. There are
      # two refusal kinds and they mean different things to whoever reads the page.
      # expensive_read_in_flight is ONE CLIENT fanning out past its own share - a lost
      # debounce, a script, a page that mounts more parallel queries than it used to - and
      # the remedy is with that client, not with this instance, so paging an operator about
      # it would train them to ignore the rule. expensive_read_surface_full means EVERY
      # principal together is asking for more expensive work at once than this replica's
      # share of the pool allows, which is a provisioning decision: raise DB_POOL_MAX_SIZE,
      # or add a replica. Whether EXPENSIVE_READ_MAX_IN_FLIGHT has to move with it depends
      # on whether it is PINNED - unset, it is derived from the pool at every boot (60% of
      # it, capped at 6), so the pool alone widens the share on the next restart and
      # setting the variable would only convert a derive-safe install into a pinned one.
      #
      # RATE-BASED, NOT "> 0", for the reason StatementBudgetExceeded gives: a single
      # refusal is two people asking for a report at the same second, and it is the state
      # the bulkhead exists to produce rather than a fault. What matters is the SUSTAINED
      # rate.
      #
      # noDataState/execErrState stay OK: what this watches is a POSITIVE RATE on a counter
      # Micrometer registers at boot, so an absent series means the app is not being scraped
      # at all - AppDown's job, and this would only arrive as a second copy of that page.
      - uid: hamstrack-expensive-read-surface-saturated
        title: ExpensiveReadSurfaceSaturated
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Expensive reads are being refused because the whole instance's expensive-read share is full, and have been for a quarter of an hour. This is the bulkhead working - reports and searches are refused in milliseconds so interactive endpoints keep their connections - but a SUSTAINED rate of it means the instance is under-provisioned for its traffic, and real users are being turned away with 429 EXPENSIVE_SURFACE_BUSY. It is a clean 4xx, so it appears in no error rate. NEXT STEP: read hamstrack_expensive_read_in_flight (max over replicas, never sum - each process has its own bulkhead and its own pool) to confirm it is sitting at the share in force, then either raise DB_POOL_MAX_SIZE or add a replica. CHECK WHETHER EXPENSIVE_READ_MAX_IN_FLIGHT IS PINNED BEFORE TOUCHING IT: while it is unset the share is derived from the pool at every boot (60% of it, capped at 6), so raising the pool widens the share by itself, and setting the variable would only convert a derive-safe install into one somebody has to keep in step with the pool by hand - a pinned share at or above the pool refuses the boot. If it IS pinned, raise the pool first and the share after. If instead that gauge is pinned at the ceiling with no traffic to explain it, there are TWO explanations and one metric tells them apart. (a) A LEAKED PERMIT - the bulkhead never refills and the surface will refuse everything until the process restarts. (b) SLOTS HELD BY SLOW OR HOSTILE CLIENTS - a slot is taken before the request body is read and given back after the response is written, so a handful of trickled uploads or slow readers can pin the whole share for the price of a few sockets, which looks identical on this gauge and is not a leak. Read hamstrack_expensive_read_permit_force_released_total: FLAT while the gauge is pinned means (a), and the fix is a restart plus a bug report; CLIMBING means (b), the watchdog is taking slots back, and the thing to look at is where those connections come from (Caddy access logs, and the WARN lines naming the user id) rather than any ceiling. The sibling kind expensive_read_in_flight is deliberately NOT in this rule: that one is a single client fanning out past its own share, and the remedy is with the client. NOTE WHICH SURFACES SHARE THIS BULKHEAD BEFORE BLAMING ONE: since HD-174 the PLANNING reads (GET .../projects/*/backlog and its sections) take permits from the same share as reports and search, so a team grooming a backlog can be the reason a colleague's report is refused, and the reverse. That is the accepted trade - a 429 in milliseconds with Retry-After: 1, where the status quo was that colleague waiting out a 30s connectionTimeout behind a planning read legitimately holding its connection for minutes - so it is not a defect to chase. This gauge has no per-surface breakdown by design (a per-path label would be the unbounded label the cardinality rule forbids); to attribute occupancy, read the per-class latency and refusal rates from the load harness or the access logs"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(hamstrack_ratelimit_hit_total{kind="expensive_read_surface_full"}[15m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0.005] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query

      # ────────────────────────────────────────────────────────────────────────────────
      # THE WATCHDOG (HD-182 review)
      #
      # A slot on that surface is taken BEFORE the request body is read and given back
      # AFTER the response is written, so part of its life is paced by the client. The
      # watchdog force-releases a slot held past DB_STATEMENT_TIMEOUT_MS + 60s and counts
      # it here. Until this rule existed the counter was covered BY CONSEQUENCE only: a
      # leaked slot eventually trips ExpensiveReadSurfaceSaturated above, but only once the
      # surface is already refusing real users - and the metric row in docs/observability.md
      # prescribes an action ("restart, and file a bug") that nothing was watching for.
      #
      # WHAT IT MEANS IS ONE OF TWO THINGS AND BOTH WANT A HUMAN. Either a client is holding
      # a slot across a client-paced stretch (a trickled upload, a reader taking a CSV a byte
      # at a time), which is the cheap denial this surface is worth denying - the WARN line
      # names the user id - or a request on this surface genuinely ran for over a minute
      # past the statement budget, which is a report nobody should be waiting for. Neither
      # is a leaked permit: a LEAK never reaches this counter at all, which is exactly why
      # a FLAT counter beside a pinned hamstrack_expensive_read_in_flight gauge means the
      # leak and a CLIMBING one means held slots.
      #
      # RATE-BASED WITH A LOW FLOOR RATHER THAN "> 0", for StatementBudgetExceeded's reason:
      # one force-release in a quarter of an hour is a single stalled client and paging on it
      # would train an operator to ignore the rule. More than about one every five minutes,
      # held for fifteen, is a pattern. It is a WARNING and not a page: capacity is being
      # taken back correctly while this fires - the bulkhead is working, and what needs a
      # human is the reason, not the outcome.
      #
      # noDataState/execErrState stay OK for the same reason as the rule above: this watches
      # a positive rate on a counter Micrometer registers at boot, so an absent series means
      # nothing is being scraped, which is AppDown's job.
      - uid: hamstrack-expensive-read-permit-force-released
        title: ExpensiveReadPermitForceReleased
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "The expensive-read watchdog is taking slots back, and has been for a quarter of an hour. A slot is held from before the request body is read until after the response is written, so this means requests on that surface are living past DB_STATEMENT_TIMEOUT_MS + 60s - either a client pacing one (a trickled upload, or a reader taking a report CSV a byte at a time, which costs the attacker one socket per slot) or a genuine request nobody should be waiting for. THE BULKHEAD IS WORKING WHILE THIS FIRES: capacity is being returned, and no user is refused by this rule's condition alone. NEXT STEP: read the WARN lines from PerPrincipalInFlightLimit - each names the user id and how long the slot was held - then the Caddy access logs for that caller. DO NOT RAISE ANY CEILING IN RESPONSE: a bigger share is more slots for the same client to hold. Read this counter beside hamstrack_expensive_read_in_flight (max over replicas, never sum): pinned gauge with this counter CLIMBING is slots being held, and the client is the thing to look at; pinned gauge with this counter FLAT is a LEAKED permit instead, which never reaches this counter at all and needs a process restart plus a bug report."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(hamstrack_expensive_read_permit_force_released_total[15m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0.003] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
                  type: query
