<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamstrack — Source-available task tracker</title>
    <!-- HD-194: the phrase is "source-available", never "open source" — Hamstrack ships under
         the Elastic License 2.0, which is not an OSI-approved licence. Wherever the licence is
         named, the permission it grants is named in the same sentence, so the two cannot drift
         apart. Sealed by src/licensing.test.ts. -->
    <meta name="description" content="Hamstrack is a source-available task tracker: boards, backlog, workspaces, comments and attachments. Self-host it free, including commercially, or use the cloud." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Open Graph: og:url points at the public cloud site; harmless for self-hosted installs -->
    <meta property="og:title" content="Hamstrack — Source-available task tracker" />
    <meta property="og:description" content="Boards, backlog, workspaces, comments and attachments. Source-available under the Elastic License 2.0: self-host it free, including commercially, or use the cloud." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hamstrack.com/" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
