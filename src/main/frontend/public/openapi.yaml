# Hamstrack REST API — OpenAPI 3.0 specification.
#
# Hand-maintained (springdoc does not support Spring Boot 4 yet): when the API
# surface changes, update this file together with docs/api-cloud.md and
# docs/api-dc.md. Served at /openapi.yaml and rendered by the in-app /docs page.
openapi: 3.0.3
info:
  title: Hamstrack REST API
  version: 0.2.0
  description: |
    The HTTP API behind the Hamstrack web app — everything the UI does goes
    through it, and it is available to users for scripting and integrations.

    **Authentication** — call `POST /api/auth/login` and send the returned
    access token as `Authorization: Bearer <token>` (use the **Authorize**
    button here). Tokens are short-lived (default 30 min); refresh via the rotating
    `refresh_token` cookie with `POST /api/auth/refresh`.

    **Access model** — a resource you cannot see returns `404`, whether it
    does not exist or you are not a member of its workspace. The API is
    unversioned while in beta; breaking changes are announced in release notes.

    **Permissions** — authorization is a permission check, not a role
    comparison, at workspace scope as well as inside a project: the role enums
    and the role ladder are gone, and the permission model is the only
    authority. `GET /permissions` is the catalog; `myPermissions` on every
    workspace and project response is what the caller holds there (advisory,
    for rendering only — the API is the enforcement boundary, and a client that
    gates nothing is still safe). A `403` names the permission it wanted:
    `detail` reads `Requires permission: <key>`, always the bare catalog key,
    never the `:own` form. Every `role` / `myRole` field is an **open role key
    string**, not an enum — never switch exhaustively on one, and gate on
    `myPermissions` instead. A member listing also carries `roleId` beside
    `role` — the role's **identity**, and the only safe way to match a member
    against `GET /workspaces/{workspaceId}/roles`, since a key is unique only
    within one *(workspace, scope)* and `MEMBER` already names two different
    built-in roles. The permissions a request's
    own shape determines are checked **before** the project's state, so a
    caller who lacks one on an archived project gets `403`, not the
    `409 "Project is archived"`. A single request may need several — see
    `PATCH …/issues/{number}`, which checks only the fields that are present
    *and actually changing* and names the first missing permission in catalog
    order. Whether a *target user* may be assigned is not a permission failure
    of the caller's: it answers `422` (see `issue.assignable`).

    **Errors** — every failure is an RFC 9457 problem document
    (`application/problem+json`). A request body that fails validation answers
    `400` with a `detail` naming the offending fields **and** an `errors` object
    keyed by JSON field path (see `ValidationProblemDetail`): both are built
    from one list, sorted by rendered line and capped at 10 entries, with any
    overflow appended to `detail` as `"; … and N more"`. Cross-field
    (class-level) rules use the empty-string key `""`. Constraint messages are
    always **English** regardless of the request's `Accept-Language` — they are
    human-readable text, so match on the `errors` keys, not on the wording. A
    body that cannot be parsed at all is still a `400` but carries no `errors`
    map, because nothing was bound.

    **Lock contention is a retryable `409`, never a `500`.** From 0.17.0 **every
    transaction this API opens bounds how long it will wait for a row lock**
    (3 s by default), so any write that collides with a longer-running change
    gives up and is told to retry rather than hanging until a client does — and
    so does the other way a race ends, the database rolling one of two
    overlapping writes back (deadlock or lock timeout). Writes that take row
    locks deliberately — membership changes are the main ones — are simply the
    likeliest to meet it: the bound is the API’s, not theirs. Nothing is left
    half-applied, so the loser is told to try again rather than shown a fault:
    `409` with `detail: "Someone else is changing this right now — try again in a moment"`
    and `Retry-After: 1`, the same retry shape `429` uses. This is app-wide
    rather than a property of any one endpoint, and it is the only `409` worth
    retrying automatically — an invariant conflict (stale `version`, name in
    use, last owner) answers identically until the state changes. Retry the
    **identical** request after the header's seconds; change nothing. Tell it
    apart by the `Retry-After` header, not by the wording of `detail` — this
    variant deliberately carries no `errorType`.

    **A request that outruns the server’s time budget is a `422`, and it is
    not retryable.** Every transaction this API opens is bounded: a database
    statement that runs longer than the instance’s budget
    (`app.persistence.statement-timeout-ms`, 10 s by default) is cancelled, and
    the request answers `422` with `errorType: "STATEMENT_BUDGET_EXCEEDED"` and
    a `detail` naming that budget in human units. **This is a property of the
    API rather than of a set of endpoints** — the bound is applied where
    transactions begin, not at individual handlers, because how long a request
    takes follows from how much a workspace has accumulated and not from which
    feature was called. So any operation in this document that reads or writes
    may answer it, whatever its own `responses` list enumerates, and it is
    deliberately attached to no path: such a list could not be kept true. The
    budget also bounds any *one* statement, so a request may spend longer than
    it overall before being stopped. See `StatementBudgetProblemDetail`.

    **There is deliberately no `Retry-After`, because an identical retry fails
    identically.** The same request over the same data costs the same time, so
    a retry — immediate, backed off, or automatic inside an SDK — spends the
    whole budget again and is refused again. Never retry it. What clears it is
    a *smaller* request (a narrower date range, a tighter filter, fewer rows)
    or an operator raising the budget; `detail` offers the narrowing only where
    narrowing is possible, since some requests take no parameter that could
    narrow anything, and where nothing can be narrowed it closes the loop
    rather than trailing off: it says the request is larger than this instance
    is configured to answer. The sentence always ends somewhere, but it
    deliberately prescribes no action there — it describes the situation rather
    than dispatching the reader, because the setting behind the budget is not
    one every reader’s administrator owns. This is the exact opposite of the
    lock-contention `409` above, which it resembles: that one means *someone
    else is changing this right now* and retrying works, this one means *this
    took too long and will take too long again* and retrying does not.

    **A write that conflicts with a related record is a `409`, not a crash.**
    Where the database itself refuses a write because a reference cannot be
    satisfied — in either direction: something still points at a row being
    removed, or a row being written points at something that is no longer
    there — the refusal reaches the caller as `409` with
    `errorType: "REFERENCE_CONSTRAINT_VIOLATION"`, and nothing is
    half-applied. **This is a property of the API rather than of a set of
    endpoints** — it is what makes "no reference is ever left stranded" true
    of every path, including one added later that forgets to check, which is
    the entire reason it exists and why no operation below lists it. **A
    caller should not normally meet it**: where an operation can foresee the
    conflict it checks first and answers its own, more specific `409` naming
    what is in the way and what to do about it, and that pre-check is the
    refusal to code against. This one is the backstop under it, and it
    **prescribes no remedy specific to either direction** — it cannot tell
    which of the two it caught, and their remedies are opposite — so it offers
    only the recovery that holds both ways: re-read, then retry. Whether that
    recovery helps follows from the direction. Where the cause was somebody
    else's commit — a referenced row deleted between the read that resolved it
    and the write that landed, which is the likeliest way to meet this at all —
    a retry genuinely can succeed, the exact opposite of the time-budget `422`
    above; where something still points at what is being removed, it is still
    there and a retry is refused identically. Re-read first and send what you
    find rather than replaying the identical body.

    **"In a moment" is literal.** A reload may still be served a briefly cached
    copy of the project's catalog, so an entry that is already gone can keep
    being offered for a little while. There is deliberately no `Retry-After` —
    that header stays with the lock-contention `409`, where the wait has a
    known bound — and nothing here is a schedule to key on. See
    `ReferenceConstraintProblemDetail`.

    **`errorType` says which failure a body is**, wherever one status covers
    more than one. It is a plain string extension on the problem body, stable
    and safe to branch on where the wording of `detail` is not: an invalid HQL
    query carries `PARSE_ERROR` or `SEMANTIC_ERROR`, a member removal
    refused over project administrators carries `STRANDED_PROJECTS`,
    `ADOPTION_BLOCKED` or `ADOPTION_ROLE_UNREADABLE`, and any request stopped
    for outrunning the server’s time budget carries
    `STATEMENT_BUDGET_EXCEEDED`, and a write the database refuses because a
    reference could not be satisfied carries
    `REFERENCE_CONSTRAINT_VIOLATION`.
    Two rules for consuming
    it: treat a value you do not
    recognise as "no recovery I know about" rather than guessing at one, and do
    not read its **absence** as an unknown value — a response that needs no
    discriminator simply has no `errorType` (the lock-contention `409` above is
    exactly that case, and is told apart by `Retry-After` instead).


    It is not a `409`-only member. The time-budget `422` above carries it,
    and one `403` carries it as well —
    `REACTIVATED_DEFAULT_ABOVE_CEILING`, when restoring open project access
    would make a *per-project* declared default live that the caller may not
    set — and the same two endpoints answer the plain grant-ceiling `403` with
    no discriminator at all, so the absence rule matters there exactly as much
    as it does for lock contention. Being a `403`, it does not interact with the
    "check `Retry-After` first" rule, which sorts `409`s only.

    **Pagination** — paginated endpoints take `page` (zero-based, default 0)
    and `size` (default 50, clamped server-side to a maximum of 100) and return
    a uniform `PageResponse` envelope (`content` plus `page`/`size`/
    `totalElements`/`totalPages`/`hasNext`). The issue list is the deliberate
    exception: without `size` it returns a `BoardIssuesResponse` (a server-capped
    board list, `cap` = `app.board.max-issues`, default 500), and only switches to
    the `PageResponse` envelope when `size` is passed.

    **Rate limits** — sensitive auth endpoints share a per-IP budget
    (15 requests/min by default), and repeated failed logins for one account
    trigger an exponential backoff. Both return `429` with a `Retry-After`
    header (seconds). **Three** non-auth surfaces have throttles of their own:
    `POST …/issues/{number}/rank` allows at most one whole-project rank
    rebalance per project per 60 s and answers `429` + `Retry-After` for a
    second one inside that window — a retryable throttle, not a fault; every
    `…/reports/**` endpoint shares a **per-principal** budget
    (`app.reports.requests-per-minute`, 60/min by default); and the whole HQL
    surface — `…/search/**` **plus `…/filters/**`**, since validating a saved
    filter is search-surface work wherever it is mounted — shares a **second,
    separate** per-principal budget
    (`app.search.requests-per-minute`, 120/min by default). Both report budgets are
    checked **before** the workspace/project is resolved, so an over-budget
    caller sees `429` even for a project they could not otherwise see.
    `POST …/search/insights` is a report living on the search path and spends
    **both** budgets — see the `Reports` tag.
  contact:
    name: Hamstrack
    url: https://github.com/Zherikhov/hamstrack
  license:
    name: Elastic License 2.0
    url: https://www.elastic.co/licensing/elastic-license

servers:
  - url: /api
    description: This instance (Cloud or self-hosted DC)
  - url: https://hamstrack.com/api
    description: Hamstrack Cloud

tags:
  - name: Meta
    description: Public instance metadata
  - name: Auth
    description: Registration, login, tokens, password recovery
  - name: Permissions
    description: >-
      The permission catalog — static product metadata describing every
      permission this build defines, and the exact vocabulary a custom role is
      composed from (see the **Roles** tag). The per-caller answer ("what may
      *I* do here?") is not here: it rides `myPermissions` on each workspace and
      project response.
  - name: Workspaces
    description: Tenancy boundary — members, invites
  - name: Roles
    description: >-
      The workspace's roles — the eight built-in templates every workspace
      sees, plus any custom roles it defines. A role is a named bundle of
      permissions and nothing more: there is no ordering on roles, and no rung a
      role occupies.


      Reading the list is open to any workspace member (role names are rendered
      on a People tab); everything else needs `workspace.role.manage`, which is
      deliberately separate from `workspace.member.manage` — defining what a
      role may do is strictly more dangerous than handing out one that already
      exists. **There is no `POST /roles`:** creation is duplication of an
      existing role, for the reason given on the duplicate operation.
  - name: Onboarding
    description: First-login flow — pending invites and create-or-join-a-team (Cloud)
  - name: Projects
    description: Projects and project membership
  - name: Project config
    description: The effective taxonomy of a project (statuses, transitions, priorities, types)
  - name: Issues
    description: Issues, addressed by project-scoped number
  - name: Comments
    description: >-
      Issue comments. Permission-gated since HD-126: `comment.create` (which
      this surface had no gate for at all before), `comment.edit` (own-only at
      every role — never grantable unrestricted) and `comment.delete` (own, or
      unrestricted for the built-in project MANAGER, which is the new ability to
      moderate somebody else's comment). Reading needs project access only.
  - name: Attachments
    description: Issue file attachments
  - name: Labels
    description: >-
      The workspace's label catalog — free-form colored tags reusable across
      every project of the workspace (content, not bound taxonomy: labels never
      appear in a project's config). Reads are open to workspace members;
      creation needs `label.create`, and rename/recolor/describe versus
      archive/unarchive/merge/delete are the two widths of one key —
      `label.manage` own-only (labels you created) and `label.manage`
      unrestricted respectively.
  - name: Components
    description: >-
      A project's component catalog — curated modules of one project with an
      optional lead and an optional create-time auto-assign (content, not bound
      taxonomy: components never appear in a project's config). Reads are open
      to project members; writes need `component.manage` (the built-in project
      MANAGER, or a workspace OWNER/ADMIN across their whole workspace).
      Assigning a component to an issue is `issue.edit`, not `component.manage`
      — the permission governs the catalog, not the link.
  - name: Versions
    description: >-
      A project's release plan — versions with a fully reversible
      release/un-release lifecycle, linked to issues as **fix** ("ships in") and
      **affects** ("broken in") versions (content, not bound taxonomy: versions
      never appear in a project's config). Reads are open to project members;
      writes need `version.manage` (the built-in project MANAGER, or a
      workspace OWNER/ADMIN across their whole workspace). Linking a version to
      an issue is `issue.edit`, not `version.manage`.
  - name: Sprints
    description: >-
      A project's iterations — a time-box with a one-way lifecycle
      (`FUTURE` → `ACTIVE` → `COMPLETED`, no re-open, at most one active sprint
      per project), plus the project's planning reads — the whole view
      (`GET …/backlog`) and any one of its sections on its own
      (`…/backlog/sections/…`), which answer identically for the same section.
      Sprints are content, not bound taxonomy: they never appear in a project's
      config.
      Reads are open to project members; the lifecycle (create/edit/start/
      complete/delete) needs `sprint.manage` (the built-in project MANAGER, or
      a workspace OWNER/ADMIN across their whole workspace), while putting
      issues into a sprint is `sprint.assign` and ranking them is `issue.rank`
      — everyday contributor permissions.
  - name: Reports
    description: >-
      Read-only, project-scoped analytics under
      `/workspaces/{wsId}/projects/{pId}/reports`. Every report needs **project
      membership and nothing else** — there is deliberately no `report.view`
      permission, because every number a report prints is derivable by the same
      member from the search API they already hold. **No status code depends on
      a delivery capability**, so a project with `board: KANBAN` or
      `estimation: false` gets the identical answers.


      Four conventions are fixed here by the first report and inherited by the
      rest — two of them with exceptions, both stated below (not every report
      has a window, and the throttle is inherited by **path** rather than by
      being a report): every response carries the shared `ReportMeta`
      provenance block (`computedAt`, `basedOnIssues`, `truncated`, `cap`,
      `firstIssueAt`, `unmatchedFilters`); every response is
      `Cache-Control: private, max-age=60` **plus `Vary: Authorization`** (one
      tenant's data, so cacheable by the browser that asked and by nothing
      else); a window wider than `app.reports.max-window-days` is **refused with
      a `400` naming the cap** — never silently clamped, because a chart of a
      window nobody asked for is exactly how a report earns "these numbers don't
      match what I expected"; and the whole base path shares one **per-principal
      throttle** (`app.reports.requests-per-minute`, 60/min by default, master
      switch `app.rate-limit.enabled`), so a report added later **on this base
      path** inherits the budget instead of having to ask for one.


      That inheritance is a property of the path, not of being a report, and
      there is already one counterexample: `POST …/search/insights` is a report
      that lives on the search path, inherited nothing, and had to be bound to
      the limiter explicitly. A report mounted anywhere else is unthrottled until
      somebody says otherwise — which is why the binding is written down rather
      than assumed.


      The per-principal budgets — this one and the search budget over
      `…/search/**` and `…/filters/**` — are **the one place in this API where
      `429` precedes `404`**: they run in interceptors, before the workspace and
      project are resolved, so a caller over budget is refused even for a project
      they cannot see. The
      budget is keyed on the caller and never on the project, which is what keeps
      that refusal free of tenancy information — the `429` is identical for a
      real project, a nonexistent one and somebody else's.


      Two things vary between reports rather than across them. **Not every
      report has a window**: `/aging` answers a current-state question and takes
      no parameters at all, so **it has no `400` of its own** — and neither does
      its `.csv` sibling, for the same reason: a report that asks the caller for
      nothing has nothing to refuse. A malformed path UUID still `400`s on both,
      as it does everywhere, while binding and before any handler runs. The sprint reports
      have no window either; their span is the sprint's, and an over-long sprint
      is **clipped and disclosed** (`seriesTruncatedAt`) rather than refused,
      because the caller never stated that window. `/velocity` bounds its sample
      instead — `sprints` is **refused at both ends** (1…12) rather than clamped,
      by the same never-answer-a-question-nobody-asked rule the window cap
      follows.


      And a request-supplied id means one of two opposite things depending on
      whether it is a **subject** or a **filter**, a distinction this path draws
      explicitly because R1/R3 and R4 sit on opposite sides of it. A report's
      **filter** ids (`typeId`, `componentId`, `labelId` on `/flow` and
      `/cycle-time`) are predicates, not addressed resources — applied inside an
      already project-scoped statement where an unknown id can only subtract, so
      an unknown or foreign one narrows the report to an empty result, is named
      in `meta.unmatchedFilters`, and is never a `404` or a `422`. A report's
      **subject** id (`sprintId` on `/sprint-burnup` and `/sprint-review`) is the
      resource the report is *about*: it resolves through its parent project and
      an id that does not resolve there — including one belonging to another
      project or tenant — is a `404`. Getting either half backwards produces a
      plausible, wrong report.


      The sprint reports add one more shared rule: **omitting `sprintId` means
      the project's ACTIVE sprint, and having none is a `200` with
      `sprint: null`** — deliberately not a `404`, which would be
      indistinguishable from "that sprint is not in this project" and leave a
      client unable to tell a project between sprints from a bad id.


      **Each of the six project reports has a `.csv` sibling** — append `.csv` to
      the path. It takes the same parameters, answers the same status codes, and
      exports **the plotted series: one row per data point**, under a `#`-comment
      header naming the project, the window, the measure, the percentiles (or why
      they were suppressed), `computedAt`, `basedOnIssues` and whether truncation
      bit. The `ReportCsvFile` schema documents the file format once for all six.


      **They are not issue-list exports, and there is currently no such export in
      this API.** That is worth stating plainly because it is the natural wrong
      assumption: a "download matching issues" button is a different feature,
      wired to a search-side export path that **does not exist yet** — there is no
      CSV or export endpoint under `/search`, and the handoff cannot be built by a
      client either: HQL can now scope a query to one project, but it still has
      no `resolved`/`closed` field, so the flow report’s resolved half is not
      expressible as a query at all. It is tracked as its own ticket. Until it
      lands, do not read a report CSV as the issues behind the chart: it is the
      numbers that were drawn.


      `/velocity` sits on the same rule from the other side: **its subject is the
      PROJECT**, which the path already names, so it takes no `sprintId` at all
      (its sample is resolved from the project) and has no `404` of its own. It
      is where the family’s three refusals bite hardest.


      **Three things this family will not do, and they are policy rather than
      backlog**: no per-person breakdown of a published metric; no aggregate
      above the project (every report is served from below `/projects/{pId}/`,
      and the friction of comparing two teams by hand is the design); and no
      single quotable number, so where this family forecasts it returns a range
      with its sample size attached. The line is a **published metric versus an
      ad-hoc query**, which is what makes `/search/insights` consistent with
      `/velocity` rather than an exception to it: velocity has a stable URL and
      is read out in a ceremony, so it refuses `ASSIGNEE`; insights is whatever
      HQL somebody just typed and is not addressable as "the team’s number", so
      it offers `ASSIGNEE` as a grouping dimension. Same policy, opposite
      answers, because they are different objects.
  - name: Search
    description: >-
      Cross-project issue search via HQL (Hamstrack Query Language). The Insights
      panel (POST .../search/insights) hangs off this same base path and breaks
      down the query in the box; it is documented under **Reports**, whose
      conventions it follows.
  - name: Saved Filters
    description: Reusable, workspace-scoped HQL data sources (own + shared)
  - name: Notifications
    description: The current user's notification feed
  - name: Events
    description: Real-time Server-Sent Events
  - name: Admin
    description: Global taxonomy management — requires the system ADMIN role (403 otherwise)
  - name: Delegated admin
    description: >-
      The same catalog/set/binding operations at a workspace scope
      (/workspaces/{wsId}/admin, `workspace.taxonomy.manage` — the built-in
      OWNER/ADMIN) or a project scope (/workspaces/{wsId}/projects/{pId}/admin,
      `project.taxonomy.manage` — the built-in project MANAGER only, not the
      workspace-wide curator set). Membership-based: a non-member of the
      workspace, an unknown workspace and an unknown project are 404; a member
      without the permission is 403, naming it.


      **The project family now answers 403 where it used to answer 404** for a
      workspace member who is not a project member — its workspace-scoped
      sibling always answered 403 for the identical failure. Safe only because
      the project is already listed to that caller by GET .../projects; the
      tenancy rule is untouched, and a non-member of the WORKSPACE still gets
      404.

security:
  - bearerAuth: []

paths:
  /meta:
    get:
      tags: [Meta]
      summary: Instance flags and version
      description: Which optional surfaces are enabled on this installation, and the app version.
      operationId: getMeta
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetaResponse' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register an account
      description: |
        Sends a verification email. `termsAccepted: true` is required when the
        instance has terms acceptance enabled (see `GET /meta`). Returns `403`
        when the operator disabled public signup.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered — verification email sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email is already registered
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email with the one-time token
      description: Exchanges the emailed token for a session (acts as a login).
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthOk' }
        '400':
          description: Token is invalid, expired or already used
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Re-send the verification email
      description: Always returns `200` — no account enumeration.
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Returns an access token and sets the `refresh_token` cookie
        (`HttpOnly`, `SameSite=Strict`, path `/api/auth`). Unverified accounts
        get `403`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthOk' }
        '401':
          description: Invalid email or password
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Email address is not verified
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token
      description: |
        Authenticated by the `refresh_token` cookie. Returns a fresh access
        token and a new cookie; the previous refresh token is invalidated.
      operationId: refresh
      security:
        - cookieAuth: []
      responses:
        '200': { $ref: '#/components/responses/AuthOk' }
        '400':
          description: Missing, invalid or expired refresh token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Revokes the refresh token and clears the cookie.
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        '204': { description: Logged out }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      description: Always returns `200` — no account enumeration.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with the emailed token
      description: Revokes all active sessions on success.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 100 }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: Token is invalid, expired or already used
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      operationId: me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /permissions:
    get:
      tags: [Permissions]
      summary: The permission catalog
      description: |
        Every permission this build defines, with the metadata a client needs to
        make sense of a `myPermissions` entry.

        **Static product metadata, not tenant data.** There is no workspace
        context, no path or query parameter and no database access, and the body
        is identical for every caller on a given version — fetch it once and
        cache it for the session. It still requires a valid access token
        (`401` without one).

        Entries come back in a stable order (workspace-scoped first, then
        project-scoped). **This endpoint is the authoritative list**: it grows
        between releases, so drive UI from it rather than hard-coding keys or a
        count. Individual keys, on the other hand, are permanent — they are the
        wire contract shared by this catalog and every `myPermissions` array,
        and are never renamed.
      operationId: listPermissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermissionCatalogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workspaces:
    post:
      tags: [Workspaces]
      summary: Create a workspace
      description: Caller becomes `OWNER`; default issue types and statuses are seeded.
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Workspaces]
      summary: List my workspaces
      operationId: listWorkspaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkspaceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workspaces/{workspaceId}:
    get:
      tags: [Workspaces]
      summary: Get a workspace
      operationId: getWorkspace
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workspaces]
      summary: Rename a workspace, or change how its projects are accessed
      description: |
        Requires `workspace.edit`. Every field is optional and each is an
        independent decision: a body naming only `name` does not disturb the
        access mode, and one naming only the mode does not disturb the name. A
        body naming **none** of them is a `400` rather than a silent `200`.

        **What `projectAccessMode` decides — and what it does not.** Exactly one
        thing: whether a workspace member who holds *no* explicit
        `project_members` row in a project inherits that project's default role.
        There is deliberately **no "enforcement off" mode**; permissions always
        mean what they say in both modes. A member's effective project role
        resolves as: their explicit `project_members` row, else the project's
        `defaultProjectRoleId` → the workspace's `defaultProjectRoleId` → the
        built-in **Contributor**, *and only while the workspace is `OPEN`* —
        else nothing at all. `STRICT` narrows **writes** only: everyone can
        still see every project.

        `OPEN` is the default for new workspaces and for every workspace this
        release upgrades, and behaviour under it is identical to before this
        release. Flipping to `STRICT` changes **no data** — no membership row,
        no assignee, no sprint — and flipping back restores every permission
        byte for byte.

        **The default role is bounded by a grant ceiling.**
        `defaultProjectRoleId` is handed to nearly every member, so it may not
        name a role granting a permission the caller does not already hold —
        compared against a **fixed baseline**: the built-in Contributor's
        permissions, unioned with whatever the caller's *workspace* role grants
        in every project (`project.curate.all` / `project.administer.all`). The
        bound applies to **both ends**, so a default that is already wider than
        the baseline may not be replaced either. The built-in workspace `OWNER`
        is exempt in their own workspace. A refusal is a `403` naming the
        missing permission. That comparand is **not** the one the project-level
        picker uses, so a role accepted here may be refused there and the other
        way round — see
        `PATCH /workspaces/{workspaceId}/projects/{projectId}/default-role`.

        **A flip from `STRICT` back to `OPEN` is itself a grant**, even when the
        body names no role: every declared default in the workspace stops being
        inert at that moment, so the workspace default *and* every project's own
        override are measured against the same ceiling before the flip is
        allowed. A refusal over a **project's** override is a structured `403`
        (`errorType: "REACTIVATED_DEFAULT_ABOVE_CEILING"`, naming the projects,
        the role and the missing permission); a refusal over the **workspace**
        default is the plain ceiling `403` with no `errorType` — see the `403`
        response below, and do not assume the discriminator is there. The
        opposite direction is unbounded: taking inheritance away grants nothing.

        `defaultProjectRoleId` and `clearDefaultProjectRole` are two different
        statements, so sending both is a `422` rather than a precedence rule.

        **A request whose values already hold is a `200` that writes nothing** —
        the row is not touched, so `updatedAt` does not move.
      operationId: updateWorkspace
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceRequest' }
      responses:
        '200':
          description: >-
            The updated workspace — or the unchanged one, when every requested
            value already held.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400':
          description: >-
            The body names none of `name`, `projectAccessMode`,
            `defaultProjectRoleId` or `clearDefaultProjectRole`; or `name`
            fails validation (1–255 characters after trimming); or
            `projectAccessMode` is not one of `OPEN` / `STRICT`, which fails at
            the JSON boundary because there is no third mode to fall back to.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403': { $ref: '#/components/responses/ProjectAccessForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StrandedByInheritance' }
        '422':
          description: >-
            `defaultProjectRoleId` is unknown, belongs to another workspace or
            is `WORKSPACE`-scoped — `PROJECT` scope is not negotiable here,
            because a workspace role accepted as a project default would put
            `workspace.edit` into every member's context in every project of
            the workspace; or the body sends `defaultProjectRoleId` **and**
            `clearDefaultProjectRole`. Branch on the status, not on the wording
            of `detail`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/project-access:
    get:
      tags: [Workspaces]
      summary: Project access — current state, settable roles and current impact
      description: |
        Requires `workspace.edit`. One request behind the whole workspace
        General settings page: the current `mode`, the current declared
        `defaultProjectRoleId`, which `PROJECT`-scoped roles the caller may set
        it to (`settable`), and an `impact` block describing the workspace **as
        it stands** — the same shape `POST …/project-access/preview` returns for
        a proposed change.

        Gated on `workspace.edit` rather than open to every member because it
        aggregates write access workspace-wide, which is a different object from
        the project member lists any member may read. It is the control's own
        preview.
      operationId: getProjectAccess
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAccessResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/project-access/preview:
    post:
      tags: [Workspaces]
      summary: What would this project-access change do?
      description: |
        Requires `workspace.edit`. Takes **the same body as
        `PATCH /workspaces/{workspaceId}`**, runs the same well-formedness,
        scope and grant-ceiling checks, and **persists nothing** — `POST`
        because it carries a body, exactly as `POST …/roles/preview` does.

        **The counts are advisory; the refusals are not.** Read that literally.
        Every number but one describes a population — active workspace members
        crossed with explicit project memberships — that is *not* the row being
        written, so nothing about the write can pin it: people join, leave and
        get added to projects between a preview and a `PATCH`. The response
        therefore carries `computedAt`, and there is deliberately no token, no
        echo and no `expectedCount` field; inventing one would be ceremony that
        merely looks like a guarantee. Re-fetch immediately before acting, and
        treat the numbers as a decision aid rather than a contract.

        The one exact thing is `strandedProjects`. It is **re-derived inside the
        write's own transaction** and enforced there whether or not anybody ever
        previewed, so a client that skips this endpoint gets the same `409`.
        Preview and write share one implementation, so for the same body the
        list here is the list the `PATCH` would refuse with.

        A grant-ceiling failure surfaces here as the ordinary **`403`**, never
        as a "would fail" field inside a `200` — a preview that succeeds while
        describing a refusal teaches clients to ignore it. That includes the
        structured refusal a `STRICT` → `OPEN` flip can produce
        (`errorType: "REACTIVATED_DEFAULT_ABOVE_CEILING"`), which is exactly the
        answer the `PATCH` would give for the same body. There is no `409`:
        the stranding this body would cause is a *field*, because that is the
        question being asked.
      operationId: previewProjectAccess
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceRequest' }
      responses:
        '200':
          description: >-
            What the change would do. Nothing was written — the workspace row is
            untouched and `updatedAt` has not moved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAccessImpactResponse' }
        '400':
          description: >-
            As the `PATCH`: an empty body, a `name` that fails validation, or an
            unknown `projectAccessMode`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403': { $ref: '#/components/responses/ProjectAccessForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >-
            As the `PATCH`: an unknown, foreign or `WORKSPACE`-scoped
            `defaultProjectRoleId`, or a body sending both
            `defaultProjectRoleId` and `clearDefaultProjectRole`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/members:
    get:
      tags: [Workspaces]
      summary: List workspace members
      operationId: listWorkspaceMembers
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkspaceMemberResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/members/{userId}:
    patch:
      tags: [Workspaces]
      summary: Change a member's workspace role
      description: |
        Requires `workspace.member.manage` — held by the built-in `OWNER` and
        `ADMIN` and not by `MEMBER`, which is exactly who could use this before.
        There is no role *ladder* behind it any more: the role enums are gone
        and the permission model is the only authority.

        **Name the role with `roleId`** — the assignable role's id, and the only
        way to name one of the workspace's own custom roles. The legacy `role`
        **key** still works and is now deprecated; **exactly one of the two must
        be present**, and neither or both is a `422`. Setting the role a member
        already holds is an accepted no-op, not an error, so re-sending the
        current value is safe.

        **Grant ceiling.** Nobody may hand out — or act on a member holding — a
        role that grants a permission they do not hold themselves, and the check
        covers the target's *current* role as well as the new one. It compares
        **permission sets**, not role names (there is no ordering on roles to
        compare), and an own-only grant never satisfies an unrestricted one. The
        `403` names the offending permission.

        **Owner guardrail.** On top of that sits one rule permission sets cannot
        express: only an `OWNER` may hand out the `OWNER` role or administer a
        member who holds it. `OWNER` and `ADMIN` are seeded with *identical*
        permissions on purpose — ownership is a guardrail on assignment, not a
        bigger role — so without this an `ADMIN` could promote themselves or
        demote the real owner. An `ADMIN` therefore manages `MEMBER`s and other
        `ADMIN`s but can neither promote anyone to `OWNER` nor demote an existing
        one; an `OWNER` **may** promote another member to `OWNER`, which is how
        ownership is handed over. This differs on purpose from
        `POST /workspaces/{workspaceId}/invites`, which refuses `OWNER` outright
        *even for an owner*: you promote a colleague to owner, you do not invite
        a stranger as one.

        For the built-in roles all of this behaves exactly as the old "never
        above your own role" rule did; only the wording of the `403` changed.

        **Last owner.** A workspace must never end up without an `OWNER`, so
        demoting the final one returns `409` — whoever asks, including that owner
        acting on themselves. The check is serialised, so two admins demoting two
        different owners concurrently cannot both succeed. Self-*demotion* is
        otherwise fine: an owner stepping down while another owner exists is an
        ordinary handover.

        **Scope.** A workspace role change does not touch project memberships —
        someone demoted to `MEMBER` keeps any explicit project `MANAGER` rows they
        hold. Use `/workspaces/{workspaceId}/projects/{projectId}/members` for
        those.

        `404` covers an unknown workspace, a caller who is not a member, **and** a
        target who holds no membership in *this* workspace. The last one is a
        statement about the membership and says nothing about whether the account
        exists.
      operationId: updateWorkspaceMember
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/memberUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceMemberRequest' }
      responses:
        '200':
          description: OK — the updated membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMemberResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastWorkspaceOwner' }
        '422': { $ref: '#/components/responses/UnknownRole' }
    delete:
      tags: [Workspaces]
      summary: Remove a member from the workspace
      description: |
        Requires `workspace.member.manage`, under the same grant ceiling and
        Owner guardrail and the same last-owner rule as the `PATCH` above
        (`403` / `409` respectively).

        **This is not account deletion.** A user is global and may belong to
        several workspaces; removal revokes access *here* only. In one
        transaction it deletes the `workspace_members` row and the member's
        project memberships in this workspace, clears the `assignee` of their
        issues in this workspace — writing one `assignee` history entry per issue,
        so the unassignment is auditable — and deletes every unaccepted invite for
        their address here, which would otherwise re-appear as a live join button
        the moment the membership row was gone. Once the transaction commits, any
        live SSE stream they hold on this workspace is closed (membership is only
        checked when a stream is opened). The account itself, and their membership
        of every other workspace (including work assigned to them there), are
        untouched.

        The unassignment bumps each affected issue's `version`, so a client that
        loaded one of those issues *before* the removal and then saves an edit gets
        the usual `409` from `PATCH .../issues/{number}` and re-reads, rather than
        silently writing the departed assignee back.

        **A removal that would leave a project without an administrator is
        refused (`409`).** Because this endpoint deletes the member's project
        memberships, offboarding the only member of a project who holds
        `project.member.manage` would leave that project with nobody able to
        manage its membership — so the whole removal is refused and **nothing at
        all changes**: not the workspace membership, not the project rows, not an
        assignee. "Administrator" means *a holder of that permission*, not a
        carrier of one particular role, so any role granting it counts and a role
        that does not grant it never does; among the built-ins that is `MANAGER`
        and `TEAM_LEAD`. A workspace `OWNER`/`ADMIN` holding no membership row
        in the project is not one of its administrators —
        `project.member.manage` sits outside the workspace-wide curator set — and
        a project that already has no administrator is untouched: only the step
        from one to none is refused.

        Two kinds of project deliberately do not count, so fewer removals are
        refused than the rule above suggests: an **archived** project is frozen,
        has nothing left to administer, and never blocks an offboarding; and only
        **ACTIVE** accounts count as administrators, so a project whose sole
        administrator has been deactivated is treated as already having none —
        disabling an account never leaves a permanent `409` behind, and a
        disabled administrator never masks a project that is in truth unmanaged.

        The body is a `StrandedProjectsProblemDetail`: `detail` is prose for a
        human, **capped at three project names** plus `and N more`, while the
        `projects` extension is **uncapped** and carries ids. Render from
        `projects`; never parse `detail`. `errorType` is
        `"STRANDED_PROJECTS"` here — the machine-readable statement that the
        `adoptStrandedProjects=true` retry below is available.

        **Resolving it: repeat the request with `adoptStrandedProjects=true`.**
        The two-step flow is the intended path, not an escape hatch — first call
        answers the `409` listing the projects, a human reviews it, the second
        call carries the flag. In the same transaction as the removal, the
        **caller** is granted the built-in project role `TEAM_LEAD`
        ("Team lead" — a contributor's everyday rights plus
        `project.member.manage`) in each project that would otherwise be
        stranded, and the removal proceeds. The flag is a **query parameter**
        (this `DELETE` takes no body), defaults to `false`, and is accepted on a
        first attempt too — a client never has to collect the `409` first.

        **An adoption changes the success status: `200`, not `204`.** A removal
        that grants nothing answers `204 No Content` as before — every removal
        without the flag, and a flagged one that turned out to strand nothing.
        Only a removal that actually granted the caller a role answers `200`
        with a `MemberRemovalResponse` naming every project taken over. The
        asymmetry is deliberate: the flag is accepted with no prior `409`, so a
        client that wires it on once could otherwise accumulate project roles
        for its user with nothing on the wire ever saying so — the grant would
        be visible only in a server log the actor cannot read. Branch on the
        status; do not assume `204`.

        **The adoption itself can be refused — the same `409`, and this one
        offers no retry.** If the caller already holds a role in one of the
        stranded projects that grants something `TEAM_LEAD` does not, replacing
        that row would *demote* the person doing the rescuing, and the grant
        ceiling would then refuse to give the missing permissions back (nobody
        left holds them). Skipping the project instead would strand it. So the
        whole removal is refused and nothing at all is written. The body is the
        same `StrandedProjectsProblemDetail` — but `errorType` is
        `"ADOPTION_BLOCKED"` rather than `"STRANDED_PROJECTS"`, `projects` lists
        only the projects that block the adoption, and `detail` names the
        obstacle rather than a retry that would fail identically. **Branch on
        `errorType`, and do not offer an adopt button for this one**: the flag
        is already set, and setting it again produces this same `409`.


        It is unreachable with the built-in project roles — each is either
        covered by `TEAM_LEAD` or already holds `project.member.manage`, in
        which case the project was never stranded — so it takes a custom project
        role (a "QA lead" with `issue.delete` and no member management). **The
        remedy is somebody else's action, not the caller's:** ask the member
        being removed — still ACTIVE, still that project's administrator — to
        appoint a successor while they still can, or have another workspace
        administrator who does **not** already work in that project run the
        removal instead — not one who already administers it, which is the set
        this branch has just proven empty. Appointing one
        directly is not open to the caller, because
        `POST /workspaces/{workspaceId}/projects/{projectId}/members` needs
        `project.member.manage` **in that project**, which is exactly what this
        branch proves they do not have.

        **A second stop on the same path, and a different reader**
        (`errorType: "ADOPTION_ROLE_UNREADABLE"`). The adoption also refuses
        when the caller's own membership row in a listed project refers to a
        role that **cannot be resolved** — a mis-scoped, foreign or hand-edited
        `role_id`, which a normal client never meets — because overwriting a row
        the server cannot read is exactly what a rescue must not do. Nothing
        about the caller's permissions is wrong. It is cleared by **nobody party
        to the request**: retrying fails identically, and nothing the caller or
        the member being removed can change affects it, so it needs an operator
        to repair the stored row (already logged as an ERROR and counted before
        the refusal). `detail` accordingly names no cause and prescribes no
        action to its reader. When this and `ADOPTION_BLOCKED` both apply, this
        one is reported **first** — either ends the request, and the second
        should not be the one nobody present can clear.

        **Be precise about the size of that grant.** It is *not* the project
        `MANAGER` role, which an earlier build handed out: an adopter gets no
        `issue.delete`, no unrestricted `attachment.delete`, and none of
        `project.archive`, `project.edit`, `project.taxonomy.manage`,
        `sprint.manage`, `version.manage` or `component.manage` — control of the
        roster, never of the work. Nor is it `project.member.manage` alone, which
        is *narrower* than what an ordinary member of that project already holds
        and would demote the adopter into a state they could not undo. It is also
        not literally "the right to appoint an administrator and nothing else":
        measured against what an ordinary member can already do there the delta
        is exactly `project.member.manage`, but a caller who held a **narrower
        explicit role** in an adopted project (a `COMMENTER` row, say) has that
        row replaced and gains the contributor rights with it. Either way the
        adoption is a durable takeover of somebody else's project.

        The other remedy — giving each listed project another administrator via
        `POST /workspaces/{workspaceId}/projects/{projectId}/members` — needs
        `project.member.manage` **in that project**, which no workspace-scoped
        role grants, so the workspace `OWNER` reading the refusal gets `403` for
        it; without the flag the only way out would be a database edit. The
        **grant ceiling is deliberately not applied** to the adoption: in a
        project they never joined a workspace `OWNER` holds only the four
        workspace-wide curator permissions, and `project.member.manage` is not
        among them, so a ceiling check would refuse every adoption. What bounds
        it instead is that it reaches only a project this request is about to
        strand, that the caller has already passed the ceiling against the
        departing member's workspace role, and that it is explicit and logged per
        project.

        **The flag is consent, not an instruction, and it never names a
        project.** The adopted set is recomputed server-side inside the
        transaction — it is what is about to be stranded *now*, not the array the
        earlier `409` returned. A project that gained another administrator in
        between is silently dropped, a flagged removal that strands nothing grants
        nothing at all, and no project the client merely wants can be added. Read
        `adoptedProjects` off the `200` for what was actually taken over
        (`myRole`/`myPermissions` on `GET /workspaces/{workspaceId}/projects`
        reflect it too); where the caller already held a membership row in an
        adopted project, that row is promoted in place rather than duplicated.

        **A third stranding refusal, and this one is about *inherited*
        administrators.** A project can be administered with no membership row
        at all: while the workspace is `OPEN`, a default role that grants
        `project.member.manage` makes every member without an explicit row an
        administrator of it. Removing the last such member leaves that project
        unmanageable just as surely, so the removal is refused with `409`
        `errorType: "STRANDED_BY_INHERITANCE"` naming those projects.
        `adoptStrandedProjects=true` does **not** clear it and is not offered:
        adoption writes a Team lead row, and the caller here inherits a default
        at least as wide, so it would narrow them in the project being rescued.
        The way out is in `detail` and the caller can take it now — give each
        named project an explicit administrator, which the current default still
        permits — or ask the departing member to do it while they still can. It
        is checked **after** the explicit-row cases above, and it cannot fire at
        all while the workspace default grants no member management, which is
        the shipped configuration.

        Both the last-owner `409` and the self-removal `422` are checked
        **before** this one, so at most one *invariant* refusal is ever reported;
        the two stranded-project variants above are one such refusal and are told
        apart by `errorType` (`"STRANDED_PROJECTS"` / `"ADOPTION_BLOCKED"` /
        `"ADOPTION_ROLE_UNREADABLE"` / `"STRANDED_BY_INHERITANCE"`),
        never by the wording of `detail`. A further `409` is not an invariant at
        all and can arrive on any attempt: lock contention, which carries
        `Retry-After` and deliberately **no** `errorType` — the header is what
        identifies it, so check the header before you read `errorType` (see
        **Errors** in the introduction).

        **What survives, deliberately:** all historical attribution (issue
        reporter, comment author, history entries, attachment uploader), the saved
        filters they own — a shared filter resolves in the *viewer's* context and
        keeps working — and any component they lead: a departed lead keeps the
        `lead` row and component auto-assign silently skips them. These are by
        design, not dangling references.

        Removing someone who is already not a member is a clean `404`, so a
        repeated `DELETE` is idempotent rather than an error.

        **No self-removal.** Leaving a workspace is a separate feature (its own
        confirmation, landing page and "that was my only workspace" handling) and
        is not built, so a caller naming themselves gets `422`. A sole owner
        deleting themselves gets `409` instead — "promote another owner first" is
        the answer that stays true once leaving exists. Self-*demotion* via the
        `PATCH` above is allowed.
      operationId: removeWorkspaceMember
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/memberUserId'
        - name: adoptStrandedProjects
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >-
            Consent to take over every project this removal would otherwise
            strand: the caller is granted the built-in project role `TEAM_LEAD`
            ("Team lead" — a contributor's rights plus `project.member.manage`,
            and nothing that can delete an issue or reconfigure the project) in
            each of them, in the same transaction as the removal, and the `409`
            above does not fire.


            It is a bare yes/no on purpose — a client cannot name the projects,
            and must not assume the set equals the `projects` array of the
            `409` it saw. That set is recomputed inside the transaction, so one
            that has since gained another administrator is silently skipped, and
            `true` on a removal that strands nothing grants nothing at all.


            Accepted on a first attempt as well as on a retry, which is why an
            adoption answers `200` with the list of what it granted instead of
            `204` — a grant the actor cannot see would be a side effect rather
            than consent. It can still be refused: see the `409` below when the
            caller's own role in a stranded project is wider than `TEAM_LEAD`.
      responses:
        '200':
          description: >-
            Removed from the workspace, **and** the caller adopted one or more
            projects that the removal would otherwise have stranded. Only ever
            returned for `adoptStrandedProjects=true`; an adoption that granted
            nothing is a `204`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberRemovalResponse' }
        '204':
          description: >-
            Removed from the workspace, nothing granted — every removal without
            the flag, and a flagged one that stranded nothing. No body.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/WorkspaceMemberRemovalConflict' }
        '422':
          description: >-
            The target is the caller — self-removal ("leave workspace") is not
            this endpoint
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/invites:
    post:
      tags: [Workspaces]
      summary: Invite a member by email
      description: |
        Requires `workspace.member.manage` — the same permission and the same
        grant ceiling as `PATCH /workspaces/{workspaceId}/members/{userId}`, one
        implementation shared by both so they cannot drift. The granted role
        must not grant a permission the caller lacks, and can never be the
        built-in `OWNER` *even for an owner* — an existing member can still be
        promoted to `OWNER` afterwards via that `PATCH`. The invite is bound to
        the invited email.


        **Name the role with `roleId`** — the assignable role's id, and the only
        way to invite somebody straight onto one of the workspace's own custom
        roles. The legacy `role` **key** still works and is now deprecated;
        **exactly one of the two must be present**, and neither or both is a
        `422`, as is a role reference this instance cannot assign.
      operationId: inviteMember
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteMemberRequest' }
      responses:
        '201':
          description: Invite sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: User is already a member
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422': { $ref: '#/components/responses/UnknownRole' }

  /workspaces/{workspaceId}/roles:
    get:
      tags: [Roles]
      summary: List the roles available in this workspace
      description: |
        The built-in role templates plus every custom role this workspace owns,
        in one list.

        **Open to any workspace member.** Role names are rendered for everybody
        on a People tab, so keeping the list behind an administrative permission
        would only force clients to fetch it another way. The sensitive half is
        `includeUsage`, which additionally requires `workspace.role.manage` and
        answers `403` without it. Nothing else here is gated.

        Entries are grouped by `scope`, with built-in templates before custom
        roles inside each group, then ordered by `position` and `name`. Each
        entry carries the derived `assignment` block (see `RoleAssignmentView`).


        **`usage` is `null` unless you asked for it, and a full object when you
        did** — including for a role that is in play nowhere, which comes back
        zeroed with `inUse: false` rather than `null`. The two states mean
        genuinely different things: `null` is "not requested", and a zeroed
        object is "requested, and the answer is none". Never read the first as
        the second.
      operationId: listRoles
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: scope
          in: query
          required: false
          description: >-
            Restrict the list to one scope. Absent means both, which is the
            usual case for a role picker that has to show workspace and project
            roles side by side.
          schema: { $ref: '#/components/schemas/RoleScope' }
        - name: includeUsage
          in: query
          required: false
          description: >-
            Attach the `usage` block to each role. **Requires
            `workspace.role.manage`** — the counts are the sensitive half of
            this endpoint, and the list itself is open to every member, so this
            is the one parameter that can turn a `200` into a `403`. It costs a
            constant four grouped queries, not one per role.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/roles/preview:
    post:
      tags: [Roles]
      summary: Dry-run the assignment feedback for a permission list
      description: |
        **Persists nothing.** Answers the derived `assignment` block for a
        permission list that does not exist yet, so a role editor can show the
        consequence of a checkbox while it is being ticked rather than after
        Save — or, worse, as a `403` weeks later.

        It runs the **same validation a real write runs**, which is half its
        value: an unknown key, a permission of the wrong scope, an illegal
        `ownOnly` and a duplicated key all answer the same `422` here that
        `PATCH /workspaces/{workspaceId}/roles/{roleId}` would. The preview and
        the write cannot disagree, because the block is computed by the same
        server-side call the runtime grant ceiling makes.

        Requires `workspace.role.manage`. `scope` is **required** in the body —
        unlike the update request, there is no stored role to take it from. This
        is not a way to change a role's scope: nothing is stored.
      operationId: previewRole
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewRoleRequest' }
      responses:
        '200':
          description: OK — the derived block, wrapped so it matches the same key on a role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignmentPreviewResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RolePermissionUnprocessable' }

  /workspaces/{workspaceId}/roles/{roleId}:
    get:
      tags: [Roles]
      summary: Get one role
      description: >-
        Open to any workspace member, like the list. `usage` is always `null`
        here — fetch `GET /workspaces/{workspaceId}/roles/{roleId}/usage` for
        the counts, which needs `workspace.role.manage`.


        A role that is neither a built-in template nor one of this workspace's
        own is a `404`, never a `403` and never a `422`: an id in a **path** is
        an address, and answering anything else would make the endpoint an
        oracle for whether a role exists in another tenant.
      operationId: getRole
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/roleId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Roles]
      summary: Rename, re-describe or re-compose a custom role
      description: |
        Requires `workspace.role.manage` — deliberately **not**
        `workspace.member.manage`: defining what a role may do is strictly more
        dangerous than handing out one that already exists.

        `permissions` is a **full replacement** when present, and `null` leaves
        the grants alone; an empty array is a real value, because a role that
        grants nothing is legal (the built-in Viewer is exactly that). It cannot
        be a delta.

        **`scope`, `key` and `builtIn` are not on the request, and their absence
        is the guard.** Scope is immutable: were it editable, one `PATCH` would
        turn every existing assignment of the role into a wrong-scope row — a
        WORKSPACE role sitting in `project_members.role_id`, putting
        `workspace.member.manage` into every holder's project permissions. For
        the same reason a permission's own scope must equal the role's scope
        (`422` otherwise). `key` is server-generated, and identity rather than
        configuration.

        **The definition ceiling** applies to WORKSPACE-scoped roles: a caller
        may not compose a role granting a permission they do not hold
        themselves (`403`, naming that permission). The workspace **Owner is
        exempt inside their own workspace**, which is the only reason
        `project.administer.all` — held by no built-in role — is mintable at
        all. An `ADMIN` is not exempt. PROJECT-scoped roles are not subject to
        it: an actor's project permissions differ per project, so there is no
        comparand, and a rule that refused an admin duplicating Contributor
        would be the wrong rule.

        **The ceiling is measured at both ends of the edit** — the role as it
        stands today, not only the set you are sending. It is the rule
        `PATCH /workspaces/{workspaceId}/members/{userId}` already applies to a
        membership, where the old role and the new one are both bounded because
        checking only the new one would let an `ADMIN` demote an `OWNER`.
        Bounding only the incoming set here would likewise let an administrator
        *strip* a role granting more than they hold, demoting its holders below
        themselves with no way back — restoring those grants is exactly what
        this ceiling refuses.

        So a workspace `ADMIN` cannot strip, **or even rename**, a
        WORKSPACE-scoped role that grants a permission they do not hold; an
        `OWNER` may do both; and an `ADMIN` still edits freely within their own
        set. The current-role end is checked on **every** `PATCH`, not only one
        carrying `permissions` — a role's name is what an administrator picks it
        by, so relabelling a role you may not strip is the same act one size
        smaller — and its `403` is evaluated **before** the name-conflict `409`.
        PROJECT-scoped roles keep the drop described above at **both** ends,
        deliberately; `SELF_HELD_ROLE` below is what guards them instead.

        `version` follows the same optimistic-concurrency convention as issues:
        present and stale is `409`, absent is last-writer-wins with the entity
        version still catching a true concurrent flush. A permission set is
        exactly the state where a silent lost update is unacceptable — two
        admins each unticking one box would otherwise restore each other's.

        **You may not widen a `PROJECT`-scoped role you hold yourself** (`409`
        `errorType: "SELF_HELD_ROLE"`). An edit is a grant to every holder at
        once, evaluated against nobody, and the definition ceiling is
        deliberately not applied at project scope — so without this rule a
        member of a project carrying a custom role could `PATCH` twenty
        permissions into it and hand themselves `issue.delete`,
        `project.archive` and `project.taxonomy.manage` there. Narrowing,
        renaming and re-describing a role you hold stay legal, and so does
        widening one you do not hold, which is the ordinary recipe.

        **Built-in roles are neither editable nor deletable** (`409`): they are
        product metadata shared by every workspace. Duplicate one instead. The
        check is on the `builtIn` flag and never on the key string — a workspace
        may legally own a custom role keyed `ADMIN`, and that one *is* editable.
      operationId: updateRole
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/roleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: OK — the updated role, with a fresh `version` and `assignment`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoleConflict' }
        '422': { $ref: '#/components/responses/RolePermissionUnprocessable' }
    delete:
      tags: [Roles]
      summary: Delete a custom role, optionally reassigning its holders
      description: |
        Requires `workspace.role.manage`. Built-in roles cannot be deleted
        (`409`).

        **A role that is still in use is refused** with `409`
        `errorType: "ROLE_IN_USE"`, and the refusal carries the whole
        `RoleUsageResponse` as a `usage` extension so a client can render the
        remap dialog straight from it, without a second round trip. Repeat the
        call with `?reassignToRoleId=…` to move every holder to another role of
        the **same scope** and then delete. What is reassigned depends on the
        scope: workspace memberships and pending invites for a WORKSPACE role;
        project memberships and the two default-project-role columns for a
        PROJECT one.

        **The role being deleted has a ceiling of its own** (`403`), checked
        first — before the self-held, in-use and stranding refusals. Deleting a
        role is the strongest possible edit of it, so a workspace `ADMIN` may
        not delete a WORKSPACE-scoped role granting a permission they do not
        hold: otherwise `DELETE …?reassignToRoleId=…` would be the very
        demotion `PATCH /workspaces/{workspaceId}/members/{userId}` refuses,
        taken through a door that endpoint closes. An `OWNER` is exempt, the
        refusal names the offending permission, and at PROJECT scope this end is
        dropped exactly as the definition ceiling on `PATCH` is — the
        narrow-or-preserve rule below carries that scope instead.

        **You cannot delete a role you hold yourself** (`409`
        `errorType: "SELF_HELD_ROLE"`). A bulk reassign is otherwise a
        self-escalation route no ceiling can see: delete the custom "QA" role
        you hold in project P, reassigning to the built-in Project admin, and
        you are Project admin of P — a ceiling is evaluated per assignment, and
        this is one `UPDATE` over every holder at once. The remedy is one call
        you can make yourself: move yourself to another role first, or ask
        another administrator to run the delete.

        `reassignToRoleId` is a **value, not an address**, so an unknown,
        foreign or wrong-scope id — or the id of the role being deleted — is one
        indistinguishable `422`, while the `roleId` in the path is a `404`.

        **A reassign may narrow or preserve, never widen** (`403`). A bulk
        reassign is not an assignment, so the per-assignment grant ceiling
        cannot see it; without this rule one call would move every holder of a
        narrow role onto the built-in Project admin, in projects the caller is
        not even a member of. At `WORKSPACE` scope the target is measured
        against the caller's own permissions — the identical ceiling a member
        role change applies, so the Owner guardrail comes with it. At `PROJECT`
        scope there is no such comparand, so the target is measured against
        **the role being deleted**: it must be covered by it, i.e. every holder
        ends up with the same grants or fewer. The workspace Owner is exempt in
        their own workspace, as everywhere else. The refusal names the offending
        permission.

        **A reassign can never mint an Owner *invitation*** (`403`). An invite
        never grants the built-in `OWNER` role — not even one issued by an
        owner: ownership is handed over to an existing member, it is not offered
        to somebody who has not joined yet. So
        `?reassignToRoleId=<built-in OWNER>` on a WORKSPACE-scoped role that
        still has **pending invites** is refused, since it would repoint those
        invites at `OWNER` through the back door; `detail` says how many are in
        the way. They are refused rather than silently destroyed — they belong
        to somebody else. Two ways out, both named in the message: reassign to
        any other role, or let the invitees accept and promote them afterwards
        with `PATCH /workspaces/{workspaceId}/members/{userId}`. This one fires
        for an `OWNER` too, because the Owner exemption returns from the
        reassign ceiling before its Owner guardrail can be reached.

        Finally, a reassign that would demote every administrator of one or more
        projects at once is refused with `409`
        `errorType: "LAST_PROJECT_ADMIN_BULK"`, listing them in `projects`.
        There is deliberately no adoption flag here: unlike a member removal,
        the remedy is satisfiable by the person refused, and `detail` names
        **both** halves of it — *"Choose a replacement that also grants
        `project.member.manage` and is no wider than the role being deleted, or
        give each of those projects another administrator first."* Naming only
        the first half would send the caller straight into the reassign
        ceiling's `403`.
      operationId: deleteRole
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/roleId'
        - name: reassignToRoleId
          in: query
          required: false
          description: >-
            Move every holder of the role to this one, in the same transaction,
            before deleting it. Must be a role assignable in this workspace **of
            the same scope**, and must not be the role being deleted — anything
            else is `422`. Omitting it is fine for a role nobody holds; for one
            in use it produces the `409` `ROLE_IN_USE` above.
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 'Deleted (with every holder reassigned, when asked)' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoleConflict' }
        '422': { $ref: '#/components/responses/UnknownRole' }

  /workspaces/{workspaceId}/roles/{roleId}/usage:
    get:
      tags: [Roles]
      summary: Where a role is currently in play
      description: >-
        Requires `workspace.role.manage`. These are the same counts the delete
        guard itself uses, published so a client cannot compute a different
        answer from the parts and then be surprised by a `409`.


        **Every count is filtered to this workspace.** Built-in templates are
        shared rows belonging to no workspace, so an unscoped count of their
        holders would publish every other tenant's headcount from a
        workspace-scoped endpoint.
      operationId: getRoleUsage
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/roleId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleUsageResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/roles/{sourceRoleId}/duplicate:
    post:
      tags: [Roles]
      summary: Duplicate a role — the only way to create one
      description: |
        Requires `workspace.role.manage`.

        **There is deliberately no `POST /roles`.** A custom role is made by
        duplicating a built-in template (or another custom role) and editing the
        copy. That is product posture, not an oversight: the grant ceiling is a
        **subset** rule and not a ladder, so a role composed from an empty
        checklist can assign nobody — not Contributor, not Commenter, not even
        Viewer-plus-anything — and discovering that as a `403` six weeks later
        is the exact complaint this model was built against. Duplication always
        starts from a superset. "From scratch" stays reachable by duplicating
        **Viewer**, which grants nothing; it is a named, deliberate act rather
        than the default.

        `scope` and the whole permission set are **copied from the source** and
        are not on the request. Neither is `key`: it is generated server-side
        from the name (uppercased, `[A-Z0-9_]`, truncated to 40 characters,
        suffixed `_2`, `_3`… on collision), which is also how a custom role is
        stopped from reusing a built-in's key. `name` defaults to
        `"<source name> copy"`.

        The source is addressed by **path**, so an unknown or foreign source is
        `404`. The workspace's custom-role limit is counted first, before any
        other work, so a workspace at its cap gets one cheap `409`
        (`errorType: "ROLE_LIMIT_REACHED"`) rather than a validation tour.


        **The cap is exact, not advisory.** The count is taken under a row lock
        on the workspace, so concurrent duplicates cannot overshoot it. Taking
        that lock deliberately makes this the **likeliest** role write to answer
        a retryable `409` with `Retry-After`, but not the only one: from 0.17.0
        the wait bound (3 s by default) belongs to every transaction the API
        opens rather than to this endpoint. A lost race means nothing was
        created — just retry.
      operationId: duplicateRole
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: sourceRoleId
          in: path
          required: true
          description: >-
            The role to copy — a built-in template or one of this workspace's
            own. Addressed as a resource, so unknown or foreign is `404`.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateRoleRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoleConflict' }

  /workspaces/accept-invite:
    post:
      tags: [Workspaces]
      summary: Accept an invite
      description: >-
        Must be signed in with the invited email address. The role the invite
        carries is re-validated before it is written onto the new membership,
        so an invite whose stored role is no longer a usable role of that
        workspace — a corrupt row a normal client never meets — is refused
        with the same `404`.
      operationId: acceptInvite
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Joined the workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already a member
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /invites:
    get:
      tags: [Onboarding]
      summary: List pending invites addressed to me
      description: >-
        Pending, non-expired workspace invites sent to the signed-in user's
        email — the onboarding "join a team" surface. Accept/decline by id
        without needing the emailed token link.
      operationId: listMyInvites
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingInvite' }

  /invites/{id}/accept:
    post:
      tags: [Onboarding]
      summary: Accept an invite by id
      description: >-
        Still bound to the invited email — a foreign invite id returns 404.
        The role the invite carries is re-validated before it is written onto
        the new membership; an invite whose stored role is no longer usable in
        that workspace is refused with the same `404`.
      operationId: acceptInviteById
      parameters: [ { $ref: '#/components/parameters/adminId' } ]
      responses:
        '200':
          description: Joined the workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already a member
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /invites/{id}/decline:
    post:
      tags: [Onboarding]
      summary: Decline (remove) an invite by id
      operationId: declineInvite
      parameters: [ { $ref: '#/components/parameters/adminId' } ]
      responses:
        '204': { description: Declined }
        '404': { $ref: '#/components/responses/NotFound' }

  /onboarding/create-team:
    post:
      tags: [Onboarding]
      summary: Choose to create your own team (onboarding)
      description: >-
        The "Create a team" first-login choice: provisions the demo starter
        workspace (if enabled) and completes onboarding, so the welcome screen
        isn't shown again. The user then creates their real team on the
        workspaces page. Users who join an existing team never call this and get
        no demo workspace.
      operationId: onboardingCreateTeam
      responses:
        '204': { description: Onboarding completed }

  /workspaces/{workspaceId}/projects:
    post:
      tags: [Projects]
      summary: Create a project
      description: >-
        Requires `project.create` — a **workspace**-scoped permission despite the
        `project.` prefix (there is no project to scope it to yet). Every
        built-in workspace role grants it, so every member can still open a
        project exactly as before; it is its own key so that "only admins open
        new projects" becomes expressible. Caller becomes project `MANAGER`. Key
        is unique per workspace.

        The optional `delivery` object declares how the team will deliver, and it
        is **partial per member**: whatever you leave out takes the lean default
        — `KANBAN`, releases **off**, estimation **off** — rather than staying
        unset, and omitting the whole object yields all three. The capabilities
        are independent and the server never infers one from another, so a client
        that means "Scrum, and we estimate" sends `board` **and** `estimation` in
        this one request. (Projects that existed before delivery capabilities
        shipped were migrated to keep everything they had — releases **on**,
        estimation **on**, and `SCRUM` if they already owned a sprint — so an
        existing project will look different from a freshly created one.)

        `delivery.preset` is derived and **cannot be set**: sending it is a `400`
        with the field-anchored `errors` map (`ValidationProblemDetail`), and the
        rejection is **total** — nothing else in the body is applied.
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Project key already exists in the workspace
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get a project
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: Update name / description / delivery capabilities
      description: >-
        Requires `project.edit` — held by the built-in project `MANAGER` and,
        across every project of their workspace, by an `OWNER`/`ADMIN` of the
        enclosing workspace who need not be a project member; any other member
        gets a `403` naming it. That is the same tier every other
        project-content write asks for (components, versions, sprints have
        their own `*.manage` keys with the identical holders), while
        `archive`/`unarchive` (`project.archive`) and member management
        (`project.member.manage`) are **not** in that set:
        `project.archive` stays `MANAGER`-only, and `project.member.manage` is
        held by the built-in `MANAGER` and `TEAM_LEAD`. Partial — omitted
        fields are left unchanged.

        `delivery` is partial **per member**: sending one capability leaves the
        others untouched, and omitting the object leaves all three alone. Setting
        a capability to the value it already has is a no-op that still returns
        `200` with the current state, and no switch ever destroys, clears or
        moves data — confirmations are a UI affordance, so there is no `409` for
        "you still have unreleased versions". Two ways to earn a `400` here:
        `delivery.preset` is derived and cannot be set (so a client **must strip
        `preset`** before `PATCH`ing back a `delivery` object it read from a
        `GET`), and the deprecated top-level `boardMode` must not **disagree**
        with `delivery.board` — an agreeing pair is fine. Both rejections are
        **total**: nothing else in the body is applied.

        An **archived** project is frozen: its settings — `delivery` included,
        which changes how the board, the backlog, the rail and the issue detail
        render — are as read-only as its issues, sprints and ranks, so this
        returns `409 "Project is archived"`. `POST …/unarchive` is the way back,
        and it stays `MANAGER`-only. Note the ordering: the permission is
        checked **first**, so a caller who lacks `project.edit` on an archived
        project gets the `403`, not this `409`.
      operationId: updateProject
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400':
          description: >-
            Two different bodies, on purpose.


            **Field-anchored** (`errors` present): `delivery.preset is derived
            from board/releases/estimation and cannot be set` — a bean-validation
            failure on the nested object, so it arrives as a
            `ValidationProblemDetail` keyed `delivery.preset`. Also covers an
            unknown enum value and any other failed field constraint.


            **Plain** (no `errors` map): `boardMode and delivery.board disagree —
            send only one` — a cross-field rule enforced in the service, so only
            `detail` explains it. Clients must read `errors` defensively.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `Project is archived` — an archived project's settings are frozen
            along with its content. Unarchive it first.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/archive:
    post:
      tags: [Projects]
      summary: Archive a project
      description: >-
        Requires `project.archive` (the built-in project `MANAGER`; not part of
        the workspace-wide curator set). Archived projects reject issue
        mutations.
      operationId: archiveProject
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      responses:
        '204': { description: Archived }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/unarchive:
    post:
      tags: [Projects]
      summary: Restore an archived project
      description: Requires `project.archive`.
      operationId: unarchiveProject
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      responses:
        '204': { description: Restored }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/members:
    get:
      tags: [Projects]
      summary: List project members
      description: >-
        Open to **any workspace member**, project member or not — no permission
        is required. The assignee picker, mention autocomplete and a People view
        all need it, and the workspace member list is already open the same way.
        (Its former role gate admitted everyone, so no caller's result changed.)
      operationId: listProjectMembers
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectMemberResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Projects]
      summary: Add a project member
      description: >-
        Requires `project.member.manage` (the built-in project `MANAGER` or
        `TEAM_LEAD`; it is **not** part of the workspace-wide curator set, so a
        workspace OWNER/ADMIN who is not a project member cannot use it). The
        user must already be a workspace member.


        **Name the role with `roleId`** — the assignable `PROJECT`-scoped role's
        id, and the only way to name one of the workspace's own custom roles.
        The legacy `role` **key** (`MANAGER`, `TEAM_LEAD`, `MEMBER`,
        `COMMENTER`, `VIEWER`) still works and is now deprecated; **exactly one
        of the two must be present**, and neither or both is a `422`. So is a
        role reference this instance cannot assign here — including a
        *workspace* role, because scope is part of the question and `MEMBER`
        names a different role in each scope.


        The **grant ceiling** applies: you may not hand out a project role that
        grants a project permission you do not hold yourself (`403`, naming that
        permission). One escape, shared with the `PATCH` below: any holder of
        `project.member.manage` may always grant the built-in `MANAGER` role to
        **somebody else**, never to themselves — otherwise a project whose only
        member-managers hold a narrower role could never acquire what none of
        them holds.


        **`VIEWER` sent as `role` is stored as `MEMBER`** — see the
        `ProjectRole` schema — while naming the built-in Viewer by `roleId`
        stores it verbatim, which is how a genuinely read-only project
        membership finally becomes expressible. The response echoes what was
        stored either way.
      operationId: addProjectMember
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddProjectMemberRequest' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMemberResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already a project member
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422': { $ref: '#/components/responses/UnknownRole' }

  /workspaces/{workspaceId}/projects/{projectId}/members/{userId}:
    patch:
      tags: [Projects]
      summary: Change a project member's role
      description: |
        Requires `project.member.manage` — the project twin of
        `PATCH /workspaces/{workspaceId}/members/{userId}`, and **new**. Before
        it existed, correcting somebody's project role meant remove-then-add:
        two calls, each strand-checked separately, with the member dropped onto
        the workspace default in between and a window in which the project
        genuinely had no administrator.

        Body is `{"roleId": "…"}` and nothing else — no legacy `role` key,
        because there is no legacy client for a brand-new endpoint. The response
        is the same `ProjectMemberResponse` the add returns.

        **The grant ceiling applies to both ends** of the edit: the role the
        member holds now *and* the one requested. Checking only the new role
        would let a narrow member-manager demote somebody wider than themselves,
        which is the same escalation by the other door.

        **One deliberate escape:** any holder of `project.member.manage` may
        always grant the built-in project `MANAGER` role — to somebody else,
        never to themselves — regardless of the ceiling. Without it a project
        whose only member-managers carry a role narrower than `MANAGER` could
        never acquire what none of them holds, and `project.archive` /
        `project.taxonomy.manage` have no other route: a workspace `OWNER` who
        is not a member there holds no `project.member.manage` and so cannot
        assign any project role in that project either. The `target != actor`
        condition is load-bearing: without it `project.member.manage` would
        imply all twenty project permissions for its own holder. The residual is
        documented rather than hidden — two cooperating members can bootstrap a
        project administrator between them, which *is* the recovery procedure,
        performed by two willing people and logged at both steps.

        **The last administrator is protected here too** (`409`): a demotion
        strands a project with no row removed at all, which the removal guards
        could not see. The check is skipped for a *promotion* — a role that
        itself grants `project.member.manage` cannot strand anything, and
        requiring a second administrator before you may widen the only one would
        make the invariant unfixable. Self-demotion is allowed, and refused by
        this same guard exactly when it would orphan the project.

        Setting the role a member already holds is an accepted no-op. Like the
        removal, this takes row locks on the project's administrators, which
        makes it likelier than most writes to meet the wait bound every
        transaction this API opens carries, so a lost race is a retryable `409`
        carrying `Retry-After` rather than a hang.
      operationId: updateProjectMember
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/memberUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectMemberRequest' }
      responses:
        '200':
          description: OK — the updated membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMemberResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastProjectAdmin' }
        '422': { $ref: '#/components/responses/UnknownRole' }
    delete:
      tags: [Projects]
      summary: Remove a project member
      description: |
        Requires `project.member.manage`, and is bounded by the grant ceiling on
        the role the member holds now *and* on the role the removal leaves them
        with.

        **The project's last administrator is protected (`409`).** Removing the
        only member who holds `project.member.manage` would leave the project
        with nobody able to manage its membership, and that permission is not
        part of the workspace-wide curator set — so a workspace `OWNER`/`ADMIN`
        who is not a member of the project cannot step in either. Add another
        administrator first, then retry.

        The guard is on the **permission, not on one particular role**: any role
        granting `project.member.manage` makes its holder an administrator here,
        and a role that does not grant it never does — so a sole administrator is
        protected whatever role carries the permission; among the built-ins both
        `MANAGER` and `TEAM_LEAD` carry it. A project with no explicit
        administrator at all is a normal state and is left alone; only the step
        from one to none is refused.

        The same invariant is enforced workspace-wide by
        `DELETE /workspaces/{workspaceId}/members/{userId}`, which deletes these
        rows for every project at once and answers a `409` naming each affected
        project.

        This removal takes row locks on the project's administrators, which
        makes it likelier than most writes to meet the wait bound every
        transaction this API opens carries (3 s by default), so two overlapping
        removals answer a retryable `409` with `Retry-After` instead of one of
        them hanging — see **Errors** in the introduction.
      operationId: removeProjectMember
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastProjectAdmin' }

  /workspaces/{workspaceId}/projects/{projectId}/default-role:
    get:
      tags: [Projects]
      summary: This project's default access
      description: |
        Requires **`project.member.manage`** — not `project.edit`. A project's
        default role is membership authority rather than project settings, and
        the two are deliberately different grants; that is also why this is its
        own endpoint instead of a field on
        `PATCH /workspaces/{workspaceId}/projects/{projectId}`, where a
        second-permission field would be one gate away from being forgotten.

        Returns both links of the default-role chain (they duplicate
        `ProjectResponse.defaultRole` on purpose — a picker dialog is worth a
        self-contained read), the workspace's `mode`, so the dialog can say
        "this workspace is Restricted, so nothing is inherited right now — this
        default applies again if it is switched back to Open" without a second
        fetch, and `settable`: which `PROJECT`-scoped roles this caller may make
        the default here.
      operationId: getProjectDefaultRole
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDefaultRoleResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: Set this project's default access
      description: |
        Requires **`project.member.manage`**. Send **exactly one** of
        `{"roleId": "…"}` or `{"inherit": true}`; neither and both are alike a
        `422`, never a precedence rule. `inherit: true` stores `null`, meaning
        *"follow the workspace default"* — a real choice rather than an absence,
        since "this project deliberately follows the workspace" and "this
        project happens to name the same role the workspace does" diverge the
        moment the workspace default moves.

        **The grant ceiling here is bounded differently from the workspace
        one.** The comparand is `ctx.permissions()` — the caller's own real,
        effective permission set *in this project* — and **nobody is exempt**;
        the workspace picker instead compares against a fixed built-in
        Contributor baseline. So a role one scope accepts the other may refuse,
        in either direction. The bound applies to **both ends**: an actor whose
        own role is narrower than the current default may not replace it, so a
        narrow member-manager cannot quietly narrow a default of Project admin.
        A refusal is a `403` naming the first missing permission.

        **The membership escape does not reach here.** A holder of
        `project.member.manage` may hand the built-in project `MANAGER` role to
        *another member* regardless of the ceiling — that escape rests entirely
        on the target not being the actor, and a default has no target, or
        rather its target is everyone including the actor. So the same caller
        who may promote a colleague to Project admin gets a `403` naming
        `issue.delete` when they aim that role at the project default.

        Re-sending the value already stored is an accepted no-op. Answers the
        full `ProjectResponse`, so a People card re-renders straight from the
        write.
      operationId: setProjectDefaultRole
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectDefaultRoleRequest' }
      responses:
        '200':
          description: >-
            The updated project — or the unchanged one, when the requested value
            was already stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StrandedByInheritance' }
        '422':
          description: >-
            `roleId` is unknown, belongs to another workspace or is
            `WORKSPACE`-scoped; or the body sent neither `roleId` nor
            `inherit: true`, or both.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/config:
    get:
      tags: [Project config]
      summary: Effective taxonomy of a project
      description: |
        Everything needed to render the board and issue forms: statuses of the
        project's workflow (board-column order), transition rules (empty =
        all moves allowed), offered priorities with the default for new
        issues, the issue types of the project's type set, and the custom
        fields of the project's field set (display order, with create-form
        flags). Workspace members only.
        Replaced the workspace-scoped `/statuses`, `/issue-types` and
        `/status-transitions` endpoints.
      operationId: getProjectConfig
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConfig' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- System administration (system ADMIN role only) ----

  /admin/statuses:
    get:
      tags: [Admin]
      summary: List catalog statuses (admin)
      operationId: adminListStatuses
      responses:
        '200':
          description: Catalog with usage counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a status (admin)
      description: >-
        Names must be unique among the statuses **visible** to the target scope — not only
        own-scope rows but also inherited ones (a global/system status, or a workspace status
        inherited by a project). A colliding name returns `409`; reuse the inherited status
        instead of creating a scoped duplicate. The same visible-scope uniqueness applies to
        priorities, issue types and fields (fields also on `key`), and to renames via PATCH.
      operationId: adminCreateStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertStatus' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Name already exists or is inherited from a wider scope
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /admin/statuses/{id}:
    patch:
      tags: [Admin]
      summary: Update a status (admin)
      description: >-
        A rename is refused (`409`) when the new name collides with any status visible to the
        scope, inherited ones included — reuse the inherited status instead.
      operationId: adminUpdateStatus
      parameters: [ { $ref: '#/components/parameters/adminId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertStatus' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Name already exists or is inherited from a wider scope
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    delete:
      tags: [Admin]
      summary: Delete a status, optionally remapping issues (admin)
      description: |
        409 while issues reference the status and `replaceWithId` is absent,
        or when the deletion would leave a workflow empty / the replacement
        is not part of every affected workflow. `POST /{id}/archive` and
        `/{id}/unarchive` (not listed individually) hide an entry from new
        use instead. The same delete/archive semantics apply to priorities
        and issue types.

        `replaceWithId` is resolved **within the caller’s own scope** and
        answers `404` — never `403` — when it names an entry that scope cannot
        see, so an entry belonging to another tenant is indistinguishable from
        one that does not exist. Here that scope is global: a workspace- or
        project-scoped entry is not a valid replacement for a global one.
      operationId: adminDeleteStatus
      parameters:
        - $ref: '#/components/parameters/adminId'
        - name: replaceWithId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: In use — remap required or blocked by integrity rules
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /admin/priorities:
    get:
      tags: [Admin]
      summary: List catalog priorities (admin)
      description: Full CRUD mirrors `/admin/statuses` — POST, PATCH `/{id}`, DELETE `/{id}?replaceWithId=`, POST `/{id}/archive|unarchive`.
      operationId: adminListPriorities
      responses:
        '200':
          description: Catalog with usage counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminPriority' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/issue-types:
    get:
      tags: [Admin]
      summary: List catalog issue types (admin)
      description: Full CRUD mirrors `/admin/statuses`.
      operationId: adminListIssueTypes
      responses:
        '200':
          description: Catalog with usage counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminIssueType' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/fields:
    get:
      tags: [Admin]
      summary: List catalog custom fields (admin)
      description: |
        POST creates a field (`key` blank = derived from the name; key and
        type are immutable afterwards — stored values depend on them), PATCH
        `/{id}` updates name/config/description, POST `/{id}/archive` and
        `/{id}/unarchive` hide a field from forms without touching values.
        POST also refuses (409) a `key` that the HQL search vocabulary has
        claimed — any name a query resolves to a built-in field, its aliases
        (`labels`, `points`, …) included, so the reserved set is slightly wider
        than what `GET …/search/schema` advertises (that endpoint lists each
        field once, under its canonical name, and is capability-narrowed).
        A registered search name always outranks a custom field of the same key: such a
        field would work everywhere in the product except search, where it
        would be silently omitted from the vocabulary. The check runs **after**
        the blank-`key` slugification, so a field merely *named* "Project" is
        refused too. **Create only** — a key is immutable on update, so
        enforcing it there would strand an existing field, and this guard is
        never retroactive. The same refusal applies wherever a custom field is
        created, including the delegated
        `/workspaces/{workspaceId}/admin/fields` and
        `/workspaces/{workspaceId}/projects/{projectId}/admin/fields` mirrors.
        DELETE `/{id}` refuses (409) while issues hold values for the field
        unless `?dropValues=true` is passed — the values are then dropped;
        there is no remap across arbitrary value shapes. DELETE also refuses
        (409) for a built-in system field (`isSystem: true`) — those can only
        be archived, not deleted.
      operationId: adminListFields
      responses:
        '200':
          description: Catalog with usage counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminField' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a custom field (admin)
      operationId: adminCreateField
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertField' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminField' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            Either the name or key already exists / is inherited from a wider
            scope, or the key (after slugification) is one the HQL search
            vocabulary has claimed — `detail` says which. A reserved key reads
            `'project' is a reserved search field name — pick a different key
            (a custom field with this key would not be searchable)`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: Select field without options / option missing id or label
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /admin/field-sets:
    get:
      tags: [Admin]
      summary: List field sets (admin)
      description: |
        POST / PATCH `/{id}` take `{name, items:[{fieldId, required,
        showOnCreate}]}` (full replacement, display order; a required field
        is always shown on create); DELETE refuses while projects use the
        set. The system default set ("No fields") is empty and not deletable.
      operationId: adminListFieldSets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminFieldSet' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/workflows:
    get:
      tags: [Admin]
      summary: List workflows (admin)
      operationId: adminListWorkflows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminWorkflow' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a workflow (admin)
      description: |
        `PATCH /admin/workflows/{id}` takes the same body (full replacement
        of statuses and transitions; 409 when a removed status still holds
        issues in bound projects). `DELETE /admin/workflows/{id}` refuses
        (409) while projects use the workflow; the system default is not
        deletable.
      operationId: adminCreateWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertWorkflow' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWorkflow' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Name already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /admin/statuses/{id}/usage:
    get:
      tags: [Admin]
      summary: Usage detail of a catalog entry (admin)
      description: |
        The expansion behind a usage chip — names instead of counts: the
        workflows/sets containing the entry and the projects that effectively
        use it through them (deduplicated; projects on a system default are
        included). The same endpoint exists for the other catalogs:
        `GET /admin/priorities/{id}/usage`, `GET /admin/issue-types/{id}/usage`,
        `GET /admin/fields/{id}/usage` (not listed individually).
      operationId: adminStatusUsage
      parameters: [ { $ref: '#/components/parameters/adminId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/priority-sets:
    get:
      tags: [Admin]
      summary: List priority sets (admin)
      description: POST / PATCH `/{id}` take `{name, items:[{priorityId, isDefault}]}` (full replacement, display order); DELETE refuses while projects use the set.
      operationId: adminListPrioritySets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminPrioritySet' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/issue-type-sets:
    get:
      tags: [Admin]
      summary: List issue type sets (admin)
      description: |
        POST / PATCH `/{id}` take `{name, typeIds: […]}` (full replacement,
        display order; a set can never be empty); DELETE refuses while
        projects use the set, and the system default ("All types") is not
        deletable. A type set restricts only issue creation and type changes —
        existing issues keep a type that has left the set.
      operationId: adminListIssueTypeSets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminIssueTypeSet' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/projects:
    get:
      tags: [Admin]
      summary: Assignment matrix — all projects × bindings (admin)
      operationId: adminListProjects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectBinding' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/projects/{id}/bindings:
    patch:
      tags: [Admin]
      summary: Change a project's workflow / priority / field / type set (admin)
      description: |
        Full replacement of all bindings; `null` = the system default. 409
        when the project has issues in statuses the new workflow lacks.
        Field/type set changes are always allowed — values stay stored,
        issues keep their type.
      operationId: adminUpdateProjectBindings
      parameters: [ { $ref: '#/components/parameters/adminId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflowId: { type: string, format: uuid, nullable: true }
                prioritySetId: { type: string, format: uuid, nullable: true }
                fieldSetId: { type: string, format: uuid, nullable: true }
                issueTypeSetId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBinding' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Issues would be stranded in statuses the new workflow lacks
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /admin/users:
    get:
      tags: [Admin]
      summary: List all user accounts (admin)
      description: Paginated, ordered by creation time (oldest first).
      operationId: adminListUsers
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a user account (admin)
      description: |
        Creates an ACTIVE account with no password and sends no email. The
        response carries a one-time `setupLink` (`/reset-password?token=`,
        valid 7 days) the admin hands over so the person can set a password.
        On DC this is the primary way to onboard users — public
        self-registration is disabled there.
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                displayName: { type: string, maxLength: 100 }
                systemRole: { type: string, enum: [ADMIN, USER], default: USER }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/AdminUser' }
                  setupLink: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /admin/users/{id}/setup-link:
    post:
      tags: [Admin]
      summary: Regenerate a user's one-time setup link (admin)
      operationId: adminRegenerateSetupLink
      parameters: [ { $ref: '#/components/parameters/adminId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupLink: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Change a user's role or status (admin)
      description: |
        Partial update; any omitted field is unchanged. `status` accepts only
        ACTIVE / DISABLED. Guards return 409 when the change would disable or
        demote the last active administrator, or the admin's own account.
        Disabling revokes the user's refresh tokens.
      operationId: adminUpdateUser
      parameters: [ { $ref: '#/components/parameters/adminId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemRole: { type: string, enum: [ADMIN, USER] }
                status: { type: string, enum: [ACTIVE, DISABLED] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Would lock out the last administrator, or self-disable/self-demote
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  # ---- Delegated administration (workspace.taxonomy.manage / project.taxonomy.manage) ----

  /workspaces/{workspaceId}/admin/statuses:
    get:
      tags: [Delegated admin]
      summary: List workspace-scoped catalog (visible = global ∪ workspace)
      description: >-
        Workspace console. The full catalog/set surface of `/admin/**` is mirrored
        under `/workspaces/{workspaceId}/admin/**`, gated on
        `workspace.taxonomy.manage` (the built-in OWNER/ADMIN):
        `statuses`, `priorities`, `issue-types`, `fields` (GET/POST, PATCH `/{id}`,
        POST `/{id}/archive|unarchive`, DELETE `/{id}` [`?replaceWithId=`; fields
        `?dropValues=`], GET `/{id}/usage`) and the sets `workflows`,
        `priority-sets`, `field-sets`, `issue-type-sets` (GET/POST, PATCH/DELETE
        `/{id}`). List responses carry `scope`; writes to inherited (global) rows
        return 404. A delete’s `?replaceWithId=` resolves within this scope’s
        visible catalog too — an id it cannot see is 404, never 403.
      operationId: wsAdminListStatuses
      parameters: [ { $ref: '#/components/parameters/workspaceId' } ]
      responses:
        '200':
          description: Visible statuses (scope-tagged)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminStatus' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/admin/projects:
    get:
      tags: [Delegated admin]
      summary: Workspace binding matrix — every project in the workspace
      operationId: wsAdminMatrix
      parameters: [ { $ref: '#/components/parameters/workspaceId' } ]
      responses:
        '200':
          description: Project bindings for the workspace
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProjectBinding' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/admin/binding-options:
    get:
      tags: [Delegated admin]
      summary: Sets bindable within the workspace (global ∪ workspace)
      operationId: wsAdminBindingOptions
      parameters: [ { $ref: '#/components/parameters/workspaceId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindingOptions' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/admin/projects/{projectId}/bindings:
    patch:
      tags: [Delegated admin]
      summary: Set a project's bindings (workspace admin)
      operationId: wsAdminUpdateBindings
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflowId: { type: string, format: uuid, nullable: true }
                prioritySetId: { type: string, format: uuid, nullable: true }
                fieldSetId: { type: string, format: uuid, nullable: true }
                issueTypeSetId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBinding' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Set not visible to the project
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/admin/bindings:
    get:
      tags: [Delegated admin]
      summary: This project's bindings (project.taxonomy.manage)
      description: >-
        Project console. The catalog/set surface mirrors `/admin/**` under
        `/workspaces/{workspaceId}/projects/{projectId}/admin/**`, gated on
        `project.taxonomy.manage` — the built-in project MANAGER only; it is not
        part of the workspace-wide curator set, so a workspace OWNER/ADMIN with
        no project membership row is refused. Rows scoped PROJECT are editable;
        global/workspace rows are inherited (read-only). This endpoint plus PATCH
        set the four bindings. A catalog delete’s `?replaceWithId=` resolves only
        within what this project can see (global ∪ workspace ∪ its own rows);
        anything else is 404.


        **A workspace member who is not a project member now gets 403 here, not
        404** — see the `Delegated admin` tag description. A non-member of the
        workspace still gets 404.
      operationId: projectAdminGetBindings
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBinding' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Delegated admin]
      summary: Set this project's bindings (project.taxonomy.manage)
      operationId: projectAdminUpdateBindings
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflowId: { type: string, format: uuid, nullable: true }
                prioritySetId: { type: string, format: uuid, nullable: true }
                fieldSetId: { type: string, format: uuid, nullable: true }
                issueTypeSetId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBinding' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Set not visible to the project
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/admin/binding-options:
    get:
      tags: [Delegated admin]
      summary: Sets bindable to this project (global ∪ workspace ∪ project)
      operationId: projectAdminBindingOptions
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindingOptions' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/issues:
    post:
      tags: [Issues]
      summary: Create an issue
      description: |
        Requires `issue.create` — **plus** `issue.assign` when the body carries
        an `assigneeId`, and **plus** `sprint.assign` when it carries a
        `sprintId`. All three are checked from the request shape alone, before
        anything is read or written (and before the archived-project `409`), so
        a rejected create changes nothing. A `403` names the first permission
        that was missing.

        `assigneeId` must be a workspace member **who holds `issue.assignable`
        in this project**; a target who does not is a `422` ("That user cannot
        be assigned in this project"), deliberately distinct from the `422` for
        an unknown assignee. A component's auto-assign lead who lacks it is
        skipped silently instead — the issue is filed unassigned rather than
        failing over somebody else's role. `parentId` links a sub-task
        to a parent issue in the same project (rejected with `422` if unknown,
        in another project, or a hierarchy-level violation). The issue gets the
        next sequential project-scoped `number`. `labelIds` attaches workspace
        labels — an unknown, foreign-workspace or archived label id, or more
        than `app.classification.max-labels-per-issue` distinct ids, is a `422`.
        `componentId` files the issue under a component of **this** project (an
        unknown, foreign-project or archived component is a `422`); when that
        component has `autoAssign` and a lead and the request carries no
        `assigneeId`, the lead becomes the assignee. `fixVersionIds` and
        `affectsVersionIds` link versions of **this** project in the two
        independent roles — an unknown, foreign-project or archived version, or
        more than `app.classification.max-version-links-per-issue` distinct ids
        **per link type**, is a `422`. `sprintId` files the issue straight into
        a sprint of **this** project (an unknown, foreign-project or
        **completed** sprint is a `422`); omitted, the issue lands in the
        backlog. `storyPoints` is the native estimate — `0`…`999` with at most 2
        decimals (`422` otherwise), and `null`/omitted means *unestimated*,
        which is deliberately not the same as `0`. A new issue is always
        appended to the **bottom** of the ranked backlog; `position` is
        server-written and never accepted from a payload.
      operationId: createIssue
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIssueRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Project is archived
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422': { $ref: '#/components/responses/UnprocessableReference' }
    get:
      tags: [Issues]
      summary: List issues
      description: |
        Dual-shape by design. **Without** `size` the response is a
        `BoardIssuesResponse` — the board/kanban path. The issue list is bounded
        server-side to `cap` (`app.board.max-issues`, default 500, never
        client-overridable); when the project after the same filters exceeds it,
        `truncated` is true and `totalAvailable` reports the full count so the UI
        can render a truncation banner. **With** `size` the response is a
        paginated `PageResponse` envelope (the backlog path), and the optional
        `excludeDone` flag drops issues whose status is in the DONE category
        server-side. The `statusId`/`assigneeId`/`priorityId`/`componentId`/
        `labelId`/`fixVersionId` filters apply in both modes and are ANDed
        together.

        The **label, component and fix-version filters are applied server-side**
        (they must search the whole project, not just the capped page on
        screen): repeat `labelId` once per label and pick the combining mode
        with `labelMatch`; `componentId` and `fixVersionId` are single optional
        uuids. `fixVersionId` matches the **fix** role only — an affects link to
        the same version does not match it. A `componentId`/`fixVersionId`
        belonging to another project simply matches nothing — never an error.

        The **sprint filters** work the same way: `sprintId` narrows to one
        sprint (a foreign id matches nothing, never an error) and
        `noSprint=true` narrows to the backlog (issues in no sprint at all).
        They are **mutually exclusive** — "in this sprint" and "in no sprint"
        can never both hold, so sending both is a `400` rather than a silently
        empty result. Rows come back in the shared backlog/board rank order
        (`position`, then newest first); the rank value itself is not exposed.
      operationId: listIssues
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - name: statusId
          in: query
          schema: { type: string, format: uuid }
        - name: assigneeId
          in: query
          schema: { type: string, format: uuid }
        - name: priorityId
          in: query
          schema: { type: string, format: uuid }
        - name: componentId
          in: query
          description: >-
            Filter to issues filed under this project component, ANDed with the
            other filters. An id from another project matches nothing rather
            than erroring.
          schema: { type: string, format: uuid }
        - name: labelId
          in: query
          description: >-
            Repeatable — filter to issues carrying these labels
            (`?labelId=…&labelId=…`). Combined per `labelMatch`, ANDed with the
            other filters. More than `app.classification.max-labels-per-issue`
            (default 20) distinct values is a `400`.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: labelMatch
          in: query
          description: >-
            How `labelId` values combine — `any` = carries at least one (OR),
            `all` = carries every one (AND). Lowercase, closed set: anything
            else is a `400` (never a silent fall-through to `any`).
          schema: { type: string, enum: [any, all], default: any }
        - name: fixVersionId
          in: query
          description: >-
            Filter to issues that ship in this version, ANDed with the other
            filters. Matches the **fix** link role only — an affects link to the
            same version does not match. An id from another project matches
            nothing rather than erroring.
          schema: { type: string, format: uuid }
        - name: sprintId
          in: query
          description: >-
            Filter to issues committed to this sprint, ANDed with the other
            filters. An id from another project matches nothing rather than
            erroring. Mutually exclusive with `noSprint` (`400` when both are
            sent).
          schema: { type: string, format: uuid }
        - name: noSprint
          in: query
          description: >-
            Filter to issues in **no** sprint — the backlog. Mutually exclusive
            with `sprintId` (`400` when both are sent).
          schema: { type: boolean, default: false }
        - name: excludeDone
          in: query
          description: Paginated mode only — drop issues in a DONE-category status
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
      responses:
        '200':
          description: |
            A `BoardIssuesResponse` when `size` is omitted; a `PageResponse`
            envelope when `size` is present.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoardIssuesResponse'
                  - allOf:
                      - $ref: '#/components/schemas/PageResponse'
                      - type: object
                        properties:
                          content:
                            type: array
                            items: { $ref: '#/components/schemas/IssueResponse' }
        '400':
          description: >-
            Unknown `labelMatch` value, more than
            `app.classification.max-labels-per-issue` distinct `labelId` values,
            or `sprintId` and `noSprint` sent together.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/issues/{number}:
    get:
      tags: [Issues]
      summary: Get an issue
      operationId: getIssue
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Issues]
      summary: Update an issue
      description: |
        **Multi-permission, per field.** One request can require `issue.edit`,
        `issue.transition`, `issue.assign` and `sprint.assign` at once:
        `statusId` needs `issue.transition`, the assignee needs `issue.assign`,
        the sprint needs `sprint.assign`, and every other field (title,
        description, type, priority, due date, labels, component, parent,
        versions, story points, custom `fields`) needs `issue.edit` — which an
        `issue.edit:own` grant satisfies on issues you **reported**. Only fields
        that are **present and actually changing** are checked, so a whole-form
        patch that moves one field does not need rights over the rest it echoes
        back; a non-empty `fields` map is the one exception, checked on
        presence rather than on change. When several are missing the `403`
        names the **first** in catalog order (`issue.edit` → `issue.transition`
        → `issue.assign` → `sprint.assign`). Every check runs before the first
        mutation and before the archived-project `409`.

        Partial update — send any subset of fields plus the `version` you last
        read; a stale version returns `409` (omit `version` to skip the check —
        last-write-wins for the fields you send, though a competing commit
        landing while the request is in flight still returns `409` from the
        database's own check rather than overwriting it).
        Status changes are validated against workflow transition rules (`422`
        when forbidden). `parentId` sets/changes the parent and `clearParent`
        detaches it; an illegal parent (unknown/foreign-project, self, cycle,
        hierarchy-level violation, or a type change that conflicts with an
        existing parent/child edge) returns `422`. `labelIds` is a
        **full-replacement** set: present → the issue ends up with exactly those
        labels (`[]` clears them all), absent → unchanged. `componentId`
        sets/changes the component and `clearComponent` unsets it; attaching an
        unknown, foreign-project or archived component is a `422` (an
        already-attached archived one may stay). Component auto-assign never
        fires on update. `fixVersionIds` and `affectsVersionIds` are
        full-replacement sets **per role** — sending one never touches the
        other, `[]` clears that role, absent leaves it unchanged; the same `422`
        rules as create apply, with the per-issue cap counted separately per
        link type. `sprintId` moves the issue into a sprint of this project and
        `clearSprint: true` returns it to the backlog (the
        `assigneeId`/`clearAssignee` convention); sending **both** is a `400`
        (it used to let `sprintId` win silently — `POST …/rank` already refused
        the same combination, and the two write paths now agree). An unknown,
        foreign-project or **completed** target sprint is a `422`, and so is
        moving the issue out of a sprint that is already `COMPLETED`.
        `storyPoints` sets the estimate
        (`0`…`999`, at most 2 decimals — `422` otherwise) and
        `clearStoryPoints: true` marks the issue unestimated again. Both a
        sprint and a story-point change write one history entry each; the issue
        **rank** is never changed here — that is `POST …/issues/{number}/rank`.
      operationId: updateIssue
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIssueRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueResponse' }
        '400':
          description: >-
            Malformed request — `sprintId` and `clearSprint` sent together
            ("put it in sprint X" and "take it out of every sprint" cannot both
            hold).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale `version` — the issue was modified by someone else, or the project is archived
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            Unknown status/type/assignee/parent, a workflow-forbidden
            transition, an unknown / foreign-project / archived label,
            component or version, an out-of-range `storyPoints`, an unknown /
            foreign-project / **completed** target sprint — or the issue's
            **current** sprint is `COMPLETED` and the request changes or clears
            it. A completed sprint's membership is frozen in both directions;
            every other field of such an issue stays editable. Also **a new
            assignee who lacks `issue.assignable` in this project** ("That user
            cannot be assigned in this project") — validated only on an actual
            change, so an issue whose assignee has since lost the permission
            stays editable and is never unassigned.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    delete:
      tags: [Issues]
      summary: Delete an issue
      description: >-
        Requires `issue.delete`; an `issue.delete:own` grant covers issues you
        **reported**. Removes comments and attachment files too. The permission
        is checked **before** the project's state, so a caller without it on an
        archived project now gets `403` where they used to get
        `409 "Project is archived"`.
      operationId: deleteIssue
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/issues/{number}/rank:
    post:
      tags: [Issues]
      summary: Move an issue in the backlog / board rank
      description: >-
        Re-ranks one issue in the project-wide order the board and the backlog
        **share**, optionally moving it into or out of a sprint in the same
        request. Requires `issue.rank` — the everyday contributor tier, not the
        sprint-lifecycle one: dragging items at a planning meeting is teamwork.
        A request that also changes the sprint requires `sprint.assign` too
        (the same permission the sprint endpoints and `PATCH …/issues/{number}`
        check — one permission, every door).

        **Both permissions are checked before the project's state.** `issue.rank`
        first, `sprint.assign` as soon as the request is known to move the issue
        between sections, and only then is an **archived** project refused with
        `409`. So a caller missing either one gets the `403`, never the archive
        conflict — the same ordering issue delete and attachment delete already
        follow. The answer to "may you?" must not depend on the state of the
        thing you are asking about.

        The client never sends a rank value — it sends the neighbours it dropped
        between (`afterIssueId` / `beforeIssueId`, both by **id**, while the
        moved issue travels by `number`), and the server computes the placement
        from them. Whichever neighbour is missing is looked up in the target
        section; both absent means "append to the end of the section". Because
        the rank is server-written it is not exposed anywhere — there is no
        `position` field on `IssueResponse`.

        Rank changes write **no** history (positional churn would drown the
        log); a sprint change in the same request does. `version` is
        **optional**: sent, it is an optimistic check (`409` when stale);
        omitted, the move simply applies — ranking is last-drag-wins.

        Repeatedly dropping an issue into the same gap eventually exhausts it
        and the server re-spaces the whole project's ranks. That rebalance is
        throttled to **once per project per 60 s**: a second one inside the
        window is a `429` with `Retry-After`, which is a retryable throttle, not
        a fault — nothing was moved, and the same request succeeds after the
        wait.
      operationId: rankIssue
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RankIssueRequest' }
      responses:
        '200':
          description: Moved — the issue in its new state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueResponse' }
        '400':
          description: >-
            Malformed request — `sprintId` and `clearSprint` sent together, or
            neither an anchor nor a sprint change (the request asks for
            nothing).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Stale `version`, the project is archived, or **the list changed** —
            the anchors are no longer consistent with each other
            (`after.position >= before.position`), so the caller's view is out
            of date. Refresh and drag again; nothing was moved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            An anchor is unknown / belongs to another project, an anchor is not
            in the **target** section (a different sprint, or the backlog when
            moving into a sprint), an anchor **is** the issue being moved,
            `sprintId` is unknown / foreign / **completed**, or the issue's
            **current** sprint is `COMPLETED` and the request would move it out
            of (or on from) that sprint — a completed sprint's membership is the
            delivery record the completion already reported, so it is frozen in
            both directions. A pure rank move inside a completed sprint is still
            allowed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429':
          description: >-
            The project's ranks were just re-spaced — this request would have
            triggered a second whole-project rebalance inside the 60 s cooldown.
            A **retryable throttle, not a fault**: nothing was moved, and
            retrying after the number of seconds in `Retry-After` succeeds.
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/issues/{number}/children:
    get:
      tags: [Issues]
      summary: List an issue's direct children
      description: The direct children of the issue, in board order (`position` then newest).
      operationId: listIssueChildren
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
      responses:
        '200':
          description: OK, board order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IssueResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/issues/{number}/history:
    get:
      tags: [Issues]
      summary: Field-level change history
      description: Paginated, oldest first.
      operationId: getIssueHistory
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
      responses:
        '200':
          description: OK, oldest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/IssueHistoryResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/issues/{number}/comments:
    post:
      tags: [Comments]
      summary: Add a comment
      description: >-
        Requires `comment.create`. **This endpoint had no gate at all before** —
        any workspace member could comment on any issue in any project. The
        built-in project `MANAGER`, `TEAM_LEAD`, `MEMBER` and `COMMENTER` all
        grant it, so everyone who could comment still can; what changed is that
        a project can now have a role that reads but does not comment.


        The permission is checked **before** the archived-project `409`, so a
        caller without it sees the `403` on an archived project.
        `@DisplayName` mentions notify the mentioned workspace members.
      operationId: createComment
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProjectArchived' }
    get:
      tags: [Comments]
      summary: List comments
      description: >-
        Soft-deleted comments are excluded. Paginated, oldest first. Reading
        needs nothing beyond project access — no permission.
      operationId: listComments
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/CommentResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/issues/{number}/comments/{commentId}:
    patch:
      tags: [Comments]
      summary: Edit a comment
      description: >-
        Requires `comment.edit`, which is **own-only at every role** — it is the
        one catalog entry that cannot be granted unrestricted, because putting
        words in someone else's mouth is not a capability this product ships.
        Even a project administrator holds only `comment.edit:own`. Editing
        another person's comment is therefore a `403` for everybody, exactly as
        before; what changed is that the refusal now names the permission
        instead of being an empty `403` with no body.


        Checked before the archived-project `409`.
      operationId: updateComment
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
        - $ref: '#/components/parameters/commentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProjectArchived' }
    delete:
      tags: [Comments]
      summary: Delete a comment (soft)
      description: >-
        Requires `comment.delete`, which honours the ownership modifier: the
        built-in `TEAM_LEAD`, `MEMBER` and `COMMENTER` hold it **own-only**
        (your own comments, as before) and the project `MANAGER` holds it
        **unrestricted**.


        **That unrestricted half is a new capability.** Until this release
        nobody could delete another person's comment — not a project
        administrator, not a workspace owner — because the only rule was
        authorship. It is moderation, and it is deliberately the *opposite*
        choice from `comment.edit`: deleting someone's comment is moderation,
        editing it is impersonation. A workspace `OWNER`/`ADMIN` who is not a
        member of the project does **not** get it — `comment.delete` is not part
        of the workspace-wide curator set.


        Soft delete (the comment leaves the list; attribution is kept). Checked
        before the archived-project `409`.
      operationId: deleteComment
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
        - $ref: '#/components/parameters/commentId'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProjectArchived' }

  /workspaces/{workspaceId}/projects/{projectId}/issues/{number}/attachments:
    post:
      tags: [Attachments]
      summary: Upload an attachment
      description: >-
        Requires `attachment.create`, checked before the archived-project
        `409`. `multipart/form-data` with a `file` field. A per-file size limit is enforced in-app
        (default 20 MB; `413` when exceeded) in addition to the servlet hard ceiling
        (default 25 MB). The file extension must be in the allow-list (default: png, jpg, jpeg,
        gif, webp, bmp, svg, pdf, txt, csv, log, md, json, doc, docx, xls, xlsx, ppt, pptx, zip)
        or the upload is rejected with `415`. The stored/returned `contentType` is derived from
        the filename on the server — the client-supplied header is ignored.
      operationId: uploadAttachment
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: >-
            File exceeds a size ceiling. The wording says which one: the in-app
            per-file limit answers `File exceeds the 20 MB limit` (the configured
            size), the servlet multipart ceiling answers `File is too large`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '415':
          description: File extension is not in the allow-list
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    get:
      tags: [Attachments]
      summary: List attachments
      operationId: listAttachments
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttachmentResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/issues/{number}/attachments/{attachmentId}:
    get:
      tags: [Attachments]
      summary: Download an attachment
      operationId: downloadAttachment
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
        - $ref: '#/components/parameters/attachmentId'
      responses:
        '200':
          description: 'Binary content, `Content-Disposition: attachment`'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Attachments]
      summary: Delete an attachment
      description: >-
        Requires `attachment.delete`, with the ownership modifier: an
        `attachment.delete:own` grant covers the files **you** uploaded, the
        unrestricted grant covers anyone's (the built-in project `MANAGER`) —
        which is the previous "uploader or `MANAGER`" rule spelled out. The
        permission is checked **before** the project's state, so a caller
        without it on an archived project now gets `403` where they used to get
        `409 "Project is archived"`.
      operationId: deleteAttachment
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/issueNumber'
        - $ref: '#/components/parameters/attachmentId'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/labels:
    get:
      tags: [Labels]
      summary: List the workspace's labels
      description: >-
        The workspace's label catalog, ordered by name (case-insensitive). Any
        workspace member may read it; a non-member — or an unknown workspace —
        gets `404`, never `403`. Archived labels are hidden unless
        `includeArchived=true`. With `withUsage=true` every row carries its
        `issueCount` (one grouped query for the whole list); otherwise
        `issueCount` is `null`.
      operationId: listLabels
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: includeArchived
          in: query
          description: Include archived labels (hidden by default)
          schema: { type: boolean, default: false }
        - name: withUsage
          in: query
          description: Fill `issueCount` on every row (null when omitted)
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK, ordered by name (case-insensitive)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LabelResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Labels]
      summary: Create a label
      description: >-
        **Any workspace member** may create a label — tagging is self-serve. The
        `name` is normalized server-side (NFC, invisible control/format
        characters stripped, whitespace collapsed, max 60 chars after
        normalization) and is unique per workspace **case-insensitively**,
        archived labels included: a collision returns `409` with the winning
        label's id in the `existingId` extension. An omitted `color` gets a
        deterministic swatch derived from the name.
      operationId: createLabel
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLabelRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelResponse' }
        '400':
          description: >-
            Failed validation — blank name, a name longer than 60 characters
            after normalization, or a `color` that is not `#RRGGBB`/`#RRGGBBAA`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LabelNameConflict' }
        '422':
          description: >-
            The workspace already holds the maximum number of labels
            (`app.classification.max-labels-per-workspace`, default 1000) —
            archive or delete some first. Archived labels count toward that
            ceiling: they keep their unique name slot.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/labels/{labelId}:
    patch:
      tags: [Labels]
      summary: Rename / recolor / describe a label
      description: >-
        Partial update — `null`/omitted fields are left unchanged. Requires
        `label.manage` **qualified by ownership**: the built-in workspace
        OWNER/ADMIN hold it unrestricted and MEMBER holds it own-only, so a
        member may still rename a label they created and nobody else's. Any
        other member gets a `403` naming the key (a non-member still gets
        `404`). A pure casing change
        keeps the label's unique slot; any other rename into an existing name
        (archived rows included) returns `409` with `existingId`.
      operationId: updateLabel
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/labelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLabelRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelResponse' }
        '400':
          description: Blank/too-long name, or a `color` that is not `#RRGGBB`/`#RRGGBBAA`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LabelNameConflict' }
    delete:
      tags: [Labels]
      summary: Delete a label
      description: >-
        Requires `label.manage` **unrestricted** (the built-in workspace
        OWNER/ADMIN): the check is made with no ownership argument, so an
        own-only grant can never satisfy it — a member may not delete even a
        label they created. A label still attached to issues returns
        `409` unless `force=true`, which detaches it everywhere first (including
        issues in archived projects — the catalog row disappears either way).
        There is no remap-on-delete: use `POST …/merge` for that. Archiving is
        the recommended non-destructive alternative.
      operationId: deleteLabel
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/labelId'
        - name: force
          in: query
          description: Detach the label from every issue and delete it anyway
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The label is used on at least one issue and `force` was not set
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/labels/{labelId}/archive:
    post:
      tags: [Labels]
      summary: Archive a label
      description: >-
        Requires `label.manage` **unrestricted** (the built-in workspace
        OWNER/ADMIN) — an own-only grant does not satisfy it, so a member cannot
        archive even a label they created. Always allowed, even while the label is
        in use: it leaves every picker and the default catalog listing, existing
        attachments are preserved (and reported with `archived: true` on the
        issue), and it can no longer be added to an issue (`422`). The name slot
        stays reserved.
      operationId: archiveLabel
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/labelId'
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/labels/{labelId}/unarchive:
    post:
      tags: [Labels]
      summary: Restore an archived label
      description: >-
        Requires `label.manage` **unrestricted** (the built-in workspace
        OWNER/ADMIN). The row already owns its unique name
        slot, so this can never conflict.
      operationId: unarchiveLabel
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/labelId'
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/labels/{labelId}/merge:
    post:
      tags: [Labels]
      summary: Merge labels into this one
      description: >-
        Requires `label.manage` **unrestricted** (the built-in workspace
        OWNER/ADMIN). Every issue carrying one of `sourceIds`
        ends up carrying the label in the path, duplicates collapse, and the
        source labels are **deleted**. The cure for tag soup. No per-issue
        history rows are written (a merge can touch thousands of issues) — this
        response plus the target's bumped `updatedAt` are the record. Issues in
        archived projects are re-pointed too.
      operationId: mergeLabels
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/labelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeLabelsRequest' }
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeLabelsResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >-
            A source id equals the target, or one of them does not resolve
            inside this workspace (a foreign-tenant id leaks nothing — it is
            simply "not in this workspace").
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/labels/{labelId}/usage:
    get:
      tags: [Labels]
      summary: How many issues carry a label
      description: >-
        Backs the settings usage chip and the delete-confirm dialog. Any
        workspace member.
      operationId: labelUsage
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/labelId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelUsageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/components:
    get:
      tags: [Components]
      summary: List the project's components
      description: >-
        The project's component catalog, ordered by name (case-insensitive).
        Any project member may read it; a missing workspace, a missing project
        or a non-member all give `404`, never `403`. Archived components are
        hidden unless `includeArchived=true`. With `withUsage=true` every row
        carries its `issueCount` (one grouped query for the whole list);
        otherwise `issueCount` is `null`.
      operationId: listComponents
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - name: includeArchived
          in: query
          description: Include archived components (hidden by default)
          schema: { type: boolean, default: false }
        - name: withUsage
          in: query
          description: Fill `issueCount` on every row (null when omitted)
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK, ordered by name (case-insensitive)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ComponentResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Components]
      summary: Create a component
      description: >-
        Requires `component.manage` / `version.manage` / `sprint.manage` as
        applicable — granted by the built-in project `MANAGER` and, across every
        project of their workspace, by an `OWNER`/`ADMIN` of it (who need not be
        a project member); any other member gets a `403` naming the key. The `name` is normalized
        server-side (NFC, invisible control/format characters stripped,
        whitespace collapsed, max 80 chars after normalization) and is unique
        per **project** case-insensitively, archived components included — a
        collision is a `409` (no `existingId` extension: components have no
        on-the-fly create to recover from). The same name in a different project
        is fine. `leadId` must be a workspace member and `autoAssign: true`
        requires a lead (`422` otherwise).
      operationId: createComponent
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateComponentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentResponse' }
        '400':
          description: >-
            Failed validation — blank name, a name longer than 80 characters
            after normalization, or a description over 500 characters.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ComponentConflict' }
        '422':
          description: >-
            `leadId` does not resolve to a member of this workspace ("Unknown
            lead" — a foreign-tenant id leaks nothing), `autoAssign` is true with
            no lead, **or** the project already holds the maximum number of
            components (`app.classification.max-components-per-project`, default
            500) — archive or delete some first. **Archived components count
            toward that ceiling**: they keep their unique name slot and are still
            returned by `includeArchived=true`, so excluding them would let
            create → archive → repeat bypass the cap.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/components/{componentId}:
    get:
      tags: [Components]
      summary: Get a component
      description: >-
        Any project member. `issueCount` is always `null` here — use
        `GET …/components/{componentId}/usage` or the list's `withUsage=true`.
      operationId: getComponent
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/componentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Components]
      summary: Rename / re-lead / describe a component
      description: >-
        Same permission as the create/update endpoints above (built-in project
        `MANAGER`, or a workspace `OWNER`/`ADMIN` across their workspace).
        Partial — `null`/omitted fields are left unchanged. A pure casing change
        keeps the component's unique slot; any other rename onto a taken name
        (archived rows included) is a `409`. `leadId` sets the lead and
        `clearLead: true` unsets it (the `assigneeId`/`clearAssignee`
        convention); the resulting state must still satisfy "auto-assign needs a
        lead" (`422` otherwise).
      operationId: updateComponent
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/componentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateComponentRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentResponse' }
        '400':
          description: >-
            Blank name, a name longer than 80 characters after normalization, or
            a description over 500 characters.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ComponentConflict' }
        '422': { $ref: '#/components/responses/ComponentLeadUnprocessable' }
    delete:
      tags: [Components]
      summary: Delete a component
      description: >-
        Project curator only. A component still carried by issues returns `409`
        unless `force=true`, which **nulls the component on every issue that
        carried it** and then deletes the row. There is no
        remap-to-another-component, and no per-issue history is written (a
        forced delete can touch thousands of issues). Archiving is the
        recommended non-destructive alternative.
      operationId: deleteComponent
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/componentId'
        - name: force
          in: query
          description: Clear the component from every issue and delete it anyway
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The component is used on at least one issue and `force` was not set
            (the message states the count), or the project is archived.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/components/{componentId}/archive:
    post:
      tags: [Components]
      summary: Archive a component
      description: >-
        Project curator only. Always allowed, even while the component is in
        use — this is the recommended alternative to delete: it leaves every
        picker and the default settings list, existing assignments are kept (and
        reported with `archived: true` on the issue), and it can no longer be
        attached to an issue (`422`). Reversible, and the name slot stays
        reserved.
      operationId: archiveComponent
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/componentId'
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProjectArchived' }

  /workspaces/{workspaceId}/projects/{projectId}/components/{componentId}/unarchive:
    post:
      tags: [Components]
      summary: Restore an archived component
      description: >-
        Project curator only. The row already owns its unique name slot, so this
        can never conflict on the name.
      operationId: unarchiveComponent
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/componentId'
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProjectArchived' }

  /workspaces/{workspaceId}/projects/{projectId}/components/{componentId}/usage:
    get:
      tags: [Components]
      summary: How many issues carry a component
      description: >-
        Backs the settings usage chip and the delete-confirm dialog. Any project
        member.
      operationId: componentUsage
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/componentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentUsageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/versions:
    get:
      tags: [Versions]
      summary: List the project's versions
      description: >-
        The project's release plan — the Releases page's data source. Any
        project member may read it; a missing workspace, a missing project or a
        non-member all give `404`, never `403`. Ordered **unreleased first**,
        then by `releaseDate` ascending with undated versions last, then by name
        (case-insensitive). Archived versions are hidden unless
        `includeArchived=true`; released ones are **included by default**
        (`includeReleased=true` — a release page without its shipped releases is
        useless). `issueCount`, `doneIssueCount` and `affectsIssueCount` are
        always present: they cost one grouped query for the whole list, so there
        is nothing to opt out of.
      operationId: listVersions
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - name: includeArchived
          in: query
          description: Include archived versions (hidden by default)
          schema: { type: boolean, default: false }
        - name: includeReleased
          in: query
          description: >-
            Include already-released versions. Defaults to **true**, unlike
            `includeArchived` — set it to false for a "what is still open"
            picker.
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: >-
            OK — unreleased first, then by planned date (undated last), then by
            name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VersionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Versions]
      summary: Create a version
      description: >-
        Requires `component.manage` / `version.manage` / `sprint.manage` as
        applicable — granted by the built-in project `MANAGER` and, across every
        project of their workspace, by an `OWNER`/`ADMIN` of it (who need not be
        a project member); any other member gets a `403` naming the key. The `name` is normalized
        server-side (NFC, invisible control/format characters stripped,
        whitespace collapsed, max 60 chars after normalization) and is unique
        per **project** case-insensitively, archived versions included — a
        collision is a `409`. The same name in a different project is fine. A
        version is always born **unreleased**: `releaseDate` is only the plan,
        and shipping it is the separate `POST …/release` call.
      operationId: createVersion
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVersionRequest' }
      responses:
        '201':
          description: 'Created — always `released: false`, `archived: false`, all counts 0'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        '400':
          description: >-
            Failed validation — blank name, a name longer than 60 characters
            after normalization, or a description over 500 characters.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422':
          description: >-
            The project already holds the maximum number of versions
            (`app.classification.max-versions-per-project`, default 500) —
            delete some first. **Archived (and released) versions count toward
            that ceiling**: they keep their unique name slot and are still
            loaded by `includeArchived=true`, so excluding them would let
            create → archive → repeat bypass the cap. Also returned for a
            `releaseDate` outside `1000-01-01`…`9999-12-31` (see
            `CreateVersionRequest.releaseDate`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/versions/{versionId}:
    get:
      tags: [Versions]
      summary: Get a version
      description: >-
        Any project member. The progress counters are filled here too (the same
        grouped query as the list); `GET …/versions/{versionId}/usage` adds the
        unresolved-issue count the release/delete dialogs need.
      operationId: getVersion
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/versionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Versions]
      summary: Rename / describe / re-plan a version
      description: >-
        Same permission as the create/update endpoints above (built-in project
        `MANAGER`, or a workspace `OWNER`/`ADMIN` across their workspace).
        Partial — `null`/omitted fields are left unchanged. A pure casing change
        keeps the version's unique slot; any other rename onto a taken name
        (archived rows included) is a `409`. `releaseDate` is a nullable scalar:
        a date sets it and `clearReleaseDate: true` unsets it (the
        `assigneeId`/`clearAssignee` convention). The release lifecycle
        deliberately does **not** move through here — use `POST …/release` /
        `POST …/unrelease`.
      operationId: updateVersion
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/versionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVersionRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        '400':
          description: >-
            Blank name, a name longer than 60 characters after normalization, or
            a description over 500 characters.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ReleaseDateOutOfRange' }
    delete:
      tags: [Versions]
      summary: Delete a version
      description: >-
        Project curator only. A version still linked to issues (in **either**
        role) returns `409` unless you pass one of the two escape hatches:
        `force=true` deletes every one of its links, or `remapToId` re-points
        every link — **both** the fix and the affects ones — to another version
        of the same project. **When both are supplied `remapToId` wins**: it is
        the strictly more specific, non-destructive intent. A **released**
        version may be deleted, and `remapToId` may point at a released version
        (back-porting is legitimate bookkeeping) — unlike
        `moveUnresolvedToVersionId` on release, which insists on an unreleased
        target. No per-issue history is written (a delete can touch thousands of
        issues). Archiving is the recommended non-destructive alternative.
      operationId: deleteVersion
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/versionId'
        - name: force
          in: query
          description: >-
            Delete every fix/affects link to this version and then delete it.
            Ignored when `remapToId` is also given.
          schema: { type: boolean, default: false }
        - name: remapToId
          in: query
          description: >-
            Re-point every link of both roles to this version of the same
            project, then delete. Takes precedence over `force`.
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The version is linked to at least one issue and neither `force` nor
            `remapToId` was given (the message states the count), the project is
            archived, **or** a concurrent issue edit added the target version to
            one of the very issues being re-pointed, re-creating a link
            collision mid-remap. That last one is a retryable race, not a fault,
            and the delete is rolled back with it — the version is still there
            and its links are untouched.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            `remapToId` is the version being deleted, is unknown / belongs to
            another project ("Unknown version"), or is **archived**. A released
            target is allowed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/versions/{versionId}/release:
    post:
      tags: [Versions]
      summary: Release a version
      description: >-
        Project curator only. The request body is **optional** — a bare `POST`
        means "release it now, keeping the planned date". When neither the body
        nor the stored version carries a `releaseDate`, the server stamps
        **today** (server UTC date). Releasing a version that still has
        unresolved issues is **allowed on purpose**: a release with open work is
        a real, common state, and blocking it would only push teams to falsify
        the tracker. Optionally pass `moveUnresolvedToVersionId` to re-point the
        **fix** links of every issue in a non-DONE status to another version of
        the same project first; DONE issues stay on the released version. The
        flip is a conditional update, so releasing an already-released version
        is a `409` rather than a silent success — an idempotent-looking response
        would hide a double-click that runs the destructive move twice.
      operationId: releaseVersion
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/versionId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseVersionRequest' }
      responses:
        '200':
          description: 'Released — `released: true` and `releasedAt` stamped'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The version is already released, the project is archived, **or** a
            concurrent issue edit added the target version to one of the very
            issues being re-pointed, re-creating a link collision mid-remap.
            That last one is a retryable race, not a fault, and the release is
            rolled back with it — "nothing happened, try again", never a
            half-applied move.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            `moveUnresolvedToVersionId` is the version being released, is
            unknown / belongs to another project ("Unknown version"), is
            archived, or is **already released** — open work must never be moved
            onto a shipped release. Also returned for a `releaseDate` outside
            `1000-01-01`…`9999-12-31`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/versions/{versionId}/unrelease:
    post:
      tags: [Versions]
      summary: Un-release a version
      description: >-
        Project curator only. Clears `released` and `releasedAt` but
        **preserves `releaseDate`** (it goes back to being the plan), so the
        release → un-release round-trip loses nothing. Issues moved away by a
        `moveUnresolvedToVersionId` are **not** moved back — that was a separate,
        explicit action. Conditional like release: un-releasing something that
        is not released is a `409`, not a silent no-op.
      operationId: unreleaseVersion
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/versionId'
      responses:
        '200':
          description: 'Un-released — `released: false`, `releasedAt: null`, `releaseDate` kept'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The version is not released, or the project is archived
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/versions/{versionId}/archive:
    post:
      tags: [Versions]
      summary: Archive a version
      description: >-
        Project curator only. Always allowed, even while the version is in use,
        and orthogonal to `released` — archiving old shipped releases is how the
        Releases list stays short. The version leaves every picker and the
        default listing, existing links are kept (and reported with
        `archived: true` on the issue), it can no longer be linked to an issue
        (`422`), and it is reversible. The name slot stays reserved.
      operationId: archiveVersion
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/versionId'
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProjectArchived' }

  /workspaces/{workspaceId}/projects/{projectId}/versions/{versionId}/unarchive:
    post:
      tags: [Versions]
      summary: Restore an archived version
      description: >-
        Project curator only. The row already owns its unique name slot, so this
        can never conflict on the name.
      operationId: unarchiveVersion
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/versionId'
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProjectArchived' }

  /workspaces/{workspaceId}/projects/{projectId}/versions/{versionId}/usage:
    get:
      tags: [Versions]
      summary: How many issues a version is linked to
      description: >-
        Backs the delete-confirmation dialog and the "move N unresolved issues
        to →" prompt in the release dialog. Any project member.
        `unresolvedFixIssueCount` is exactly what `moveUnresolvedToVersionId`
        would move.
      operationId: versionUsage
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/versionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionUsageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/sprints:
    get:
      tags: [Sprints]
      summary: List the project's sprints
      description: >-
        Any project member; a missing workspace, a missing project or a
        non-member all give `404`, never `403`. **Always paginated** (default
        size 50): open sprints are capped, but `COMPLETED` ones accumulate for
        years. Ordering is `ACTIVE` first, then `FUTURE` by `sequence`
        ascending, then `COMPLETED` newest-first — the `page`/`size` parameters
        control the window, not the order. `state` is a **repeatable** filter
        (`?state=ACTIVE&state=FUTURE`); omitting it returns every state. The
        counters (`issueCount`, `doneIssueCount`, `points`, `donePoints`,
        `unestimatedCount`) are always filled — they cost one grouped query for
        the whole page, so there is nothing to opt out of.
      operationId: listSprints
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - name: state
          in: query
          description: >-
            Repeatable state filter (`?state=ACTIVE&state=FUTURE`); omitted =
            every state.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/SprintState' }
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
      responses:
        '200':
          description: OK — ACTIVE, then FUTURE by sequence, then COMPLETED newest-first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SprintResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Sprints]
      summary: Create a sprint
      description: >-
        Requires `component.manage` / `version.manage` / `sprint.manage` as
        applicable — granted by the built-in project `MANAGER` and, across every
        project of their workspace, by an `OWNER`/`ADMIN` of it (who need not be
        a project member); any other member gets a `403` naming the key. Everything in the body is
        optional: a blank/absent `name` becomes `"Sprint {sequence}"`, which is
        why default names can never collide. The name is normalized server-side
        (NFC, invisible control/format characters stripped, whitespace
        collapsed, max 60 characters after normalization) and is unique per
        **project**, case-insensitively, **completed sprints included** — a
        collision is a `409`.

        A sprint is always born `FUTURE`: `startAt`/`endAt` are only the plan,
        and starting it is the separate `POST …/start` call.
      operationId: createSprint
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSprintRequest' }
      responses:
        '201':
          description: 'Created — always `state: FUTURE`, all counters 0'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintResponse' }
        '400':
          description: >-
            A `name` that normalizes to blank or to more than 60 characters, or
            a `goal` over 500 characters.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SprintConflict' }
        '422':
          description: >-
            The project already holds `app.agile.max-open-sprints-per-project`
            (default 20) open sprints — complete or delete one first.
            `COMPLETED` sprints do not count toward that cap (they are history
            and can never be started again). Also returned for
            `endAt <= startAt`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/sprints/{sprintId}:
    get:
      tags: [Sprints]
      summary: Get a sprint
      description: >-
        Any project member. The counters are filled here too (the same grouped
        query as the list). A sprint id belonging to another project or another
        workspace is a `404` — only a *payload* `sprintId` (on issue create /
        update / rank) turns a foreign id into a `422`.
      operationId: getSprint
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sprintId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sprints]
      summary: Rename / re-goal / re-plan a sprint
      description: >-
        Project curator only. Partial — omitted fields are left unchanged.
        `startAt`/`endAt` are nullable scalars: a value sets them and
        `clearStartAt`/`clearEndAt` unset them (the
        `assigneeId`/`clearAssignee` convention). The **lifecycle deliberately
        does not move through here** — there is no `state` field, so a PATCH can
        neither start, complete nor re-open a sprint.


        `startAt` is editable **only while the sprint is still `FUTURE`**. Once
        it has started, its start date is the origin its reports are measured
        from: the scope it committed to is recorded against the original start,
        so moving the start afterwards would leave the two records disagreeing —
        pull it earlier and every recorded commitment sits *after* the new start,
        so "committed scope at start" reads `0`. Changing `startAt` on an
        `ACTIVE` or `COMPLETED` sprint is therefore a `422`; the recovery path
        for a wrong start is a new sprint, not an edit to a running one. An
        `ACTIVE` sprint must also keep a start date at all (`clearStartAt` on a
        running sprint is a `422`). Equality is by **instant, not by
        representation** — re-sending the same moment in another UTC offset
        (`09:00+02:00` vs `07:00Z`) is not an edit and is accepted, so a client
        may round-trip a sprint and PATCH it back unchanged.
      operationId: updateSprint
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sprintId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSprintRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintResponse' }
        '400':
          description: >-
            A `name` that normalizes to blank or to more than 60 characters, or
            a `goal` over 500 characters.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SprintConflict' }
        '422':
          description: >-
            The resulting dates are inconsistent (`endAt <= startAt`); an
            **ACTIVE** sprint would be left without a start date ("An active
            sprint must keep a start date"); or the request changes `startAt` on
            a sprint that is no longer `FUTURE` ("A sprint's start date can only
            be changed while it is still in the future") — a started sprint's
            start is the origin its reports are measured from, so it is frozen.
            Re-sending the same instant in a different UTC offset is not a change
            and is accepted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    delete:
      tags: [Sprints]
      summary: Delete a sprint
      description: >-
        Project curator only. An **ACTIVE** sprint is a `409` ("complete it
        first") — deleting a running commitment silently is never what anybody
        meant. A `FUTURE`/`COMPLETED` sprint that still holds issues is a `409`
        as well unless you pass `force=true`, which detaches the issues first
        (their **rank is preserved**, so they keep their relative place in the
        backlog they return to) and then deletes the sprint.
      operationId: deleteSprint
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sprintId'
        - name: force
          in: query
          description: >-
            Detach every issue still in the sprint (preserving their rank) and
            then delete it. Never allowed for an ACTIVE sprint.
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            The workspace, project or sprint was not found (or the caller is not
            a member) — **including** the case where another curator deleted the
            same sprint a moment earlier. The row is removed by a conditional
            delete, so the loser of that race gets this `404` rather than a
            `500`; the sprint is gone either way, so treat it as success.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: >-
            The sprint is ACTIVE (complete it first), it still holds issues and
            `force` was not given (the message states the count), or the project
            is archived.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/sprints/{sprintId}/start:
    post:
      tags: [Sprints]
      summary: Start a sprint
      description: >-
        Project curator only, `FUTURE` → `ACTIVE`. The request body is
        **optional** — a bare `POST` means "start it now and run it for
        `app.agile.default-sprint-length-days` (default 14) days". A `startAt`
        in the past is allowed on purpose (backfilling a sprint that actually
        began on Monday is normal); a `startAt` in the **future** is a `422` —
        starting is the act that turns a plan into history, and it cannot be
        dated ahead of now.

        Read that refusal together with the `startAt` freeze on
        `PATCH …/sprints/{sprintId}`: the two are one rule, and either one
        alone gives a wrong model of the endpoint. A forward-dated start writes
        a `startAt` that the sprint's own commitment record — stamped when the
        start actually happens — legitimately disagrees with, so a burn-up
        measured over the sprint's window reads a committed scope of `0`; the
        freeze then makes that wrong date **permanent**, recoverable only by
        completing the sprint and creating a new one. It also let a sprint be
        completed *before* it started, which the velocity report reads as a
        negative-length iteration.

        **The remedy is the one the message names**: leave the sprint planned
        until it actually begins. Planning a future start stays entirely legal
        — `POST …/sprints` and `PATCH …/sprints/{sprintId}` accept any date,
        and a `FUTURE` sprint's dates stay editable — and starting it stamps
        the start for you, so the date never has to be typed. A `startAt` up to
        five minutes ahead of the server's clock is not refused but **recorded
        as `now`** — the response echoes the clamped instant, not the one sent,
        so the sprint and the commitment records it is measured against always
        carry the same moment. The tolerance means "a slightly fast clock is
        now", never "a slightly future start is stored", and it is there for
        **unsynchronised client clocks, not policy** — not configurable, and
        far too small to express an intention.

        **At most one sprint per project may be active**, and that invariant is
        enforced by the database, not only in Java: starting a second one is a
        `409`, and so is a double-click on the same one. Starting an **empty**
        sprint is allowed — the UI warns, the API does not.
      operationId: startSprint
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sprintId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartSprintRequest' }
      responses:
        '200':
          description: 'Started — `state: ACTIVE`, `startAt`/`endAt` stamped'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintResponse' }
        '400':
          description: A `goal` over 500 characters.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The sprint is not `FUTURE` (already active, or completed — there is
            no re-open), **another sprint of this project is already active**,
            or the project is archived.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            `endAt <= startAt`, or a `startAt` in the **future** (more than the
            five-minute clock-skew tolerance ahead of the server) — leave the
            sprint planned and start it when it actually begins.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/sprints/{sprintId}/completion-preview:
    get:
      tags: [Sprints]
      summary: What completing this sprint would report
      description: >-
        The completion dialog's data source, so it never has to guess: the same
        counters the subsequent completion reports (off the same query — no
        drift), plus the `FUTURE` sprints the unfinished work may be carried
        over to. **Read-only and readable by any project member**, unlike the
        completion itself — looking at the numbers is not a commitment. An empty
        `targetCandidates` means the dialog must offer "create a sprint"
        instead.
      operationId: sprintCompletionPreview
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sprintId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintCompletionPreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/sprints/{sprintId}/complete:
    post:
      tags: [Sprints]
      summary: Complete a sprint
      description: >-
        Project curator only, `ACTIVE` → `COMPLETED`. **Terminal — there is no
        re-open**; the recovery path is to create a new sprint and move the
        issues back.

        Unlike `start` the body is **required**: the disposition of the
        unfinished work is a real decision, and defaulting it silently would
        move issues nobody asked to move. Every issue whose status category is
        **not DONE** moves to the chosen destination (the backlog, or a `FUTURE`
        sprint of the same project); **DONE issues keep their sprint** — that is
        the sprint's record of what it delivered. The rank is never rewritten,
        so carried-over items keep their relative order.

        Conditional like release: a double-click is a `409`, not an
        idempotent-looking success that would run the destructive move twice.
      operationId: completeSprint
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sprintId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteSprintRequest' }
      responses:
        '200':
          description: Completed — the done-vs-carried-over report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintCompletionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The sprint is not `ACTIVE` (already completed, or never started), or
            the project is archived.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            `moveUnfinishedTo: "SPRINT"` without a `targetSprintId`, or a target
            that is unknown, belongs to another project, is the sprint being
            completed, or is not `FUTURE`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/sprints/{sprintId}/issues:
    post:
      tags: [Sprints]
      summary: Put a batch of issues into the sprint
      description: >-
        Requires `sprint.assign` — deliberately separate from the
        lifecycle's `sprint.manage`, because filling a sprint is ordinary
        planning work the whole team does at a planning meeting. The same
        permission guards the other two doors into sprint membership
        (`PATCH …/issues/{number}` with `sprintId`/`clearSprint`, and
        `POST …/issues/{number}/rank` with a sprint change). Issues are
        addressed by **id** here. An issue already in this sprint is a silent
        no-op (no history entry, no `version` bump, no event); the others are
        re-ranked to the `TOP` or `BOTTOM` of the sprint's section, keeping
        their relative order among themselves. Assigning to the `ACTIVE` sprint
        mid-sprint is allowed — a scope change is a real event — but a
        `COMPLETED` sprint is a `422`.

        This call is also a **removal** path: an issue joining this sprint
        leaves whichever sprint it is in today, so a completed sprint's frozen
        membership applies here in both directions — a `422` if the **target**
        sprint is `COMPLETED`, and a `422` if **any** issue in `issueIds`
        currently belongs to a `COMPLETED` sprint. The whole batch is validated
        before anything moves, so that rejection is **atomic**: no issue in the
        request changes sprint or rank.

        Returns the sprint with its **refreshed** counters, so a client does not
        need a second round trip.
      operationId: addIssuesToSprint
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sprintId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddIssuesToSprintRequest' }
      responses:
        '200':
          description: OK — the sprint with refreshed counters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintResponse' }
        '400':
          description: >-
            An empty `issueIds`, or more than
            `app.agile.max-issues-per-bulk-move` (default 100) distinct ids
            after de-duplication — chunk the request. Over 500 entries is
            rejected at binding as a payload guard.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The project is archived
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            An issue id is unknown or belongs to another project ("Unknown
            issue" — never a `404`, which would confirm existence), the
            **target** sprint is `COMPLETED`, or **any** issue in `issueIds` is
            currently in a `COMPLETED` sprint (`"Sprint 'X' is completed"`,
            where `X` is that source sprint) — the same frozen-membership rule
            as `DELETE …/sprints/{id}/issues/{issueId}`. The batch is checked as
            a whole up front, so this rejection is **atomic**: no issue moves.
            An issue already in the target sprint is a no-op and is not checked.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/sprints/{sprintId}/issues/{issueId}:
    delete:
      tags: [Sprints]
      summary: Take one issue out of the sprint
      description: >-
        Requires `sprint.assign`, like the bulk add. The issue's **rank is
        preserved**, so it keeps its relative place in the backlog it returns
        to.

        **Idempotent:** removing an issue that is not in this sprint is a `204`
        as well, not a `404` — the endpoint expresses "this issue must not be in
        this sprint", which is already true, and a retried request must never
        surprise the client. An `issueId` that does not resolve **within the
        project** is still a `404`.

        A `COMPLETED` sprint's membership is **frozen** — the delivery record
        the completion already reported — so taking an issue out of one is a
        `422`. The idempotent `204` is checked **first**: an issue that is not
        in the sprint still returns `204`, completed or not.
      operationId: removeIssueFromSprint
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sprintId'
        - name: issueId
          in: path
          required: true
          description: The issue's **id** (not its project-scoped number)
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 'Removed — or already not in this sprint (idempotent)' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            The workspace, project or sprint was not found (or the caller is not
            a member), **or** the `issueId` does not resolve within this
            project.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: The project is archived
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            The sprint is `COMPLETED` and the issue **is** in it — its
            membership is a delivered fact and stays frozen. (An issue that is
            not in the sprint returns the idempotent `204` instead, because that
            check runs first.)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/backlog:
    get:
      tags: [Sprints]
      summary: The project's planning view
      description: >-
        One request returns every section the backlog screen renders: the
        project's **open** sprint sections (`ACTIVE` first, then `FUTURE` by
        `sequence`) above the rank-ordered backlog. Any project member may read
        it; a missing workspace, a missing project or a non-member all give
        `404`.

        The filter parameters are exactly the ones `GET …/issues` accepts and
        are all applied **server-side**, so filtering searches the whole project
        rather than the capped page already on screen. Each section is
        independently capped at `sectionCap`
        (`app.agile.section-max-issues`, default 300) and reports `truncated` /
        `totalAvailable` — while its `stats` are computed over the **whole**
        section, so a truncated section still shows honest totals.

        The response also carries `bulkMoveCap`
        (`app.agile.max-issues-per-bulk-move`, default 100) — the limit on ONE
        `POST …/sprints/{sprintId}/issues` call, which is a **different** knob
        from `sectionCap`. Chunk "move everything to…" actions at that number
        rather than hardcoding it or deriving it from `sectionCap`.

        Each section can also be re-fetched **on its own** under
        `…/backlog/sections/…`, which answers with that same section — same rows,
        same `truncated`, same whole-section `totalAvailable` and `stats` — plus
        these caps, and takes no page size either.


        Rows inside every section are in the shared rank order (`position`, then
        newest first), which is the same order the board uses.
      operationId: getBacklogView
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/planningStatusId'
        - $ref: '#/components/parameters/planningAssigneeId'
        - $ref: '#/components/parameters/planningPriorityId'
        - $ref: '#/components/parameters/planningComponentId'
        - $ref: '#/components/parameters/planningLabelId'
        - $ref: '#/components/parameters/planningLabelMatch'
        - $ref: '#/components/parameters/planningFixVersionId'
        - $ref: '#/components/parameters/planningIncludeDone'
      responses:
        '200':
          description: OK — sprint sections (ACTIVE first) plus the backlog section
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacklogViewResponse' }
        '400':
          description: >-
            Unknown `labelMatch` value, or more than
            `app.classification.max-labels-per-issue` distinct `labelId` values.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/backlog/sections/backlog:
    get:
      tags: [Sprints]
      summary: One planning section — the backlog
      description: >-
        The backlog section of the planning view (`GET …/backlog`) on its own,
        for a client refreshing a section it already rendered — after a rank
        move, a sprint assignment or a manual refresh — without refetching every
        other section with it.


        **The answer is field-for-field the section the aggregate returns** for
        the same project and the same filters: the same rows in the same rank
        order, the same `truncated`, the same `totalAvailable` and every `stats`
        field, plus the caps the view carries at its top level (`sectionCap`,
        `bulkMoveCap`). A refreshed section can therefore be patched into a
        cached view without translating anything, and a section obtained either
        way carries the same guarantees. The response schema
        (`BacklogSectionResponse`) is built from the aggregate's own section
        shape rather than restating it.


        **There is no `page` and no `size` parameter, and that absence is the
        contract.** A section is bounded by `sectionCap`
        (`app.agile.section-max-issues`) — a number the server owns and
        publishes on every planning response, and one a client never sends back.
        With no size on the wire there is nothing for a client to hold, nothing
        to echo back and nothing to narrow, so the behaviour holds unchanged
        when an operator retunes that cap in either direction: the refresh
        simply carries the new value. Fetching a section through the paginated
        issue list instead makes the answer depend on a page size and changes
        what `truncated` describes — there it is measured against the page you
        received, here against the section — which is why a planning read takes
        no page size.


        **`truncated` means the section holds more matching issues than
        `sectionCap`**, and `totalAvailable` and every `stats` figure are
        computed over the **whole** section, filters applied, never over the rows
        returned. A truncated section still shows honest totals.


        Every filter the aggregate accepts is accepted here, `includeDone`
        included: a refresh that took a different set would answer a different
        question than the render did.


        **Throttle: none, as parity with the aggregate rather than as an
        omission.** No planning read carries a per-principal budget — a budget
        is earned by the work a handler does, not by where it is mounted, and
        refusing a section fetch would only push the client onto the whole-view
        refetch, which runs the same aggregation and ships every section's rows
        with it.
      operationId: getBacklogSection
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/planningStatusId'
        - $ref: '#/components/parameters/planningAssigneeId'
        - $ref: '#/components/parameters/planningPriorityId'
        - $ref: '#/components/parameters/planningComponentId'
        - $ref: '#/components/parameters/planningLabelId'
        - $ref: '#/components/parameters/planningLabelMatch'
        - $ref: '#/components/parameters/planningFixVersionId'
        - $ref: '#/components/parameters/planningIncludeDone'
      responses:
        '200':
          description: >-
            OK — the backlog section, possibly empty, possibly truncated. An
            empty section is a `200` with `issues: []`, `truncated: false`,
            `totalAvailable: 0` and zeroed `stats`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacklogSectionResponse' }
        '400':
          description: >-
            Unknown `labelMatch` value, or more than
            `app.classification.max-labels-per-issue` distinct `labelId` values.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/projects/{projectId}/backlog/sections/{sprintId}:
    get:
      tags: [Sprints]
      summary: One planning section — a sprint
      description: >-
        One sprint's section of the planning view on its own, under the same
        contract as the backlog section beside it: field-for-field what the
        aggregate returns for that section, plus the view's two caps, the same
        meaning of `truncated` (more matching issues in the section than
        `sectionCap`), whole-section `totalAvailable` and `stats` — and **no
        `page` and no `size`**, because a section is bounded by the server's
        `sectionCap`, which travels on the response and is never sent back.


        The sprint is resolved **through the project**, so a sprint id belonging
        to a sibling project in the same workspace is a `404` rather than an
        answer; a malformed one is a `400` at binding, before the handler runs.
        The path segment is never ambiguous: `backlog` is a literal and a sprint
        id is a UUID.


        **A `COMPLETED` sprint answers `200`.** It drops out of the aggregate,
        which lists open sprints, so the client's next full refetch removes the
        section — but a refresh already in flight must not turn into a `404` or
        a `409`: state does not change a status code here. A sprint deleted in
        the meantime is a `404`, which a client should read as "this section is
        gone" and recover from by refetching the view.


        No `includeDone`: it applies to the backlog section only, here as in the
        aggregate, because a sprint's DONE issues are its record of what it
        delivered. Every other filter the aggregate accepts is accepted here.
      operationId: getBacklogSprintSection
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sprintId'
        - $ref: '#/components/parameters/planningStatusId'
        - $ref: '#/components/parameters/planningAssigneeId'
        - $ref: '#/components/parameters/planningPriorityId'
        - $ref: '#/components/parameters/planningComponentId'
        - $ref: '#/components/parameters/planningLabelId'
        - $ref: '#/components/parameters/planningLabelMatch'
        - $ref: '#/components/parameters/planningFixVersionId'
      responses:
        '200':
          description: >-
            OK — the sprint's section, possibly empty, possibly truncated, with
            `sprint` carrying the sprint and its filter-aware counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacklogSectionResponse' }
        '400':
          description: >-
            Malformed `sprintId`, unknown `labelMatch` value, or more than
            `app.classification.max-labels-per-issue` distinct `labelId` values.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: >-
            Not found — or not a member of the containing workspace. The
            workspace, the project, the sprint and the caller's membership are
            deliberately **indistinguishable** here: a sprint of another project
            or of another tenant reads exactly like an unknown one.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /workspaces/{workspaceId}/projects/{projectId}/reports/flow:
    get:
      tags: [Reports]
      summary: Flow — created vs resolved over a window
      description: >-
        Two series over a window — issues **created** per bucket and issues
        **resolved** per bucket — plus the open-count line at each bucket's end
        and the three window totals (`created`, `resolved`, `net`). Any project
        member may read it; a missing workspace, a missing project, a project in
        another workspace and a non-member all give `404`, never `403`.


        **Every parameter is optional.** No parameters at all means *the last 90
        days, weekly, unfiltered*: `to` defaults to today in UTC, `interval` to
        `WEEK`, and `from` to **`min(90, app.reports.max-window-days)` days**
        before `to` inclusive of both endpoints — the default window is derived
        from the cap so that the endpoint's own default request can never be
        refused by the endpoint's own cap (an operator running
        `REPORTS_MAX_WINDOW_DAYS=30` still gets a served parameterless call).
        That is **defaulting, not clamping**: a caller who *sends* an over-cap
        window still gets the `400`, because nothing you asked for is ever
        narrowed for you. The window is echoed back exactly as requested, so
        `from`/`to` in the response are always the caller's own numbers.


        **Buckets are not snapped to bucket boundaries.** Bucket starts are UTC
        `date_trunc` boundaries (ISO weeks, so a `WEEK` bucket starts on a
        Monday), and a window that does not begin on one opens with a bucket
        dated *before* `from`. That first bucket — and symmetrically the last —
        is **partial**: it counts only what happened inside the requested
        window, so its bar is legitimately shorter than a full week's and must
        not be read as a drop. The alternative, snapping the window outwards,
        would answer a different question than the one asked. Each bucket says so
        itself via `partial`, which is **authoritative — do not re-derive it in
        the client**: computing it browser-side means a second implementation of
        Monday truncation, and the moment the two disagree the chart annotates
        the wrong bar.


        Buckets are **zero-filled**: a bucket in which nothing happened is
        present with zeros rather than absent, so the series never has invisible
        gaps.


        **What `resolved` means, and why past numbers can move.** The series come
        from `issues.created_at` and `issues.closed_at` and from nothing else —
        there is no resolution-event history. `closed_at` is *cleared* when an
        issue leaves a DONE status, so `resolved` reads "issues that are closed
        **now**, dated by their most recent closure": reopening an issue removes
        it from the bucket it used to occupy, and reclosing it puts it in a new
        one. `openAtEnd` inherits the same caveat. This is a disclosed
        limitation, not a defect, and clients are expected to footnote it.


        **`truncated` is always `false` here.** The report aggregates inside
        PostgreSQL and materialises at most one row per bucket, so
        `app.reports.max-rows` physically cannot bite on this endpoint. `cap` is
        still reported, because a client must never have to guess which budget a
        report was measured against — and the row-level reports that follow
        return the same block and *do* truncate.


        **An empty chart is never ambiguous.** `meta.unmatchedFilters` names any
        of `typeId` / `componentId` / `labelId` that matched **no issue in this
        project at all**, so a typo'd or stale filter id cannot render a
        complete, plausible, all-zero chart indistinguishable from a genuinely
        quiet quarter. `meta.firstIssueAt` states how far this chart's own
        history reaches — and it is filtered like everything else in the
        response, so with `typeId` set it is the first issue *of that type*, not
        the project's age.
      operationId: getFlowReport
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - name: from
          in: query
          description: >-
            First day of the window, **inclusive**, as an ISO date interpreted
            in UTC. Defaults to `min(90, app.reports.max-window-days)` days
            before `to`, counting both endpoints. An unparseable value, or one
            outside the supported band `1970-01-01`…`2200-12-31`, is a `400`.
          schema: { type: string, format: date, example: 2026-05-21 }
        - name: to
          in: query
          description: >-
            Last day of the window, **inclusive**. Defaults to today in UTC.
            `from=X&to=X` is one whole UTC day, not an empty range. Same
            `1970-01-01`…`2200-12-31` band as `from`.
          schema: { type: string, format: date, example: 2026-08-19 }
        - name: interval
          in: query
          description: >-
            Bucket width. Weeks start on **Monday** (ISO-8601) and are not
            configurable. An unknown value is a `400`.
          schema: { $ref: '#/components/schemas/ReportInterval' }
        - name: typeId
          in: query
          description: >-
            Narrow to one issue type. An id that does not exist — or belongs to
            another project or tenant — **matches nothing and yields an empty
            series**; it is never a `404` or a `422`. The queries are
            project-scoped first, so an unknown filter can only ever narrow, and
            answering differently would make this endpoint an existence oracle
            for another tenant's taxonomy. This is deliberately the opposite of
            how a request-supplied id behaves elsewhere on this API. What you get
            instead is a disclosure: a filter that matched nothing is named in
            `meta.unmatchedFilters`.
          schema: { type: string, format: uuid }
        - name: componentId
          in: query
          description: Narrow to one component. Same "unknown id narrows to empty" rule as `typeId`.
          schema: { type: string, format: uuid }
        - name: labelId
          in: query
          description: >-
            Narrow to issues carrying this label. Same "unknown id narrows to
            empty" rule as `typeId`. A multi-label issue is still counted once.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK — the zero-filled series, the window totals and the shared `meta` block
          headers:
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowReportResponse' }
        '400': { $ref: '#/components/responses/ReportWindowRejected' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/ReportThrottled' }

  /workspaces/{workspaceId}/projects/{projectId}/reports/flow.csv:
    get:
      tags: [Reports]
      summary: Flow — the plotted series as CSV
      description: >-
        The CSV export of `GET …/reports/flow` — **one row per bucket**, exactly
        the bars that were drawn, zero-filled and `partial`-flagged as on screen.


        Every parameter, default, refusal and status code is that endpoint's:
        this handler delegates to the same service, and being a download changes
        none of them. The file's structure, its comment header and its cell
        conventions are the family's — the `ReportCsvFile` schema documents them
        once for all six exports.


        Header lines specific to this report: `# Window`, `# Interval`,
        `# Totals` (created / resolved / net), a note explaining `partial` when
        any bucket carries it, and `# Filters that matched nothing` when a filter
        matched nothing — so a thin file is never mistaken for a quiet quarter.
      operationId: getFlowReportCsv
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/reportCsvFrom'
        - $ref: '#/components/parameters/reportCsvTo'
        - $ref: '#/components/parameters/reportCsvInterval'
        - $ref: '#/components/parameters/reportCsvTypeId'
        - $ref: '#/components/parameters/reportCsvComponentId'
        - $ref: '#/components/parameters/reportCsvLabelId'
      responses:
        '200':
          description: >-
            The file. Columns: `date`, `created`, `resolved`, `openAtEnd`,
            `partial`.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ReportCsvDisposition' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            text/csv:
              schema: { $ref: '#/components/schemas/ReportCsvFile' }
        '400': { $ref: '#/components/responses/ReportWindowRejected' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/ReportCsvNotAcceptable' }
        '429': { $ref: '#/components/responses/ReportThrottled' }
  /workspaces/{workspaceId}/projects/{projectId}/reports/cycle-time:
    get:
      tags: [Reports]
      summary: Cycle time — how long finished work took
      description: >-
        The finished-work half of the cycle time page: one entry per issue
        **completed inside the window**, plus the p50/p85 of both measures.
        Access, caching, the `meta` block, the window rules and the throttle are
        the family's — see the `Reports` tag; only what is specific to this
        report is stated here.


        **The window is a range on `closed_at`.** An issue created two years ago
        and closed yesterday is in yesterday's report; an issue created inside
        the window and still open is in no report here at all. That is the only
        reading under which the x-axis (completion date) *is* the window.
        Parameters are optional and default exactly as `/flow`'s do — no
        parameters means *the last 90 days, unfiltered*, with `from` derived
        from `min(90, app.reports.max-window-days)`. The window arithmetic and
        both refusals are literally the same implementation as `/flow`'s
        (`ReportWindow`), messages included, so a client that handles one
        handles the other.


        **The honesty rule: cycle time is defined only for issues that have a
        recorded start.** `startedAt` arrived in an earlier slice and was
        backfilled best-effort (the backfill matches history rows to statuses by
        display *name*, so a renamed status is invisible to it, and an issue
        filed directly into an in-progress status wrote no history row at all),
        so a project with history has completed issues with no start. Those
        issues carry `cycleDays: null` — not `0`, not the lead time — and
        contribute to `leadDays`, to `sampleSize` and to `missingStartCount`,
        and to nothing else. **`created_at` is never substituted for a missing
        `started_at`**: that single substitution would turn this into a
        lead-time report wearing the label "cycle time", move the p85 that
        `/aging` draws across its columns, and say so nowhere. Surface
        `missingStartCount` — "cycle time available for 812 of 940 completed
        issues" is the sentence it exists for.


        **Percentiles are suppressed below five samples, per measure,
        independently.** `percentiles.cycle` and `percentiles.lead` are computed
        over *different* sets — `sampleSize - missingStartCount` and
        `sampleSize` — which on an upgraded install differ wildly, so one may be
        suppressed while the other is not. Suppression is `null`s **inside** the
        pair; the containers `percentiles`, `percentiles.cycle` and
        `percentiles.lead` are **always present**, so read
        `percentiles.cycle.p50 == null` and never code for a missing object.


        **The lines describe the whole matching set even when the dots are
        truncated.** Percentiles are aggregates computed by PostgreSQL over
        every matching issue, not over the page that survived `meta.cap`; a p85
        over "the most recent 20 000" would be a different statistic wearing the
        same label. So `sampleSize` versus `items.length` — not `meta.truncated`
        alone — is what tells a client it is drawing a subset, and **what
        survives truncation is the most recent work** (`items` are ordered most
        recently closed first). A client that assumes the other end draws a
        wrong chart from a correct response.
      operationId: getCycleTimeReport
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - name: from
          in: query
          description: >-
            First day of the window, **inclusive**, as an ISO date interpreted
            in UTC — a bound on `closed_at`. Defaults to
            `min(90, app.reports.max-window-days)` days before `to`, counting
            both endpoints. An unparseable value, or one outside the supported
            band `1970-01-01`…`2200-12-31`, is a `400`.
          schema: { type: string, format: date, example: 2026-05-21 }
        - name: to
          in: query
          description: >-
            Last day of the window, **inclusive**. Defaults to today in UTC.
            `from=X&to=X` is one whole UTC day, not an empty range. Same
            `1970-01-01`…`2200-12-31` band as `from`.
          schema: { type: string, format: date, example: 2026-08-19 }
        - name: typeId
          in: query
          description: >-
            Narrow to one issue type. Filters here are **predicates, not
            addressed resources**: an id that does not exist — or belongs to
            another project or tenant — matches nothing and yields an empty
            `items` with `200`, never a `404` or a `422`, exactly as on `/flow`.
            A filter that matched nothing is named in `meta.unmatchedFilters`.
          schema: { type: string, format: uuid }
        - name: componentId
          in: query
          description: Narrow to one component. Same "unknown id narrows to empty" rule as `typeId`.
          schema: { type: string, format: uuid }
        - name: labelId
          in: query
          description: >-
            Narrow to issues carrying this label. Same "unknown id narrows to
            empty" rule as `typeId`. A multi-label issue is counted once — and
            counted once in the percentiles too, which a join instead of an
            `EXISTS` would have skewed toward the most-labelled issues.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK — the dots, both percentile pairs, the two counts and the shared `meta` block
          headers:
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CycleTimeReportResponse' }
        '400': { $ref: '#/components/responses/ReportWindowRejected' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/ReportThrottled' }

  /workspaces/{workspaceId}/projects/{projectId}/reports/cycle-time.csv:
    get:
      tags: [Reports]
      summary: Cycle time — the plotted series as CSV
      description: >-
        The CSV export of `GET …/reports/cycle-time` — **one row per plotted
        point**, which here is one row per completed issue, because the chart is
        a scatter plot *of issues*. That is not the flat-issue-list mistake: the
        plotted value is `cycleDays` / `leadDays`, and `key` and `title` are
        there to identify the dot a reader is pointing at. No description, no
        status history, no components — the columns an issue export would carry
        and a chart does not plot.


        Every parameter, default, refusal and status code is the JSON endpoint's;
        see the `ReportCsvFile` schema for the file's shared structure.


        **`cycleDays` is empty for an issue with no recorded start** — never
        backfilled from `created_at`, exactly as in JSON — and the header counts
        those rows in `# Completed issues with no start` and explains the gap.
        The percentile pairs are in the header, or the reason each was
        suppressed.
      operationId: getCycleTimeReportCsv
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/reportCsvFrom'
        - $ref: '#/components/parameters/reportCsvTo'
        - $ref: '#/components/parameters/reportCsvTypeId'
        - $ref: '#/components/parameters/reportCsvComponentId'
        - $ref: '#/components/parameters/reportCsvLabelId'
      responses:
        '200':
          description: >-
            The file. Columns: `issueId`, `key`, `title`, `typeId`, `startedAt`,
            `closedAt`, `cycleDays`, `leadDays`.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ReportCsvDisposition' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            text/csv:
              schema: { $ref: '#/components/schemas/ReportCsvFile' }
        '400': { $ref: '#/components/responses/ReportWindowRejected' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/ReportCsvNotAcceptable' }
        '429': { $ref: '#/components/responses/ReportThrottled' }
  /workspaces/{workspaceId}/projects/{projectId}/reports/aging:
    get:
      tags: [Reports]
      summary: Aging work in progress — which open item is rotting right now
      description: >-
        The unfinished-work half of the cycle time page: one column per non-DONE
        status of the project's effective workflow, each holding its open issues
        **oldest first**, with a cycle-time p50/p85 to draw across them. Access,
        caching, the `meta` block and the throttle are the family's — see the
        `Reports` tag.


        **No parameters, and no window — deliberately.** "Which open item is
        rotting *right now*" is a question about current state: a window on it
        would be meaningless (every open issue is open today) or actively
        misleading (a window on `created_at` hides exactly the oldest items,
        which are the entire point). This is therefore **the one endpoint on
        this base path whose *question* takes no input, so it has **no `400` of
        its own** (its `.csv` sibling inherits that): it validates nothing, because
        there is nothing here for a caller to state wrongly, and a stray query
        parameter is ignored rather than refused. Its failures are `401`, `404`
        and `429` — plus the two that belong to every endpoint rather than to
        this one: a `400` from binding a malformed path UUID, and a `500` on an
        install with no system default workflow.


        **"Open" is `status.category <> DONE`** — the same question the columns
        are keyed on — and not `closed_at IS NULL`. The two agree today only
        because the application maintains that invariant; asking the category
        keeps an issue from being in the report but in no column, or the
        reverse.


        **An issue whose status has left the workflow is not dropped.** Statuses
        gate *transitions*, not existing rows, so a workflow swap strands
        whatever was mid-flight. Those issues arrive in a single trailing column
        with `statusId: null`, `category: null` and the name
        `"Not on this board"`. **A client must render that column**: a report
        whose purpose is to name the item nobody is looking at must not begin by
        hiding the items nobody is looking at. Empty columns are present too — a
        status nobody is in is a fact about the board, and a report that draws
        only the columns it found rows for redraws its own axis every day.


        **`ageDays` falls back to `created_at` when there is no `started_at`,
        and the asymmetry with `/cycle-time` is deliberate.** Cycle time
        measures finished work, where substituting filing time for start time
        produces a number that is simply wrong. Age asks how long something has
        been waiting, and "filed 40 days ago, never picked up" is a true,
        useful and materially *different* fact from "in progress for 40 days".
        Both belong on this board, so `ageDays` is never `null` and the nullable
        `startedAt` is returned beside it precisely so a reader can tell the two
        apart.


        **The percentile lines belong to the other half, and are deliberately
        unwindowed.** `percentiles` here is the **cycle time** p50/p85 of this
        project's *whole completed history* — not a window, and not the measure
        the reader toggled. That is what makes the report actionable: an item
        past the p85 line is visibly older than 85% of everything the team has
        ever finished, a statement in the team's own units with no target, no
        SLA and nothing configured. The same two field names therefore mean
        different things on `/cycle-time` (that request's window, one pair per
        measure) and here (all time, cycle only) — a client showing both must
        not label them alike. Suppression is the family's: below five completed
        issues *with a start* the pair is `null`s, the columns still render (the
        lines are an overlay, not a precondition), and a project whose history
        predates the `started_at` backfill can legitimately have full columns and
        no lines.


        **The lines are served from a 60-second per-project snapshot; the columns
        never are.** Their aggregate is the one statement in this feature bounded
        by nothing the caller can narrow — no window, no cap, and it grows for the
        life of the project — so it runs at most once per project per minute per
        node. The claim is unchanged (the pass still covers the whole history when
        it runs) and the staleness is one this response already advertises with
        `Cache-Control: max-age=60`; a reference line drawn from years of history
        does not visibly move in a minute. The open half — the columns, the items
        and `meta.basedOnIssues` — is computed live on every request, because a
        minute-old count printed above a live item list is exactly the "these
        numbers don't match" failure the `meta` block exists to prevent.


        **Truncation keeps the oldest.** Open issues are ordered oldest-first
        **project-wide** and the cap is applied to that single ordering *before*
        the rows are grouped into columns, so what survives is the aging end of
        the whole queue — the opposite end from `/cycle-time`'s, and the right one
        for each; a truncated response thins the freshest items out of every
        column at once rather than trimming each column separately.
        `meta.basedOnIssues` is how many open issues the report was *about*,
        which when `meta.truncated` is larger than the number of items shipped.
      operationId: getAgingReport
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK — the columns, the lifetime cycle-time lines and the shared `meta` block
          headers:
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgingReportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/ReportThrottled' }

  /workspaces/{workspaceId}/projects/{projectId}/reports/aging.csv:
    get:
      tags: [Reports]
      summary: Aging WIP — the plotted series as CSV
      description: >-
        The CSV export of `GET …/reports/aging` — **the columns flattened, one
        row per open issue, each carrying the column it sits in**. Same
        scatter-plot-of-issues reasoning as `cycle-time.csv`: the plotted value
        is `ageDays`, and the key and title identify the dot.


        Takes **no parameters**, exactly as the JSON does — a current-state
        report has no window to state, and the header says so in as many words
        rather than leaving a blank `# Window` line to be read as an omission.


        The `# Cycle time percentiles` lines are the project's **completed**
        work, drawn as reference lines across the columns; the header states
        explicitly that they are *not* computed from the open issues in the file,
        because that is the natural wrong reading of a file containing only open
        issues. An empty trailing column name means the "Not on this board"
        column, whose `statusId` is empty.
      operationId: getAgingReportCsv
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: >-
            The file. Columns: `statusId`, `status`, `category`, `issueId`,
            `key`, `title`, `ageDays`, `assigneeId`, `startedAt`.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ReportCsvDisposition' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            text/csv:
              schema: { $ref: '#/components/schemas/ReportCsvFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/ReportCsvNotAcceptable' }
        '429': { $ref: '#/components/responses/ReportThrottled' }
  /workspaces/{workspaceId}/projects/{projectId}/reports/sprint-burnup:
    get:
      tags: [Reports]
      summary: Sprint burn-up — will this sprint land, and what happened to the plan
      description: >-
        Two lines over one sprint's days — **scope** (how much work was in the
        sprint at the end of each UTC day) and **completed** (how much of that
        was closed by then) — plus `scopeChanges`, the log that explains every
        step in the first of them. Access, caching, the `meta` block and the
        throttle are the family's; see the `Reports` tag.


        The client draws the faint ideal guide itself, from `(startAt, 0)` to
        `(endAt, committedAtStart)` — **to the COMMITTED scope, not the current
        one**. That is what makes it a guide rather than a verdict: a sprint that
        took work on sits above its guide, which is information, not failure.
        Regenerating the guide against today's scope would make every sprint look
        on-plan.


        **`sprintId` is the report's SUBJECT, not a filter — the opposite of how
        `/flow` and `/cycle-time` treat `typeId`.** It defaults to the project's
        **ACTIVE** sprint (a project has at most one, enforced in the database,
        so the default is unambiguous). A `sprintId` that names a sprint in
        **another** project or tenant resolves to nothing and is a `404`, exactly
        as one that never existed — because a subject is an addressed resource,
        while a filter is a predicate applied inside an already project-scoped
        statement where an unknown id can only subtract. Opposite rules on one
        base path, both load-bearing: getting either backwards produces a
        plausible, wrong report.


        **No ACTIVE sprint is a `200` with `sprint: null`, not a `404`.** The
        caller asked a well-formed question about a project they can see, and
        "there is no sprint running" is an answer. A `404` there would be
        indistinguishable from the `404` above — leaving a client unable to tell
        a project between sprints from a bad id — and it would leave the empty
        state with no body to render. A sprint that exists but has never started
        answers the same way with its `sprint` populated: `startAt: null`, an
        empty `series` and `committedAtStart: 0`, because commitment is an event
        and it has not happened yet.


        **Points here are each issue's CURRENT estimate — and the sprint
        review's are not. Both are deliberate; do not "fix" either to match the
        other.** Under `measure=POINTS` this report weighs every issue by
        `issues.story_points` **as it stands today**, so a re-estimate moves the
        whole scope line *including its past*: a chart read yesterday can
        legitimately look different today, and a client should footnote it
        ("Points reflect current estimates"). The alternative is not buildable —
        the ledger writes a row only on a membership change, so a per-day
        estimate history does not exist and cannot be reconstructed.
        `/sprint-review` reads the ledger's entry **snapshot** instead, because
        the retrospective question is *what did this weigh when it entered*.
        Each is wrong for the other's question. The one exception is inherited
        rather than chosen: a **deleted** issue has no current estimate, so it is
        weighed by its snapshot — the only number left.


        **Scope change is membership change only.** The line steps up on an add
        and down on a remove, and on nothing else — **a re-estimate is never a
        scope event and never appears in `scopeChanges`**, because the ledger
        writes no row for one. That single rule is what makes this a burn-up
        worth trusting rather than a burndown: every step in the line has a
        timestamp, an issue and (for a live issue) an author.


        **The commitment is not a change.** The `ADDED` rows a sprint's start
        writes are all stamped exactly `startAt`; they are reported as
        `committedAtStart` and as the height of the first point, and are
        deliberately **not** listed in `scopeChanges`, which would otherwise bury
        four real changes under twenty-three rows saying "the sprint started".
        Only events strictly after `startAt` are changes.


        **The line ends where it ends.** The last point is today for a running
        sprint and the **completion instant** for a finished one — not the
        planned `endAt`, and not the end of the completion's calendar day
        (measuring at the following midnight would put the completion's own
        carry-out removals inside the last point, so every completed sprint would
        render as having delivered 100% of its final scope — a chart that cannot
        show a miss). There is **no projection**: no "at this rate you finish
        Thursday". Forecasting is a later slice, with a stated sample size. A
        sprint that overran is drawn to today and its guide simply ends earlier
        than its lines do.


        **A deleted issue still appears**, rendered from the ledger's snapshot —
        see `ScopeChange`. It keeps its steps, its instant, its direction and its
        `key`, and reports `issueId: null` **and** `actorId: null`. Render it as
        a real, unlinked entry; dropping it would silently rewrite what the
        sprint held.


        **No status code here depends on a delivery capability.** A `KANBAN`
        project's sprint answers exactly as a `SCRUM` project's does, and
        `measure=POINTS` returns a points series in a project whose `estimation`
        is `false`. The UI hides those controls; the API hides nothing.
      operationId: getSprintBurnupReport
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - name: sprintId
          in: query
          description: >-
            The sprint to report on. Defaults to the project's **ACTIVE**
            sprint; when the project has none the answer is a `200` with
            `sprint: null`. **A subject, not a filter**: an id that does not
            resolve inside this project — including one from another project or
            tenant — is a `404`, not an empty chart. An id that is not a UUID at
            all is a `400` instead: it fails while Spring binds the parameter,
            before the handler runs, and a malformed id names no resource, so
            there is no existence for it to confirm.
          schema: { type: string, format: uuid }
        - name: measure
          in: query
          description: >-
            What the two lines count. Defaults to `COUNT`, the measure every
            project has whether or not it estimates. Echoed back in the response
            so a client can never mislabel a chart it did not explicitly
            parameterise. An unknown value is a `400`.
          schema: { $ref: '#/components/schemas/ReportMeasure' }
      responses:
        '200':
          description: >-
            OK — the day series, the scope-change log, the commitment anchor and
            the shared `meta` block. Also the answer when the project has no
            ACTIVE sprint (`sprint: null`, empty series).
          headers:
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintBurnupResponse' }
        '400':
          description: >-
            An unknown `measure` value, or a `sprintId` (or path id) that is not
            a UUID — the latter raised while binding, before the handler runs, on
            every endpoint of this API alike.


            This report takes **no window**, so none of the window refusals of
            `/flow` and `/cycle-time` apply to it: a sprint longer than
            `app.reports.max-window-days` is clipped and disclosed with
            `seriesTruncatedAt`, never refused. The caller stated no window here
            — the sprint did — so there is nothing for them to correct, and
            refusing would leave a legitimately long sprint with no chart at all.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ReportSprintNotFound' }
        '429': { $ref: '#/components/responses/ReportThrottled' }

  /workspaces/{workspaceId}/projects/{projectId}/reports/sprint-burnup.csv:
    get:
      tags: [Reports]
      summary: Sprint burn-up — the plotted series as CSV
      description: >-
        The CSV export of `GET …/reports/sprint-burnup` — **one row per UTC day,
        `scope` and `completed`**: the two lines, and nothing else.


        **The scope-change log is deliberately not folded in.** It is a different
        shape from a day series, and two tables in one CSV is a file no
        spreadsheet opens correctly. The header states how many scope changes
        there were and points at the JSON endpoint for them, so a reader is told
        what is missing rather than left to notice.


        Every parameter, default, refusal and status code is the JSON endpoint's;
        see the `ReportCsvFile` schema for the file's shared structure.


        **No ACTIVE sprint is a `200`, not an error** — the header carries a
        `# No sprint:` note explaining that this project has none and none was
        named, and the file has zero data rows. An unexplained empty CSV would
        recreate exactly the ambiguity the JSON endpoint avoids by answering
        `sprint: null` instead of `404`. Other report-specific header lines:
        `# Measure`, `# Committed at start`, `# Issues in scope with no estimate`
        (with a note on why a POINTS line can sit below a COUNT line), and
        `# Series truncated at` when the day series was clipped.
      operationId: getSprintBurnupReportCsv
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/reportCsvSprintId'
        - $ref: '#/components/parameters/reportCsvMeasure'
      responses:
        '200':
          description: >-
            The file. Columns: `date`, `scope`, `completed`. Zero data rows when
            the project has no ACTIVE sprint and none was named.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ReportCsvDisposition' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            text/csv:
              schema: { $ref: '#/components/schemas/ReportCsvFile' }
        '400':
          description: >-
            Same as the JSON sibling — an unknown `measure`, or a `sprintId` or
            path id that will not bind. This report takes no window, so none of
            the window refusals apply.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ReportSprintNotFound' }
        '406': { $ref: '#/components/responses/ReportCsvNotAcceptable' }
        '429': { $ref: '#/components/responses/ReportThrottled' }
  /workspaces/{workspaceId}/projects/{projectId}/reports/sprint-review:
    get:
      tags: [Reports]
      summary: Sprint review — committed, added, removed, completed, carried over
      description: >-
        The retro record, and **not a chart**: five labelled lists of issue rows,
        each with a count, a point sum and an unestimated count, plus one header
        line's worth of `totals`. Access, caching, the `meta` block and the
        throttle are the family's; see the `Reports` tag.


        Subject resolution is the burn-up's exactly: `sprintId` defaults to the
        project's **ACTIVE** sprint, no ACTIVE sprint is a `200` with
        `sprint: null` and five empty lists, and a `sprintId` that does not
        resolve inside this project is a `404` — a subject, never a filter.
        There is **no `measure` parameter**: this report reports counts *and*
        points for every list, so there is nothing to toggle.


        **Points here are the ledger's entry SNAPSHOT — the opposite of the
        burn-up beside it, on purpose.** Every point value in this response is
        what the issue weighed **when it entered this sprint**, never today's
        estimate. The retrospective question is what the team took on, and an
        issue re-pointed from 3 to 8 after the sprint ended would otherwise
        retroactively rewrite the commitment — the one number a retro exists to
        look at honestly. `/sprint-burnup` reads current points because it asks a
        live question. State the two together, or one will be reported as a bug
        against the other. Consequently **every number in this response is stable
        for a COMPLETED sprint**: the ledger is append-only and id-keyed, so the
        record survives renames, re-estimates and the deletion of the issues
        themselves.


        **The sprint's end is when it was COMPLETED, not when it was planned to
        end.** Every "before the end" boundary here is `completedAt` for a
        finished sprint and the instant of the request for a running one;
        `endAt` is reported beside them and decides nothing. A sprint completed
        three days late did not remove anything "after the end" for those three
        days, and one completed early did not carry over the work it had already
        stopped doing.


        **The five lists are labelled views, not a partition.** An issue is in
        `committed` and — if it landed — in `completed` too; that overlap is the
        headline. Only `committed` + `addedAfterStart` are disjoint and together
        cover everything the sprint ever held, and only `completed` +
        `carriedOver` partition what it held at its end.


        **The headline's denominator is `atEndCount`, not the commitment.**
        "Completed X of Y" reads `completedCount` of `atEndCount` — completed
        plus carried over, i.e. what the sprint **held at its end** — so the
        numerator is a subset of its own denominator. Against the *commitment* it
        is not: work added after the start can be completed, so a sprint that
        took late work on and finished it could report "completed 25 of 23". The
        commitment is not lost by that — it keeps its own list, count and point
        sum, and `addedAfterStartCount` is precisely the disclosure of how far
        the sprint drifted from it.


        **A deleted issue still gets a row**, with `deleted: true`, its
        snapshotted `key` and `points`, and `null` for everything only the live
        issue could answer. Render it as the line it is ("DEMO-77 (deleted)")
        rather than dropping it — dropping it would silently change what the
        sprint delivered.


        **A deleted issue out of a COMPLETED sprint lands in `carriedOver`, with
        a null `closedAt`.** `closed_at` lives on the issue, the issue is gone,
        and removing an issue from a frozen sprint writes no ledger row — so
        nothing in the record could prove it was finished. It is neither dropped
        (which would shrink what the sprint committed to) nor claimed as
        completed (which a report may not do for something it cannot show).


        **No status code here depends on a delivery capability**, and there is no
        per-assignee anything: `assigneeId` is a field on a row so a client can
        show an avatar, and nothing in this feature groups, counts, sums or
        filters by it.
      operationId: getSprintReviewReport
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - name: sprintId
          in: query
          description: >-
            The sprint to review. Defaults to the project's **ACTIVE** sprint;
            when the project has none the answer is a `200` with `sprint: null`
            and five empty lists. **A subject, not a filter** — the same `404` as
            on `/sprint-burnup`, and the same `400` for an id that is not a UUID.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >-
            OK — the five lists, the header totals and the shared `meta` block.
            Also the answer when the project has no ACTIVE sprint, and when the
            named sprint has never started (`sprint` populated, `startAt: null`,
            five empty lists).
          headers:
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintReviewResponse' }
        '400':
          description: >-
            A `sprintId` (or path id) that is not a UUID, raised while binding
            before the handler runs. This report takes no window and has no
            refusal of its own beyond that.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ReportSprintNotFound' }
        '429': { $ref: '#/components/responses/ReportThrottled' }

  /workspaces/{workspaceId}/projects/{projectId}/reports/sprint-review.csv:
    get:
      tags: [Reports]
      summary: Sprint review — the record as CSV
      description: >-
        The CSV export of `GET …/reports/sprint-review`, and **the one export
        that is not a plotted series** — because the report is not a chart. It is
        five labelled lists, so the file is **one row per issue per list, with a
        leading `list` column** naming which line of the record the row belongs
        to.


        **The same key legitimately appears more than once**, exactly as it does
        on screen: an issue that was committed and then completed is in both
        lists, and the five lists are labelled views rather than a partition.
        Deduplicate only if you know which question you are asking; summing a
        column across the whole file counts those issues twice.


        Every parameter, default, refusal and status code is the JSON endpoint's;
        see the `ReportCsvFile` schema for the file's shared structure.


        **`points` are the ledger's entry snapshots, not today's estimates** —
        the header says so, because a column of numbers in a spreadsheet carries
        none of the context the API reference does. The header also carries
        `# Totals (count/points)` and a `# List <name>` summary line per list,
        and — as on the burn-up — a `# No sprint:` note plus zero data rows when
        the project has no ACTIVE sprint and none was named.
      operationId: getSprintReviewReportCsv
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/reportCsvSprintId'
      responses:
        '200':
          description: >-
            The file. Columns: `list`, `issueId`, `key`, `title`, `typeId`,
            `assigneeId`, `statusId`, `points`, `closedAt`, `deleted`. A deleted
            issue still gets its row, with `deleted` true and only `key` and
            `points` populated.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ReportCsvDisposition' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            text/csv:
              schema: { $ref: '#/components/schemas/ReportCsvFile' }
        '400':
          description: A `sprintId` or path id that will not bind. This report takes no window.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ReportSprintNotFound' }
        '406': { $ref: '#/components/responses/ReportCsvNotAcceptable' }
        '429': { $ref: '#/components/responses/ReportThrottled' }
  /workspaces/{workspaceId}/projects/{projectId}/reports/velocity:
    get:
      tags: [Reports]
      summary: Velocity — how much should we plan for next sprint
      description: >-
        The last N **completed** sprints as bars, each showing what it delivered
        with its commitment marked on it, and beside them a p50/p85 band to plan
        the next sprint with. Access, caching, the `meta` block and the throttle
        are the family's; see the `Reports` tag.


        The whole response is one sentence with a picture: *"Recent sprints
        delivered between 14 and 23 issues; plan for ~18 (p50) and treat 23 (p85)
        as a stretch. Based on 6 sprints."*


        **This report is defined by what it refuses to do, and the refusals are
        part of the contract rather than of the UI.** Velocity's documented harm
        is not its arithmetic, it is its audience: a single number read as a
        productivity score, compared between teams, and answered by inflating
        estimates. So three things are absent on purpose and will not be added —
        an integrator who assumes they are simply missing will ask for the wrong
        thing.

        * **No per-person breakdown.** Not a filter, not a field, not a tooltip
          extra, not a future CSV column. The statement behind this endpoint does
          not select `actor_id` or `assignee_id` at all, so there is nothing to
          break down by; the refusal holds one layer below the response shape.
        * **No cross-project or workspace-level aggregate**, and **the
          endpoint's own path is the enforcement** — this shape exists only under
          `/projects/{projectId}/`. Comparing two teams means opening two pages
          and doing the arithmetic by hand, and **that friction is the design**:
          the cost of the comparison is paid by the person making it, because the
          harm above comes from comparisons cheap enough to make without thinking.
          A rollup added "for convenience" removes the mitigation and keeps the
          metric.
        * **No single quotable average.** There is no `averageVelocity` field and
          there is not meant to be one. The band is a range that always arrives
          with its own sample size, precisely so there is nothing to paste into a
          status report.


        **`sprints` is refused at BOTH ends, never clamped.** Above `12` and below
        `1` are both `400`s naming the bound. The lower bound is not pedantry:
        `sprints=0` would otherwise fail deeper in as a `500` on an endpoint whose
        contract promises a `400`, and "zero sprints" is a question with no answer
        rather than a request for an empty chart. The cap of 12 is deliberately an
        order of magnitude below Jira's 120 sprints / 25 000 issues, and not only
        for cost: twelve sprints is roughly half a year, and **a band computed
        from further back is a precise number about a team that no longer
        exists** — different members, different process, a different idea of what
        a point is.


        **There is no `sprintId`, and no `404` of its own.** The sample is
        resolved *from the project* — its most recently completed sprints — so no
        caller-supplied sprint id ever reaches the query. This is the sibling of
        the subject-versus-filter rule the two sprint reports sit on: **velocity's
        subject is the project**, which the path already names, so there is
        nothing here that could fail to resolve.


        **The band is suppressed for two different reasons, and they are not the
        same news.** `forecast` is always present; when it is suppressed both
        percentiles are `null` and `sampleSize` still states what there was, so a
        client says what it has rather than showing an empty box. The bars render
        either way — they are facts, and only the band is an inference.

        * **Fewer than three completed sprints** — *"Not enough completed sprints
          to forecast (need 3, have 2)"*. Three is the smallest sample in which a
          p50 and a p85 can name different sprints at all; at two the "band" would
          be the range itself dressed up as a statistic. This is the same principle
          as `/cycle-time`'s percentile suppression, one level up, and time fixes
          it.
        * **`meta.truncated` is true** — the row cap bit, so the bars that
          survived are no longer the sample anybody asked for, and a p85 over a
          subset the reader did not choose is a number this report may not stand
          behind. Time does not fix this one. See
          `VelocityReportResponse.sprints` for what the cap removes and why whole
          sprints go rather than partial ones.

        **Read `meta.truncated` to tell the two apart.** A client that treats null
        percentiles as only ever meaning "not enough history" will tell its user
        the wrong thing in the second case.


        A project that has never completed a sprint is a `200` with an empty
        `sprints` list and `sampleSize: 0` — never a `404`.


        **Points are the ledger's entry SNAPSHOT, not current estimates** — the
        sprint review's rule, and the opposite of the burn-up's. Velocity is
        retrospective and every sprint it describes is frozen: with current points
        a re-estimate today would move a bar drawn four months ago **and the band
        computed from it**, so tomorrow's plan would change because somebody tidied
        yesterday's backlog. It also keeps the bar and its drill-down honest — the
        commitment number here is summed from the same snapshots
        `/sprint-review` sums, so the review is literally the bar's breakdown.


        **`sprints[]` is chronological, oldest first**, so a client renders left to
        right in time without sorting, and every bar carries `startAt` /
        `completedAt` so order never has to be inferred from a name.


        **No status code depends on a delivery capability.** A `KANBAN` project
        answers with whatever sprints it has completed, and `measure=POINTS`
        answers with points in a project whose `estimation` is `false`.
      operationId: getVelocityReport
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - name: sprints
          in: query
          description: >-
            How many of the most recently completed sprints to sample. Defaults
            to `6` — roughly a quarter of a year. **Refused, not clamped, at both
            ends**: anything below `1` or above `12` is a `400` whose `detail`
            names the bound and the value asked for.
          schema: { type: integer, minimum: 1, maximum: 12, default: 6, example: 6 }
        - name: measure
          in: query
          description: >-
            What the four per-sprint numbers and the band count. Defaults to
            `COUNT`. Echoed back in the response, so a cached or shared chart
            always says what it is measuring. An unknown value is a `400`.
          schema: { $ref: '#/components/schemas/ReportMeasure' }
      responses:
        '200':
          description: >-
            OK — the bars oldest first, the band, and the shared `meta` block.
            Also the answer for a project that has never completed a sprint
            (empty `sprints`, `forecast.sampleSize: 0`).
          headers:
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VelocityReportResponse' }
        '400':
          description: >-
            `sprints` outside `1`…`12` — the `detail` names the bound and the
            value asked for, and the sample is **never** clamped to fit, because a
            forecast built from a different number of sprints than the one you
            asked for is worse than no forecast. Also an unknown `measure`, or a
            path id / `sprints` value that will not bind at all.


            **The two kinds refuse in a different order relative to tenancy, and
            the difference is visible.** A value that fails to *bind* (`sprints=x`,
            an unknown `measure`, a malformed path UUID) is refused by Spring
            before the handler runs, so it `400`s even on a project the caller
            cannot see. A value that binds and is then judged (`sprints=99`) is
            refused only **after** tenancy is resolved, so on a project the caller
            cannot see it is a `404` — a `400` there would confirm the project
            exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/ReportThrottled' }

  /workspaces/{workspaceId}/projects/{projectId}/reports/velocity.csv:
    get:
      tags: [Reports]
      summary: Velocity — the bars as CSV
      description: >-
        The CSV export of `GET …/reports/velocity` — **one row per completed
        sprint**, oldest first, carrying exactly the four numbers the bar shows
        plus its unestimated count.


        Every parameter, default, refusal and status code is the JSON endpoint's;
        see the `ReportCsvFile` schema for the file's shared structure.


        **The band is in the header, never a column** — `# Forecast: p50=…,
        p85=…, sample size=…`, described there as *a range to plan the next
        sprint with, and deliberately not a single number to compare teams by*.
        When it is suppressed the header says so and why, and **the bars are
        exported anyway**, because they are facts and only the band is an
        inference.


        **The report's refusals travel with the file.** Its columns are exactly
        the JSON record's and may not grow a per-person one: there is no
        assignee, actor or owner column here and there will not be, and no
        workspace-level `velocity.csv` exists — comparing two teams still means
        exporting two files and doing the arithmetic yourself, which is the
        intended friction rather than an omission.
      operationId: getVelocityReportCsv
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/reportCsvSprints'
        - $ref: '#/components/parameters/reportCsvMeasure'
      responses:
        '200':
          description: >-
            The file. Columns: `sprintId`, `name`, `startAt`, `completedAt`,
            `committed`, `completed`, `addedAfterStart`, `carriedOver`,
            `unestimatedCount`. Zero data rows for a project that has never
            completed a sprint.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ReportCsvDisposition' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            text/csv:
              schema: { $ref: '#/components/schemas/ReportCsvFile' }
        '400':
          description: >-
            Same as the JSON sibling — `sprints` outside `1`…`12`, refused and
            never clamped, or an unknown `measure`, or an id that will not bind.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/ReportCsvNotAcceptable' }
        '429': { $ref: '#/components/responses/ReportThrottled' }
  /notifications:
    get:
      tags: [Notifications]
      summary: List my notifications
      description: >-
        Newest first, capped at 30, across the workspaces you are
        **currently** a member of. These paths name no workspace — the feed is
        cross-workspace by design — but every one of them filters on live
        membership, so a notification from a workspace you have since left is
        not listed here, not counted by `/notifications/unread-count`, not
        touched by `/notifications/read-all`, and `404`s on
        `/notifications/{id}/read`. It is hidden, not deleted: rejoin the
        workspace and it comes back with its read state intact.
      operationId: listNotifications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Unread counter
      description: >-
        Counts exactly the notifications `GET /notifications` would return —
        the caller's own, in the workspaces they are currently a member of —
        with no 30-row cap.
      operationId: unreadCount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, format: int64, example: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one as read
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: >-
            Not found — a notification this caller cannot see. An unknown id,
            one addressed to another user, and one belonging to a workspace the
            caller is no longer a member of are deliberately a **single
            indistinguishable answer**, never a `403`: a success here returns
            the whole notification, excerpt included, so a lookup that told the
            cases apart would disclose the content it exists to withhold.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all as read
      description: >-
        Marks everything the caller can currently see. A notification in a
        workspace the caller has left stays **unread** — hiding a row must not
        quietly mutate it — so a member who is re-added finds that inbox in the
        state they left it.
      operationId: markAllNotificationsRead
      responses:
        '204': { description: Done }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workspaces/{workspaceId}/sse:
    get:
      tags: [Events]
      summary: Subscribe to workspace events (SSE)
      description: |
        Server-Sent Events stream (`text/event-stream`), workspace members
        only. Event names: `ISSUE_CREATED`, `ISSUE_UPDATED`, `ISSUE_DELETED`
        (data: `{"projectId", "issueNumber"}`) and `NOTIFICATION`. Reconnect
        with standard `EventSource` retry semantics.
      operationId: subscribeSse
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/search:
    post:
      tags: [Search]
      summary: Search issues with HQL
      description: |
        Runs an HQL (Hamstrack Query Language) query across the workspace,
        restricted to the caller's visible (non-archived) projects — the
        tenancy/visibility scope is ANDed in server-side and no query text can
        widen it. Workspace members only. Paginated (`size` clamped 1..100).

        **HQL in brief** — a boolean expression of `field OP value` comparisons.

        - **Queryable fields:** `status`, `assignee`, `reporter`, `type`,
          `priority`, `project`, `created`, `updated`, `due`,
          `closed` (alias `closedAt`), `parent`, `text`,
          `label` (alias `labels`), `component` (alias `components`),
          `fixVersion`, `affectsVersion`, `sprint` (alias `sprints`),
          `storyPoints` (alias `points`), plus any **custom field** (M2) by its
          `key` (e.g. `severity`). `GET /search/schema` advertises the fields
          autocomplete should offer; that list is capability-aware and may be a
          **subset** of what actually resolves (see below). Field names are
          matched case-insensitively, so the all-lowercase `fixversion` /
          `affectsversion` spellings work too (`/schema` always advertises the
          camelCase name, exactly once per field). Whatever the query says, the
          scope stays the caller's visible projects: a `project` term can only
          **narrow** it, never widen it, and every result row still names its
          owner (`projectId`/`projectKey`/`projectName`).
        - **Operators:** `=` `!=` `IN` `~` `>` `<` `>=` `<=` (which operators a
          field accepts comes from `GET /search/schema`; `~` is text only,
          ordered comparisons are for dates and `priority`). Negation is the
          prefix keyword, for every field alike: write `NOT field IN (…)` — the
          grammar has no `field NOT IN (…)` form for any field at all.
        - **Booleans:** `AND` `OR` `NOT` with `( )` grouping; precedence is
          `NOT` > `AND` > `OR`.
        - **Nullability:** `field IS [NOT] EMPTY` on nullable fields
          (`assignee`, `parent`, `due`, `closed`, `label`, `component`,
          `fixVersion`, `affectsVersion`, `sprint`, `storyPoints`, and every
          custom field except CHECKBOX). On a nullable field, `!=` **also
          matches the rows holding no value at all**: SQL's three-valued logic
          would drop them and the language deliberately does not, since "not
          closed on the 1st" plainly includes "not closed" — the reading
          `label != "x"` and `due != …` have always had.
        - **Sorting:** a trailing `ORDER BY field [ASC|DESC], …` clause (must be
          last). Custom fields are **not sortable** (yet). Rows with no value
          for the sort key land where the database puts them for that direction
          (last ascending, first descending), identically for **every** nullable
          sort key — so no two of them disagree about which end the empty rows
          sit at.
        - **Functions:** `currentUser()`, `now()`, `startOfWeek()` (server UTC).
        - **Values:** status/type/priority by **name**; users by email,
          display name, `currentUser()`, or UUID fallback; dates as
          `YYYY-MM-DD`. `text` (`~`) is a case-insensitive substring over title
          and description.
        - **Dates:** a date-valued field takes ordered comparisons
          (`= != > < >= <=`), **is sortable**, offers `now()` and
          `startOfWeek()`, and does **not** accept `IN`. Its operand is a bare
          `YYYY-MM-DD` date standing for the **whole UTC day**, inclusively:
          `created = "2026-08-01"` matches anything stamped from `00:00Z` that
          day up to — but not including — the next, `created <= "2026-08-01"`
          runs to the end of that day, and `created > "2026-08-01"` starts at
          the beginning of the following one. A time of day is never part of an
          operand.
        - **Closed date** (`closed`, alias `closedAt`) is when the issue was
          last closed — the queryable form of the `closedAt` every
          `IssueResponse` already carries, and a date field like the rest
          (ordered comparisons, sortable, `now()`/`startOfWeek()`, no `IN`),
          nullable. **`closed IS EMPTY` means the issue is open right now.** It
          does not mean the issue was never finished: the stamp is written when
          an issue enters a DONE-category status and **cleared** when it leaves
          one, so a reopened issue is empty again and the date it used to carry
          is gone — cleared, not archived. "Never closed" is therefore not a
          question this field can answer. Per the nullable rule above,
          `closed != "2026-08-01"` also matches the issues that are not closed
          at all. The response spelling `closedAt` resolves too, as an alias,
          but `closed` is the name to write: it is the one
          `GET /search/schema` advertises, and this language names date fields
          after the **event** rather than after the column (`created`,
          `updated`), so spelling a single one of them after its column would
          leave the vocabulary unguessable in both directions. Example:
          `closed >= startOfWeek() AND assignee = currentUser()`.
        - **Project** (`project`) is single-valued and never empty, and is
          resolved by project **key** only — `project = "HD"`, matched
          case-insensitively with surrounding whitespace ignored. Operators
          `= != IN`, and it **is sortable** (`ORDER BY project` orders by key).
          A project's **name** is deliberately not a resolution source: unlike a
          key, a name carries no uniqueness constraint, so a name operand would
          denote a *set* — the ambiguity this field exists to remove. The name
          is published as a **label** beside the key it inserts, both in the
          `/schema` `PROJECT` picklist and in `/suggest?field=project`
          (`{"label": "Hamstrack (HD)", "value": "HD"}`), and an operand that
          matches a visible project's name comes back with a hint naming that
          project's key. Every issue has a project, so `project IS [NOT] EMPTY`
          is a `422` rather than a statement that could never be true. An
          operand naming no project the caller can search is the ordinary
          field-anchored `422`, and the wording is **the same** whether the key
          is unknown, belongs to a project outside the caller's reach, or
          belongs to an archived project — the three are indistinguishable on
          purpose, so this field cannot be used to probe which projects exist.
          Because it narrows the row set rather than the resolution of other
          fields, it is also what disambiguates the project-scoped catalogs:
          `project = "HD" AND fixVersion = "2.4.0"` says which "2.4.0" is meant.
        - **Labels** (`label`, alias `labels`) are many-valued and given by
          **name** (`= != IN` and `IS [NOT] EMPTY`; not sortable). `label = "x"`
          means "carries x", `label != "x"` means "does not carry x" (issues
          with no labels at all included), `label IS EMPTY` means "carries no
          label". Archived labels are excluded from name resolution, so a name
          that no longer exists in the workspace is a `422` at run time.
        - **Components** (`component`, alias `components`) are single-valued and
          given by **name** (`= != IN` and `IS [NOT] EMPTY`) and — unlike
          `label` — **sortable** (`ORDER BY component` sorts by component name,
          issues without one included). Names resolve across the caller's
          visible **projects**, so two projects may each own a "Billing" and
          both match. Archived components are excluded from name resolution
          (a `422` at run time), though issues keep carrying them.
        - **Versions** — `fixVersion` ("ships in") and `affectsVersion`
          ("broken in") are two fields over the same link table, told apart by
          the role, both many-valued and given by **name** (`= != IN` and
          `IS [NOT] EMPTY`; **not sortable**, so `ORDER BY fixVersion` is a
          `422`). `fixVersion = "2.4.0"` means "ships in 2.4.0",
          `fixVersion IS EMPTY` means "not scheduled for any release" — the
          unassigned-work query. Names resolve across the caller's visible
          **projects** (two projects may each ship a "2.4.0"), and archived
          versions are excluded from name resolution (a `422` at run time),
          though issues keep carrying them.
        - **Sprints** (`sprint`, alias `sprints`) are single-valued and given by
          **name** (`= != IN` and `IS [NOT] EMPTY`), and — like `label` —
          **not sortable**, so `ORDER BY sprint` is a `422`: sprint order across
          several projects has no common meaning. `sprint IS EMPTY` means "in no
          sprint", i.e. the backlog. Names resolve across the caller's visible
          **projects**, so two projects may each run a "Sprint 7" and both
          match. `COMPLETED` sprints are excluded from name resolution (years of
          history would flood the namespace), though issues carrying them still
          match by id.
        - **Story points** (`storyPoints`, alias `points`) is the first native
          numeric field: a real column, so it takes ordered comparisons directly
          (`= != > < >= <=`) and **is sortable** — that is the point ("show me
          the big ones first"). `storyPoints IS EMPTY` means **unestimated**,
          which is deliberately not the same statement as `= 0`. It has no value
          picklist. The **operand is bounded to the field's own domain** — the
          same `0`…`999` with at most 2 decimals the write path enforces — so
          `storyPoints > 1e999` or `storyPoints = 1.234` is a `422` semantic
          error naming the field, not a `500`. A filter that could never match a
          row is rejected up front rather than handed to the database.
        - **Custom fields** are queried by `key`, operators per type — TEXT /
          TEXTAREA / URL: `= != ~`; NUMBER / DATE: `= != > < >= <=`; SELECT:
          `= != IN`; MULTI_SELECT: `=` (contains) / `IN` (any-of); USER:
          `= != IN` + `currentUser()`; CHECKBOX: `=`; all support
          `IS [NOT] EMPTY` except CHECKBOX. SELECT/MULTI_SELECT values are given
          by option **label or id**, USER values by email / display name /
          `currentUser()` / UUID, DATE as `YYYY-MM-DD`. Example:
          `severity = "High" AND environment = prod`.
        - **Retired field keys** — `story_points`, the custom-field key release
          0.13.0 archived when story points became a native field, still
          resolves: it is a permanent alias for `storyPoints`, so a saved filter
          written against the old key keeps running (no migration ever rewrites
          a stored filter's text). The alias is a **last-resort** fallback,
          consulted only after system fields and the caller's visible custom
          fields — so a workspace that owns its own custom field keyed
          `story_points` still resolves to **its own field**, never to the
          native column. Once the alias has applied, errors name the
          **canonical** field: `story_points IN (5)` answers `422 "The IN
          operator is not allowed on field 'storyPoints'"`. Aliases are
          compatibility, not vocabulary — `GET /search/schema` never advertises
          them.

        **Delivery capabilities never gate this endpoint.** `sprint`,
        `fixVersion`, `affectsVersion` and `storyPoints` parse, compile and run
        on every project, whatever its `delivery` capabilities say — typed by
        hand or loaded from a saved filter. On a project with `board: KANBAN`,
        `releases: false`, `estimation: false`, `sprint = "Smoke Sprint"` still
        returns `200` with its rows and `sprint = "No Such Sprint"` still returns
        the ordinary field-anchored `422`. Capabilities only narrow what
        `GET /search/schema` and `GET /search/suggest` *suggest*, so **the
        suggested set is a subset of the resolvable set** — never use `/schema`
        as a validator for a query you are about to send.

        An empty/blank `query` matches all visible issues (default sort).
        Examples:
        `status = "In Progress" AND assignee = currentUser() ORDER BY priority DESC`
        · `type = Bug AND priority >= High AND due IS NOT EMPTY`.
      operationId: searchIssues
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SearchResultRow' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >-
            Invalid query. A parse error carries `errorType: "PARSE_ERROR"` with
            a highlight span (`position`, `length`, nullable `token`); a semantic
            error carries `errorType: "SEMANTIC_ERROR"` with the offending
            `field` and `position`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HqlProblemDetail' }
        '429': { $ref: '#/components/responses/SearchThrottled' }

  /workspaces/{workspaceId}/search/schema:
    get:
      tags: [Search]
      summary: HQL autocomplete metadata
      description: >-
        The field/operator schema plus the small value picklists
        (statuses/types/priorities reachable by the caller's visible projects)
        that drive the search UI's autocomplete. `fields[]` lists the system
        fields first, then the caller's visible **custom fields** (M2) — each
        with `name` = the field `key`, `type` = its custom `FieldType`, and the
        operators legal for that type. SELECT/MULTI_SELECT custom fields publish
        their options in `values` under a `CUSTOM:<key>` key; USER custom fields
        use the `USER` value-source (served via `/search/suggest`). The member
        list is deliberately NOT embedded — use `/search/suggest` for
        user-valued fields (system or custom). The `LABEL` picklist holds the
        workspace's non-archived label names but is **capped at 200 entries** —
        beyond that, fall back to `/search/suggest?field=label`. The `COMPONENT`
        picklist holds the non-archived component names of the caller's visible
        projects and is capped the same way (fall back to
        `/search/suggest?field=component`), and the `VERSION` picklist does the
        same for the version names of the visible projects with `releases` on
        (see the capability note below) — **one** picklist backs both
        `fixVersion` and
        `affectsVersion` (both declare `valueSuggest: "VERSION"`), since the two
        roles draw from the same catalog. A `SPRINT` picklist holds the **open**
        (non-completed) sprint names of the caller's visible projects with
        `board: SCRUM`, capped at
        200 the same way — but note that unlike the other picklists it has **no
        `/search/suggest` fallback**: `?field=sprint` is intentionally not wired
        and returns the standard `422`, because a project's open sprints are
        bounded by `app.agile.max-open-sprints-per-project` and cannot overflow
        the picklist in practice. A `PROJECT` picklist holds the caller's
        visible (non-archived) projects, capped at 200 the same way, with
        `/search/suggest?field=project` as its overflow; each entry is
        `{label: "<name> (<KEY>)", value: "<KEY>"}`, because the key is the only
        string the `project` field resolves. It is **not** capability-narrowed —
        every project has a project — and it can only ever offer what a query
        already reaches, being the same visible set the scope predicate
        restricts every search to. `storyPoints` has no picklist at all (it is
        numeric). Field names are matched
        case-insensitively internally, but each field is advertised here exactly
        **once**, under its canonical camelCase name (aliases such as `sprints`
        and `points` de-duplicate onto their descriptor). Retired keys
        (`story_points`) are compatibility, not vocabulary, and are never
        advertised here even though they still resolve. Workspace members
        only.


        **Capability-aware — and suggestion-only.** A system field that belongs
        to a delivery capability is listed only when **at least one** visible
        project has that capability on: `sprint` needs a project with
        `board: SCRUM`, `fixVersion`/`affectsVersion` need one with `releases`,
        `storyPoints` needs one with `estimation`. Every other field is always
        listed. The `SPRINT` and `VERSION` picklists are additionally scoped to
        the visible projects **with the capability on** — so on a workspace whose
        only visible project is Kanban with releases and estimation off,
        `fields` holds every system field except those four (plus the caller's
        custom fields) and both picklists are empty.


        **An omitted field still resolves.** This endpoint is autocomplete
        vocabulary, never a contract: `sprint`, `fixVersion`, `affectsVersion`
        and `storyPoints` keep parsing, compiling and running on every project
        regardless of any capability, so a saved filter can never break because
        a curator flipped a toggle, and no status code anywhere depends on a
        capability. The practical consequence for integrators: **the suggested
        set is a subset of the resolvable set** — a Kanban project may
        legitimately own sprints and a `releases: false` project may own
        versions, and those names vanish from suggestions while still matching
        in queries.


        **The `insights` block follows the identical rule.** It publishes the
        measures and grouping dimensions worth OFFERING to the Insights panel
        (`POST …/search/insights`), narrowed the same way: the `SPRINT` dimension
        appears only when at least one visible project has `board: SCRUM`, and
        the `POINTS` measure only when at least one has `estimation` on —
        mirroring how the `sprint` and `storyPoints` FIELDS are narrowed above.
        And, exactly as with fields, **what is omitted still resolves**: the
        panel answers `200` for a dimension or measure that is not in this list,
        so a saved panel state cannot break because a curator flipped a project
        toggle. It is published here rather than hardcoded in a client precisely
        because it is capability-narrowed.
      operationId: searchSchema
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSchemaResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/SearchThrottled' }

  /workspaces/{workspaceId}/search/suggest:
    get:
      tags: [Search]
      summary: Typeahead for fields whose values come from a bounded catalog
      description: >-
        Bounded server-side typeahead — the system `assignee`/`reporter` fields
        and any USER-typed **custom field** (M2, by its `key`), plus `label`
        (alias `labels`), `component` (alias `components`),
        `fixVersion`/`affectsVersion` and `project` — so large workspaces never
        ship a whole catalog to the client. Returns at most 20 matches. For
        `label`, `component` and the two version fields the match is a
        case-insensitive **substring** (over the workspace's non-archived label
        names, resp. the non-archived component/version names of the caller's
        visible projects), and `%`/`_` in `q` are literal characters, not
        wildcards. Both version roles share one catalog, so `fixVersion` and
        `affectsVersion` return identical suggestions (names de-duplicated
        case-insensitively, so a "2.4.0" shipped by two projects is offered
        once). Workspace members only.


        Version suggestions are **capability-aware**, exactly like the
        `/search/schema` `VERSION` picklist they overflow: they are drawn from
        the caller's visible projects **with `releases` on**. That is a
        suggestion narrowing only — a version whose project has releases off is
        still resolvable by name in a query, and no status code depends on a
        capability. No other field served here is capability-narrowed.


        `project` **prefix**-matches the caller's visible projects on **key**
        and on **name** — someone typing `HD` and someone typing `Hams` are
        after the same project — but the `value` offered is always the **key**,
        because
        that is the only string the field resolves; the name travels in the
        `label`. Archived projects are never offered, here or in the `/schema`
        `PROJECT` picklist this overflows: a value surface may only offer what
        resolution accepts.


        **Not** served here: `sprint`. Its `/search/schema` `SPRINT` picklist is
        already bounded by `app.agile.max-open-sprints-per-project`, so no
        typeahead fallback was wired — asking for it gets the `422` that any
        resolvable field with no value picklist gets, which is worded
        differently from the `422` a name that resolves to nothing gets (see
        the `422` response below).
      operationId: searchSuggest
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: field
          in: query
          required: true
          description: >-
            The HQL field to suggest values for — a user-valued field (e.g.
            `assignee`), `label`/`labels`, `component`/`components`,
            `fixVersion`/`affectsVersion`, or `project`. Any other name
            (including `sprint`) is a `422`, in one of the two wordings
            described under that
            response: a name that resolves to nothing reads differently from a
            name that resolves to a field with no value picklist.
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: >-
            Text to match (max 100 chars). `%` and `_` are treated literally.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >-
            Two different refusals, told apart by their `detail` — both carry
            `errorType: SEMANTIC_ERROR` and the offending `field` exactly as
            the caller spelled it. **A name that resolves to nothing** (not a
            system field, not a custom field this caller can see, not a retired
            key) is refused in the same words — and with the same "did you
            mean …?" hint, when a near match exists — that every other HQL
            surface gives an unknown name; a custom field the caller cannot see
            is indistinguishable from a typo, so its existence is never leaked.
            **A name that does resolve, to a field with no bounded value lookup
            behind it** (a numeric, a date, or a picklist small enough for
            `/search/schema` to carry whole) is refused as having no value
            suggestions: that field exists, and it is the value question being
            declined.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HqlProblemDetail' }
        '429': { $ref: '#/components/responses/SearchThrottled' }

  /workspaces/{workspaceId}/search/insights:
    post:
      tags: [Reports]
      summary: Insights — break down the query in the search box
      description: >-
        The dashboard replacement, and the seventh and last report of the set.
        Instead of a grid of independently-configured widgets, **one panel whose
        dataset is the HQL query already in the search box**: `slice` picks the x
        axis, `segment` optionally colours it, and the answer is the same
        population the result list underneath is showing.


        One dataset is the entire argument for it. There is nothing to
        double-count across widgets, no layout to migrate, and a saved filter
        becomes a saved report at no cost — the panel cannot disagree with the
        list beneath it, because both compile from one query through one
        predicate.


        **It is workspace-scoped, not project-scoped**, which is why it sits on
        the search base path rather than under `/projects/{pId}/reports`: it
        answers a question about a query somebody typed, and that query already
        spans whatever the caller can see. Membership is the family's — a missing
        workspace and a non-member are the same `404`, never a `403`.


        **It is the only POST in the reports family, and that changes what
        caching means.** The query is a body (up to 2 000 characters), not a
        query string. **A POST response is not served from an HTTP cache** —
        browsers do not cache them, and RFC 9111's narrow allowance needs a
        `Content-Location` that no client here sends. So the
        `Cache-Control: private, max-age=60` and `Vary: Authorization` this
        endpoint carries are for **consistency and defence**, not for effect:
        they match the rest of the surface, and they mean that if an intermediary
        ever cached this anyway the response is already marked private and keyed
        on the credential. **The real 60-second de-duplication is client-side**
        (the SPA's query `staleTime`), which is where it has to be for a POST —
        do not expect the browser to do it for you.


        **Its refusals are `422`, not `400` — do not generalise from the five
        `/reports` GETs.** There, `?measure=BOGUS` is a binding failure Spring
        raises before the handler runs, so it is a `400`. Here the parameters
        arrive inside a JSON body and are resolved in the service, so an unknown
        `measure`, `slice` or `segment` is a **`422` naming the parameter and
        listing what it accepts** — which is also what every other refusal under
        `/search` looks like. Same idea, different mechanism, and a client that
        generalises the reports family's `400` will handle the wrong code.


        **`measure` ranks; it does not filter.** Every bucket always carries
        `count`, `points` **and** `unestimatedCount` — they come out of one
        `GROUP BY` and cost nothing measurable, so flipping the client's toggle
        needs no round trip. What the measure decides is the `ORDER BY`, and
        therefore **which buckets survive the caps**: a response is the top
        `sliceCap` buckets *by that measure*, so `POINTS` can legitimately return
        a **different set of bars** than `COUNT` over the identical query. That is
        the point — "the ten statuses with the most issues" and "the ten with the
        most points" are different questions, and a truncated top-N has to know
        which one it was asked. `NONE` means "no y axis, draw a table"; it ranks
        by count server-side (a bucket must be ordered by something to be capped
        at all) and is echoed back so the client knows not to draw bars.


        **A bar's height is not the sum of its stacks, and must not be computed
        that way.** Bars and cells are capped **separately** (`sliceCap` = 200,
        `cellCap` = 1000, both fixed constants), and the bars get their own
        `GROUP BY`, so **`slices[].count` / `points` are always exact** while
        `cells` may be partial. Summing the cells to get a bar would make every
        truncated response quietly understate its own chart.


        **Two different truncations, and a client should be able to say which
        happened**: `slicesTruncated` means bars are missing from the x axis
        (there were more buckets than `sliceCap`, and you got the largest by
        `measure`); `cellsTruncated` means the breakdown inside the bars is
        partial. They are different pictures. Note that `meta.truncated` stays
        **`false`** and `meta.cap` keeps meaning `app.reports.max-rows` — a fact
        rather than a stub: this report materialises **no issue rows at all**
        (PostgreSQL aggregates and returns buckets), so the row cap cannot bite.
        What can truncate here is buckets, and that has its own two flags rather
        than borrowing a field that means rows.


        **`meta.basedOnIssues` is deliberately not the sum of the series.** It is
        the distinct issues matching the query — the same number the search
        result list reports — computed independently of every cap above. With a
        many-valued dimension such as `LABEL` one issue lands in several buckets,
        so the bars sum to **more**; when a cap bites they sum to **less**. Both
        are arithmetic rather than defects, and `sliceMultiValued` /
        `segmentMultiValued` are on the response so a client can label its total
        honestly instead of leaving the reader to discover the mismatch.


        **Capability narrows the offered list, never the resolution.**
        `GET /search/schema` drops the `SPRINT` dimension when no visible project
        plans in sprints and the `POINTS` measure when none estimates — but a
        dimension omitted there **still resolves if you ask for it**, exactly as
        an omitted HQL field still parses. No status code depends on a
        capability, so a saved panel state cannot break because a curator flipped
        a project toggle.
      operationId: searchInsights
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsightsRequest' }
      responses:
        '200':
          description: >-
            OK — the bars, the optional breakdown, both caps, both truncation
            flags and the shared `meta` block.
          headers:
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
            Vary: { $ref: '#/components/headers/ReportVary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsResponse' }
        '400':
          description: >-
            A malformed body, a `query` longer than 2 000 characters or a
            `measure`/`slice`/`segment` longer than **32** (both rejected at
            binding, before the token is ever looked at — so an oversized token is
            a `400` while an unrecognised one is the `422` below), or a path id
            that is not a UUID. All are raised while
            binding, before the handler runs, so they disclose nothing about the
            workspace. **Every refusal the endpoint itself makes is a `422`
            instead** — see below.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >-
            The field-anchored refusals, all `422` — never `400`:

            * an **unparseable HQL query** — `errorType: "PARSE_ERROR"` with a
              highlight span (`position`, `length`, nullable `token`);
            * a **semantic HQL error** — `errorType: "SEMANTIC_ERROR"` with the
              offending `field` and `position`. Identical to what `POST …/search`
              returns for the same query, because it is the same pipeline;
            * an **unknown `measure`, `slice` or `segment`** — the detail names
              the parameter and lists what it accepts;
            * **`segment` equal to `slice`** — a diagonal is not a breakdown, and
              it is refused rather than rendered, because the response would look
              like a broken chart with nothing in it to explain why.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HqlProblemDetail' }
        '429': { $ref: '#/components/responses/ReportThrottled' }

  /workspaces/{workspaceId}/filters:
    get:
      tags: [Saved Filters]
      summary: List saved filters
      description: >-
        The caller's own saved filters plus every `shared` filter in the
        workspace. Workspace members only — a non-member gets `404`, never `403`.
      operationId: listSavedFilters
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedFilterResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/SearchThrottled' }
    post:
      tags: [Saved Filters]
      summary: Create a saved filter
      description: >-
        Create a saved filter owned by the caller. The stored HQL is validated at
        save time (parse + structural registry validation) but never executed
        here; value resolution (`currentUser()`, status-name→id, …) is deferred to
        run time. `name` is unique per `(workspace, owner)`. Workspace members only.
      operationId: createSavedFilter
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSavedFilterRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilterResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A filter with that name already exists for this owner in the workspace
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            Invalid HQL. A parse error carries `errorType: "PARSE_ERROR"` with a
            highlight span (`position`, `length`, nullable `token`); a semantic
            error carries `errorType: "SEMANTIC_ERROR"` with the offending `field`
            and `position` (same shape as search).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HqlProblemDetail' }
        '429': { $ref: '#/components/responses/SearchThrottled' }

  /workspaces/{workspaceId}/filters/{filterId}:
    get:
      tags: [Saved Filters]
      summary: Get a saved filter
      description: >-
        Fetch one saved filter the caller can see (their own, or a `shared` one).
        A private filter owned by someone else — or a foreign/non-member request —
        gets `404`, never `403`.
      operationId: getSavedFilter
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/filterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilterResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/SearchThrottled' }
    patch:
      tags: [Saved Filters]
      summary: Update a saved filter
      description: >-
        Partial update — only the non-null fields are applied (a `null`/omitted
        field is a no-op). **Owner only:** a non-owner, even on a `shared` filter,
        gets `404` (never `403`). Changed HQL is re-validated at save time.
      operationId: updateSavedFilter
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/filterId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSavedFilterRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilterResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A filter with the new name already exists for this owner in the workspace
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: Invalid HQL (same `HqlProblemDetail` shape as create/search)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HqlProblemDetail' }
        '429': { $ref: '#/components/responses/SearchThrottled' }
    delete:
      tags: [Saved Filters]
      summary: Delete a saved filter
      description: >-
        Delete a saved filter. **Owner only** — a non-owner (even on a `shared`
        filter) gets `404`, never `403`.
      operationId: deleteSavedFilter
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/filterId'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/SearchThrottled' }

  /workspaces/{workspaceId}/filters/{filterId}/usage:
    get:
      tags: [Saved Filters]
      summary: Where a saved filter is used
      description: >-
        Delete-warning hook: the boards/reports that reference this saved filter,
        so a client can show a "Used by N places — delete anyway?" confirmation.
        **Owner only** (matches `DELETE`) — a non-owner gets `404`. Forward-looking:
        no board/report consumes a filter in the current release, so `usages` is
        **always `[]`**.
      operationId: savedFilterUsage
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/filterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilterUsageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/SearchThrottled' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /api/auth/login` (default 30 min lifetime).
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Rotating refresh token cookie set on login (30-day lifetime, path `/api/auth`).

  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    memberUserId:
      name: userId
      in: path
      required: true
      description: >-
        The id of the user whose membership is being administered. A user id
        that holds no membership in this workspace is a `404` about the
        membership — it reveals nothing about whether the account exists.
      schema: { type: string, format: uuid }
    issueNumber:
      name: number
      in: path
      required: true
      description: Project-scoped issue number (the `42` in `DEMO-42`)
      schema: { type: integer, format: int64 }
    commentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    attachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    filterId:
      name: filterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    labelId:
      name: labelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    componentId:
      name: componentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    versionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    sprintId:
      name: sprintId
      in: path
      required: true
      schema: { type: string, format: uuid }
    adminId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    roleId:
      name: roleId
      in: path
      required: true
      description: >-
        A role **addressed as a resource**: a built-in template, or one of this
        workspace's own custom roles. Anything else — unknown, or belonging to
        another workspace — is a `404`, never a `422`. The opposite rule applies
        to a role id sent as a *value* (`roleId` in a body, `reassignToRoleId`
        in a query), which is `422`; unifying the two would make the pair an
        oracle for whether a role exists in another tenant.
      schema: { type: string, format: uuid }
    pageParam:
      name: page
      in: query
      description: Zero-based page index (default 0)
      schema: { type: integer, minimum: 0, default: 0 }
    sizeParam:
      name: size
      in: query
      description: Page size (default 50, clamped server-side to a maximum of 100)
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

    planningStatusId:
      name: statusId
      in: query
      schema: { type: string, format: uuid }
    planningAssigneeId:
      name: assigneeId
      in: query
      schema: { type: string, format: uuid }
    planningPriorityId:
      name: priorityId
      in: query
      schema: { type: string, format: uuid }
    planningComponentId:
      name: componentId
      in: query
      description: An id from another project matches nothing rather than erroring.
      schema: { type: string, format: uuid }
    planningLabelId:
      name: labelId
      in: query
      description: >-
        Repeatable, combined per `labelMatch`. More than
        `app.classification.max-labels-per-issue` (default 20) distinct
        values is a `400`.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, format: uuid }
    planningLabelMatch:
      name: labelMatch
      in: query
      description: '`any` = carries at least one, `all` = carries every one.'
      schema: { type: string, enum: [any, all], default: any }
    planningFixVersionId:
      name: fixVersionId
      in: query
      description: Matches the **fix** link role only.
      schema: { type: string, format: uuid }
    planningIncludeDone:
      name: includeDone
      in: query
      description: >-
        Include DONE-category issues in the **backlog** section. Defaults to
        `false` — a done, unranked issue is planning noise. Sprint sections
        always include their DONE issues, because that is the sprint's
        record of what it delivered, so this flag never affects them — and a
        mapping that returns only a sprint section does not accept it at all.
      schema: { type: boolean, default: false }

    reportCsvFrom:
      name: from
      in: query
      description: >-
        Identical to the JSON sibling's `from` — same default, same
        `1970-01-01`…`2200-12-31` band, same `400` naming the cap. Being a
        download changes no parameter and no refusal.
      schema: { type: string, format: date, example: 2026-05-21 }
    reportCsvTo:
      name: to
      in: query
      description: Identical to the JSON sibling's `to`.
      schema: { type: string, format: date, example: 2026-08-19 }
    reportCsvInterval:
      name: interval
      in: query
      description: Identical to `/reports/flow`'s `interval`. An unknown value is a `400`.
      schema: { $ref: '#/components/schemas/ReportInterval' }
    reportCsvTypeId:
      name: typeId
      in: query
      description: >-
        Identical to the JSON sibling's `typeId` — a **filter**, so an unknown or
        foreign id narrows the export to zero data rows and is named in the
        `# Filters that matched nothing` header line rather than being a `404`.
      schema: { type: string, format: uuid }
    reportCsvComponentId:
      name: componentId
      in: query
      description: Identical to the JSON sibling's `componentId`; same filter rule as `typeId`.
      schema: { type: string, format: uuid }
    reportCsvLabelId:
      name: labelId
      in: query
      description: Identical to the JSON sibling's `labelId`; same filter rule as `typeId`.
      schema: { type: string, format: uuid }
    reportCsvSprintId:
      name: sprintId
      in: query
      description: >-
        Identical to the JSON sibling's `sprintId` — the report's **subject**, so
        it defaults to the project's ACTIVE sprint and an id that does not resolve
        inside this project is a `404`. Having no ACTIVE sprint is **not** an
        error: it is a `200` whose header says so, with zero data rows.
      schema: { type: string, format: uuid }
    reportCsvMeasure:
      name: measure
      in: query
      description: >-
        Identical to the JSON sibling's `measure`. Echoed into the `# Measure`
        header line, so an exported file always states which measure it holds.
      schema: { $ref: '#/components/schemas/ReportMeasure' }
    reportCsvSprints:
      name: sprints
      in: query
      description: >-
        Identical to `/reports/velocity`'s `sprints` — refused at both ends
        (1…12) rather than clamped.
      schema: { type: integer, minimum: 1, maximum: 12, default: 6, example: 6 }
  responses:
    AuthOk:
      description: Authenticated — access token in body, refresh cookie set
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthResponse' }
    Unauthorized:
      description: Missing, expired or invalid access token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: >-
        Authenticated and a member of the workspace, but missing a permission.
        Every gated operation names it: `detail` is
        `Requires permission: <key>`, where `<key>` is a catalog key exactly as
        `GET /permissions` reports it (always the bare key — never the `:own`
        form, even where an own-only grant would have carried another object).
        Non-membership and non-existence are `404`, never this.


        The old `"Insufficient workspace permissions"` /
        `"Insufficient project permissions"` sentences are **gone**, and so is
        the detail-less `403` a comment edit/delete used to return —
        workspace-scoped checks, the delegated-admin endpoints and the comment
        endpoints all name a key now. Match on the key, not on wording.


        Two refusals deliberately do **not** name a permission, because a
        permission is not what refused: the **grant ceiling** ("You cannot
        assign or administer the role …, which includes `<key>` — a permission
        you do not hold in this workspace") and the **Owner guardrail** ("Only
        an Owner can assign the Owner role or administer another Owner"). Both
        are `403`, and both apply to member administration **and** to the role
        endpoints — composing a role you could not hand out, and reassigning a
        role's holders onto a wider one, are refused the same way. The
        project-scope variant of the latter reads "Reassigning … would widen
        every holder's access: the replacement includes `<key>` …" and is
        measured against the role being deleted rather than against the caller.


        One ceiling refusal carries a **structured body** instead of a bare
        sentence: restoring open project access when a *per-project* declared
        default would come back above the caller's ceiling
        (`errorType: "REACTIVATED_DEFAULT_ABOVE_CEILING"`, with `projects`,
        `role` and `missing`). It is confined to
        `PATCH /workspaces/{workspaceId}` and
        `POST /workspaces/{workspaceId}/project-access/preview`, which document
        it under `ProjectAccessForbidden`; every other `403` on this API is the
        plain shape, and no `403` ever carries `Retry-After`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ProjectAccessForbidden:
      description: >-
        Missing `workspace.edit` — or a grant-ceiling refusal, which on this
        pair of endpoints arrives in **two different shapes**.


        Flipping `STRICT` → `OPEN` is a grant even when the body names no role:
        every declared default in the workspace stops being inert at that
        moment. When the role that goes live is a **per-project** declared
        default, the body is a `ReactivatedDefaultProblemDetail` —
        `errorType: "REACTIVATED_DEFAULT_ABOVE_CEILING"` plus `projects`, `role`
        and `missing` — because the obstacle is a column on another screen, in
        one of possibly hundreds of projects, and a refusal naming only the role
        would leave the reader opening project settings one at a time to find
        it. When the role that goes live is the **workspace** default, it is the
        ordinary ceiling refusal: the plain sentence, deliberately **no**
        `errorType` and no `projects`, because there is no project to name. The
        workspace default is bounded first, so a flip blocked by both answers
        the plain shape and the structured one appears on the retry.


        **Do not assume `errorType` is present.** Read its absence here as "the
        plain refusal", never as an unrecognised value — the same rule the
        lock-contention `409` establishes (see **Errors** in the introduction).
        And because this is a `403`, the "check `Retry-After` first" rule does
        not apply to it: no variant here is retryable, and none carries the
        header.


        Nothing is written in either shape, and the preview answers identically
        — it runs the same checks and persists nothing.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ProblemDetail'
              - $ref: '#/components/schemas/ReactivatedDefaultProblemDetail'
    NotFound:
      description: Not found — or not a member of the containing workspace
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ValidationError:
      description: >-
        Failed validation — `detail` names the offending fields and the `errors`
        map repeats them keyed by JSON field path (capped at 10 entries, English
        messages). See `ValidationProblemDetail`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblemDetail' }
    UnknownRole:
      description: >-
        The role reference cannot be honoured. Two shapes:


        **The role cannot be assigned here** — `detail` is
        `Unknown role: <what you sent>`. Covers an unknown key or id, a
        reference from the **other** scope (`MANAGER` on a workspace endpoint,
        `OWNER` on a project one; a `WORKSPACE`-scoped `roleId` sent to a
        project endpoint), the wrong case (`owner`), and a **custom role
        belonging to a workspace the caller cannot see**. It also covers
        `reassignToRoleId` on a role delete when it is unknown, foreign, of the
        other scope, or equal to the role being deleted.


        **The role was not named properly** — `Name the role with either roleId
        or role`, or `Send either roleId or role, not both — they do not always
        mean the same role`. Every membership endpoint accepts the new `roleId`
        **and** the deprecated `role` key and requires **exactly one**. "Both"
        is refused rather than resolved by precedence because the two do not
        always mean the same role: the key resolves built-ins only and, on the
        project side, still carries the `VIEWER → MEMBER` translation, so a
        silent winner would store a role the caller did not ask for — in the one
        part of the product where that is a privilege change.


        **One answer for all of them, on purpose.** A `404` for a role that does
        not exist here plus something else for nonsense would be an oracle:
        probe with a role reference, learn from the status code whether it names
        something real in a tenant you have no access to. So every unusable role
        value gets the identical `422`, and `detail` only ever echoes what the
        caller already sent. `400` would be wrong for the opposite reason — the
        request is well-formed, it is the *value* that cannot be honoured, the
        same shape as `"Unknown label"` or `"Unknown sprint"`.


        A body that omits **both** fields is now this `422` and no longer a
        `400`: the body is well-formed and every field validates on its own, so
        it is the combination that cannot be honoured. The endpoint's own
        permission is still checked **before** the value is resolved, so a
        caller who lacks it sees `403` even when the role they sent was also
        nonsense.


        The opposite rule applies to a role id in a **path**
        (`/roles/{roleId}`, the duplicate source): that is an *address*, so it
        answers `404`. See the `roleId` path parameter.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    LastWorkspaceOwner:
      description: >-
        The change would leave the workspace without an `OWNER`. `409` rather
        than `403` on purpose: the caller's permissions are fine, it is the
        workspace's own invariant that refuses. Promote a second owner first.


        The endpoint's other `409` is app-wide rather than specific to it: lock
        contention, which carries `Retry-After` and is worth retrying unchanged
        (see **Errors** in the introduction). This invariant carries no such
        header, because retrying it unchanged cannot help.
      headers:
        Retry-After:
          description: >-
            Seconds to wait. Present only on the lock-contention variant, never
            on the last-owner invariant.
          required: false
          schema: { type: integer, example: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    WorkspaceMemberRemovalConflict:
      description: >-
        One invariant refused the removal — never more than one, and the
        last-owner one is checked first:


        1. the removal would leave the workspace without an `OWNER` (a plain
        `ProblemDetail`; promote a second owner first);

        2. it would leave one or more projects without any member holding
        `project.member.manage` (a `StrandedProjectsProblemDetail`, whose
        `projects` extension names every one of them, and whose `detail` names
        the `adoptStrandedProjects=true` retry that clears it);

        3. the caller asked to adopt (`adoptStrandedProjects=true`) but at least
        one of those projects **cannot** be adopted, because the caller's own
        role there grants something `TEAM_LEAD` does not, so taking it over
        would demote them and the grant ceiling could not give it back. Same
        `StrandedProjectsProblemDetail`, `projects` listing only the blocking
        projects, but `detail` names the obstacle instead of offering a retry
        that would fail identically. Reachable only with a custom project role;
        the remedy is somebody else's action rather than the caller's — ask the
        member being removed, still ACTIVE and still that project's
        administrator, to appoint a successor while they still can, or have
        another workspace administrator who does **not** already work in those
        projects run the removal instead — not one who already administers them,
        which is the set this branch has just proven empty.


        4. the caller asked to adopt and their own membership row in a listed
        project refers to a role that **cannot be resolved** — a mis-scoped,
        foreign or hand-edited `role_id`, which a normal client never meets. The
        server will not overwrite a row it cannot read, so the whole removal is
        refused. Same body again, `errorType: "ADOPTION_ROLE_UNREADABLE"`. It is
        split from case 3 because the two need different handling: case 3 is
        cleared by a named third party, and this one by **nobody party to the
        request** — retrying fails identically, and nothing the caller or the
        member being removed can change affects it. It is a data-integrity fault
        for an operator to repair, already logged as an ERROR and counted before
        the refusal is written. `detail` therefore names no cause (the code
        cannot tell which of them it is) and prescribes no action to its reader,
        because they have none.


        5. the removal would take the last administrator a project had **only
        by inheritance** — its default role grants `project.member.manage`,
        nobody holds an explicit row that does, and the departing member was one
        of the people standing on that default. Same
        `StrandedProjectsProblemDetail`, `errorType:
        "STRANDED_BY_INHERITANCE"`. This one is **not** cleared by
        `adoptStrandedProjects=true` and deliberately offers no retry: adopting
        writes a Team lead row, and the caller here inherits a default at least
        as wide, so it would narrow them in the project they were rescuing. The
        remedy `detail` names is one the caller can perform right now — add an
        explicit administrator to each named project, which the current default
        still lets them do — or ask the departing member to do it while they
        still can.


        Cases 2, 3, 4 and 5 are mutually exclusive and are told apart by
        `errorType`: `"STRANDED_PROJECTS"` for case 2, `"ADOPTION_BLOCKED"` for
        case 3, `"ADOPTION_ROLE_UNREADABLE"` for case 4 and
        `"STRANDED_BY_INHERITANCE"` for case 5. Case 2 depends on the
        flag; when 3 and 4 both apply the server reports **4 first**, deliberately
        — either refusal ends the request, so one is necessarily second, and it
        should not be the one no present party can clear. Case 5 is checked
        **after** 2–4, so a removal that strands projects both ways reports the
        explicit-row one first. Case 1 carries no `errorType`.


        All are `409` rather than `403` for the same reason: the caller's
        permissions are fine, a state invariant is what refuses, and the identical
        request succeeds once the state is fixed (cases 3 and 4 excepted — there
        the state has to be fixed by a colleague and by an operator
        respectively).


        A sixth `409` is possible here and is **not** an invariant: lock
        contention, a plain `ProblemDetail` carrying `Retry-After` and no
        `errorType` (app-wide — see **Errors** in the introduction). So all six
        are told apart by the response and never by the wording of `detail` —
        in this order: `Retry-After` present means lock contention, so retry the
        **identical** request unchanged; otherwise `errorType` names the
        stranded-project variant (`"STRANDED_PROJECTS"` cleared by the
        `adoptStrandedProjects=true` retry, `"ADOPTION_BLOCKED"` cleared by
        somebody else's action, `"ADOPTION_ROLE_UNREADABLE"` cleared only by an
        operator repairing stored data, `"STRANDED_BY_INHERITANCE"` cleared by
        giving each named project an explicit administrator and never by a
        retry); and neither present means the last owner.
        The header has to be checked **first**: an absent `errorType` otherwise
        reads as "no retry available", which is the one wrong answer for a
        lock-contention body.
      headers:
        Retry-After:
          description: >-
            Seconds to wait before retrying. Present **only** on the
            lock-contention variant; an invariant conflict carries no such header
            because retrying it unchanged cannot help.
          required: false
          schema: { type: integer, example: 1 }
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ProblemDetail'
              - $ref: '#/components/schemas/StrandedProjectsProblemDetail'
    StrandedByInheritance:
      description: >-
        The change would leave one or more projects with **nobody able to manage
        their membership**, because their administrators exist only by
        *inheritance* — the project's default role grants
        `project.member.manage`, nobody holds an explicit `project_members` row
        that does, and this write takes that inheritance away. Reachable from a
        flip to `STRICT`, from a workspace default that stops managing members,
        and from a project default that does the same.


        `errorType` is `"STRANDED_BY_INHERITANCE"` and the body is the familiar
        `StrandedProjectsProblemDetail`: same status, same uncapped `projects`
        extension ordered by `key`, same three-name cap on `detail`. **No retry
        flag applies** — `adoptStrandedProjects=true` writes the caller a Team
        lead row, and here the caller has no row at all and inherits a default
        at least as wide as `project.member.manage`, so adopting would *narrow*
        the very person doing the rescuing. The remedy is one the refused caller
        can perform right now, and `detail` states it: give each named project
        an explicit administrator first — the current default still lets you —
        or pick a default that also manages members.


        As with every other `409` on this API, check `Retry-After` **first**: a
        header means [lock contention](#errors), which is retryable unchanged
        and deliberately carries no `errorType`. Only then branch on
        `errorType`, and treat a value you do not recognise as "no recovery I
        know about".


        Nothing is written when this fires — not the mode, not the default, not
        the name.
      headers:
        Retry-After:
          description: >-
            Seconds to wait. Present only on the lock-contention variant, never
            on this invariant — retrying it unchanged cannot help.
          required: false
          schema: { type: integer, example: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/StrandedProjectsProblemDetail' }
    LastProjectAdmin:
      description: >-
        The target is the project's only member holding
        `project.member.manage`, so removing them — **or demoting them to a role
        that does not grant it**, which strands the project with no row removed
        at all — would leave the project with
        nobody able to manage its membership. That permission is not part of
        the workspace-wide curator set, so a workspace `OWNER`/`ADMIN` who is not
        a member of the project cannot step in. `detail` is
        `This is the project's last administrator — add another one first`. The
        check is on the permission rather than on one particular role, so a sole
        administrator is protected whatever role carries it. Add another
        administrator, then retry.


        Only **ACTIVE** accounts count as an administrator here, as at the
        workspace level — a sole administrator who has been deactivated is
        treated as already gone, so this `409` never outlives the account. The
        archived-project exclusion does **not** carry over, though: the
        workspace-level removal skips archived projects so a frozen one cannot
        block an offboarding, while this endpoint keeps protecting them, because
        a project administrator holds `project.archive` and could otherwise
        archive the project and then remove themselves, leaving it frozen with
        nobody able to unarchive it.


        The other `409` here is app-wide rather than specific to these
        endpoints: both the removal and the role change take row locks on the
        project's administrators, which makes them likelier than most writes to
        meet the wait bound every transaction carries, so a lost race answers
        lock contention — a plain `ProblemDetail` carrying `Retry-After`, worth
        retrying **unchanged** (see **Errors** in the introduction). The
        invariant above carries no such header, because retrying it unchanged
        cannot help. Neither variant carries an `errorType`.
      headers:
        Retry-After:
          description: >-
            Seconds to wait. Present only on the lock-contention variant, never
            on the last-administrator invariant.
          required: false
          schema: { type: integer, example: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    RoleConflict:
      description: >-
        A state invariant refused the role write. Four variants, and **three of
        them carry an `errorType`** — branch on that, never on the wording of
        `detail`:


        * **built-in** — `Built-in roles cannot be edited or deleted —
        duplicate it to customise`. A plain `ProblemDetail`, no `errorType`:
        the caller's permissions are fine and nothing about the request is
        unprocessable, it is the nature of the resource that refuses. Keyed on
        the role's `builtIn` flag, never on its key, so a workspace's own custom
        role keyed `ADMIN` is still editable.

        * **stale `version`** — `Role was modified by someone else — refresh and
        retry`. A plain `ProblemDetail`, no `errorType`.

        * **name conflict** — another role of the same scope in this workspace
        already uses this display name (case-insensitively), or it is a
        built-in's display name. A plain `ProblemDetail`, no `errorType`. Keys
        never conflict: they are server-generated and disambiguate themselves
        with a `_2` suffix.

        * `errorType: "ROLE_IN_USE"` — `DELETE` only: the role still has holders
        and the request named no `reassignToRoleId`. This body additionally
        carries the whole `usage` object (`RoleUsageProblemDetail`) so a client
        renders the remap dialog straight from the refusal.

        * `errorType: "SELF_HELD_ROLE"` — one rule, two doors: **you may not
        widen your own access in bulk.** On `DELETE`, the caller holds the role
        being deleted (their workspace membership, or any project membership of
        theirs in this workspace), so a bulk reassign would silently change
        their own access. On `PATCH`, the edit *widens* a `PROJECT`-scoped role
        the caller holds — an edit is a grant to every holder at once, evaluated
        against nobody, so it is otherwise "remove your own row, add it back
        bigger" reassembled out of one call. Narrowing, renaming or
        re-describing a role you hold all stay legal, as does widening one you
        do not hold. No payload — the refusal is about a membership the caller
        can already see.

        * `errorType: "LAST_PROJECT_ADMIN_BULK"` — the change would demote every
        administrator of one or more projects at once: removing
        `project.member.manage` from a PROJECT-scoped role (`PATCH`), or
        reassigning to a role that does not grant it (`DELETE`). Same
        `StrandedProjectsProblemDetail` and `projects` list as the member
        removal, but **no adoption retry exists** — the remedy is the caller's
        own, and `detail` states it **per door**, because the two doors do not
        share one: the edit door says *keep that permission on the role, or give
        each of those projects another administrator first*, while the delete
        door additionally requires the replacement to be **no wider than the
        role being deleted** (naming only the first constraint would send the
        caller into the reassign ceiling's `403`). Render `detail`; do not
        compose the sentence yourself.

        * `errorType: "ROLE_LIMIT_REACHED"` — `POST …/duplicate` only: the
        workspace already holds `app.roles.max-custom-per-workspace` custom
        roles (both scopes counted together; built-in templates belong to no
        workspace and never count). Delete a role you no longer use first. The
        count is taken under a row lock on the workspace, so the cap is
        **exact** rather than advisory — concurrent duplicates cannot overshoot
        it — and the same lock is why this endpoint can also lose a lock race,
        below. The discriminator is what separates the two: they share a status
        and only one of them is worth retrying.


        A last `409` is possible on any of these endpoints and is not an
        invariant at all: **lock contention**, a plain `ProblemDetail` carrying
        `Retry-After` and no `errorType` (see **Errors** in the introduction).
        **Check `Retry-After` first** — an absent `errorType` otherwise reads as
        "no recovery I know about", which is the one wrong answer for a body
        that is simply asking to be retried unchanged.
      headers:
        Retry-After:
          description: >-
            Seconds to wait. Present **only** on the lock-contention variant,
            never on any of the invariants above, because retrying one of those
            unchanged cannot help.
          required: false
          schema: { type: integer, example: 1 }
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ProblemDetail'
              - $ref: '#/components/schemas/RoleUsageProblemDetail'
              - $ref: '#/components/schemas/StrandedProjectsProblemDetail'
    RolePermissionUnprocessable:
      description: >-
        A permission entry cannot be honoured. Each case below is a `422` and is
        about a *value* rather than the shape of the request — the body is
        well-formed JSON and every field validates on its own:


        * an unknown key (`Unknown permission: <key>`) — the write-path half of
        a rule whose read-path half is the opposite: a stored grant this build
        no longer understands is dropped and logged rather than throwing,
        because dropping can only ever narrow a role while throwing on a read
        would take the instance down for one bad row;

        * a permission whose scope is not the role's (`Permission <key> cannot
        be granted by a PROJECT-scoped role …`). This is the load-bearing one: a
        permission set carries no memory of where a grant came from, so a
        PROJECT-scoped role holding `workspace.member.manage` would put it
        straight into every holder's project permissions — an escalation
        assembled entirely from legitimate ids;

        * `ownOnly: true` on a permission whose `supportsOwn` is `false`
        (`Permission <key> cannot be narrowed to objects you own`). Honouring it
        silently would *narrow* the grant behind the administrator's back;
        ignoring it silently would store something other than what was ticked.
        Note the opposite case is **not** an error: a permission with
        `ownRequired: true` (`comment.edit`) is forced own-only rather than
        refused;

        * the same key listed twice (`Permission <key> is listed twice`) —  the
        two entries could disagree about `ownOnly`, and one would win invisibly.


        `POST /workspaces/{workspaceId}/roles/preview` produces exactly the
        same refusals, which is the point of the endpoint.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    UnprocessableReference:
      description: >-
        Unknown status/type/assignee/parent, a workflow-forbidden transition,
        or a target user who may not be assigned in this project
        (`"That user cannot be assigned in this project"` — the target lacks
        `issue.assignable`). The last one is deliberately a `422` and not a
        `403`: the caller was entitled to make the request, the value they sent
        is invalid. It is also deliberately a different sentence from
        `"Unknown assignee"`, so a member is never told a colleague does not
        exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    LabelNameConflict:
      description: >-
        A label with this name already exists in the workspace
        (case-insensitively; an archived label keeps its name slot). The body
        carries the winning label's id in `existingId` so a client can reuse it
        in one round-trip instead of re-listing the catalog.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/LabelConflictProblemDetail' }
    ComponentConflict:
      description: >-
        Either a component with this name already exists **in this project**
        (case-insensitively; an archived component keeps its name slot, so
        unarchive or rename it instead of creating a twin) — the same name in
        another project is fine, components are project-owned — or the project
        itself is archived and its catalog is frozen. Unlike a label conflict
        this body carries **no** `existingId` extension: there is no on-the-fly
        component creation to recover from.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ComponentLeadUnprocessable:
      description: >-
        `leadId` does not resolve to a member of this workspace ("Unknown
        lead" — a foreign-tenant id leaks nothing), or `autoAssign` would end up
        true with no lead.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ReleaseDateOutOfRange:
      description: >-
        `releaseDate` is outside `1000-01-01`…`9999-12-31`. A `LocalDate`
        happily parses values PostgreSQL's `date` column cannot hold, so the
        bound is enforced in the service on every path that accepts the field
        (create, update, release). It is a **`422`**, not a `400`, unlike the
        neighbouring name/length failures: the field is well-formed, its value
        is simply not storable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    VersionConflict:
      description: >-
        Either a version with this name already exists **in this project**
        (case-insensitively; an archived version keeps its name slot, so
        unarchive or rename it instead of creating a twin) — the same name in
        another project is fine, versions are project-owned — or the project
        itself is archived and its release plan is frozen. Like a component
        conflict, and unlike a label one, this body carries **no** `existingId`
        extension.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    SprintConflict:
      description: >-
        Either a sprint with this name already exists **in this project**
        (case-insensitively; a `COMPLETED` sprint keeps its name slot, so rename
        the new one) — the same name in another project is fine, sprints are
        project-owned — or the project itself is archived and its sprints are
        frozen. Like a component/version conflict, this body carries **no**
        `existingId` extension.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ProjectArchived:
      description: >-
        The project is archived — its content is frozen (its component catalog,
        release plan, issues and comments; every management call returns this,
        reads keep working). A caller who *also* lacks the permission the call
        needs gets the `403` instead: permission first, project state second.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: Rate limited — retry after the number of seconds in the `Retry-After` header
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

    StatementBudgetExceeded:
      description: >-
        The request was stopped for outrunning the server’s time budget:
        `422` with `errorType: "STATEMENT_BUDGET_EXCEEDED"` and, deliberately,
        no `Retry-After` — an identical retry costs identical time and is
        refused identically.


        **Deliberately referenced by no operation.** Every application
        transaction is bounded, so this answer belongs to the API as a whole
        rather than to a list of paths — and that list could not be kept true,
        because whether a request outruns the budget follows from how much data
        a workspace holds and not from which endpoint was called. It is defined
        here so the shape has one home; do not "complete" the spec by attaching
        it to whichever endpoints look expensive today.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/StatementBudgetProblemDetail' }

    ReferenceConstraintViolation:
      description: >-
        The write was refused by the database because a reference could not be
        satisfied: `409` with `errorType: "REFERENCE_CONSTRAINT_VIOLATION"`.
        Both directions land here — something still points at a row being
        removed, and a row being written points at something that is no longer
        there — and the body asserts neither, because they cannot be told
        apart without reading the message the database owns. Nothing is
        half-applied.


        **Deliberately referenced by no operation, and not the refusal a
        caller normally meets.** Where an operation can foresee the conflict it
        checks first and answers its own, more specific `409`; this one is the
        guarantee underneath those checks — that no reference is ever left
        stranded, on a path written later that forgets to check as much as on
        the ones documented here. Attaching it to whichever paths look exposed
        today would say the opposite of what it is. It carries no
        `Retry-After`, and names nothing: not the entry, not a count, not the
        constraint.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ReferenceConstraintProblemDetail' }

    ReportWindowRejected:
      description: >-
        `from` is after `to`; the window is wider than
        `app.reports.max-window-days` (the `detail` names the cap, the property
        key and the measured length — the window is **never** silently
        clamped); `from` or `to` falls outside the supported band
        `1970-01-01`…`2200-12-31` (refused in the same name-the-bound wording,
        **before** any date arithmetic runs — an extreme but perfectly parseable
        year used to overflow into a `500`); or a date cannot be parsed. On
        `/flow` an unknown `interval` is a fourth `400` of the same shape.


        Every windowed report shares one implementation of these rules
        (`ReportWindow`) down to the wording of the messages, so `/flow` and
        `/cycle-time` refuse identically. `/aging` and the two sprint reports
        have no window and therefore none of these refusals — an over-long sprint
        is clipped and disclosed (`seriesTruncatedAt`), never refused, because
        its caller stated no window. Their own `400`s are the ones every endpoint
        of this API has: a path or query id that is not a UUID, plus an unknown
        `measure` on `/sprint-burnup`, all raised while binding.


        Tenancy is resolved **before** the window is validated, so a caller who
        cannot see the project gets `404` for a malformed window too — a `400`
        would confirm the project exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ReportThrottled:
      description: >-
        Past this caller's report budget (`app.reports.requests-per-minute`,
        60/min by default, in-memory per app node and disabled wholesale by
        `app.rate-limit.enabled=false`). A **retryable throttle, not a fault**:
        nothing was computed, and retrying after the number of seconds in
        `Retry-After` succeeds — a report is never narrowed or approximated to
        fit a budget.


        The budget covers the whole `…/reports/**` path per principal **plus
        `POST …/search/insights`**, which is a report that does not live under
        the reports base path (its dataset is an HQL query, so it hangs off
        `/search`) and is therefore bound explicitly rather than by prefix. **All
        seven reports share one budget rather than holding one each**, so a page
        opening `/sprint-burnup` and `/sprint-review` together spends two of it,
        and a panel refresh spends one from the same pot. The budget is spent
        **before** the workspace and project are resolved.


        **There is a second, separate budget over `…/search/**` and
        `…/filters/**`** (`app.search.requests-per-minute`, 120/min by default),
        covering `POST …/search`, `/search/schema`, `/search/suggest` and every
        saved-filter operation — validating a saved filter is search-surface work
        wherever it is mounted, and a saved filter is a saved search. It is
        deliberately not folded into the reports pot: somebody typing in a search
        box legitimately fires several requests a minute and must not be starved
        to protect charts.


        **`POST …/search/insights` spends BOTH budgets, and the LOWER CONFIGURED
        VALUE binds.** It sits on the reports limiter deliberately, because
        removing that binding would raise the panel’s allowance to the search
        budget as a side effect. Do not assume which one governs: it follows from
        whatever an operator has configured, so lowering *either* property lowers
        the panel. **A panel refresh therefore competes with report fetches *and*
        with searches.** The per-principal budgets — this one and the search
        budget — are therefore **the one place in this API where `429` precedes
        `404`**: an over-budget caller is refused even for a project they cannot
        see. Keying
        on the caller rather than the project is what keeps that refusal free of
        tenancy information — and it means the budget bounds one **user**, not
        one workspace: aggregate report load still scales with the number of
        members asking.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ReportSprintNotFound:
      description: >-
        The family's `404` — an unknown workspace, an unknown project, a project
        in a **different** workspace and a non-member, all indistinguishable —
        **plus one of its own**: a `sprintId` that does not resolve inside this
        project, including one that belongs to another project or another tenant.


        That last case is the **subject-versus-filter** rule arriving in a status
        code. A sprint is what the report is *about*, so it is resolved through
        its parent and refused when it does not resolve; `typeId` / `componentId`
        / `labelId` on `/flow` and `/cycle-time` are predicates applied inside an
        already project-scoped statement, where an unknown id can only subtract —
        so those narrow to an empty result with a `200` and are disclosed in
        `meta.unmatchedFilters`. Opposite rules on the same base path, and each
        is deliberate.


        **Not to be confused with "no sprint is running."** Omitting `sprintId`
        when the project has no ACTIVE sprint is a `200` with `sprint: null`, not
        this — precisely so that a client can tell a project between sprints from
        a bad id, which a shared `404` would make impossible.


        Tenancy is resolved **before** the sprint is looked up, so a caller who
        cannot see the project gets this `404` whatever they named; and the
        report throttle is spent before either, so a `429` can still precede it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

    SearchThrottled:
      description: >-
        Past this caller's **search** budget (`app.search.requests-per-minute`,
        120/min by default, in-memory per app node, disabled wholesale by
        `app.rate-limit.enabled=false`). A retryable throttle, not a fault: nothing
        was computed, and the identical request succeeds after the number of
        seconds in `Retry-After`.


        The budget covers the whole `…/search/**` path per principal **and the
        whole `…/filters/**` path** — every saved-filter operation, `GET` and
        `DELETE` included, since the binding is by path and not by method. Saved
        filters are on this budget because **HQL validation is search-surface work
        wherever it is mounted**: validating a filter builds the same
        `ResolutionContext` that `GET …/search/schema` pays for — roughly eight
        statements, including a workspace-wide label projection and a full member
        scan — so `POST …/filters` with a deliberately invalid body was an
        unthrottled eight-query refusal loop. It is charged here rather than to the
        reports pot, or to a third one, because a saved filter *is* a saved search:
        the same person doing the same work.


        The budget is **separate from the reports budget** — a person typing in a
        search box legitimately fires several requests a minute, and starving them
        to protect charts would be the wrong trade. It exists because these
        endpoints are the expensive ones rather than the cheap ones: a query may
        carry dozens of text predicates that compile to unanchored, unindexable
        scans over a text column, and the endpoint runs the whole predicate
        **twice** per request (count, then page).


        Keyed on the caller, and spent **before** the workspace is resolved — so an
        over-budget caller is refused even for a workspace they cannot see, and the
        `429` is identical for a real workspace and a nonexistent one.


        **`POST …/search/insights` spends BOTH budgets, and the LOWER CONFIGURED
        VALUE binds.** It sits on the reports limiter deliberately, because
        removing that binding would raise the panel’s allowance to the search
        budget as a side effect. Lowering *either* property lowers the panel, so
        do not assume which one governs. See `ReportThrottled`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ReportCsvNotAcceptable:
      description: >-
        The request `Accept` header excludes `text/csv`. These operations declare
        `produces: text/csv`, so a client asking for `application/json` is refused
        rather than handed a CSV body labelled as JSON.


        Error responses are unaffected by that declaration: a `404`, `429` or
        `400` on one of these paths still comes back as a `application/problem+json`
        problem detail, not as CSV.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
  headers:
    ReportCsvDisposition:
      description: >-
        Always `attachment`, with a **server-built** filename — never one the
        client supplied. The shape is `<PROJECT KEY>-<report>-<YYYY-MM-DD>.csv`,
        e.g. `DEMO-velocity-2026-08-20.csv`. The date comes from the same
        `computedAt` the file’s header prints, so the name and the contents can
        never disagree — which is what tells two exports of the same report apart
        in a downloads folder.
      schema: { type: string, example: 'attachment; filename="DEMO-velocity-2026-08-20.csv"' }
    ReportCacheControl:
      description: >-
        Always `private, max-age=60`. `private` is the load-bearing half: a
        report is one tenant's data and must never be held by a shared cache.
      schema: { type: string, example: 'private, max-age=60' }
    ReportVary:
      description: >-
        Always `Authorization`. A browser's HTTP cache keys on (method, URL) and
        **ignores request headers unless `Vary` names them**, so without this a
        shared-profile browser could replay a cached `200` to a different bearer
        token inside the 60 s — one the server would have answered `404`.
        `private` is a promise the cache has to be told how to keep.
      schema: { type: string, example: Authorization }

  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457 problem details
      properties:
        type: { type: string, example: 'about:blank' }
        title: { type: string, example: Conflict }
        status: { type: integer, example: 409 }
        detail: { type: string, example: Issue was modified by someone else — refresh and retry }

    ValidationProblemDetail:
      description: >-
        The `400` body of a request that fails bean validation. `detail` names
        every offending field and `errors` carries the same failures keyed by
        JSON field path — both are rendered from one sorted list capped at 10
        entries, so the two halves never disagree; an overflow is appended to
        `detail` as `"; … and N more"`. Constraint messages are always English
        regardless of `Accept-Language`, and are human-readable text: match on
        the `errors` keys instead.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            detail:
              type: string
              description: >-
                The reported failures joined with `"; "`, each rendered as
                `<field>: <message>`. The field prefix is omitted when the
                message already starts with the field path, so a full-sentence
                constraint message is not stuttered back.
              example: 'key: Key must be uppercase letters and digits only; name: must not be blank'
            errors:
              type: object
              description: >-
                Failed fields keyed by JSON path, nested paths included
                (`delivery.preset`, `items[3].fieldId`). A cross-field
                (class-level) rule has no field of its own and lands under the
                empty-string key `""`; its message is rendered bare in `detail`.
                One message per field — the first failed constraint wins.
              additionalProperties: { type: string }
              example:
                key: Key must be uppercase letters and digits only
                name: must not be blank

    StatementBudgetProblemDetail:
      description: >-
        The `422` body of a request the server stopped for outrunning its time
        budget. Any operation that touches the database can answer it — the
        bound is applied to every application transaction rather than to a
        chosen set of handlers — so it is documented as a property of the API
        and deliberately listed under no individual path.


        It carries **no `Retry-After`**, and that absence is the contract: the
        same request over the same data costs the same time, so an identical
        retry is refused identically. What clears it is a smaller request (a
        shorter date range, a tighter filter, fewer rows) or an operator raising
        the budget — not an administrator the caller can necessarily reach, which
        is why `detail` never prescribes one.
        Contrast the lock-contention `409`, which does carry `Retry-After` and
        *is* worth retrying unchanged.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            status: { type: integer, example: 422 }
            detail:
              type: string
              description: >-
                Names the budget in human units, and offers narrowing only where
                narrowing is possible — some bounded requests take no parameter
                that could narrow anything — so where nothing can be narrowed
                the sentence closes the loop rather than trailing off: it says
                the request is larger than this instance is configured to
                answer. That ending describes the situation rather than
                prescribing an action, since the reader may have none. It never
                names the property, the environment variable or the database
                setting behind the budget: those are the operator’s, and the
                operator’s copy of this refusal is a log line.
              example: >-
                This request was stopped after 10 seconds — it is too expensive
                to complete on this instance. If it takes a date range or
                filters, narrow them; otherwise this request is larger than this
                instance is configured to answer. Retrying it unchanged will take
                just as long.
            errorType:
              type: string
              enum: [STATEMENT_BUDGET_EXCEEDED]

    ReferenceConstraintProblemDetail:
      description: >-
        The `409` body of a write the database refused because a reference
        could not be satisfied. It belongs to the API rather than to a list of
        paths — it is what makes "no reference is ever left stranded" true of
        every path, including one added later that forgets its own check — so
        it is defined here and attached to no operation.


        The refusal a caller normally meets is the endpoint's own pre-check
        `409`, which knows what is in the way and can therefore prescribe a
        remedy for it. This is the backstop under it and prescribes no
        direction-specific remedy, because it cannot tell whether it caught a
        row that is still pointed at or a write pointing at a row that is gone,
        and those two want opposite actions. Never a `500`.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            status: { type: integer, example: 409 }
            detail:
              type: string
              description: >-
                Direction-neutral, which is a constraint rather than a style:
                the reachable case is an ordinary write racing a concurrent
                delete, whose author can neither remap nor archive anything. So
                it prescribes only the recovery that holds in both directions —
                re-read, then retry — and names nothing: not the entry, not a
                count, not the constraint. It says "in a moment" because a
                reload can still be served a briefly cached copy of the project
                catalog, so an entry already deleted may keep being offered for
                a short while; the wording carries that limit rather than this
                handler reaching into another feature's cache to hide it. No
                `Retry-After` accompanies it and no schedule is implied. The
                direction and the offending key go to the server log, which is
                the operator's copy of this refusal.
              example: >-
                This change conflicts with a related record, so it was not
                applied. Something else may have changed at the same time —
                reload and try again in a moment.
            errorType:
              type: string
              enum: [REFERENCE_CONSTRAINT_VIOLATION]

    HqlProblemDetail:
      description: >-
        The `422` body for an invalid HQL query. Beyond the standard problem
        fields it carries the machine-readable highlight/anchor the search UI
        uses to underline the offending part of the query.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errorType:
              type: string
              enum: [PARSE_ERROR, SEMANTIC_ERROR]
            position: { type: integer, description: '0-based character offset into the query', example: 12 }
            length: { type: integer, description: 'Length of the highlight span (PARSE_ERROR)', example: 4 }
            token: { type: string, nullable: true, description: 'The offending token, when known (PARSE_ERROR)' }
            field: { type: string, description: 'The offending field name (SEMANTIC_ERROR)', example: assignee }

    LabelConflictProblemDetail:
      description: >-
        The `409` body for a duplicate label name (create, or a rename that
        races another one). Beyond the standard problem fields it carries the id
        of the label that already owns the name, so a picker can attach the
        existing label without a second round-trip.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            existingId:
              type: string
              format: uuid
              nullable: true
              description: >-
                The label that already uses this name. Null only in the rare
                case where the winner could not be re-read (e.g. it was deleted
                between the failed insert and the lookup).

    StrandedProjectsProblemDetail:
      description: >-
        The `409` body of a change refused because it would leave one or more
        projects without any member holding `project.member.manage`: a workspace
        member removal, a role edit that strips that permission from a
        `PROJECT`-scoped role, or a role delete whose reassignment target does
        not grant it — or, when `adoptStrandedProjects=true` was sent on a
        removal, because one of those projects cannot be adopted without
        demoting the caller. **All of those share this body** — same status, same
        `projects` extension — so a client that only renders "these projects are
        in the way" stays correct without telling them apart. One that offers a
        retry **must** tell them apart, and `errorType` is how: the two demand
        opposite behaviour, and `detail` is prose, not a contract. The parts
        have three consumers: `errorType` is the discriminator, `detail` is a
        sentence to render verbatim and is capped, `projects` is the complete
        machine-readable list. A client must read `projects`.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errorType:
              type: string
              enum: [STRANDED_PROJECTS, ADOPTION_BLOCKED, ADOPTION_ROLE_UNREADABLE, LAST_PROJECT_ADMIN_BULK, STRANDED_BY_INHERITANCE]
              description: >-
                Which refusal this is — **always present** on this body, and the
                only supported way to tell them apart. `STRANDED_PROJECTS` is
                the ordinary refusal: repeating the request with
                `adoptStrandedProjects=true` will clear it, so an adopt button
                is safe to offer. `ADOPTION_BLOCKED` means that retry has
                already been made and fails identically, so do not offer one;
                the way out is a named third party's action.
                `ADOPTION_ROLE_UNREADABLE` is the same stop reached for a
                different reason — a membership row whose stored role cannot be
                resolved — and it is cleared by nobody party to the request:
                no retry, no action by the caller or by the member being
                removed, only an operator repairing the row. When it and
                `ADOPTION_BLOCKED` both apply, this one is reported first, so
                the caller is not sent to arrange a handover that would then hit
                a refusal they cannot clear either.
                `LAST_PROJECT_ADMIN_BULK` comes from the **role** endpoints
                instead of a member removal — an edit or a delete-with-reassign
                that would demote every administrator of the listed projects at
                once — and has no retry flag at all. Its remedy differs per
                door and is spelled out in `detail`, which is why a client
                should render that sentence rather than composing one. Treat a value
                you do not recognise as `ADOPTION_BLOCKED` — "no recovery I know
                about" is the only default that cannot invent a button that
                `409`s.


                `STRANDED_BY_INHERITANCE` is the project-access family: a
                workspace member removal, a flip to `STRICT`, or a change to
                either default-role column that takes away an inheritance no
                explicit membership row was standing in for — the listed
                projects would be left with nobody able to manage their
                membership. **No retry flag applies to it either**, and offering
                one would be worse than useless: `adoptStrandedProjects=true`
                writes a Team lead row, while the caller here holds no row and
                inherits a default at least as wide, so adopting would narrow
                the rescuer. `detail` names a remedy the refused caller can
                perform now — give each named project an explicit administrator
                while the current default still lets you, or choose a default
                that also manages members.


                Do not read the **absence** of `errorType` as an unrecognised
                value: a `409` without it is not this schema at all, but the
                last-owner invariant or lock contention — and the latter *is*
                retryable, identified by its `Retry-After` header.
              example: STRANDED_PROJECTS
            detail:
              type: string
              description: >-
                Names at most **three** projects as `<name> (<key>)`,
                summarises the remainder as `and N more`, and ends by naming the
                `adoptStrandedProjects=true` retry, so the sentence stands on its
                own for a reader who never sees the extension. Prose for a human,
                not a contract — do not parse it, and do not derive the count of
                affected projects from it. The cannot-adopt variant
                (`errorType: "ADOPTION_BLOCKED"`) uses the same cap and names no
                retry, e.g. `Your own role in Alpha (P17) holds more than "Team
                lead" does, so taking it over would take that away from you and
                nobody could give it back. Ask the member you are removing to
                appoint another administrator there while they still can, or have
                another workspace administrator who does not already work in that
                project run the removal instead.` The unreadable variant
                (`errorType: "ADOPTION_ROLE_UNREADABLE"`) names no retry and no
                remedy its reader can perform, only the operator repair: `Your
                membership in Alpha (P17) refers to a role that cannot be read,
                so that project cannot be taken over automatically and the
                removal has been left untouched. …`
              example: 'Removing this member would leave 4 projects without an administrator: Alpha (P17), Bravo (P42), Charlie (P8) and 1 more. Give each another administrator first, or repeat this request with adoptStrandedProjects=true to take them over yourself.'
            projects:
              type: array
              description: >-
                **Every** affected project, ordered by `key` — uncapped, unlike
                `detail`. Naming them discloses nothing: each belongs to the
                workspace the caller is already administering and is listable via
                `GET /workspaces/{workspaceId}/projects`. On the cannot-adopt
                variant it lists only the projects that block the adoption, which
                may be a subset of what the first `409` named.
              items: { $ref: '#/components/schemas/ProjectRef' }

    ReactivatedDefaultProblemDetail:
      description: >-
        The `403` body of a flip from `STRICT` to `OPEN` refused because it
        would make a **per-project** declared default live again, and that
        default grants more than the caller may grant. Returned by
        `PATCH /workspaces/{workspaceId}` and by
        `POST /workspaces/{workspaceId}/project-access/preview`.


        Split out of the generic ceiling refusal because that one names a role
        and a permission, which are the wrong two facts here: the reader is
        flipping one switch on the workspace's General page while the obstacle
        is a column in some *other* project's settings, one of possibly
        hundreds, and without `projects` they cannot act at all. The remedy is
        deliberately three-part and is stated in `detail`, because which parts
        are open to this reader is not something the server can see — a built-in
        role cannot be narrowed, and clearing a project's override needs
        `project.member.manage` **in that project**, which is outside the
        workspace-wide curator set and therefore granted by no workspace role.
        The last part — ask a workspace Owner — always exists, which is what
        makes this a guard rather than a lock-out.


        The **workspace-default** branch of the same refusal deliberately keeps
        the generic ceiling body, with no `errorType` and no `projects`: there
        is no project to name. So one status has two shapes on one endpoint, and
        a client must not assume the discriminator is present — the rule the
        lock-contention `409` already establishes.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errorType:
              type: string
              enum: [REACTIVATED_DEFAULT_ABOVE_CEILING]
              description: >-
                **Always present on this body**, and the only supported way to
                tell it from the plain ceiling `403` the same endpoints also
                answer. A code rather than prose because the client's next
                action is distinct from every other `403` in this area: a plain
                ceiling refusal is cleared in the picker the client is already
                showing, this one in another project's settings and possibly by
                somebody else. Its **absence** is not an unknown value — it
                means the plain refusal.
              example: REACTIVATED_DEFAULT_ABOVE_CEILING
            detail:
              type: string
              description: >-
                Names at most **three** projects as `<name> (<key>)`,
                summarises the remainder as `and N more`, names the role and the
                missing permission, and ends with all three remedies. Prose for
                a human: render it verbatim, do not parse it, and do not derive
                the number of affected projects from it.
              example: 'Restoring open project access would make “Project admin” the default in Payments (PAY), Ops (OPS), and it includes issue.delete — a permission you do not hold in this workspace. Narrow that role if it is one you can edit, ask an administrator of each of those projects to clear its default, or ask a workspace Owner to make this change.'
            projects:
              type: array
              description: >-
                **Every** live project whose declared default names the
                offending role — uncapped, unlike `detail`, and in no guaranteed
                order. One body reports one role, so a project declaring a
                *different* over-ceiling role is not listed here: it surfaces as
                its own refusal on the retry. Archived projects are excluded,
                because nothing is inherited in them. Naming these discloses
                nothing — the caller holds `workspace.edit` and can already list
                every project of the workspace via
                `GET /workspaces/{workspaceId}/projects`.
              items: { $ref: '#/components/schemas/ProjectRef' }
            role:
              type: string
              description: >-
                The display name of the role those projects declare as their
                default.
              example: Project admin
            missing:
              type: string
              description: >-
                The first permission key the caller's baseline does not cover —
                the identical string `settable.cannotSet[].missing` greys the
                equivalent role out with in the pickers, because it is the same
                comparison over the same comparand.
              example: issue.delete

    MemberRemovalResponse:
      type: object
      description: >-
        The `200` body of `DELETE
        /workspaces/{workspaceId}/members/{userId}` when
        `adoptStrandedProjects=true` actually granted something. A removal that
        grants nothing stays `204` with no body.
      properties:
        adoptedProjects:
          type: array
          description: >-
            The projects the caller now administers (built-in project role
            `TEAM_LEAD`), ordered by `key`. Server-derived and never an echo of
            client input — the client cannot name a project — and never empty:
            an empty adoption is a `204`. Where the caller already held a
            membership row in one of these, that row was promoted in place.
          items: { $ref: '#/components/schemas/ProjectRef' }

    MessageResponse:
      type: object
      properties:
        message: { type: string }

    PageResponse:
      type: object
      description: >-
        Uniform pagination envelope. `content` holds the page of rows (the item
        type is documented per endpoint); the rest is the cursor metadata the
        client needs to render a pager.
      properties:
        content:
          type: array
          description: The rows on this page (item type per endpoint)
          items: {}
        page: { type: integer, description: Zero-based index of this page, example: 0 }
        size: { type: integer, description: Page size actually used, example: 50 }
        totalElements: { type: integer, format: int64, description: Total rows across all pages, example: 137 }
        totalPages: { type: integer, description: Total number of pages, example: 3 }
        hasNext: { type: boolean, description: Whether a further page exists, example: true }

    MetaResponse:
      type: object
      properties:
        publicLandingEnabled: { type: boolean }
        termsAcceptanceRequired: { type: boolean }
        publicSignupEnabled: { type: boolean }
        version: { type: string, example: 0.2.0 }

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 100 }
        displayName: { type: string, minLength: 2, maxLength: 100 }
        termsAccepted:
          type: boolean
          description: Required to be `true` when the instance enforces terms acceptance

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: One-time token from the verification email }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string }

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string, description: JWT for the Authorization header }
        expiresIn: { type: integer, format: int64, example: 1800, description: 'Access token lifetime, seconds (default 30 min)' }
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }

    MeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        systemRole: { type: string, enum: [ADMIN, USER] }
        needsOnboarding:
          type: boolean
          description: >-
            Cloud only — true until the user creates or joins their first team
            (or skips the welcome screen). Always false when onboarding is
            disabled (e.g. DC).

    PendingInvite:
      type: object
      description: A workspace invite addressed to the current user (onboarding "join a team")
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        workspaceName: { type: string }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        invitedByName: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    WorkspaceRole:
      type: string
      example: ADMIN
      description: >-
        A **workspace role key**. `OWNER`, `ADMIN` and `MEMBER` are the built-in
        ones and are spelled exactly as they always were, so nothing that sends
        or reads these values breaks.


        **Deliberately not an `enum`.** The field is an open string because a
        workspace **can now define roles of its own** (see the **Roles** tag),
        whose key travels in exactly this field — a client that switches
        exhaustively, or generates a closed union / enum deserializer from this
        schema, breaks the first time it meets one. Display an unrecognized
        role; never decide with it. For decisions use `myPermissions`.


        A value this instance cannot assign is `422 "Unknown role"` (see the
        `UnknownRole` response), never a silent fallback and never a `404`. As a
        **request** field it is now deprecated in favour of `roleId`, which is
        the only way to name a custom role.

    ProjectRole:
      type: string
      example: MANAGER
      description: >-
        A **project role key**. `MANAGER`, `TEAM_LEAD`, `MEMBER`, `COMMENTER`
        and `VIEWER` are the built-in ones. Open string rather than an `enum`
        for the same reason as `WorkspaceRole` — do not switch exhaustively on
        it.


        `TEAM_LEAD` ("Team lead") is **new in both directions**: it is assignable
        through `POST /workspaces/{workspaceId}/projects/{projectId}/members`
        and it is returned in a member's `role` and in a project's `myRole`, so a
        client that enumerates project role values will meet one it has not seen
        before. It grants everything the contributor role `MEMBER` grants plus
        `project.member.manage`, and nothing else — no `issue.delete`, no
        unrestricted `attachment.delete`, no
        `project.archive`/`project.edit`/`project.taxonomy.manage`, no
        `sprint.manage`/`version.manage`/`component.manage`. It is also what an
        adoption grants (see `adoptStrandedProjects` on
        `DELETE /workspaces/{workspaceId}/members/{userId}`).


        Three notes when **sending** one: `TEAM_LEAD` is newly assignable,
        `COMMENTER` is newly assignable (it was rejected before), and `VIEWER`
        is accepted but **stored as `MEMBER`** — the built-in role keyed
        `VIEWER` now grants nothing, whereas it used to mean "no explicit row",
        which granted everything. The response echoes what was stored, so this
        value does not round-trip. Sending the built-in Viewer's **`roleId`**
        instead stores it verbatim, which is how a genuinely read-only project
        membership is expressed.


        As a **request** field this key is now deprecated in favour of `roleId`,
        which is also the only way to name one of the workspace's own custom
        project roles.

    PermissionScope:
      type: string
      enum: [WORKSPACE, PROJECT]
      description: >-
        The object a permission is granted on, and therefore which response
        carries it: a `WORKSPACE` key can only appear in a workspace's
        `myPermissions`, a `PROJECT` key only in a project's.

    PermissionCapabilityHint:
      type: string
      enum: [BOARD, RELEASES, null]
      nullable: true
      description: >-
        The delivery capability this permission is *about* — `null` for most
        entries. A **labelling hint only, never a check**: a project with
        `delivery.board: KANBAN` still enforces `sprint.manage` in exactly the
        same way, and `delivery.releases: false` changes nothing about
        `version.manage`. Capabilities decide what a UI offers, permissions
        decide what the API allows, and neither substitutes for the other.

    PermissionCatalogEntry:
      type: object
      description: >-
        One entry of `GET /permissions`. Describes a permission's shape, not
        whether you hold it — that is `myPermissions`.
      properties:
        key:
          type: string
          maxLength: 64
          example: sprint.manage
          description: >-
            The permanent wire key — `area.action`, lowercase, dot-separated, at
            most 64 characters, and never containing a `:`. This is the exact
            string that appears in a `myPermissions` array (optionally suffixed
            with `:own`).
        scope: { $ref: '#/components/schemas/PermissionScope' }
        supportsOwn:
          type: boolean
          description: >-
            Whether a grant of this permission may be narrowed to objects the
            caller owns — i.e. whether the `key:own` form can ever appear in a
            `myPermissions` array. `false` for most entries.
        ownRequired:
          type: boolean
          description: >-
            Whether the permission may **only** be granted own-only. Implies
            `supportsOwn: true`, and means the bare key never appears in any
            `myPermissions` — only the `:own` form does.
        capability: { $ref: '#/components/schemas/PermissionCapabilityHint' }

    MyPermissions:
      type: array
      items: { type: string }
      example: ['issue.create', 'issue.edit:own', 'comment.create', 'comment.edit:own']
      description: |-
        The **requesting user's** effective permissions on the object carrying
        this field, as flat keys from the catalog published by
        `GET /permissions`. It is the intended way for a client to decide what
        to show.

        * **Always present**, in catalog order. An empty array is a real answer
          (a caller with no grants); the field is never `null` and never
          omitted, so a client must never read "absent" as "allowed".
        * **The caller only** — never another user's permissions.
        * **Scoped to the object it rides**: a workspace's array holds only
          `WORKSPACE`-scoped keys, a project's only `PROJECT`-scoped ones —
          including any the caller gets in that project by virtue of their
          workspace role rather than a project membership.

        **The `:own` suffix.** An entry is either the bare key
        (`"issue.edit"` — the permission for *any* object) or the key plus
        `:own` (`"issue.edit:own"` — only objects the caller owns: the issue's
        reporter, the comment's author, the attachment's uploader, the label's
        creator). At most one of the two forms appears for a given permission.

        `"issue.edit"` and `"issue.edit:own"` are **two distinct values, not a
        prefix relationship**. An own-only grant does **not** satisfy an
        unrestricted check. Compare with equality:
        `perms.includes('issue.edit')` for the unrestricted question, and
        `perms.includes('issue.edit') || (isMine && perms.includes('issue.edit:own'))`
        for the per-object one. A `startsWith`/prefix match is the one way to
        get this wrong, and it fails in the *widening* direction — it would read
        an own-only grant as permission over everyone's objects. (Keys never
        contain `:`, so the suffix is unambiguous to split on; equality is still
        the safer test.)

        **Not an authorization boundary.** The API enforces its own rules on
        every request regardless of what a client rendered; `myPermissions` only
        lets the client hide what would be refused anyway. Hiding a control is a
        UX decision, never a security control.

    RoleScope:
      type: string
      enum: [WORKSPACE, PROJECT]
      description: >-
        Which object a role is held on, and therefore which permissions it may
        contain: a `WORKSPACE` role may only hold `WORKSPACE`-scoped
        permissions, a `PROJECT` role only `PROJECT`-scoped ones (`422`
        otherwise). It is **immutable after creation** and is not on any update
        request — a role whose scope could change would turn every existing
        assignment of it into a wrong-scope row, which is the one corruption
        this model has no way to detect after the fact.


        Scope is also part of every role lookup rather than a hint: `MEMBER`
        names a different built-in in each scope.

    RolePermissionEntry:
      type: object
      description: >-
        One grant on a role, in the **object form** —
        `{"key": "comment.edit", "ownOnly": true}`. Deliberately not
        `myPermissions`' flat `"comment.edit:own"` wire form: a role editor
        needs the own toggle as a field it can render and send back, while the
        suffix encoding exists so a client gate can do one string comparison
        against a flat list. Both are produced from the same stored grants, so
        they cannot disagree.
      required: [key]
      properties:
        key:
          type: string
          maxLength: 64
          example: issue.transition
          description: >-
            A permission key exactly as `GET /permissions` publishes it. An
            unknown key is `422`.
        ownOnly:
          type: boolean
          default: false
          description: >-
            Narrow the grant to objects the caller owns. Optional and defaults
            to `false` — an unqualified grant is the unrestricted one, which is
            also the common case. `true` on a permission whose `supportsOwn` is
            `false` is a `422` rather than being silently ignored. A permission
            with `ownRequired: true` (`comment.edit`) is **forced** own-only on
            the way in, so it always reads back as `true`.

    RoleRef:
      type: object
      description: >-
        The smallest useful reference to a role: enough to render a chip and
        enough to send back as an assignment. Every role named in one of these
        is one the caller can already list through
        `GET /workspaces/{workspaceId}/roles`.
      properties:
        roleId: { type: string, format: uuid }
        name: { type: string, example: Contributor }

    RoleBlocker:
      type: object
      description: >-
        A role this one **cannot** assign, and the first permission that is
        why.
      properties:
        roleId: { type: string, format: uuid }
        name: { type: string, example: Contributor }
        missing:
          type: string
          example: issue.rank
          description: >-
            The offending permission **key** — never a rendered sentence, so
            the client owns the copy. It is the same string the runtime `403`
            quotes when a real assignment is refused, because both come from
            the same server-side comparison.

    RoleAssignmentView:
      type: object
      description: |-
        **What this role could hand out, derived by the server.** It exists so
        the grant ceiling is visible while a role is being composed rather than
        as a `403` six weeks later, and it is computed by the *same* call the
        runtime ceiling makes — which is the only reason a preview and a
        refusal cannot disagree. Do not re-implement it in a client: the
        own-only/unrestricted asymmetry is subtle, and a second implementation
        of a server predicate is a bug by construction.

        **Advisory, for rendering only** — exactly like `myPermissions`. The API
        is the enforcement boundary and performs its own check on every request,
        whatever a client drew from this block.

        **It is a lower bound.** It is computed from the role *alone*, and
        ignores what a real holder additionally gets from their workspace role
        (`project.curate.all` / `project.administer.all`), so a holder may in
        practice assign more than `canAssign` lists. That is the conservative
        direction, and the one `warnings` is about. Render it as "on its own,
        this role can assign: …".

        Computed against every role of the **same scope** available in this
        workspace (built-ins plus custom), excluding the role itself.
      properties:
        managesMembers:
          type: boolean
          description: >-
            Whether the role holds `workspace.member.manage` /
            `project.member.manage` **unrestricted** for its own scope — i.e.
            whether it can assign anybody at all.
        canAssign:
          type: array
          description: Roles this one entirely covers, and may therefore hand out.
          items: { $ref: '#/components/schemas/RoleRef' }
        cannotAssign:
          type: array
          description: >-
            Roles it does not cover, each with the first permission it is
            missing.
          items: { $ref: '#/components/schemas/RoleBlocker' }
        warnings:
          type: array
          description: >-
            Machine-readable codes, so a client renders copy rather than
            re-deriving the condition. Today there is exactly one:
            `MANAGES_MEMBERS_BUT_ASSIGNS_NOTHING`, which fires when the role
            manages a roster and yet every role it can assign grants nothing —
            somebody who can add people to a project and cannot give any of them
            the ability to do a single thing. (Note this is not literally
            "`canAssign` is empty": the built-in Viewer grants the empty set and
            the empty set is covered by every set, so every role can assign
            Viewer.) **Warn, never block** — a role granting nothing is legal
            and an intermediate save is legitimate. Treat an unrecognised code
            as informational.
          items: { type: string }
          example: [MANAGES_MEMBERS_BUT_ASSIGNS_NOTHING]

    RoleAssignmentPreviewResponse:
      type: object
      description: >-
        The body of `POST /workspaces/{workspaceId}/roles/preview` — the derived
        block on its own, wrapped rather than returned bare so the shape matches
        the same key on a `RoleResponse` and one component renders both.
      properties:
        assignment: { $ref: '#/components/schemas/RoleAssignmentView' }

    RoleUsageResponse:
      type: object
      description: >-
        Where a role is currently in play. The body of
        `GET /workspaces/{workspaceId}/roles/{roleId}/usage`, the optional
        `usage` block on the roles list, and the `usage` extension on the
        `ROLE_IN_USE` `409`.


        **Every count is filtered to this workspace** — built-in roles are
        shared rows belonging to no workspace, so an unscoped count would
        publish another tenant's headcount.
      properties:
        roleId: { type: string, format: uuid }
        members:
          type: integer
          format: int64
          description: Workspace memberships holding it (`WORKSPACE` scope).
        invites:
          type: integer
          format: int64
          description: Pending, not-yet-accepted invites carrying it (`WORKSPACE` scope).
        projectMembers:
          type: integer
          format: int64
          description: Project memberships holding it in this workspace (`PROJECT` scope).
        projects:
          type: integer
          format: int64
          description: >-
            How many distinct projects those memberships are spread across —
            the number a "used in N projects" line wants. It is not an
            independent kind of usage and does not feed `inUse`.
        defaultForProjects:
          type: integer
          format: int64
          description: Projects naming it as their default project role.
        defaultForWorkspace:
          type: boolean
          description: Whether the workspace names it as its default project role.
        inUse:
          type: boolean
          description: >-
            The exact disjunction the delete guard uses (`members`, `invites`,
            `projectMembers`, `defaultForProjects`, `defaultForWorkspace` —
            **not** `projects`), published so a client cannot compute a
            different answer from the parts and then be surprised by a `409`.

    RoleResponse:
      type: object
      description: >-
        One role, as a roles screen and a role editor see it.
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/RoleScope' }
        key:
          type: string
          maxLength: 40
          example: QA_LEAD
          description: >-
            The stable key. For a built-in it is the value that travels in every
            `role` / `myRole` field (`OWNER`, `MANAGER`, …). For a custom role
            it is **server-generated** from the name and never accepted from a
            client — a client-chosen key could collide with a built-in's, which
            the database would permit and every operator reading it would
            misread.
        name: { type: string, maxLength: 80, example: QA lead }
        description:
          type: string
          maxLength: 500
          nullable: true
        builtIn:
          type: boolean
          description: >-
            A built-in template, visible to every workspace because it is
            product metadata rather than tenant data, and neither editable nor
            deletable (`409`). Branch on **this flag**, never on the key: a
            workspace may legally own a custom role keyed `ADMIN`.
        position:
          type: integer
          format: int32
          description: Display order within the scope. Server-assigned.
        version:
          type: integer
          format: int64
          description: >-
            Echo it back on a `PATCH` to get a `409` instead of silently
            overwriting somebody else's edit.
        permissions:
          type: array
          description: >-
            The role's grants, in catalog order, in the object form. Rendered
            from the *resolved* permission set rather than from stored rows, so
            a grant this build no longer understands is dropped here exactly as
            it is dropped on the authorization path — this shows what the role
            actually does.
          items: { $ref: '#/components/schemas/RolePermissionEntry' }
        assignment: { $ref: '#/components/schemas/RoleAssignmentView' }
        usage:
          allOf:
            - $ref: '#/components/schemas/RoleUsageResponse'
          nullable: true
          description: >-
            Present only when it was asked for: on
            `GET …/roles/{roleId}/usage`, and on the list with
            `includeUsage=true` for a caller holding `workspace.role.manage`.
            Otherwise `null`.


            **`null` and a zeroed object are different answers.** `null` means
            "not requested" and says nothing about whether the role is in use; a
            role that is in play nowhere comes back as a full object with every
            count `0` and `inUse: false`, identical to what
            `GET …/roles/{roleId}/usage` answers for it. So a client that asked
            for usage never has to distinguish "unused" from "unknown", and one
            that did not ask must not read `null` as "unused".

    DuplicateRoleRequest:
      type: object
      description: >-
        The body of the only creation door. `scope`, the permission set and
        `key` are all absent on purpose: the first two are copied from the
        source, and the key is generated server-side.
      properties:
        name:
          type: string
          maxLength: 80
          description: >-
            Defaults to `"<source name> copy"`. Must be unique within
            (workspace, scope) and must not equal a built-in's display name in
            that scope, case-insensitively — `409` otherwise. Names are guarded
            rather than keys because names are what users read.
        description:
          type: string
          maxLength: 500
          description: Defaults to the source's description.

    UpdateRoleRequest:
      type: object
      description: >-
        Every field is optional; omit one to leave it alone. `scope`, `key`,
        `builtIn` and the owning workspace are deliberately not here — they are
        identity, not configuration.
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        permissions:
          type: array
          maxItems: 64
          description: >-
            **A full replacement** when present; omit it (or send `null`) to
            leave the grants untouched. An empty array is a real value — a role
            granting nothing is legal. It cannot be a delta: a partial list
            would be indistinguishable from a role that should lose everything
            not mentioned.
          items: { $ref: '#/components/schemas/RolePermissionEntry' }
        version:
          type: integer
          format: int64
          description: >-
            The `version` from the role you loaded. Present and stale is `409`
            "Role was modified by someone else"; absent is last-writer-wins.
            Send it — two administrators each unticking one box would otherwise
            silently restore each other's, and the loser's revocation would look
            like it had been applied.

    PreviewRoleRequest:
      type: object
      description: >-
        The dry-run body. Same permission shape as an update, plus a required
        `scope` because there is no stored role to take one from. Nothing is
        persisted, and this is not a way to change a role's scope.
      required: [scope]
      properties:
        scope: { $ref: '#/components/schemas/RoleScope' }
        permissions:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/RolePermissionEntry' }

    RoleUsageProblemDetail:
      description: >-
        The `409` body of a role delete refused because the role still has
        holders and no `reassignToRoleId` was given. It carries the complete
        usage counts so a client can render the remap dialog **from the
        refusal**, without a second request. Naming them discloses nothing:
        every count is scoped to the workspace the caller is already
        administering, and they hold `workspace.role.manage` or they would not
        have reached this at all.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errorType:
              type: string
              enum: [ROLE_IN_USE]
              description: Always `ROLE_IN_USE` on this body.
              example: ROLE_IN_USE
            usage: { $ref: '#/components/schemas/RoleUsageResponse' }

    Priority:
      type: object
      description: Catalog entity (was a closed enum before M1)
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: High }
        color: { type: string, example: '#EA580C' }
        icon: { type: string, nullable: true, example: chevron-up, description: lucide icon name }
        position: { type: integer }

    StatusCategory:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
      description: Drives board grouping and backlog filtering

    # ---- Admin console schemas ----

    UsageInfo:
      type: object
      description: Where a catalog entry is used; counts irrelevant to the type are 0
      properties:
        workflows: { type: integer, format: int64 }
