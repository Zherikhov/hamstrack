    AdminScope:
      type: string
      enum: [GLOBAL, WORKSPACE, PROJECT]
      description: >-
        A catalog/set row's scope. Delegated consoles list rows visible to them
        (global ∪ workspace ∪ project) but edit only rows at their own scope.

    AdminStatus:
      allOf:
        - $ref: '#/components/schemas/StatusResponse'
        - type: object
          properties:
            archived: { type: boolean }
            usage: { $ref: '#/components/schemas/UsageInfo' }
