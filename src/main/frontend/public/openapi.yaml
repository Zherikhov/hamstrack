        id: { type: string, format: uuid }
        name: { type: string, example: Default priorities }
        systemDefault: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              priority: { $ref: '#/components/schemas/Priority' }
              isDefault: { type: boolean, description: Default for new issues }
        projectsUsing: { type: integer, format: int64 }
        scope: { $ref: '#/components/schemas/AdminScope' }

    ProjectBinding:
      type: object
      description: One row of the admin assignment matrix; null binding = system default
      properties:
        projectId: { type: string, format: uuid }
        key: { type: string, example: DEMO }
        name: { type: string }
        archived: { type: boolean }
        workspaceId: { type: string, format: uuid }
        workspaceName: { type: string }
        workflowId: { type: string, format: uuid, nullable: true }
        prioritySetId: { type: string, format: uuid, nullable: true }
        fieldSetId: { type: string, format: uuid, nullable: true }
        issueTypeSetId: { type: string, format: uuid, nullable: true }

    SetOption:
      type: object
      description: A bindable set, tagged with its scope (delegated consoles)
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { $ref: '#/components/schemas/AdminScope' }

    BindingOptions:
      type: object
      description: Sets bindable to a project/workspace, per dimension
      properties:
        workflows: { type: array, items: { $ref: '#/components/schemas/SetOption' } }
        prioritySets: { type: array, items: { $ref: '#/components/schemas/SetOption' } }
        fieldSets: { type: array, items: { $ref: '#/components/schemas/SetOption' } }
        issueTypeSets: { type: array, items: { $ref: '#/components/schemas/SetOption' } }

    AdminUser:
      type: object
      description: A user account in the admin directory
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        systemRole: { type: string, enum: [ADMIN, USER] }
        status: { type: string, enum: [ACTIVE, PENDING, DISABLED] }
        hasPassword:
          type: boolean
          description: False while the account still awaits its setup link being used
        createdAt: { type: string, format: date-time }

    AdminIssueTypeSet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: All types }
        systemDefault: { type: boolean }
        types:
          type: array
          description: Display order
          items: { $ref: '#/components/schemas/IssueTypeResponse' }
        projectsUsing: { type: integer, format: int64 }
        scope: { $ref: '#/components/schemas/AdminScope' }

    UsageDetail:
      type: object
      description: '"Where exactly is this used?" — names instead of counts'
      properties:
        workflows:
          type: array
          items: { type: string }
        sets:
          type: array
          items: { type: string }
        projects:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              key: { type: string, example: DEMO }
              name: { type: string }
        issues: { type: integer, format: int64 }

    FieldType:
      type: string
      enum: [TEXT, TEXTAREA, NUMBER, DATE, SELECT, MULTI_SELECT, USER, CHECKBOX, URL]
      description: >-
        Determines the JSON value shape: TEXT/TEXTAREA/URL string ·
        NUMBER number · DATE "YYYY-MM-DD" string · SELECT option id ·
        MULTI_SELECT array of option ids · USER user UUID (workspace
        member) · CHECKBOX boolean

    FieldConfig:
      type: object
      nullable: true
      description: '`options` for selects; `min`/`max` for numbers'
      properties:
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, example: critical, description: Referenced by stored values — stable once used }
              label: { type: string, example: Critical }
              color: { type: string, nullable: true, example: '#B91C1C' }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }

    UpsertField:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 100 }
        key:
          type: string
          pattern: '[a-z0-9_]*'
          maxLength: 50
          description: Blank on create = derived from the name; immutable afterwards
        type: { $ref: '#/components/schemas/FieldType' }
        config: { $ref: '#/components/schemas/FieldConfig' }
        description: { type: string, maxLength: 500, nullable: true, description: Shown as a hint in issue forms }

    AdminField:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: severity }
        name: { type: string, example: Severity }
        type: { $ref: '#/components/schemas/FieldType' }
        config: { $ref: '#/components/schemas/FieldConfig' }
        description: { type: string, nullable: true }
        archived: { type: boolean }
        isSystem: { type: boolean, description: "Built-in system field — can only be archived, not deleted" }
        usage: { $ref: '#/components/schemas/UsageInfo' }
        scope: { $ref: '#/components/schemas/AdminScope' }

    AdminFieldSet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Engineering fields }
        systemDefault: { type: boolean }
        items:
          type: array
          description: Display order
          items:
            type: object
            properties:
              field: { $ref: '#/components/schemas/AdminField' }
              required: { type: boolean, description: Must be filled on create; cannot be cleared }
              showOnCreate: { type: boolean, description: Rendered in the create form }
        projectsUsing: { type: integer, format: int64 }
        scope: { $ref: '#/components/schemas/AdminScope' }

    FieldValueEntry:
      type: object
      description: A filled custom field on an issue
      properties:
        fieldId: { type: string, format: uuid }
        value: { description: Shape depends on the field type — see FieldType }

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }

    WorkspaceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: acme-inc }
        name: { type: string, example: Acme Inc }
        myRole:
          allOf:
            - $ref: '#/components/schemas/WorkspaceRole'
          description: >-
            The caller's workspace role **key**. Fine to display; to decide what
            to show, read `myPermissions` instead — this is an open string and
            `myRole === 'ADMIN'` is not a question that can be answered
            correctly for every member.
        myPermissions:
          allOf:
            - $ref: '#/components/schemas/MyPermissions'
          description: >-
            The caller's effective **workspace-scoped** permissions (see
            `GET /permissions`). Always present, possibly empty.
        createdAt: { type: string, format: date-time }

    WorkspaceMemberResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        joinedAt: { type: string, format: date-time }

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/WorkspaceRole' }

    UpdateWorkspaceMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          allOf:
            - $ref: '#/components/schemas/WorkspaceRole'
          description: >-
            The role key the member should end up with. Required — a `PATCH`
            with nothing to change (missing, `null` or empty) is rejected with
            `400`, and a key this instance cannot assign with `422`. It must not
            grant a permission the caller lacks, and neither may the member's
            current role; the `OWNER` role additionally requires the caller to
            be an owner. Sending the role they already hold is an accepted
            no-op.

    CreateProjectRequest:
      type: object
      required: [name, key]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        key:
          type: string
          pattern: '^[A-Z0-9]+$'
          minLength: 1
          maxLength: 10
          example: DEMO
        description: { type: string, nullable: true }
        delivery:
          allOf:
            - $ref: '#/components/schemas/DeliveryRequest'
          description: >-
            How this team will deliver. **Optional** — omitted (or with null
            members) it yields the lean new-project defaults: `KANBAN`, releases
            **off**, estimation **off**. There is no server-side "Scrum implies
            estimation" rule, so a Scrum picker sends `board: SCRUM` *and*
            `estimation: true` in this one request.

    BoardMode:
      type: string
      enum: [KANBAN, SCRUM]
      default: KANBAN
      description: >-
        How the project's board reads. A **presentation switch, not a
        permission**: the sprint API behaves identically either way, so a Kanban
        team may still plan an iteration. `SCRUM` scopes the board to the active
        sprint and shows a sprint header; `KANBAN` shows the whole project.
        This is the `board` capability of `delivery`; the top-level `boardMode`
        field is a deprecated mirror of it.

    DeliveryPreset:
      type: string
      enum: [KANBAN, SCRUM, RELEASES, CUSTOM]
      readOnly: true
      description: |-
        The **derived** display label for a project's capability set — computed
        server-side, never stored and **never accepted in a request**. Exactly
        three combinations are named; the other five read as `CUSTOM`, which is a
        legal first-class answer ("Scrum + Releases" is an ordinary way to work).

        | preset | board | releases | estimation |
        |---|---|---|---|
        | `KANBAN` | `KANBAN` | off | off |
        | `SCRUM` | `SCRUM` | off | on |
        | `RELEASES` | `KANBAN` | on | off |
        | `CUSTOM` | any other combination | | |

    DeliveryRequest:
      type: object
      description: >-
        The write side of `DeliveryResponse`. Optional wherever it appears and
        **partial in every member**: a null/omitted member leaves that capability
        alone on `PATCH` and falls back to the lean default on `POST`, so
        `{"delivery":{"releases":true}}` turns releases on and touches nothing
        else. Setting a capability to the value it already has is a no-op that
        still returns `200` with the current state, and no switch ever destroys,
        clears or moves data.


        **`preset` is not settable.** It is derived from the three capabilities,
        so a body carrying it is a `400` naming the field rather than a silent
        ignore — a client **cannot** blindly `PATCH` back the `delivery` object
        it read from a `GET`; it must strip `preset` first.
      properties:
        board:
          allOf:
            - $ref: '#/components/schemas/BoardMode'
          description: >-
            Sprints as a planning concept. A closed set — an unknown value is a
            `400`, never a silent fall-through.
        releases:
          type: boolean
          nullable: true
          description: Versions — the Releases page and rail item, fix/affects pickers.
        estimation:
          type: boolean
          nullable: true
          description: Story points — the points input and every point sum.
        preset:
          type: string
          description: >-
            **Accepted only so it can be rejected.** Any non-null value returns
            `400 "delivery.preset is derived from board/releases/estimation and
            cannot be set"` — a `@Null` constraint on the nested object, so the
            body is a `ValidationProblemDetail` whose `errors` map is keyed
            `delivery.preset` and whose `detail` is that same sentence
            (un-prefixed: the message already names its field). The rejection is
            total — a body that sets `releases` *and* echoes `preset` changes
            nothing.

    DeliveryResponse:
      type: object
      description: >-
        How a project's team delivers — three stored capabilities plus the label
        derived from them. It rides every `ProjectResponse` (which the shell
        already fetches), so asking "does this project do X?" costs no extra
        request and no surface has to infer it from the presence of data.


        **This object is presentation, never API.** It tells a client what
        vocabulary to render; it does **not** tell it what will be accepted.
        Every endpoint behaves identically whatever these values are — a project
        with `releases: false` still accepts and returns version data, `POST
        …/sprints` still succeeds with `board: KANBAN`, and `storyPoints` still
        applies with `estimation: false`. Never treat a capability as a
        permission.


        The single place a capability is visible in the API is **autocomplete
        metadata**: `GET /search/schema` omits `sprint`, `fixVersion`,
        `affectsVersion` and `storyPoints` when no visible project has the
        matching capability on, and its `SPRINT`/`VERSION` picklists (plus
        `GET /search/suggest` for the two version fields) only carry names from
        capability-on projects. Those fields still parse, compile and run
        everywhere, so no saved filter can break when a capability is flipped.
      properties:
        board:
          allOf:
            - $ref: '#/components/schemas/BoardMode'
          description: >-
            `KANBAN` or `SCRUM`. Carries the same value as the deprecated
            top-level `boardMode`.
        releases:
          type: boolean
          description: Versions — the Releases page and rail item, fix/affects pickers.
        estimation:
          type: boolean
          description: Story points — the points input and every point sum.
        preset: { $ref: '#/components/schemas/DeliveryPreset' }

    UpdateProjectRequest:
      type: object
      description: Partial project update — omitted fields are left unchanged
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        description: { type: string }
        boardMode:
          allOf:
            - $ref: '#/components/schemas/BoardMode'
          deprecated: true
          description: >-
            **Deprecated** — superseded by `delivery.board`, which carries the
            identical value. Kept as an accepted mirror for one minor release so
            clients written against 0.13.0 keep working. A closed set — an
            unknown value is a `400`, never a silent fall-through; omitted/null
            leaves the current mode. Adding this field is what widened the
            endpoint's gate from project `MANAGER` to project **curator**.

            Sending it *together with* `delivery.board` is fine when the two
            **agree**; sending both with **different** values is a `400`
            (`boardMode and delivery.board disagree — send only one`) rather than
            a silent winner-takes-all. That one is a cross-field rule enforced in
            the service, so its body carries **no** `errors` map — and, like
            every rejection here, it applies nothing else from the body. When the
            mirror is finally dropped, behaviour does not change: `delivery.board`
            already carries the identical value.
        delivery:
          allOf:
            - $ref: '#/components/schemas/DeliveryRequest'
          description: >-
            The three delivery capabilities, each independently nullable
            (partial). Omitted leaves all three unchanged. Confirmations are a UI
            affordance only — the API answers `200` with no confirmation, and
            nothing is ever destroyed.

    ProjectResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string, example: Demo Project }
        key: { type: string, example: DEMO }
        description: { type: string, nullable: true }
        archived: { type: boolean }
        boardMode:
          allOf:
            - $ref: '#/components/schemas/BoardMode'
          deprecated: true
          description: >-
            **Deprecated** — superseded by `delivery.board`, which carries the
            identical value. Still populated (and still accepted on `PATCH`) for
            exactly one minor release so clients mid-flight keep working. New
            readers use `delivery`.
        delivery:
          allOf:
            - $ref: '#/components/schemas/DeliveryResponse'
          description: >-
            How this team delivers — `board`, `releases`, `estimation` and the
            derived `preset`. Presentation only: nothing in it changes what the
            API accepts or which status code it returns.
        myRole:
          allOf:
            - $ref: '#/components/schemas/ProjectRole'
          description: >-
            The caller's **explicit** project role **key** — `VIEWER` when they
            have no project membership row of their own, even where that member
            can in fact do more than a viewer. Display only, and an open string:
            `myRole === 'MANAGER'` cannot express every role a member might
            hold. `myPermissions` carries the effective answer and is the field
            to gate on.
        myPermissions:
          allOf:
            - $ref: '#/components/schemas/MyPermissions'
          description: >-
            The caller's effective **project-scoped** permissions in this
            project (see `GET /permissions`), including any granted by their
            workspace role rather than a project membership. Always present,
            possibly empty. May be wider than `myRole` suggests.
        createdAt: { type: string, format: date-time }

    ProjectMemberResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/ProjectRole' }
        joinedAt: { type: string, format: date-time }

    AddProjectMemberRequest:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role:
          allOf:
            - $ref: '#/components/schemas/ProjectRole'
          description: >-
            The project role key to grant. Required (`400` when missing or
            blank); a key this instance cannot assign in the **project** scope
            is `422 "Unknown role"`. Bounded by the grant ceiling, and `VIEWER`
            is stored as `MEMBER` — see the `ProjectRole` schema.

    ProjectRef:
      type: object
      description: >-
        The smallest useful reference to a project: enough to link to it and
        enough for a human to recognise it. Carried by the `projects` extension
        of the workspace member-removal `409`
        (`StrandedProjectsProblemDetail`) and by `adoptedProjects` on that
        removal's `200` (`MemberRemovalResponse`).
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: P17 }
        name: { type: string, example: Alpha }

    IssueTypeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Bug }
        color: { type: string, example: '#EF4444' }
        icon: { type: string, nullable: true, example: bug }
        position: { type: integer }
        hierarchyLevel: { type: integer, description: 'Nesting level: Epic=2, Story/Task/Bug=1, Sub-task=0. A parent must be exactly one level above its child (adjacent tiers only): Epic parents Story/Task/Bug (not a Sub-task directly), which parent Sub-task.' }

    StatusResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: In Progress }
        color: { type: string, example: '#3B82F6' }
        category: { $ref: '#/components/schemas/StatusCategory' }
        position: { type: integer }

    TransitionRule:
      type: object
      description: fromStatusId null = "from any status"
      properties:
        fromStatusId: { type: string, format: uuid, nullable: true }
        toStatusId: { type: string, format: uuid }

    ProjectConfig:
      type: object
      description: The effective taxonomy of a project (see GET …/config)
      properties:
        statuses:
          type: array
          description: Board-column order
          items: { $ref: '#/components/schemas/StatusResponse' }
        transitions:
          type: array
          description: Empty = all moves allowed
          items: { $ref: '#/components/schemas/TransitionRule' }
        priorities:
          type: array
          description: Display order; isDefault marks the default for new issues
          items:
            allOf:
              - $ref: '#/components/schemas/Priority'
              - type: object
                properties:
                  isDefault: { type: boolean }
        issueTypes:
          type: array
          items: { $ref: '#/components/schemas/IssueTypeResponse' }
        fields:
          type: array
          description: Custom fields of the project's field set, display order
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              key: { type: string, example: severity }
              name: { type: string, example: Severity }
              type: { $ref: '#/components/schemas/FieldType' }
              config: { $ref: '#/components/schemas/FieldConfig' }
              description: { type: string, nullable: true }
              required: { type: boolean, description: Must be filled on create; cannot be cleared }
              showOnCreate: { type: boolean, description: Rendered in the create form }

    UserRef:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }

    CreateIssueRequest:
      type: object
      required: [title, typeId, statusId]
      properties:
        title: { type: string, maxLength: 500 }
        description: { type: string, nullable: true }
        typeId: { type: string, format: uuid, description: Must be offered by the project's type set }
        statusId: { type: string, format: uuid, description: Must belong to the project's workflow }
        priorityId: { type: string, format: uuid, nullable: true, description: Omitted = the project's default priority }
        assigneeId: { type: string, format: uuid, nullable: true, description: Must be a workspace member }
        parentId: { type: string, format: uuid, nullable: true, description: 'Parent issue in the same project. Rejected with 422 if unknown/foreign-project, or if the parent type''s hierarchy level is not strictly greater than this issue''s type level.' }
        dueDate: { type: string, format: date, nullable: true }
        labelIds:
          type: array
          nullable: true
          maxItems: 100
          description: >-
            Workspace labels to attach. Absent/null = none; duplicates are
            de-duped. Every id is resolved inside the issue's own workspace — an
            unknown, foreign-workspace or archived label, or more than
            `app.classification.max-labels-per-issue` (default 20) distinct ids,
            is a `422`. Over 100 entries is rejected at binding (`400`).
          items: { type: string, format: uuid }
        componentId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The project component to file this issue under. Resolved inside the
            issue's own project — an unknown, foreign-project or archived
            component is a `422`. When the component has `autoAssign` and a lead
            and no `assigneeId` was given, the lead is assigned automatically
            (an explicit `assigneeId` always wins; a lead who has left the
            workspace is skipped silently and the issue stays unassigned).
        fixVersionIds:
          type: array
          nullable: true
          maxItems: 100
          description: >-
            Versions this change **ships in**. Absent/null = none; duplicates
            are de-duped. Every id is resolved inside the issue's own project —
            an unknown, foreign-project or archived version, or more than
            `app.classification.max-version-links-per-issue` (default 20)
            distinct ids, is a `422`. The cap is **per link type**, so
            `fixVersionIds` and `affectsVersionIds` have independent budgets.
            Linking an already-**released** version is allowed on purpose
            (back-porting and post-release bookkeeping are legitimate). Over 100
            entries is rejected at binding (`400`).
          items: { type: string, format: uuid }
        affectsVersionIds:
          type: array
          nullable: true
          maxItems: 100
          description: >-
            Versions this defect **exists in** — same rules and the same
            independent budget as `fixVersionIds`. The same version may
            legitimately be both fix and affects on one issue.
          items: { type: string, format: uuid }
        sprintId:
          type: string
          format: uuid
          nullable: true
          description: >-
            File the issue straight into a sprint of **this** project.
            Absent/null = the backlog, which is the normal case. Resolved inside
            the issue's own project — an unknown or foreign-project id is a
            `422` ("Unknown sprint", never a `404`), and so is a **completed**
            sprint (its membership is a delivered fact).
        storyPoints:
          type: number
          nullable: true
          minimum: 0
          maximum: 999
          example: 5
          description: >-
            Native story-point estimate. `0`…`999` with at most **2 decimals**
            (`0.5`, `1.5`, `13` are all valid) — anything else is a `422`.
            Absent/null means **unestimated**, which is deliberately not the
            same statement as `0`.
        clearSprint:
          type: boolean
          default: false
          description: >-
            **Accepted and ignored on create.** A brand-new issue has nothing to
            clear — omitting `sprintId` already means "the backlog". It exists
            only so a client that shares one payload builder between create and
            update is not rejected; the meaningful flag is on
            `UpdateIssueRequest`.
        clearStoryPoints:
          type: boolean
          default: false
          description: >-
            **Accepted and ignored on create**, for the same reason as
            `clearSprint` — omitting `storyPoints` already means "unestimated".
        fields:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Custom field values keyed by field id (value shapes per
            FieldType). Required fields of the project's set must be
            present; fields outside the set or archived are rejected (422).
          example: { 'e1b2…': 5, 'f3c4…': critical }

    UpdateIssueRequest:
      type: object
      description: Partial update — omitted fields are left unchanged
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string }
        typeId: { type: string, format: uuid, description: Must be offered by the project's type set }
        statusId: { type: string, format: uuid, description: Validated against workflow transition rules }
        priorityId: { type: string, format: uuid, description: Must be offered by the project's priority set }
        assigneeId: { type: string, format: uuid }
        dueDate: { type: string, format: date }
        clearAssignee: { type: boolean, default: false, description: 'Unset the assignee (a null assigneeId cannot be distinguished from "not sent"); ignored when assigneeId is also given' }
        clearDueDate: { type: boolean, default: false, description: Unset the due date; ignored when dueDate is also given }
        parentId: { type: string, format: uuid, nullable: true, description: 'Set/change the parent issue. Rejected with 422 for an unknown/foreign-project parent, self-parenting, a cycle, a hierarchy-level violation, or a type change that conflicts with an existing parent or child edge.' }
        clearParent: { type: boolean, default: false, description: 'Detach the parent (mirrors clearAssignee/clearDueDate); ignored when parentId is also given' }
        labelIds:
          type: array
          maxItems: 100
          description: >-
            **Full-replacement** label set — present: the issue ends up carrying
            exactly these labels; `[]`: all labels removed; absent/null:
            unchanged (no clear-flag needed, `[]` is unambiguous). Same `422`
            rules as create (unknown/foreign/archived id, or more than
            `app.classification.max-labels-per-issue` distinct ids); an
            already-attached archived label may stay, it just cannot be added.
            A change writes one `labels` history entry and bumps `version`.
          items: { type: string, format: uuid }
        componentId:
          type: string
          format: uuid
          description: >-
            Set/change the project component. Resolved inside the issue's own
            project — an unknown or foreign-project id is a `422`, and so is
            attaching an **archived** component (one already attached may stay).
            A change writes one `component` history entry; auto-assign does NOT
            fire on update.
        clearComponent: { type: boolean, default: false, description: 'Unset the component (mirrors clearAssignee/clearDueDate); ignored when componentId is also given' }
        fixVersionIds:
          type: array
          maxItems: 100
          description: >-
            **Full-replacement** fix-version set, exactly like `labelIds` —
            present: the issue ends up linked to exactly these versions in the
            fix role; `[]`: all fix links removed; absent/null: unchanged (no
            clear-flag needed). The two roles are independent, so sending only
            this one never touches the affects set. Same `422` rules as create
            (unknown/foreign/archived id, or more than
            `app.classification.max-version-links-per-issue` distinct ids **per
            link type**); an already-linked archived version may stay, it just
            cannot be added. A change writes one `fixVersions` history entry and
            bumps `version`.
          items: { type: string, format: uuid }
        affectsVersionIds:
          type: array
          maxItems: 100
          description: >-
            **Full-replacement** affects-version set — same rules, independent
            budget, and a change writes one `affectsVersions` history entry.
          items: { type: string, format: uuid }
        sprintId:
          type: string
          format: uuid
          description: >-
            Move the issue into a sprint of **this** project. A nullable scalar,
            so it follows the `assigneeId`/`clearAssignee` convention rather
            than the full-replacement one: a non-null id sets it, absent leaves
            it unchanged. An unknown, foreign-project or **completed** sprint is
            a `422`, and so is moving the issue out of a sprint that is already
            `COMPLETED`. Mutually exclusive with `clearSprint` (`400` when both
            are sent). A change writes one `sprint` history entry and bumps
            `version`; the issue's **rank is not touched** (use
            `POST …/issues/{number}/rank` to place it).
        clearSprint:
          type: boolean
          default: false
          description: >-
            Return the issue to the backlog. **Mutually exclusive with
            `sprintId`** — sending both is a `400` (it used to let `sprintId`
            win silently). Clearing a `COMPLETED` sprint is a `422`.
        storyPoints:
          type: number
          minimum: 0
          maximum: 999
          example: 5
          description: >-
            Set the estimate — `0`…`999` with at most **2 decimals**, `422`
            otherwise. A real change writes one `storyPoints` history entry; a
            no-op writes none.
        clearStoryPoints: { type: boolean, default: false, description: 'Mark the issue unestimated again; ignored when storyPoints is also given' }
        fields:
          type: object
          additionalProperties: true
          description: >-
            Partial like the rest of the body — only listed field ids
            change; JSON null clears a value (required fields cannot be
            cleared).
        version:
          type: integer
          description: Optimistic lock — the `version` you last read; `409` when stale. Omit to skip the check.

    BoardIssuesResponse:
      type: object
      description: |
        Capped board issue list — the no-`size` variant of `GET .../issues`
        (HD-79). `issues` is bounded to `cap`; when the project (after the same
        filters) exceeds it, `truncated` is true and `totalAvailable` reports the
        full count so the UI can show "Showing first {cap} of {totalAvailable}".
      properties:
        issues:
          type: array
          items: { $ref: '#/components/schemas/IssueResponse' }
        truncated: { type: boolean, description: True when the project exceeds `cap` after filters }
        totalAvailable: { type: integer, format: int64, description: Full filtered count (equals issues length when not truncated) }
        cap: { type: integer, description: 'Server-side maximum (app.board.max-issues, default 500)' }

    IssueResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64, example: 18 }
        key: { type: string, example: DEMO-18 }
        title: { type: string }
        description: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/IssueTypeResponse' }
        status: { $ref: '#/components/schemas/StatusResponse' }
        priority: { $ref: '#/components/schemas/Priority' }
        assignee: { $ref: '#/components/schemas/UserRef' }
        reporter: { $ref: '#/components/schemas/UserRef' }
        parentId: { type: string, format: uuid, nullable: true }
        parentKey: { type: string, nullable: true, example: DEMO-12, description: Key of the parent issue; null if none }
        parentTitle: { type: string, nullable: true, description: Title of the parent issue; null if none }
        parentTypeId: { type: string, format: uuid, nullable: true, description: Type id of the parent issue (for its type icon); null if none }
        childCount: { type: integer, description: Number of direct children }
        doneChildCount: { type: integer, description: Direct children in a DONE-category status }
        dueDate: { type: string, format: date, nullable: true }
        labels:
          type: array
          description: >-
            The issue's workspace labels, ordered by name (case-insensitive);
            `[]` when none. An archived label already attached is still listed
            (with `archived: true`) so it can be rendered dimmed.
          items: { $ref: '#/components/schemas/LabelRef' }
        component:
          allOf:
            - $ref: '#/components/schemas/ComponentRef'
          description: >-
            The issue's project component, or `null`. An archived component
            already attached is still reported (with `archived: true`) so it can
            be rendered dimmed.
        fixVersions:
          type: array
          description: >-
            The versions this issue **ships in**, ordered by name
            (case-insensitive); `[]` when none. An archived version already
            linked is still listed (with `archived: true`) so it can be rendered
            dimmed.
          items: { $ref: '#/components/schemas/VersionRef' }
        affectsVersions:
          type: array
          description: >-
            The versions this issue is **broken in**, same shape and ordering;
            `[]` when none. A version may appear in both lists.
          items: { $ref: '#/components/schemas/VersionRef' }
        sprint:
          allOf:
            - $ref: '#/components/schemas/SprintRef'
          description: >-
            The sprint this issue is committed to, or `null` = the backlog. Note
            that the issue's **rank** (`position`) is deliberately **not**
            exposed: it is server-written only and a client never needs its
            value — drag placement travels as neighbour ids instead.
        storyPoints:
          type: number
          nullable: true
          example: 5
          description: >-
            Native story-point estimate; `null` = **unestimated**, which is
            deliberately not `0`. Serialized as a plain JSON number with
            trailing zeros stripped (`5`, not `5.00`).
        fields:
          type: array
          description: Filled custom fields only
          items: { $ref: '#/components/schemas/FieldValueEntry' }
        version: { type: integer, description: Send back in PATCH for optimistic locking }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-14T09:31:07Z'
          description: >-
            When the issue was closed — **server-maintained, never accepted on a
            request**. Stamped when the issue enters a status whose `category`
            is `DONE` (including creating it directly in one), and cleared back
            to `null` when it leaves a DONE-category status. Only a change of
            status **category** re-evaluates it: moving between two different
            DONE statuses keeps the original stamp, and an update that does not
            change the status leaves it untouched. `null` while the issue is
            open. The stamp itself writes no `history` entry — the `status`
            entry records the transition.

    IssueHistoryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        field: { type: string, example: status, description: 'Built-in attribute name, or the display name of a custom field' }
        oldValue: { type: string, nullable: true, example: To Do }
        newValue: { type: string, nullable: true, example: In Progress }
        changedById: { type: string, format: uuid }
        changedByName: { type: string }
        createdAt: { type: string, format: date-time }

    SearchRequest:
      type: object
      description: Body of `POST /workspaces/{workspaceId}/search`
      properties:
        query:
          type: string
          maxLength: 2000
          description: >-
            The HQL query. May be empty/omitted (null treated as empty) → all
            visible issues, default sort. Over 2000 chars is rejected at binding
            (`400`).
          example: status = "In Progress" AND assignee = currentUser() ORDER BY priority DESC
        page: { type: integer, minimum: 0, default: 0, description: 'Zero-based page index (null/negative → 0)' }
        size: { type: integer, minimum: 1, maximum: 100, default: 50, description: 'Page size (null → 50, clamped 1..100)' }

    SearchResultRow:
      type: object
      description: One search hit — the full issue plus its owning project's identity (results are cross-project).
      properties:
        issue: { $ref: '#/components/schemas/IssueResponse' }
        projectId: { type: string, format: uuid }
        projectKey: { type: string, example: DEMO }
        projectName: { type: string, example: Demo Project }

    SearchSchemaResponse:
      type: object
      description: Autocomplete metadata for the search UI (`GET /search/schema`).
      properties:
        fields:
          type: array
          description: >-
            One entry per live queryable field — system fields first, then the
            caller's visible custom fields (M2; `name` = the field `key`).
            The system half is **capability-aware**: `sprint`,
            `fixVersion`/`affectsVersion` and `storyPoints` appear only when at
            least one visible project has `board: SCRUM`, `releases` resp.
            `estimation` on. That narrows *suggestions* only — an omitted field
            still parses, compiles and runs, so this list is a subset of what
            search actually resolves and must not be used as a validator.
          items: { $ref: '#/components/schemas/SearchField' }
        keywords:
          type: array
          description: HQL keywords, for keyword autocomplete
          items: { type: string }
          example: [AND, OR, NOT, IN, IS, EMPTY, ORDER BY, ASC, DESC]
        values:
          type: object
          description: >-
            Value picklists keyed by value-source token (`STATUS`, `TYPE`,
            `PRIORITY`) — the distinct names reachable by the caller's visible
            projects — plus `LABEL` (the workspace's non-archived label names,
            capped at 200 entries; fall back to `/search/suggest?field=label`
            beyond that), `COMPONENT` (the non-archived component names of those
            visible projects, capped at 200 the same way), `VERSION` (the
            non-archived version names of those visible projects **that have
            `releases` on**, capped at 200 — one picklist serves both
            `fixVersion` and `affectsVersion`), `SPRINT` (the open sprint names
            of those visible projects **that have `board: SCRUM`**, capped at
            200, with no `/search/suggest` fallback) and a
            `CUSTOM:<key>` entry per SELECT/MULTI_SELECT custom field, whose
            options are `{label, value=optionId}` pairs. The capability scoping
            of `VERSION`/`SPRINT` narrows suggestions only: a name missing here
            still resolves in a query.
            `USER` (system or custom) is intentionally absent (use
            `/search/suggest`).
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/SearchValueOption' }

    SearchField:
      type: object
      description: A queryable HQL field's public schema
      properties:
        name: { type: string, description: 'HQL field name — a system field name or a custom field `key`', example: assignee }
        type:
          type: string
          description: >-
            The field's data-type family. System fields use the internal family
            (`ENUM_REF`/`USER_REF`/`LABEL_REF`/`VERSION_REF`/…); custom fields
            (M2) report their `FieldType` (`TEXT`/`TEXTAREA`/`NUMBER`/`DATE`/
            `SELECT`/`MULTI_SELECT`/`USER`/`CHECKBOX`/`URL`).
          enum: [ENUM_REF, USER_REF, ISSUE_REF, LABEL_REF, VERSION_REF, TEXT, TEXTAREA, DATE, TIMESTAMP, NUMBER, SELECT, MULTI_SELECT, USER, CHECKBOX, URL]
          example: USER_REF
        operators:
          type: array
          description: The operator tokens legal on this field (comparison ops, then `IN`, then `IS EMPTY` / `IS NOT EMPTY`)
          items: { type: string }
          example: ['=', '!=', IN, IS EMPTY, IS NOT EMPTY]
        nullable: { type: boolean, description: 'Whether `IS [NOT] EMPTY` is allowed' }
        sortable: { type: boolean, description: 'Whether the field may appear in ORDER BY' }
        valueSuggest:
          type: string
          nullable: true
          description: >-
            The value-source token
            (`STATUS`/`TYPE`/`PRIORITY`/`USER`/`LABEL`/`COMPONENT`/`VERSION`/
            `SPRINT`/…), `CUSTOM:<key>` for a SELECT/MULTI_SELECT custom field,
            or null when there is no picklist (e.g. `storyPoints`).
          example: USER
        functions:
          type: array
          description: Zero-arg functions offered for this field
          items: { type: string }
          example: ['currentUser()']

    SearchValueOption:
      type: object
      description: A picklist entry — a display label and an optional resolvable value
      properties:
        label: { type: string, example: In Progress }
        value: { type: string, nullable: true, description: 'Resolvable value when applicable (e.g. email for USER); null for name-resolved picklists' }

    SuggestResponse:
      type: object
      description: >-
        Typeahead result (`GET /search/suggest`) — for a user-valued field
        (`assignee`/`reporter` or a USER-typed custom field, M2), for
        `label`/`labels`, `component`/`components`, or
        `fixVersion`/`affectsVersion`.
      properties:
        field: { type: string, description: 'The queried field, echoed back', example: assignee }
        suggestions:
          type: array
          description: >-
            Matching workspace members — or non-archived label names for
            `label`, component names for `component`, version names (from the
            visible projects with `releases` on) for
            `fixVersion`/`affectsVersion` — capped at 20, most relevant first
          items:
            type: object
            properties:
              label: { type: string, description: 'Display name shown in the dropdown', example: Ada Lovelace }
              value: { type: string, description: 'The resolvable value the client inserts — the member email, or the label/component name for `label`/`component`', example: ada@example.com }

    SavedFilterResponse:
      type: object
      description: A saved HQL filter. `mine` is caller-relative — `true` when the authenticated actor owns it.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: My open bugs }
        hql: { type: string, description: 'The stored HQL (may be empty = all issues)', example: type = Bug AND assignee = currentUser() }
        shared: { type: boolean, description: 'Whether other workspace members can see it (read-only)' }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string, example: Ada Lovelace }
        mine: { type: boolean, description: 'True when the caller is the owner (drives edit/delete affordances)' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateSavedFilterRequest:
      type: object
      required: [name]
      description: Body of `POST /workspaces/{workspaceId}/filters`. The owner is always the caller — never taken from the body.
      properties:
        name:
          type: string
          maxLength: 120
          description: Required, non-blank; unique per `(workspace, owner)` — `409` on a dup.
          example: My open bugs
        hql:
          type: string
          maxLength: 2000
          description: >-
            The HQL to store (may be empty = all issues). Validated at save time
            (parse + structural) — a bad query → `422`. Over 2000 chars → `400`.
          example: type = Bug AND assignee = currentUser()
        shared:
          type: boolean
          default: false
          description: Whether the filter is visible read-only to other workspace members.

    UpdateSavedFilterRequest:
      type: object
      description: >-
        Body of `PATCH /workspaces/{workspaceId}/filters/{filterId}` — a partial
        update; every field is optional and `null`/omitted is a no-op. Owner only.
      properties:
        name: { type: string, maxLength: 120, description: 'New name if present; re-checked for `(workspace, owner)` uniqueness (`409` on dup, `400` if blank).' }
        hql: { type: string, maxLength: 2000, description: 'New HQL if present; re-validated at save time (`422` on a bad query).' }
        shared: { type: boolean, description: 'New sharing flag if present.' }

    SavedFilterUsageResponse:
      type: object
      description: >-
        Delete-warning payload (`GET …/filters/{filterId}/usage`). Forward-looking:
        no board/report consumes a filter in the current release, so `usages` is
        always `[]`.
      properties:
        usages:
          type: array
          description: The places referencing this filter (empty in the current release)
          items: { $ref: '#/components/schemas/SavedFilterUsage' }

    SavedFilterUsage:
      type: object
      description: One consumer of a saved filter (a board or report, when those land)
      properties:
        type: { type: string, description: 'Consumer kind — `BOARD` or `REPORT` (open string)', example: BOARD }
        id: { type: string, format: uuid }
        name: { type: string, description: 'The consumer''s display name for the confirm dialog' }

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, description: '`@DisplayName` mentions notify workspace members' }

    CommentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AttachmentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string, example: screenshot.png }
        sizeBytes: { type: integer, format: int64 }
        contentType: { type: string, example: image/png }
        uploadedById: { type: string, format: uuid }
        uploadedByName: { type: string }
        createdAt: { type: string, format: date-time }

    LabelResponse:
      type: object
      description: A workspace label — a free-form colored tag reusable across every project of the workspace.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60, example: needs-design, description: 'Display name (casing preserved); unique per workspace case-insensitively' }
        color: { type: string, example: '#0EA5A4', description: '`#RRGGBB` or `#RRGGBBAA`; auto-derived from the name when none was given' }
        description: { type: string, nullable: true, maxLength: 200 }
        archived: { type: boolean, description: 'Archived labels stay attached to their issues but can no longer be added' }
        createdById: { type: string, format: uuid, nullable: true }
        createdByName: { type: string, nullable: true, example: Ada Lovelace }
        issueCount:
          type: integer
          nullable: true
          description: >-
            Issues currently carrying this label — only filled by
            `GET …/labels?withUsage=true`; `null` otherwise.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LabelRef:
      type: object
      description: A label's display summary as embedded in an issue — deliberately minimal.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: needs-design }
        color: { type: string, example: '#0EA5A4' }
        archived: { type: boolean, description: 'True when the label is archived (render it dimmed)' }

    CreateLabelRequest:
      type: object
      required: [name]
      description: Body of `POST /workspaces/{workspaceId}/labels`. Any workspace member may create a label.
      properties:
        name:
          type: string
          maxLength: 200
          description: >-
            Required, non-blank. Normalized server-side (NFC, invisible
            control/format characters stripped, whitespace collapsed; spaces are
            allowed) and then limited to 60 characters — a longer or blank
            result is a `400`. Unique per workspace, case-insensitively,
            archived labels included (`409` + `existingId`).
          example: needs-design
        color:
          type: string
          nullable: true
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          description: '`#RRGGBB` or `#RRGGBBAA`. Omitted → a deterministic swatch derived from the name.'
          example: '#0EA5A4'
        description: { type: string, nullable: true, maxLength: 200, description: 'Optional note; blank is stored as null.' }

    UpdateLabelRequest:
      type: object
      description: >-
        Body of `PATCH /workspaces/{workspaceId}/labels/{labelId}` — partial;
        `null`/omitted means "leave unchanged". Requires `label.manage` — the
        label's creator.
      properties:
        name: { type: string, maxLength: 200, description: 'New name if present — same normalization, 60-char limit and case-insensitive uniqueness as create (`409` + `existingId`; a pure casing change is allowed).' }
        color: { type: string, pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$', description: 'New color if present (`#RRGGBB`/`#RRGGBBAA`).' }
        description: { type: string, maxLength: 200, description: 'New description if present; a blank string clears it.' }

    MergeLabelsRequest:
      type: object
      required: [sourceIds]
      description: Body of `POST /workspaces/{workspaceId}/labels/{labelId}/merge` — the labels to absorb into the path label.
      properties:
        sourceIds:
          type: array
          minItems: 1
          maxItems: 50
          description: >-
            The labels to merge into the target and then delete. Must be
            non-empty (`400`), at most 50 (`400`), all inside this workspace and
            none equal to the target (`422`).
          items: { type: string, format: uuid }

    MergeLabelsResponse:
      type: object
      description: Outcome of a merge. No per-issue history is written — this response plus the target's bumped `updatedAt` are the record.
      properties:
        targetId: { type: string, format: uuid, description: The surviving label }
        mergedLabelCount: { type: integer, description: How many source labels were absorbed and deleted }
        reassignedIssueCount: { type: integer, description: 'How many issue attachments now point at the target (collapsed duplicates are not counted twice)' }

    LabelUsageResponse:
      type: object
      description: How many issues currently carry a label.
      properties:
        issueCount: { type: integer, example: 12 }

    ComponentResponse:
      type: object
      description: >-
        A project component — a curated module of one project, with an optional
        lead and an optional create-time auto-assign.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80, example: Billing, description: 'Display name (casing preserved); unique per project case-insensitively' }
        description: { type: string, nullable: true, maxLength: 500 }
        leadId: { type: string, format: uuid, nullable: true, description: 'The component lead, or null' }
        leadName: { type: string, nullable: true, example: Ada Lovelace }
        leadAvatarUrl: { type: string, nullable: true }
        autoAssign:
          type: boolean
          description: >-
            When true, an issue created with this component and no explicit
            `assigneeId` is assigned to the lead. Cannot be true without a lead.
        archived: { type: boolean, description: 'Archived components stay on their issues but can no longer be attached' }
        issueCount:
          type: integer
          nullable: true
          description: >-
            Issues currently carrying this component — only filled by
            `GET …/components?withUsage=true` and `GET …/components/{id}/usage`;
            `null` otherwise.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ComponentRef:
      type: object
      nullable: true
      description: A component's display summary as embedded in an issue — deliberately minimal.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Billing }
        archived: { type: boolean, description: 'True when the component is archived (render it dimmed)' }

    CreateComponentRequest:
      type: object
      required: [name]
      description: >-
        Body of `POST /workspaces/{workspaceId}/projects/{projectId}/components`.
        Same permission as the create/update endpoints above (built-in project
        `MANAGER`, or a workspace `OWNER`/`ADMIN` across their workspace).
      properties:
        name:
          type: string
          maxLength: 200
          description: >-
            Required, non-blank. Normalized server-side (NFC, invisible
            control/format characters stripped, whitespace collapsed; spaces are
            allowed) and then limited to 80 characters — a longer or blank
            result is a `400`. The 200-char schema limit is only a payload
            guard. Unique per project, case-insensitively, archived components
            included (`409`).
          example: Billing
        description: { type: string, nullable: true, maxLength: 500, description: 'Optional note; blank is stored as null.' }
        leadId:
          type: string
          format: uuid
          nullable: true
          description: 'The component lead. Must be a member of this workspace — anything else is a `422` "Unknown lead".'
        autoAssign:
          type: boolean
          default: false
          description: >-
            Assign new issues filed under this component to its lead. Requires
            `leadId` (a `422` otherwise).

    UpdateComponentRequest:
      type: object
      description: >-
        Body of `PATCH …/components/{componentId}` — partial; `null`/omitted
        means "leave unchanged". Project curator only.
      properties:
        name: { type: string, maxLength: 200, description: 'New name if present — same normalization, 80-char limit and per-project case-insensitive uniqueness as create (`409`; a pure casing change is allowed).' }
        description: { type: string, maxLength: 500, description: 'New description if present; a blank string clears it.' }
        leadId: { type: string, format: uuid, description: 'New lead if present; must be a workspace member (`422` otherwise).' }
        clearLead: { type: boolean, default: false, description: 'Unset the lead (a null leadId cannot be distinguished from "not sent"); ignored when leadId is also given.' }
        autoAssign: { type: boolean, description: 'Toggle create-time auto-assign. Turning it on while the component ends up with no lead is a `422`.' }

    ComponentUsageResponse:
      type: object
      description: How many issues currently carry a component.
      properties:
        issueCount: { type: integer, example: 12 }

    VersionResponse:
      type: object
      description: >-
        A project version — one entry of the release plan, with a fully
        reversible release lifecycle. The three counters are **always** present
        (unlike `ComponentResponse.issueCount`/`LabelResponse.issueCount`, which
        are opt-in): they cost one grouped query for the whole list, so this is
        the Releases page's data source without a second round-trip.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60, example: 2.4.0, description: 'Display name (casing preserved); unique per project case-insensitively' }
        description: { type: string, nullable: true, maxLength: 500 }
        releaseDate:
          type: string
          format: date
          nullable: true
          description: >-
            The planned (or, once released, the effective) release date. Kept
            across an un-release — it simply goes back to being the plan.
          example: '2026-09-01'
        released: { type: boolean, description: 'Moved only by POST …/release and POST …/unrelease, never by PATCH' }
        releasedAt:
          type: string
          format: date-time
          nullable: true
          description: When the release was actually performed; `null` while unreleased.
        archived: { type: boolean, description: 'Archived versions stay linked to their issues but can no longer be linked' }
        issueCount: { type: integer, description: 'Issues with a **fix** link to this version (affects links are not counted)' }
        doneIssueCount: { type: integer, description: 'Of those fix-linked issues, the ones in a DONE-category status — the progress bar numerator' }
        affectsIssueCount: { type: integer, description: 'Issues with an **affects** link (triage, not progress)' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    VersionRef:
      type: object
      description: A version's display summary as embedded in an issue — deliberately minimal.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 2.4.0 }
        released: { type: boolean, description: 'True once shipped (pickers mark released options)' }
        archived: { type: boolean, description: 'True when the version is archived (render it dimmed)' }

    CreateVersionRequest:
      type: object
      required: [name]
      description: >-
        Body of `POST /workspaces/{workspaceId}/projects/{projectId}/versions`.
        Same permission as the create/update endpoints above (built-in project
        `MANAGER`, or a workspace `OWNER`/`ADMIN` across their workspace).
      properties:
        name:
          type: string
          maxLength: 200
          description: >-
            Required, non-blank. Normalized server-side (NFC, invisible
            control/format characters stripped, whitespace collapsed; spaces are
            allowed) and then limited to 60 characters — a longer or blank
            result is a `400`. The 200-char schema limit is only a payload
            guard. Unique per project, case-insensitively, archived versions
            included (`409`).
          example: 2.4.0
        description: { type: string, nullable: true, maxLength: 500, description: 'Optional note; blank is stored as null.' }
        releaseDate:
          type: string
          format: date
          nullable: true
          description: >-
            The **planned** release date. It does not release anything — a new
            version is always created unreleased. Must fall within
            `1000-01-01`…`9999-12-31` (a `422`, not a `400`, beyond that).
          example: '2026-09-01'

    UpdateVersionRequest:
      type: object
      description: >-
        Body of `PATCH …/versions/{versionId}` — partial; `null`/omitted means
        "leave unchanged". Project curator only. There is deliberately no
        `released` field: the lifecycle moves only through `POST …/release` and
        `POST …/unrelease`.
      properties:
        name: { type: string, maxLength: 200, description: 'New name if present — same normalization, 60-char limit and per-project case-insensitive uniqueness as create (`409`; a pure casing change is allowed).' }
        description: { type: string, maxLength: 500, description: 'New description if present; a blank string clears it.' }
        releaseDate: { type: string, format: date, description: 'New planned date if present. Must fall within `1000-01-01`…`9999-12-31` (`422` beyond that).' }
        clearReleaseDate: { type: boolean, default: false, description: 'Unset the planned date (a null releaseDate cannot be distinguished from "not sent"); ignored when releaseDate is also given.' }

    ReleaseVersionRequest:
      type: object
      description: >-
        Body of `POST …/versions/{versionId}/release` — **entirely optional**,
        both fields included, so `{}` (or no body at all) is a valid "just
        release it".
      properties:
        releaseDate:
          type: string
          format: date
          nullable: true
          description: >-
            Overrides the stored plan date. When neither this nor the stored
            `releaseDate` is set, the server stamps today's UTC date. Must fall
            within `1000-01-01`…`9999-12-31` (`422` beyond that).
          example: '2026-09-01'
        moveUnresolvedToVersionId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Re-point the **fix** links of every issue in a non-DONE status to
            this version instead. It must be another version of the same
            project, **unreleased** and non-archived (`422` otherwise). Omit it
            and unresolved issues simply keep the released version — releasing
            with open work is allowed on purpose.

    VersionUsageResponse:
      type: object
      description: >-
        What a version is used for — backs the delete-confirmation dialog and
        the release dialog's "move N unresolved issues to →" prompt.
      properties:
        fixIssueCount: { type: integer, example: 24, description: 'Issues with a fix link' }
        affectsIssueCount: { type: integer, example: 3, description: 'Issues with an affects link' }
        unresolvedFixIssueCount: { type: integer, example: 6, description: 'Fix-linked issues NOT in a DONE-category status — what `moveUnresolvedToVersionId` would move' }

    SprintState:
      type: string
      enum: [FUTURE, ACTIVE, COMPLETED]
      description: >-
        The sprint lifecycle, one-way: `FUTURE` (a planning bucket) →
        `ACTIVE` (at most one per project, enforced in the database) →
        `COMPLETED` (terminal — there is **no re-open**).

    SprintResponse:
      type: object
      description: >-
        A project sprint. The counters are **always** present (like
        `VersionResponse`'s progress): they cost one grouped query for the whole
        page, so there is nothing to opt out of.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60, example: Sprint 7, description: 'Display name (casing preserved); unique per project case-insensitively, completed sprints included' }
        goal: { type: string, nullable: true, maxLength: 500, example: Ship billing v2 }
        state: { $ref: '#/components/schemas/SprintState' }
        sequence: { type: integer, example: 7, description: '1-based, per project — drives the default name and the FUTURE/COMPLETED ordering' }
        startAt: { type: string, format: date-time, nullable: true, description: 'Planned while FUTURE; stamped when the sprint is started' }
        endAt: { type: string, format: date-time, nullable: true, description: 'Planned end; defaults at start to startAt + app.agile.default-sprint-length-days' }
        completedAt: { type: string, format: date-time, nullable: true, description: 'Non-null exactly when state is COMPLETED' }
        daysRemaining:
          type: integer
          nullable: true
          example: 6
          description: >-
            Whole days from today (UTC) to `endAt`, for an **ACTIVE** sprint
            with an end date only — `0` means it ends today and a **negative**
            value means it is overdue. `null` otherwise: a FUTURE or COMPLETED
            sprint has nothing to count down.
        issueCount: { type: integer, example: 12 }
        doneIssueCount: { type: integer, example: 7, description: 'Of those, the ones in a DONE-category status' }
        points: { type: number, example: 34.5, description: 'Sum of the sprint''s story points; unestimated issues contribute nothing (they are counted separately, not as zero)' }
        donePoints: { type: number, example: 21, description: 'Sum of story points over the DONE-category issues' }
        unestimatedCount: { type: integer, example: 2, description: 'Issues with no storyPoints' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SprintRef:
      type: object
      description: >-
        A sprint's display summary as embedded in an issue and in the completion
        dialog's target list — deliberately minimal, but it carries `state` so a
        client can badge the active sprint differently without a second fetch.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Sprint 7 }
        state: { $ref: '#/components/schemas/SprintState' }

    SectionStats:
      type: object
      description: >-
        Roll-up of one planning section — a sprint or the backlog. **Always
        computed over the whole section**, never over the truncated page, so a
        capped section still shows honest totals.
      properties:
        issueCount: { type: integer, example: 12, description: 'Issues in the section after the request''s filters' }
        doneIssueCount: { type: integer, example: 7 }
        points: { type: number, example: 34.5 }
        donePoints: { type: number, example: 21 }
        unestimatedCount: { type: integer, example: 2, description: '"We didn''t estimate it" is a different statement from "it''s free"' }

    BacklogViewResponse:
      type: object
      description: >-
        The whole planning view of one project in a single round trip. Sections
        are independently truncatable at `sectionCap` and independently
        refreshable — treat them as such, because if the payload ever gets too
        large the fix is lazy per-section fetches behind this same shape.
      properties:
        sprints:
          type: array
          description: 'The project''s OPEN sprint sections — ACTIVE first, then FUTURE by sequence. `[]` for a project with no open sprint.'
          items:
            type: object
            properties:
              sprint: { $ref: '#/components/schemas/SprintResponse' }
              issues:
                type: array
                items: { $ref: '#/components/schemas/IssueResponse' }
              truncated: { type: boolean, description: 'True when the section holds more than `sectionCap` matching issues' }
              totalAvailable: { type: integer, format: int64, description: 'Full filtered count of the section (equals issues length when not truncated)' }
              stats: { $ref: '#/components/schemas/SectionStats' }
        backlog:
          type: object
          description: The ranked backlog — the same shape without a sprint header.
          properties:
            issues:
              type: array
              items: { $ref: '#/components/schemas/IssueResponse' }
            truncated: { type: boolean }
            totalAvailable: { type: integer, format: int64 }
            stats: { $ref: '#/components/schemas/SectionStats' }
        sectionCap: { type: integer, example: 300, description: 'The per-section cap in force for this response (app.agile.section-max-issues)' }
        bulkMoveCap:
          type: integer
          example: 100
          description: >-
            The cap on ONE `POST …/sprints/{sprintId}/issues` call
            (`app.agile.max-issues-per-bulk-move`, default 100). Echoed here
            because it is a **different** operator knob from `sectionCap`
            (default 300): a "move everything to…" action is driven by the
            rendered section, so a client that derives one number from the other
            `400`s on every section above the bulk cap. Chunk bulk moves at this
            value instead of hardcoding it.

    SprintCompletionPreview:
      type: object
      description: >-
        What `POST …/sprints/{sprintId}/complete` would report, computed before
        the fact — off the same query, so the dialog and the result cannot
        drift.
      properties:
        totalIssueCount: { type: integer, example: 12 }
        doneIssueCount: { type: integer, example: 7 }
        unfinishedIssueCount: { type: integer, example: 5, description: 'Issues whose status category is NOT DONE — exactly what the completion will move' }
        totalPoints: { type: number, example: 34.5 }
        donePoints: { type: number, example: 21 }
        unfinishedPoints: { type: number, example: 13.5 }
        targetCandidates:
          type: array
          description: >-
            The `FUTURE` sprints of this project the unfinished work may be
            carried over to (the sprint being completed is excluded). An empty
            list means the dialog must offer "create a sprint" instead.
          items: { $ref: '#/components/schemas/SprintRef' }

    CompleteSprintRequest:
      type: object
      required: [moveUnfinishedTo]
      description: >-
        Body of `POST …/sprints/{sprintId}/complete` — **required**, unlike the
        optional start body: the disposition of the unfinished work is a real
        decision, and defaulting it silently would move issues nobody asked to
        move.
      properties:
        moveUnfinishedTo:
          type: string
          enum: [BACKLOG, SPRINT]
          description: >-
            `BACKLOG` clears the sprint of every unfinished issue (the rank is
            preserved, so they keep their order); `SPRINT` carries them over to
            `targetSprintId`.
        targetSprintId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Required exactly when `moveUnfinishedTo` is `SPRINT`. Must be a
            `FUTURE` sprint of **this** project and not the sprint being
            completed — `422` otherwise. Deliberately not an ACTIVE one (there
            is none — this sprint is it) and not a COMPLETED one.

    SprintCompletionResult:
      type: object
      description: The honest done-vs-carried-over report of a completed sprint.
      properties:
        sprint: { $ref: '#/components/schemas/SprintResponse' }
        completedIssueCount: { type: integer, example: 7, description: 'Issues that ended the sprint in a DONE-category status — they KEEP their sprint, which is the sprint''s record of what it delivered' }
        carriedOverIssueCount: { type: integer, example: 5, description: 'Unfinished issues moved to the chosen destination' }
        carriedOverToSprintId: { type: string, format: uuid, nullable: true, description: 'The target sprint, or null when the unfinished work went back to the backlog' }
        donePoints: { type: number, example: 21 }
        carriedOverPoints: { type: number, example: 13.5 }

    CreateSprintRequest:
      type: object
      description: >-
        Body of `POST …/projects/{projectId}/sprints`. Project curator only.
        Everything is optional — the empty object `{}` creates the next
        `"Sprint N"`.
      properties:
        name:
          type: string
          maxLength: 60
          example: Sprint 7
          description: >-
            Blank or absent → `"Sprint " + sequence`, which is why default names
            can never collide. Normalized server-side (NFC, invisible
            control/format characters stripped, whitespace collapsed) and then
            limited to 60 characters — a longer result is a `400`. Unique per
            project, case-insensitively, **completed sprints included** (`409`).
        goal: { type: string, nullable: true, maxLength: 500, example: Ship billing v2 }
        startAt: { type: string, format: date-time, nullable: true, description: 'The **plan** only — filling it in does NOT start the sprint (that is POST …/start)' }
        endAt: { type: string, format: date-time, nullable: true, description: 'Must be after `startAt` (`422` otherwise)' }

    UpdateSprintRequest:
      type: object
      description: >-
        Body of `PATCH …/sprints/{sprintId}` — partial; omitted means "leave
        unchanged". Project curator only. There is deliberately no `state`
        field: the lifecycle moves only through `POST …/start` and
        `POST …/complete`, and there is no re-open.
      properties:
        name: { type: string, maxLength: 60, description: 'Same normalization, 60-char limit and per-project case-insensitive uniqueness as create (`409`; a pure casing change is allowed).' }
        goal: { type: string, maxLength: 500, description: 'New goal if present; a blank string clears it.' }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        clearStartAt: { type: boolean, default: false, description: 'Unset the start date (a null startAt cannot be distinguished from "not sent"); ignored when startAt is also given.' }
        clearEndAt: { type: boolean, default: false, description: 'Unset the end date; ignored when endAt is also given.' }

    StartSprintRequest:
      type: object
      description: >-
        Body of `POST …/sprints/{sprintId}/start` — **entirely optional**, so no
        body at all (or `{}`) means "start it now with the default length".
      properties:
        startAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Defaults to **now** (UTC). A date in the past is allowed on purpose:
            backfilling a sprint that actually began on Monday is normal.
        endAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Defaults to `startAt` + `app.agile.default-sprint-length-days`
            (default 14). `endAt <= startAt` is a `422`.
        goal: { type: string, nullable: true, maxLength: 500, description: 'An optional last-minute goal; omitted leaves the stored one.' }

    AddIssuesToSprintRequest:
      type: object
      required: [issueIds]
      description: Body of `POST …/sprints/{sprintId}/issues`.
      properties:
        issueIds:
          type: array
          minItems: 1
          maxItems: 500
          description: >-
            The issues to move, by **id** (the established convention for
            references — only the rank endpoint's moved issue travels by
            number). Duplicates are de-duped; an issue already in this sprint is
            a silent no-op. More than `app.agile.max-issues-per-bulk-move`
            (default 100) distinct ids is a `400` — chunk the request. The
            500-entry schema limit is only a payload guard.
          items: { type: string, format: uuid }
        position:
          type: string
          enum: [TOP, BOTTOM]
          default: BOTTOM
          description: >-
            Where the moved issues land in the target sprint's slice of the
            shared rank space; they keep their relative order among themselves.
            `BOTTOM` is the default — adding work to a sprint is not a priority
            statement.

    RankIssueRequest:
      type: object
      description: >-
        Body of `POST …/issues/{number}/rank`. **The client never sends a rank
        value** — it sends the neighbours it dropped between and the server
        computes the placement, which is why `position` is not exposed anywhere.
      properties:
        afterIssueId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The issue the moved one should land **after** (below it). Must
            already be in the target section (`422` otherwise) and may not be
            the moved issue itself (`422`).
        beforeIssueId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The issue it should land **before** (above it), same rules.
            Whichever anchor is omitted is filled in server-side; **both**
            omitted means "append to the end of the target section" and is only
            valid together with a sprint change.
        sprintId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Move the issue into this sprint in the same request. Unknown,
            foreign-project or `COMPLETED` → `422`; so is moving the issue out
            of a sprint that is already `COMPLETED`. Mutually exclusive with
            `clearSprint` (`400` when both are set).
        clearSprint:
          type: boolean
          default: false
          description: >-
            Move the issue back to the backlog. **Mutually exclusive with
            `sprintId`** (`400` when both are set). Clearing a `COMPLETED`
            sprint is a `422`.
        version:
          type: integer
          nullable: true
          description: >-
            **Optional** optimistic check: sent → `409` when stale, omitted →
            the move simply applies. Ranking is a positional, last-drag-wins
            operation, so a mandatory version round trip would produce a `409`
            storm during a planning meeting.

    NotificationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: ISSUE_ASSIGNED }
        title: { type: string, example: You were assigned DEMO-18 }
        body: { type: string, nullable: true }
        link: { type: string, nullable: true, example: /w/…/p/…?issue=18 }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
