            properties:
              priority: { $ref: '#/components/schemas/Priority' }
              isDefault: { type: boolean, description: Default for new issues }
        projectsUsing: { type: integer, format: int64 }
        scope: { $ref: '#/components/schemas/AdminScope' }

    ProjectBinding:
      type: object
      description: One row of the admin assignment matrix; null binding = system default
      properties:
        projectId: { type: string, format: uuid }
        key: { type: string, example: DEMO }
        name: { type: string }
        archived: { type: boolean }
        workspaceId: { type: string, format: uuid }
        workspaceName: { type: string }
        workflowId: { type: string, format: uuid, nullable: true }
        prioritySetId: { type: string, format: uuid, nullable: true }
        fieldSetId: { type: string, format: uuid, nullable: true }
        issueTypeSetId: { type: string, format: uuid, nullable: true }

    SetOption:
      type: object
      description: A bindable set, tagged with its scope (delegated consoles)
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { $ref: '#/components/schemas/AdminScope' }

    BindingOptions:
      type: object
      description: Sets bindable to a project/workspace, per dimension
      properties:
        workflows: { type: array, items: { $ref: '#/components/schemas/SetOption' } }
        prioritySets: { type: array, items: { $ref: '#/components/schemas/SetOption' } }
        fieldSets: { type: array, items: { $ref: '#/components/schemas/SetOption' } }
        issueTypeSets: { type: array, items: { $ref: '#/components/schemas/SetOption' } }

    AdminUser:
      type: object
      description: A user account in the admin directory
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        systemRole: { type: string, enum: [ADMIN, USER] }
        status: { type: string, enum: [ACTIVE, PENDING, DISABLED] }
        hasPassword:
          type: boolean
          description: False while the account still awaits its setup link being used
        createdAt: { type: string, format: date-time }

    AdminIssueTypeSet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: All types }
        systemDefault: { type: boolean }
        types:
          type: array
          description: Display order
          items: { $ref: '#/components/schemas/IssueTypeResponse' }
        projectsUsing: { type: integer, format: int64 }
        scope: { $ref: '#/components/schemas/AdminScope' }

    UsageDetail:
      type: object
      description: '"Where exactly is this used?" — names instead of counts'
      properties:
        workflows:
          type: array
          items: { type: string }
        sets:
          type: array
          items: { type: string }
        projects:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              key: { type: string, example: DEMO }
              name: { type: string }
        issues: { type: integer, format: int64 }

    FieldType:
      type: string
      enum: [TEXT, TEXTAREA, NUMBER, DATE, SELECT, MULTI_SELECT, USER, CHECKBOX, URL]
      description: >-
        Determines the JSON value shape: TEXT/TEXTAREA/URL string ·
        NUMBER number · DATE "YYYY-MM-DD" string · SELECT option id ·
        MULTI_SELECT array of option ids · USER user UUID (workspace
        member) · CHECKBOX boolean

    FieldConfig:
      type: object
      nullable: true
      description: '`options` for selects; `min`/`max` for numbers'
      properties:
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, example: critical, description: Referenced by stored values — stable once used }
              label: { type: string, example: Critical }
              color: { type: string, nullable: true, example: '#B91C1C' }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }

    UpsertField:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 100 }
        key:
          type: string
          pattern: '[a-z0-9_]*'
          maxLength: 50
          description: >-
            Blank on create = derived from the name; immutable afterwards. On
            create it may not be a key the HQL search vocabulary has claimed
            (409) — the check runs after that derivation, so naming a field
            "Project" is refused just as spelling `key: project` is.
        type: { $ref: '#/components/schemas/FieldType' }
        config: { $ref: '#/components/schemas/FieldConfig' }
        description: { type: string, maxLength: 500, nullable: true, description: Shown as a hint in issue forms }

    AdminField:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: severity }
        name: { type: string, example: Severity }
        type: { $ref: '#/components/schemas/FieldType' }
        config: { $ref: '#/components/schemas/FieldConfig' }
        description: { type: string, nullable: true }
        archived: { type: boolean }
        isSystem: { type: boolean, description: "Built-in system field — can only be archived, not deleted" }
        usage: { $ref: '#/components/schemas/UsageInfo' }
        scope: { $ref: '#/components/schemas/AdminScope' }

    AdminFieldSet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Engineering fields }
        systemDefault: { type: boolean }
        items:
          type: array
          description: Display order
          items:
            type: object
            properties:
              field: { $ref: '#/components/schemas/AdminField' }
              required: { type: boolean, description: Must be filled on create; cannot be cleared }
              showOnCreate: { type: boolean, description: Rendered in the create form }
        projectsUsing: { type: integer, format: int64 }
        scope: { $ref: '#/components/schemas/AdminScope' }

    FieldValueEntry:
      type: object
      description: A filled custom field on an issue
      properties:
        fieldId: { type: string, format: uuid }
        value: { description: Shape depends on the field type — see FieldType }

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }

    WorkspaceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: acme-inc }
        name: { type: string, example: Acme Inc }
        projectAccessMode:
          allOf:
            - $ref: '#/components/schemas/ProjectAccessMode'
          description: >-
            Whether members who were never added to a project inherit its
            default role. **This is the only place it is published** — a
            workspace-level fact with one source of truth, read by every surface
            that needs it (a project's People card included) from the workspace
            response it already caches. Change it with
            `PATCH /workspaces/{workspaceId}`.
        defaultProjectRoleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The workspace's declared default project role, or `null` for the
            built-in **Contributor**. A raw **id, never a name**: resolve it
            against `GET /workspaces/{workspaceId}/roles`, which is
            workspace-scoped and so cannot return a foreign role, and render a
            placeholder if you cannot find it. It is *declared* rather than
            effective — it is stored and returned in both modes, and in `STRICT`
            it is inert until the workspace is switched back to `OPEN`.
        myRole:
          allOf:
            - $ref: '#/components/schemas/WorkspaceRole'
          nullable: true
          description: >-
            The caller's workspace role **key**. Fine to display; to decide what
            to show, read `myPermissions` instead — this is an open string and
            `myRole === 'ADMIN'` is not a question that can be answered
            correctly for every member.


            **`null` on `GET /workspaces` only**, when the caller's own
            membership row fails the role scope/ownership assertion: the
            workspace stays in the directory with `myPermissions: []` rather
            than vanishing, and the refused role is never named. The detail read
            (`GET /workspaces/{workspaceId}`) still `404`s that same
            workspace — a list is a directory, a detail read is an
            authorization, and degrading the latter would leave the caller
            silently inheriting a project role everywhere instead of nothing.
        myPermissions:
          allOf:
            - $ref: '#/components/schemas/MyPermissions'
          description: >-
            The caller's effective **workspace-scoped** permissions (see
            `GET /permissions`). Always present, possibly empty.
        createdAt: { type: string, format: date-time }

    ProjectAccessMode:
      type: string
      enum: [OPEN, STRICT]
      description: >-
        How a workspace treats somebody who has never been added to one of its
        projects. **It decides exactly one thing** — whether a member with no
        explicit `project_members` row inherits the project's default role — and
        it is emphatically **not an "enforcement off" switch**: permissions mean
        what they say in both modes, and there is no third value.


        `OPEN` — everyone in the workspace can work in every project, through
        the default-role chain (`DefaultRoleResponse`). Add somebody to a
        project only to give them a *different* role. This is the default for
        new workspaces and for every workspace upgraded into this release, and
        behaviour under it is identical to the previous release.


        `STRICT` — only people explicitly added to a project can change anything
        in it. Everyone can still **see** every project: `STRICT` narrows writes
        only, and narrowing reads would be private projects by the back door.
        The declared defaults are still stored while it is on, inert, and go
        live again the moment the workspace is switched back — which is why the
        grant ceiling on them applies in both modes.
      example: OPEN

    UpdateWorkspaceRequest:
      type: object
      description: >-
        The body of `PATCH /workspaces/{workspaceId}` and of
        `POST /workspaces/{workspaceId}/project-access/preview`. Every field is
        optional and each is an independent decision; a body naming **none** of
        them is a `400`, because "I asked for nothing and something may have
        happened" is not an answer.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed server-side; 1–255 characters after trimming.
          example: Acme Inc
        projectAccessMode:
          allOf:
            - $ref: '#/components/schemas/ProjectAccessMode'
          description: >-
            Omit to leave the mode alone. An unknown value is a `400` at the
            JSON boundary, which is the right failure — there is no third mode
            to fall back to.
        defaultProjectRoleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The `PROJECT`-scoped role every member inherits where they have no
            explicit `project_members` row and the project names no default of
            its own. `422` when it is unknown, foreign or `WORKSPACE`-scoped —
            scope is not negotiable, because a workspace role accepted here
            would put `workspace.edit` into every member's context in every
            project. Subject to the grant ceiling on **both ends**, `403`
            naming the missing permission.
        clearDefaultProjectRole:
          type: boolean
          default: false
          description: >-
            Store `null`, i.e. fall through to the built-in **Contributor**.
            Sending it **and** `defaultProjectRoleId` is a `422`: the two mean
            different things, and resolving them by precedence would store a
            value the caller did not ask for in the one part of the product
            where that is a privilege change.

    SettableRolesView:
      type: object
      description: >-
        **The grant ceiling, rendered** — which `PROJECT`-scoped roles this
        caller may make a default, and the first permission that is why not for
        the rest, so an administrator sees the bound while choosing instead of
        as a `403` afterwards.


        Derived **server-side** by the same comparison the runtime refusal
        makes, which is the only reason a greyed-out tooltip and a `403` can
        quote one string. Do **not** re-derive it client-side: the
        own-only/unrestricted asymmetry between permission keys is subtle, and a
        second implementation of a server predicate drifts.


        It is **server-derived guidance, not enforcement**. The write re-checks
        the ceiling in its own transaction, so a role listed in `canSet` can
        still be refused if the caller's own permissions changed in between, and
        a client must handle the `403` regardless of what this block said. Every
        role named here is one the caller can already list through
        `GET /workspaces/{workspaceId}/roles` — a built-in template or one of
        this workspace's own.


        The comparand differs by scope, so the same role may appear in `canSet`
        at one scope and in `cannotSet` at the other: the **workspace** picker
        compares against a fixed baseline (the built-in Contributor's
        permissions plus the caller's workspace-wide project grants), with the
        built-in `OWNER` exempt; the **project** picker compares against the
        caller's real effective set in that project, with nobody exempt.
      properties:
        canSet:
          type: array
          description: Roles the ceiling admits, in the catalog's display order.
          items: { $ref: '#/components/schemas/RoleRef' }
        cannotSet:
          type: array
          description: >-
            Roles it refuses, each with `missing` — the **first** permission the
            caller does not hold, and the identical string the runtime `403`
            carries for that role.
          items: { $ref: '#/components/schemas/RoleBlocker' }

    ProjectAccessResponse:
      type: object
      description: >-
        `GET /workspaces/{workspaceId}/project-access` — one request behind the
        workspace General settings page.
      properties:
        mode:
          allOf:
            - $ref: '#/components/schemas/ProjectAccessMode'
          description: The workspace's current project-access mode.
        defaultProjectRoleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The declared workspace default; `null` means the built-in
            **Contributor**. An **id, never a name** — resolve it against
            `GET /workspaces/{workspaceId}/roles` (workspace-scoped, so it
            cannot return a foreign role) and render a placeholder if you
            cannot find it.
        settable:
          allOf:
            - $ref: '#/components/schemas/SettableRolesView'
          description: >-
            Which roles **this caller** may make the workspace default, bounded
            by the fixed Contributor baseline.
        impact:
          allOf:
            - $ref: '#/components/schemas/ProjectAccessImpactResponse'
          description: >-
            The impact block computed for the workspace's **current** state, so
            the page can say what things look like before anything is proposed.
            A confirm dialog should re-fetch
            `POST …/project-access/preview` for the *proposed* state rather than
            reusing this.

    ProjectAccessState:
      type: object
      description: >-
        A workspace's project-access configuration on one side of a change. Ids,
        never names — the same rule as everywhere else in this area.
      properties:
        mode: { $ref: '#/components/schemas/ProjectAccessMode' }
        defaultProjectRoleId:
          type: string
          format: uuid
          nullable: true
          description: '`null` means the built-in Contributor.'

    ProjectAccessProjectImpact:
      type: object
      description: One live project's row of the impact preview.
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: PAY }
        name: { type: string, example: Payments }
        membersOnDefault:
          type: integer
          format: int64
          description: >-
            ACTIVE workspace members with **no** explicit `project_members` row
            in this project — the people the mode is about.
          example: 21
        explicitMembers:
          type: integer
          format: int64
          description: >-
            ACTIVE members who do hold a row here, and are therefore unaffected
            by the mode.
          example: 3
        membersLosingEverything:
          type: integer
          format: int64
          description: >-
            Of the members on the default, those whose **workspace** role grants
            neither `project.curate.all` nor `project.administer.all` — the ones
            who would hold the empty set here afterwards.
          example: 21
        noWritersAfter:
          type: boolean
          description: >-
            Whether this project would be one of `projectsWithNoWriters` — i.e.
            nobody at all would hold `issue.create` in it.
          example: false

    ProjectAccessImpactResponse:
      type: object
      description: >-
        **What a project-access change would do.** The body of
        `POST /workspaces/{workspaceId}/project-access/preview`, and the
        `impact` block of `GET …/project-access` computed for the current state.


        **Counts are advisory; refusals are authoritative.** Every number except
        `strandedProjects` is a snapshot of a population (active workspace
        members crossed with explicit project memberships) that is not the row
        being written, so it can go stale between this call and the write, and
        no optimistic check on the workspace could make it exact — hence
        `computedAt`, and hence no token, echo or `expectedCount`.
        `strandedProjects` is re-derived inside the write's transaction and
        enforced there whether or not anyone previewed.


        **How many, never who.** It names projects (id, `key`, `name` — all
        already listable by the caller) and no people at all: no names, no
        emails, no user ids. A per-person list would be a workspace-wide access
        report behind a single permission.
      properties:
        computedAt:
          type: string
          format: date-time
          description: >-
            When this snapshot was taken. Re-fetch immediately before acting;
            never render a preview older than the interaction it belongs to.
        from:
          allOf:
            - $ref: '#/components/schemas/ProjectAccessState'
          description: The workspace's state now.
        to:
          allOf:
            - $ref: '#/components/schemas/ProjectAccessState'
          description: The state the previewed body would produce.
        activeMembers:
          type: integer
          format: int64
          description: >-
            ACTIVE members of the workspace. Deactivated accounts are excluded
            throughout: an account that cannot log in is not a person who loses
            access.
          example: 24
        projects:
          type: integer
          description: Live (non-archived) projects of the workspace.
          example: 5
        projectsWithNoExplicitMembers:
          type: integer
          description: How many of those nobody has ever been added to.
          example: 3
        projectsWithNoWriters:
          type: integer
          description: >-
            **The honest headline.** Live projects where, after the change,
            *nobody at all* would hold `issue.create` — no explicit member's
            role grants it and the fallback is gone. A workspace `OWNER`/`ADMIN`
            does **not** rescue such a project: their workspace-wide curator
            grants are `project.edit`, `component.manage`, `version.manage` and
            `sprint.manage`, and carry no issue or comment permission — so in a
            restricted project with no explicit members nobody can file or edit
            an issue, the Owner included. A warning, not a refusal: a workspace
            may legitimately restrict a project nobody is working in.
          example: 3
        perProject:
          type: array
          description: One row per live project, ordered by `key`.
          items: { $ref: '#/components/schemas/ProjectAccessProjectImpact' }
        strandedProjects:
          type: array
          description: >-
            The projects this write would **`409`** on — they have
            administrators only by inheritance and the change takes it away.
            Empty is the normal answer, and this is the one number here that is
            re-derived and enforced under the write.
          items: { $ref: '#/components/schemas/ProjectRef' }

    WorkspaceMemberResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        roleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The member's role **identity** — the id of the row in
            `GET /workspaces/{workspaceId}/roles`, and the field to match a
            member against that catalog. Purely additive: `role` stays beside
            it, is **not** deprecated, and still carries the key.


            **A key is not an identity.** Keys are unique per
            *(workspace, scope)* only, so one string can name two different
            roles across scopes: `MEMBER` is already the key of both the
            built-in workspace **Member** and the built-in project
            **Contributor** — two roles, two ids, two different permission
            sets. A client that resolves a member's role by key against a
            catalog covering both scopes can therefore name the wrong privilege
            today, with no custom role involved. Within a single
            *(workspace, scope)* a duplicate or built-in-colliding key cannot
            currently be created (custom keys are server-generated and suffixed
            on collision), so this is about identity being the wrong shape —
            not about a live collision.


            **`null` exactly when `role` is `null`, and never on its own.**
            The two degrade together: on the member list a row whose stored
            role fails its scope/ownership assertion answers `role: null`
            **and** `roleId: null`. Emitting the id would hand back the
            withheld name by proxy — the client would resolve it in the role
            catalog and print it — so `roleId: null` means exactly what
            `role: null` means: this row's role is not nameable.
        role:
          allOf:
            - $ref: '#/components/schemas/WorkspaceRole'
          nullable: true
          description: >-
            The member's role **key**. **`null` is possible** and means the
            server refused to describe this membership's role: the stored role
            failed its scope/ownership assertion, which the list survives rather
            than `404`-ing the whole People tab over one row. The role that was
            just refused is emphatically not rendered in its place — that name
            is the one thing the assertion exists to keep out. Render such an
            entry with no role rather than guessing one.
        joinedAt: { type: string, format: date-time }

    InviteMemberRequest:
      type: object
      required: [email]
      description: >-
        **Exactly one of `roleId` and `role` must be present** — neither and
        both are alike a `422`. See `roleId` for why both fields exist and why
        "both" is refused rather than resolved by precedence.
      properties:
        email: { type: string, format: email, maxLength: 255 }
        roleId:
          type: string
          format: uuid
          description: >-
            The assignable `WORKSPACE`-scoped role's id — **the only way to name
            a custom role**, since `role` resolves built-ins only. Unknown,
            foreign or `PROJECT`-scoped is one indistinguishable `422`.


            It exists **beside** the legacy `role` key rather than replacing it
            because the shipped web client's invite screen is already live and a
            release must be independently deployable. Exactly one of the two is
            required. "Both" is refused rather than resolved by precedence
            because the two fields do not always mean the same thing — the key
            resolves built-ins only and, on the project side, still carries the
            `VIEWER → MEMBER` translation, while an id addresses any assignable
            role verbatim. A silent winner would store a role the caller did not
            ask for, in the one part of the product where that is a privilege
            change.
        role:
          allOf:
            - $ref: '#/components/schemas/WorkspaceRole'
          deprecated: true
          description: >-
            **Deprecated — send `roleId` instead.** It still works exactly as
            before and is not going away in this release, but it can only name
            a built-in role, so it cannot express a workspace's own custom ones.
            Never `OWNER`, even for an owner.

    UpdateWorkspaceMemberRequest:
      type: object
      description: >-
        **Exactly one of `roleId` and `role` must be present** — neither and
        both are alike a `422`. Neither field is individually required any more,
        precisely because the other may carry the answer: "a `PATCH` with
        nothing to change" is now that `422` rather than a `400`, since the body
        is well-formed and it is the *combination* that cannot be honoured.
      properties:
        roleId:
          type: string
          format: uuid
          description: >-
            The assignable `WORKSPACE`-scoped role's id the member should end up
            with — the only way to name a custom role. Unknown, foreign or
            `PROJECT`-scoped is one indistinguishable `422`. It must not grant a
            permission the caller lacks, and neither may the member's current
            role; the built-in `OWNER` additionally requires the caller to be an
            owner. Sending the role they already hold is an accepted no-op.
        role:
          allOf:
            - $ref: '#/components/schemas/WorkspaceRole'
          deprecated: true
          description: >-
            **Deprecated — send `roleId` instead.** Unchanged behaviour: a
            built-in role key, `422` when it is not one this instance can assign
            here. It cannot name a custom role. See `InviteMemberRequest.roleId`
            for why the two fields coexist.

    CreateProjectRequest:
      type: object
      required: [name, key]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        key:
          type: string
          pattern: '^[A-Z0-9]+$'
          minLength: 1
          maxLength: 10
          example: DEMO
        description: { type: string, nullable: true }
        delivery:
          allOf:
            - $ref: '#/components/schemas/DeliveryRequest'
          description: >-
            How this team will deliver. **Optional** — omitted (or with null
            members) it yields the lean new-project defaults: `KANBAN`, releases
            **off**, estimation **off**. There is no server-side "Scrum implies
            estimation" rule, so a Scrum picker sends `board: SCRUM` *and*
            `estimation: true` in this one request.

    BoardMode:
      type: string
      enum: [KANBAN, SCRUM]
      default: KANBAN
      description: >-
        How the project's board reads. A **presentation switch, not a
        permission**: the sprint API behaves identically either way, so a Kanban
        team may still plan an iteration. `SCRUM` scopes the board to the active
        sprint and shows a sprint header; `KANBAN` shows the whole project.
        This is the `board` capability of `delivery`; the top-level `boardMode`
        field is a deprecated mirror of it.

    DeliveryPreset:
      type: string
      enum: [KANBAN, SCRUM, RELEASES, CUSTOM]
      readOnly: true
      description: |-
        The **derived** display label for a project's capability set — computed
        server-side, never stored and **never accepted in a request**. Exactly
        three combinations are named; the other five read as `CUSTOM`, which is a
        legal first-class answer ("Scrum + Releases" is an ordinary way to work).

        | preset | board | releases | estimation |
        |---|---|---|---|
        | `KANBAN` | `KANBAN` | off | off |
        | `SCRUM` | `SCRUM` | off | on |
        | `RELEASES` | `KANBAN` | on | off |
        | `CUSTOM` | any other combination | | |

    DeliveryRequest:
      type: object
      description: >-
        The write side of `DeliveryResponse`. Optional wherever it appears and
        **partial in every member**: a null/omitted member leaves that capability
        alone on `PATCH` and falls back to the lean default on `POST`, so
        `{"delivery":{"releases":true}}` turns releases on and touches nothing
        else. Setting a capability to the value it already has is a no-op that
        still returns `200` with the current state, and no switch ever destroys,
        clears or moves data.


        **`preset` is not settable.** It is derived from the three capabilities,
        so a body carrying it is a `400` naming the field rather than a silent
        ignore — a client **cannot** blindly `PATCH` back the `delivery` object
        it read from a `GET`; it must strip `preset` first.
      properties:
        board:
          allOf:
            - $ref: '#/components/schemas/BoardMode'
          description: >-
            Sprints as a planning concept. A closed set — an unknown value is a
            `400`, never a silent fall-through.
        releases:
          type: boolean
          nullable: true
          description: Versions — the Releases page and rail item, fix/affects pickers.
        estimation:
          type: boolean
          nullable: true
          description: Story points — the points input and every point sum.
        preset:
          type: string
          description: >-
            **Accepted only so it can be rejected.** Any non-null value returns
            `400 "delivery.preset is derived from board/releases/estimation and
            cannot be set"` — a `@Null` constraint on the nested object, so the
            body is a `ValidationProblemDetail` whose `errors` map is keyed
            `delivery.preset` and whose `detail` is that same sentence
            (un-prefixed: the message already names its field). The rejection is
            total — a body that sets `releases` *and* echoes `preset` changes
            nothing.

    DeliveryResponse:
      type: object
      description: >-
        How a project's team delivers — three stored capabilities plus the label
        derived from them. It rides every `ProjectResponse` (which the shell
        already fetches), so asking "does this project do X?" costs no extra
        request and no surface has to infer it from the presence of data.


        **This object is presentation, never API.** It tells a client what
        vocabulary to render; it does **not** tell it what will be accepted.
        Every endpoint behaves identically whatever these values are — a project
        with `releases: false` still accepts and returns version data, `POST
        …/sprints` still succeeds with `board: KANBAN`, and `storyPoints` still
        applies with `estimation: false`. Never treat a capability as a
        permission.


        The single place a capability is visible in the API is **autocomplete
        metadata**: `GET /search/schema` omits `sprint`, `fixVersion`,
        `affectsVersion` and `storyPoints` when no visible project has the
        matching capability on, and its `SPRINT`/`VERSION` picklists (plus
        `GET /search/suggest` for the two version fields) only carry names from
        capability-on projects. Those fields still parse, compile and run
        everywhere, so no saved filter can break when a capability is flipped.
      properties:
        board:
          allOf:
            - $ref: '#/components/schemas/BoardMode'
          description: >-
            `KANBAN` or `SCRUM`. Carries the same value as the deprecated
            top-level `boardMode`.
        releases:
          type: boolean
          description: Versions — the Releases page and rail item, fix/affects pickers.
        estimation:
          type: boolean
          description: Story points — the points input and every point sum.
        preset: { $ref: '#/components/schemas/DeliveryPreset' }

    UpdateProjectRequest:
      type: object
      description: Partial project update — omitted fields are left unchanged
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        description: { type: string }
        boardMode:
          allOf:
            - $ref: '#/components/schemas/BoardMode'
          deprecated: true
          description: >-
            **Deprecated** — superseded by `delivery.board`, which carries the
            identical value. Kept as an accepted mirror for one minor release so
            clients written against 0.13.0 keep working. A closed set — an
            unknown value is a `400`, never a silent fall-through; omitted/null
            leaves the current mode. Adding this field is what widened the
            endpoint's gate from project `MANAGER` to project **curator**.

            Sending it *together with* `delivery.board` is fine when the two
            **agree**; sending both with **different** values is a `400`
            (`boardMode and delivery.board disagree — send only one`) rather than
            a silent winner-takes-all. That one is a cross-field rule enforced in
            the service, so its body carries **no** `errors` map — and, like
            every rejection here, it applies nothing else from the body. When the
            mirror is finally dropped, behaviour does not change: `delivery.board`
            already carries the identical value.
        delivery:
          allOf:
            - $ref: '#/components/schemas/DeliveryRequest'
          description: >-
            The three delivery capabilities, each independently nullable
            (partial). Omitted leaves all three unchanged. Confirmations are a UI
            affordance only — the API answers `200` with no confirmation, and
            nothing is ever destroyed.

    DefaultRoleResponse:
      type: object
      description: >-
        The **default project role** a workspace member inherits in a project
        when they hold no project membership row of their own — which is most
        members. Both links of the chain are published, so a client can say not
        only *what* the default is but *where it came from*: this project's own
        override → the workspace-wide default → the built-in **Contributor**,
        first non-null wins.


        It rides every `ProjectResponse` for the same reason `delivery` does:
        every surface that needs it already fetches that response, so a
        default-access card costs no extra request.


        **Writing it.** Both links are read-only on the *project* endpoints — a
        `PATCH /workspaces/{workspaceId}/projects/{projectId}` body carrying
        `defaultRole` or a flattened `defaultProjectRoleId` is still ignored,
        and always will be. Each link has its own endpoint and its own gate,
        because a default is membership authority rather than project settings:
        `PATCH /workspaces/{workspaceId}/projects/{projectId}/default-role`
        (`project.member.manage`) writes `projectRoleId`, and
        `PATCH /workspaces/{workspaceId}` (`workspace.edit`) writes
        `workspaceRoleId`. Both are bounded by a grant ceiling, against
        different comparands — see those operations.


        **It can also change with nothing having touched the project.**
        `DELETE /workspaces/{workspaceId}/roles/{roleId}?reassignToRoleId=`
        repoints every project — and the workspace itself — that named the
        deleted `PROJECT`-scoped role as its default onto the replacement, in
        the same transaction that moves the role's holders. That is how a delete
        avoids leaving a dangling default. Re-read this object after a role
        deletion rather than assuming it is frozen.


        **The chain only yields while the workspace is `OPEN`.** In a `STRICT`
        workspace (`WorkspaceResponse.projectAccessMode`) nothing is inherited
        at all: a member with no explicit row holds nothing in the project
        beyond whatever their workspace role grants everywhere. These ids stay
        stored and returned — they are the *declared* default, and they go live
        again the moment the workspace is switched back — so read the mode
        before telling a user what the chain gives them.
      properties:
        projectRoleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            This project's own override, or `null` when the project inherits
            the workspace default. Emitted verbatim from the stored column, so
            a client that cannot find the id in
            `GET /workspaces/{workspaceId}/roles` should render a placeholder
            rather than a guess. Only an id ever leaves through this field —
            never a name, never a permission.
        workspaceRoleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The workspace-wide default, or `null` when the chain falls through
            to the built-in **Contributor**. Same column semantics as
            `projectRoleId`.

    ProjectResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string, example: Demo Project }
        key: { type: string, example: DEMO }
        description: { type: string, nullable: true }
        archived: { type: boolean }
        boardMode:
          allOf:
            - $ref: '#/components/schemas/BoardMode'
          deprecated: true
          description: >-
            **Deprecated** — superseded by `delivery.board`, which carries the
            identical value. Still populated (and still accepted on `PATCH`) for
            exactly one minor release so clients mid-flight keep working. New
            readers use `delivery`.
        delivery:
          allOf:
            - $ref: '#/components/schemas/DeliveryResponse'
          description: >-
            How this team delivers — `board`, `releases`, `estimation` and the
            derived `preset`. Presentation only: nothing in it changes what the
            API accepts or which status code it returns.
        defaultRole:
          allOf:
            - $ref: '#/components/schemas/DefaultRoleResponse'
          description: >-
            The default-role chain for members of this project who have **no
            explicit membership row** — this project's override and the
            workspace default behind it. **Read-only on this endpoint**: it is
            written by `PATCH …/projects/{projectId}/default-role`
            (`project.member.manage`) and `PATCH /workspaces/{workspaceId}`
            (`workspace.edit`), never by the project `PATCH`, and a `DELETE` of
            a `PROJECT`-scoped role with `reassignToRoleId` also moves the
            stored values. Whether the chain currently yields anything depends
            on `WorkspaceResponse.projectAccessMode`.
        myRole:
          allOf:
            - $ref: '#/components/schemas/ProjectRole'
          nullable: true
          description: >-
            The caller's **explicit** project role **key** — `VIEWER` when they
            have no project membership row of their own, even where that member
            can in fact do more than a viewer. Display only, and an open string:
            `myRole === 'MANAGER'` cannot express every role a member might
            hold. `myPermissions` carries the effective answer and is the field
            to gate on.


            **`null` on `GET …/projects` only**, when the caller's explicit
            project membership fails the role scope/ownership assertion. The
            project stays in the list; the explicit role then contributes
            **nothing** to `myPermissions`, deliberately rather than falling
            back to the workspace default, which would *widen* a member whose
            narrow row is exactly what was lost.
        myPermissions:
          allOf:
            - $ref: '#/components/schemas/MyPermissions'
          description: >-
            The caller's effective **project-scoped** permissions in this
            project (see `GET /permissions`), including any granted by their
            workspace role rather than a project membership. Always present,
            possibly empty. May be wider than `myRole` suggests.
        createdAt: { type: string, format: date-time }

    ProjectDefaultRoleResponse:
      type: object
      description: >-
        `GET /workspaces/{workspaceId}/projects/{projectId}/default-role` — what
        a project's default-access picker opens against. The two ids duplicate
        `ProjectResponse.defaultRole` on purpose: a dialog is worth a
        self-contained read.
      properties:
        projectRoleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            This project's own override, or `null` when it inherits the
            workspace default. An id, never a name.
        workspaceRoleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The workspace-level default, or `null` when the chain falls through
            to the built-in **Contributor**.
        mode:
          allOf:
            - $ref: '#/components/schemas/ProjectAccessMode'
          description: >-
            The **workspace's** access mode, read-only here and owned by
            `WorkspaceResponse`. It rides along so the dialog can say "this
            workspace is Restricted, so nothing is inherited right now — this
            default applies again if it is switched back to Open" without a
            second fetch. Nothing writes it through this endpoint.
        settable:
          allOf:
            - $ref: '#/components/schemas/SettableRolesView'
          description: >-
            Which roles this caller may make the default **here** — bounded by
            their real effective permissions in this project, with nobody
            exempt. Server-derived guidance, not enforcement: the `PATCH`
            re-checks.

    UpdateProjectDefaultRoleRequest:
      type: object
      description: >-
        **Exactly one** of the two fields, which is the same two-choice shape a
        picker renders. Neither and both are alike a `422`, never a precedence
        rule.
      properties:
        roleId:
          type: string
          format: uuid
          description: >-
            The `PROJECT`-scoped role to make this project's default. `422` when
            unknown, foreign or `WORKSPACE`-scoped; `403` when it breaks the
            project-scope grant ceiling.
        inherit:
          type: boolean
          default: false
          description: >-
            `true` stores `null` — *"follow the workspace default"*. A real
            choice rather than an absence: "deliberately follows the workspace"
            and "happens to name the same role the workspace does" diverge the
            moment the workspace default moves.

    ProjectMemberResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        roleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The member's role **identity**, with the same meaning and the same
            degrade rule as `WorkspaceMemberResponse.roleId`: the id of the row
            in `GET /workspaces/{workspaceId}/roles`, additive beside the
            `role` key, which stays and is not deprecated.


            It matters most here, because **a key is not an identity** and this
            is the scope where that bites: `MEMBER` names the built-in
            workspace **Member** *and* the built-in project **Contributor** —
            different roles, different ids, different permissions — so a client
            matching a project member's `role` against a catalog spanning both
            scopes can name the wrong privilege with no custom role involved.


            `null` **only together with `role`**, on the member list, when the
            stored role fails its scope/ownership assertion: publishing the id
            of a role whose name was just withheld would give the name back by
            proxy. The write responses (add / change role) always carry both.
        role:
          allOf:
            - $ref: '#/components/schemas/ProjectRole'
          nullable: true
          description: >-
            The member's role **key**. **`null` is possible** on the member
            *list*, for the same reason and with the same meaning as on
            `WorkspaceMemberResponse.role`: the stored role failed its
            scope/ownership assertion, the entry survives, and the refused role
            is not named. The write responses (add / change role) always carry
            a key.
        joinedAt: { type: string, format: date-time }

    AddProjectMemberRequest:
      type: object
      required: [userId]
      description: >-
        **Exactly one of `roleId` and `role` must be present** — neither and
        both are alike a `422`. See `InviteMemberRequest.roleId` for why both
        fields exist.
      properties:
        userId: { type: string, format: uuid }
        roleId:
          type: string
          format: uuid
          description: >-
            The assignable `PROJECT`-scoped role's id. Unknown, foreign or
            `WORKSPACE`-scoped is one indistinguishable `422`. Bounded by the
            grant ceiling, plus the escape described on the operation.


            **This path does not translate.** The legacy `role` key maps
            `VIEWER` onto the contributor role, so until now a genuinely
            read-only project member was inexpressible; naming the built-in
            Viewer by id stores the built-in Viewer.
        role:
          allOf:
            - $ref: '#/components/schemas/ProjectRole'
          deprecated: true
          description: >-
            **Deprecated — send `roleId` instead.** Unchanged behaviour: a
            built-in project role key, `422` when it is not one this instance
            can assign in the **project** scope, and `VIEWER` still stored as
            `MEMBER` (see the `ProjectRole` schema). It cannot name a custom
            role.

    UpdateProjectMemberRequest:
      type: object
      description: >-
        **`roleId` only, and required.** There is deliberately no legacy `role`
        key here because there is no legacy client: the endpoint is new, so
        nothing is mid-migration, and accepting a key would import the
        `VIEWER → MEMBER` translation into a surface that never had it.
      required: [roleId]
      properties:
        roleId:
          type: string
          format: uuid
          description: >-
            The assignable **PROJECT**-scoped role the member should end up
            with. Unknown, foreign or `WORKSPACE`-scoped is one
            indistinguishable `422`.

    ProjectRef:
      type: object
      description: >-
        The smallest useful reference to a project: enough to link to it and
        enough for a human to recognise it. Carried by the `projects` extension
        of the workspace member-removal `409`
        (`StrandedProjectsProblemDetail`), by `adoptedProjects` on that
        removal's `200` (`MemberRemovalResponse`), and by the `projects`
        extension of the project-access `403`
        (`ReactivatedDefaultProblemDetail`).
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: P17 }
        name: { type: string, example: Alpha }

    IssueTypeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Bug }
        color: { type: string, example: '#EF4444' }
        icon: { type: string, nullable: true, example: bug }
        position: { type: integer }
        hierarchyLevel: { type: integer, description: 'Nesting level: Epic=2, Story/Task/Bug=1, Sub-task=0. A parent must be exactly one level above its child (adjacent tiers only): Epic parents Story/Task/Bug (not a Sub-task directly), which parent Sub-task.' }

    StatusResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: In Progress }
        color: { type: string, example: '#3B82F6' }
        category: { $ref: '#/components/schemas/StatusCategory' }
        position: { type: integer }

    TransitionRule:
      type: object
      description: fromStatusId null = "from any status"
      properties:
        fromStatusId: { type: string, format: uuid, nullable: true }
        toStatusId: { type: string, format: uuid }

    ProjectConfig:
      type: object
      description: The effective taxonomy of a project (see GET …/config)
      properties:
        statuses:
          type: array
          description: Board-column order
          items: { $ref: '#/components/schemas/StatusResponse' }
        transitions:
          type: array
          description: Empty = all moves allowed
          items: { $ref: '#/components/schemas/TransitionRule' }
        priorities:
          type: array
          description: Display order; isDefault marks the default for new issues
          items:
            allOf:
              - $ref: '#/components/schemas/Priority'
              - type: object
                properties:
                  isDefault: { type: boolean }
        issueTypes:
          type: array
          items: { $ref: '#/components/schemas/IssueTypeResponse' }
        fields:
          type: array
          description: Custom fields of the project's field set, display order
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              key: { type: string, example: severity }
              name: { type: string, example: Severity }
              type: { $ref: '#/components/schemas/FieldType' }
              config: { $ref: '#/components/schemas/FieldConfig' }
              description: { type: string, nullable: true }
              required: { type: boolean, description: Must be filled on create; cannot be cleared }
              showOnCreate: { type: boolean, description: Rendered in the create form }

    UserRef:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }

    CreateIssueRequest:
      type: object
      required: [title, typeId, statusId]
      properties:
        title: { type: string, maxLength: 500 }
        description: { type: string, nullable: true }
        typeId: { type: string, format: uuid, description: Must be offered by the project's type set }
        statusId: { type: string, format: uuid, description: Must belong to the project's workflow }
        priorityId: { type: string, format: uuid, nullable: true, description: Omitted = the project's default priority }
        assigneeId: { type: string, format: uuid, nullable: true, description: Must be a workspace member }
        parentId: { type: string, format: uuid, nullable: true, description: 'Parent issue in the same project. Rejected with 422 if unknown/foreign-project, or if the parent type''s hierarchy level is not strictly greater than this issue''s type level.' }
        dueDate: { type: string, format: date, nullable: true }
        labelIds:
          type: array
          nullable: true
          maxItems: 100
          description: >-
            Workspace labels to attach. Absent/null = none; duplicates are
            de-duped. Every id is resolved inside the issue's own workspace — an
            unknown, foreign-workspace or archived label, or more than
            `app.classification.max-labels-per-issue` (default 20) distinct ids,
            is a `422`. Over 100 entries is rejected at binding (`400`).
          items: { type: string, format: uuid }
        componentId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The project component to file this issue under. Resolved inside the
            issue's own project — an unknown, foreign-project or archived
            component is a `422`. When the component has `autoAssign` and a lead
            and no `assigneeId` was given, the lead is assigned automatically
            (an explicit `assigneeId` always wins; a lead who has left the
            workspace is skipped silently and the issue stays unassigned).
        fixVersionIds:
          type: array
          nullable: true
          maxItems: 100
          description: >-
            Versions this change **ships in**. Absent/null = none; duplicates
            are de-duped. Every id is resolved inside the issue's own project —
            an unknown, foreign-project or archived version, or more than
            `app.classification.max-version-links-per-issue` (default 20)
            distinct ids, is a `422`. The cap is **per link type**, so
            `fixVersionIds` and `affectsVersionIds` have independent budgets.
            Linking an already-**released** version is allowed on purpose
            (back-porting and post-release bookkeeping are legitimate). Over 100
            entries is rejected at binding (`400`).
          items: { type: string, format: uuid }
        affectsVersionIds:
          type: array
          nullable: true
          maxItems: 100
          description: >-
            Versions this defect **exists in** — same rules and the same
            independent budget as `fixVersionIds`. The same version may
            legitimately be both fix and affects on one issue.
          items: { type: string, format: uuid }
        sprintId:
          type: string
          format: uuid
          nullable: true
          description: >-
            File the issue straight into a sprint of **this** project.
            Absent/null = the backlog, which is the normal case. Resolved inside
            the issue's own project — an unknown or foreign-project id is a
            `422` ("Unknown sprint", never a `404`), and so is a **completed**
            sprint (its membership is a delivered fact).
        storyPoints:
          type: number
          nullable: true
          minimum: 0
          maximum: 999
          example: 5
          description: >-
            Native story-point estimate. `0`…`999` with at most **2 decimals**
            (`0.5`, `1.5`, `13` are all valid) — anything else is a `422`.
            Absent/null means **unestimated**, which is deliberately not the
            same statement as `0`.
        clearSprint:
          type: boolean
          default: false
          description: >-
            **Accepted and ignored on create.** A brand-new issue has nothing to
            clear — omitting `sprintId` already means "the backlog". It exists
            only so a client that shares one payload builder between create and
            update is not rejected; the meaningful flag is on
            `UpdateIssueRequest`.
        clearStoryPoints:
          type: boolean
          default: false
          description: >-
            **Accepted and ignored on create**, for the same reason as
            `clearSprint` — omitting `storyPoints` already means "unestimated".
        fields:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Custom field values keyed by field id (value shapes per
            FieldType). Required fields of the project's set must be
            present; fields outside the set or archived are rejected (422).
          example: { 'e1b2…': 5, 'f3c4…': critical }

    UpdateIssueRequest:
      type: object
      description: Partial update — omitted fields are left unchanged
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string }
        typeId: { type: string, format: uuid, description: Must be offered by the project's type set }
        statusId: { type: string, format: uuid, description: Validated against workflow transition rules }
        priorityId: { type: string, format: uuid, description: Must be offered by the project's priority set }
        assigneeId: { type: string, format: uuid }
        dueDate: { type: string, format: date }
        clearAssignee: { type: boolean, default: false, description: 'Unset the assignee (a null assigneeId cannot be distinguished from "not sent"); ignored when assigneeId is also given' }
        clearDueDate: { type: boolean, default: false, description: Unset the due date; ignored when dueDate is also given }
        parentId: { type: string, format: uuid, nullable: true, description: 'Set/change the parent issue. Rejected with 422 for an unknown/foreign-project parent, self-parenting, a cycle, a hierarchy-level violation, or a type change that conflicts with an existing parent or child edge.' }
        clearParent: { type: boolean, default: false, description: 'Detach the parent (mirrors clearAssignee/clearDueDate); ignored when parentId is also given' }
        labelIds:
          type: array
          maxItems: 100
          description: >-
            **Full-replacement** label set — present: the issue ends up carrying
            exactly these labels; `[]`: all labels removed; absent/null:
            unchanged (no clear-flag needed, `[]` is unambiguous). Same `422`
            rules as create (unknown/foreign/archived id, or more than
            `app.classification.max-labels-per-issue` distinct ids); an
            already-attached archived label may stay, it just cannot be added.
            A change writes one `labels` history entry and bumps `version`.
          items: { type: string, format: uuid }
        componentId:
          type: string
          format: uuid
          description: >-
            Set/change the project component. Resolved inside the issue's own
            project — an unknown or foreign-project id is a `422`, and so is
            attaching an **archived** component (one already attached may stay).
            A change writes one `component` history entry; auto-assign does NOT
            fire on update.
        clearComponent: { type: boolean, default: false, description: 'Unset the component (mirrors clearAssignee/clearDueDate); ignored when componentId is also given' }
        fixVersionIds:
          type: array
          maxItems: 100
          description: >-
            **Full-replacement** fix-version set, exactly like `labelIds` —
            present: the issue ends up linked to exactly these versions in the
            fix role; `[]`: all fix links removed; absent/null: unchanged (no
            clear-flag needed). The two roles are independent, so sending only
            this one never touches the affects set. Same `422` rules as create
            (unknown/foreign/archived id, or more than
            `app.classification.max-version-links-per-issue` distinct ids **per
            link type**); an already-linked archived version may stay, it just
            cannot be added. A change writes one `fixVersions` history entry and
            bumps `version`.
          items: { type: string, format: uuid }
        affectsVersionIds:
          type: array
          maxItems: 100
          description: >-
            **Full-replacement** affects-version set — same rules, independent
            budget, and a change writes one `affectsVersions` history entry.
          items: { type: string, format: uuid }
        sprintId:
          type: string
          format: uuid
          description: >-
            Move the issue into a sprint of **this** project. A nullable scalar,
            so it follows the `assigneeId`/`clearAssignee` convention rather
            than the full-replacement one: a non-null id sets it, absent leaves
            it unchanged. An unknown, foreign-project or **completed** sprint is
            a `422`, and so is moving the issue out of a sprint that is already
            `COMPLETED`. Mutually exclusive with `clearSprint` (`400` when both
            are sent). A change writes one `sprint` history entry and bumps
            `version`; the issue's **rank is not touched** (use
            `POST …/issues/{number}/rank` to place it).
        clearSprint:
          type: boolean
          default: false
          description: >-
            Return the issue to the backlog. **Mutually exclusive with
            `sprintId`** — sending both is a `400` (it used to let `sprintId`
            win silently). Clearing a `COMPLETED` sprint is a `422`.
        storyPoints:
          type: number
          minimum: 0
          maximum: 999
          example: 5
          description: >-
            Set the estimate — `0`…`999` with at most **2 decimals**, `422`
            otherwise. A real change writes one `storyPoints` history entry; a
            no-op writes none.
        clearStoryPoints: { type: boolean, default: false, description: 'Mark the issue unestimated again; ignored when storyPoints is also given' }
        fields:
          type: object
          additionalProperties: true
          description: >-
            Partial like the rest of the body — only listed field ids
            change; JSON null clears a value (required fields cannot be
            cleared).
        version:
          type: integer
          description: Optimistic lock — the `version` you last read; `409` when stale. Omit to skip the check.

    BoardIssuesResponse:
      type: object
      description: |
        Capped board issue list — the no-`size` variant of `GET .../issues`
        (HD-79). `issues` is bounded to `cap`; when the project (after the same
        filters) exceeds it, `truncated` is true and `totalAvailable` reports the
        full count so the UI can show "Showing first {cap} of {totalAvailable}".
      properties:
        issues:
          type: array
          items: { $ref: '#/components/schemas/IssueResponse' }
        truncated: { type: boolean, description: True when the project exceeds `cap` after filters }
        totalAvailable: { type: integer, format: int64, description: Full filtered count (equals issues length when not truncated) }
        cap: { type: integer, description: 'Server-side maximum (app.board.max-issues, default 500)' }

    IssueResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64, example: 18 }
        key: { type: string, example: DEMO-18 }
        title: { type: string }
        description: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/IssueTypeResponse' }
        status: { $ref: '#/components/schemas/StatusResponse' }
        priority: { $ref: '#/components/schemas/Priority' }
        assignee: { $ref: '#/components/schemas/UserRef' }
        reporter: { $ref: '#/components/schemas/UserRef' }
        parentId: { type: string, format: uuid, nullable: true }
        parentKey: { type: string, nullable: true, example: DEMO-12, description: Key of the parent issue; null if none }
        parentTitle: { type: string, nullable: true, description: Title of the parent issue; null if none }
        parentTypeId: { type: string, format: uuid, nullable: true, description: Type id of the parent issue (for its type icon); null if none }
        childCount: { type: integer, description: Number of direct children }
        doneChildCount: { type: integer, description: Direct children in a DONE-category status }
        dueDate: { type: string, format: date, nullable: true }
        labels:
          type: array
          description: >-
            The issue's workspace labels, ordered by name (case-insensitive);
            `[]` when none. An archived label already attached is still listed
            (with `archived: true`) so it can be rendered dimmed.
          items: { $ref: '#/components/schemas/LabelRef' }
        component:
          allOf:
            - $ref: '#/components/schemas/ComponentRef'
          description: >-
            The issue's project component, or `null`. An archived component
            already attached is still reported (with `archived: true`) so it can
            be rendered dimmed.
        fixVersions:
          type: array
          description: >-
            The versions this issue **ships in**, ordered by name
            (case-insensitive); `[]` when none. An archived version already
            linked is still listed (with `archived: true`) so it can be rendered
            dimmed.
          items: { $ref: '#/components/schemas/VersionRef' }
        affectsVersions:
          type: array
          description: >-
            The versions this issue is **broken in**, same shape and ordering;
            `[]` when none. A version may appear in both lists.
          items: { $ref: '#/components/schemas/VersionRef' }
        sprint:
          allOf:
            - $ref: '#/components/schemas/SprintRef'
          description: >-
            The sprint this issue is committed to, or `null` = the backlog. Note
            that the issue's **rank** (`position`) is deliberately **not**
            exposed: it is server-written only and a client never needs its
            value — drag placement travels as neighbour ids instead.
        storyPoints:
          type: number
          nullable: true
          example: 5
          description: >-
            Native story-point estimate; `null` = **unestimated**, which is
            deliberately not `0`. Serialized as a plain JSON number with
            trailing zeros stripped (`5`, not `5.00`).
        fields:
          type: array
          description: Filled custom fields only
          items: { $ref: '#/components/schemas/FieldValueEntry' }
        version: { type: integer, description: Send back in PATCH for optimistic locking }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-14T09:31:07Z'
          description: >-
            When the issue was closed — **server-maintained, never accepted on a
            request**. Stamped when the issue enters a status whose `category`
            is `DONE` (including creating it directly in one), and cleared back
            to `null` when it leaves a DONE-category status. Only a change of
            status **category** re-evaluates it: moving between two different
            DONE statuses keeps the original stamp, and an update that does not
            change the status leaves it untouched. `null` while the issue is
            open. The stamp itself writes no `history` entry — the `status`
            entry records the transition.

    IssueHistoryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        field: { type: string, example: status, description: 'Built-in attribute name, or the display name of a custom field' }
        oldValue: { type: string, nullable: true, example: To Do }
        newValue: { type: string, nullable: true, example: In Progress }
        changedById: { type: string, format: uuid }
        changedByName: { type: string }
        createdAt: { type: string, format: date-time }

    SearchRequest:
      type: object
      description: Body of `POST /workspaces/{workspaceId}/search`
      properties:
        query:
          type: string
          maxLength: 2000
          description: >-
            The HQL query. May be empty/omitted (null treated as empty) → all
            visible issues, default sort. Over 2000 chars is rejected at binding
            (`400`).
          example: status = "In Progress" AND assignee = currentUser() ORDER BY priority DESC
        page: { type: integer, minimum: 0, default: 0, description: 'Zero-based page index (null/negative → 0)' }
        size: { type: integer, minimum: 1, maximum: 100, default: 50, description: 'Page size (null → 50, clamped 1..100)' }

    SearchResultRow:
      type: object
      description: One search hit — the full issue plus its owning project's identity (results are cross-project).
      properties:
        issue: { $ref: '#/components/schemas/IssueResponse' }
        projectId: { type: string, format: uuid }
        projectKey: { type: string, example: DEMO }
        projectName: { type: string, example: Demo Project }

    SearchSchemaResponse:
      type: object
      description: Autocomplete metadata for the search UI (`GET /search/schema`).
      properties:
        fields:
          type: array
          description: >-
            One entry per live queryable field — system fields first, then the
            caller's visible custom fields (M2; `name` = the field `key`).
            The system half is **capability-aware**: `sprint`,
            `fixVersion`/`affectsVersion` and `storyPoints` appear only when at
            least one visible project has `board: SCRUM`, `releases` resp.
            `estimation` on. That narrows *suggestions* only — an omitted field
            still parses, compiles and runs, so this list is a subset of what
            search actually resolves and must not be used as a validator.
          items: { $ref: '#/components/schemas/SearchField' }
        keywords:
          type: array
          description: HQL keywords, for keyword autocomplete
          items: { type: string }
          example: [AND, OR, NOT, IN, IS, EMPTY, ORDER BY, ASC, DESC]
        values:
          type: object
          description: >-
            Value picklists keyed by value-source token (`STATUS`, `TYPE`,
            `PRIORITY`) — the distinct names reachable by the caller's visible
            projects — plus `LABEL` (the workspace's non-archived label names,
            capped at 200 entries; fall back to `/search/suggest?field=label`
            beyond that), `COMPONENT` (the non-archived component names of those
            visible projects, capped at 200 the same way), `VERSION` (the
            non-archived version names of those visible projects **that have
            `releases` on**, capped at 200 — one picklist serves both
            `fixVersion` and `affectsVersion`), `SPRINT` (the open sprint names
            of those visible projects **that have `board: SCRUM`**, capped at
            200, with no `/search/suggest` fallback), `PROJECT` (those visible
            projects themselves, capped at 200, overflowing to
            `/search/suggest?field=project`; `label` is `"<name> (<KEY>)"` and
            `value` is the `<KEY>`, the only string the `project` field
            resolves) and a
            `CUSTOM:<key>` entry per SELECT/MULTI_SELECT custom field, whose
            options are `{label, value=optionId}` pairs. The capability scoping
            of `VERSION`/`SPRINT` narrows suggestions only: a name missing here
            still resolves in a query.
            `USER` (system or custom) is intentionally absent (use
            `/search/suggest`).
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/SearchValueOption' }
        insights:
          allOf:
            - $ref: '#/components/schemas/SearchSchemaInsights'
          description: >-
            The vocabulary of the Insights panel
            (`POST …/search/insights`) — capability-narrowed on exactly the
            same terms as `fields`, and suggestion-only in exactly the same
            way: a dimension omitted here still resolves if it is requested.

    InsightsMeasure:
      type: string
      enum: [COUNT, POINTS, NONE]
      default: COUNT
      description: >-
        What the Insights panel plots on the y axis. **Not `ReportMeasure`** — that
        one is bound off a query string by `/sprint-burnup` and `/velocity`, where
        a third `NONE` constant would bind happily and then mean nothing.


        **It ranks; it does not filter.** Every bucket carries `count`, `points`
        *and* `unestimatedCount` whatever you send — they fall out of one
        `GROUP BY` and cost nothing measurable, so a client toggle needs no round
        trip. What this decides is the `ORDER BY`, and therefore which buckets
        survive `sliceCap` / `cellCap`: **`COUNT` and `POINTS` can return
        different buckets from the same query**, which is correct, because "the
        top ten by issues" and "the top ten by points" are different questions.


        `POINTS` sums `issues.story_points` with unestimated issues contributing
        `0` and counted in `unestimatedCount` beside it, and is accepted whatever
        the visible projects declare — `estimation: false` hides the toggle in the
        UI and never changes a status code.


        `NONE` means "no y axis — draw a breakdown table, not a chart". It ranks
        by count server-side (a bucket has to be ordered by something to be capped
        at all) and is echoed back, so the distinction is real but entirely the
        client's. The counts still ship: withholding them would return strictly
        less data for exactly the same work and leave the table blank.

    InsightsDimension:
      type: string
      enum: [STATUS, TYPE, PRIORITY, ASSIGNEE, COMPONENT, LABEL, SPRINT, PROJECT]
      description: >-
        What the panel groups by. One list serves **both** roles — the x axis
        (`slice`) and the colour (`segment`) — because "group by A, coloured by B"
        is symmetric; the only rule is that the two must differ (`422` otherwise).


        `ASSIGNEE`, `COMPONENT`, `LABEL` and `SPRINT` are nullable and produce a
        **no-value bucket** (unassigned, no component, no labels, not in a
        sprint), whose `id` and `label` are both `null`. **`LABEL` is the one
        many-valued dimension**: an issue with three labels appears in three
        buckets, so those buckets sum to more than `meta.basedOnIssues` — see
        `sliceMultiValued` / `segmentMultiValued`.


        **`PROJECT` groups but never clicks through.** Issues carry a project and
        the search scope already restricts which are visible, so the bucket is
        perfectly good. HQL now *has* a `project` field, but it resolves a
        project **key** while this axis is grouped and labelled by **name** —
        which resolves to nothing, names carrying no uniqueness — so every
        project bucket still ships `hql: null` and the bar is not clickable.
        Carrying the key down to the fragment is its own small slice; nothing
        about the grouping itself is blocked meanwhile.


        **`ASSIGNEE` is offered here and refused by `/velocity`, and that is not
        an inconsistency.** Velocity is a *published metric* — stable URL, quoted
        in a ceremony — where a per-person column becomes a comparison whether
        anyone meant it or not. This is an *ad-hoc query somebody typed*: its
        dataset is whatever HQL is in the box, it is not addressable as "the
        team's number", and the same person could get the same breakdown by
        running eight searches by hand. The line is **published metric vs. ad-hoc
        query**.

    InsightsRequest:
      type: object
      description: >-
        The panel's whole input. Every field is optional, so `{}` is a valid body
        meaning *"count everything I can see, grouped by status"*.
      properties:
        query:
          type: string
          maxLength: 2000
          nullable: true
          example: 'status IN ("In Progress", "In Review") AND due < now()'
          description: >-
            The dataset, as HQL — **the same string `POST …/search` takes**,
            parsed, validated, resolved and compiled by the same machinery, which
            is what guarantees the panel and the result list under it cannot
            disagree. `null` or empty means every issue the caller can see,
            exactly as on search. Longer than 2 000 characters is a `400` at
            binding; anything unparseable or semantically wrong is a `422`
            carrying the same `PARSE_ERROR` / `SEMANTIC_ERROR` detail search
            returns.
        measure:
          allOf:
            - $ref: '#/components/schemas/InsightsMeasure'
          nullable: true
          maxLength: 32
          description: >-
            Case-insensitive; `null` or blank means `COUNT`. An unknown token is a
            `422` naming the parameter and listing what it accepts — **not** the
            `400` the `/reports` GETs raise for the same mistake.
        slice:
          allOf:
            - $ref: '#/components/schemas/InsightsDimension'
          nullable: true
          maxLength: 32
          description: >-
            The x axis. Case-insensitive; `null` or blank means `STATUS`. Unknown
            token → `422`.
        segment:
          allOf:
            - $ref: '#/components/schemas/InsightsDimension'
          nullable: true
          maxLength: 32
          description: >-
            The optional colour dimension. `null` or blank means unsegmented, in
            which case `cells` and `segments` come back empty and the bars alone
            are the answer. Unknown token → `422`; **equal to `slice`** → `422`
            too, because a diagonal is not a breakdown.

    InsightsBucket:
      type: object
      description: >-
        One value of a dimension — a bar on the x axis, or an entry in the legend.


        **Buckets are keyed by id, not by name, and that is visible.** Each
        visible project owns its own statuses, types, priorities, components and
        sprints, so two projects can both have an "In Progress": two catalog rows,
        **two buckets, one label**, and the panel shows both. Grouping by name was
        rejected because it fails more quietly — a name that no longer resolves
        (a completed sprint, an archived component) would produce a bar whose own
        filter fragment `422`s the moment somebody clicked it.
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The catalog / user / project id, or **`null` for the "has no value"
            bucket** (unassigned, no component, not in a sprint, no labels).
            `cells` reference buckets by this id, so `null` is a **real key** and
            must be matched as one, not treated as missing.
        label:
          type: string
          nullable: true
          example: In Progress
          description: >-
            The display name, or **`null` for the no-value bucket** — the client
            supplies "Unassigned" / "No component" / "Backlog", because that
            wording is UI copy and belongs where the rest of the UI copy lives.
            The server deliberately does not send it.
        hql:
          type: string
          nullable: true
          example: 'status = "In Progress"'
          description: >-
            An HQL fragment selecting **exactly the issues in this bucket**, for
            the click-to-narrow affordance — the panel is a navigation device as
            much as a chart. `null` when no such fragment exists, in which case
            **the bar is not clickable**.


            **Do not rebuild this client-side.** It looks trivial and it is not:
            the rule behind every `null` is *the fragment reproduces this bucket
            exactly, or there is no fragment*, and a locally-built clause fails
            that quietly by producing valid-looking HQL over the wrong set. It is
            `null` in four cases:

            * the dimension has no HQL vocabulary at all (`PROJECT`);
            * the bucket's name does not resolve — a **completed sprint**, an
              **archived** component or label. HQL drops those from name
              resolution on purpose, so a fragment naming one would `422` on
              click;
            * the name resolves to **more than one id** — the cross-project "In
              Progress" above. The fragment would be strictly **wider than the
              bar**, and a filter returning more issues than the bar you clicked
              is exactly the "these numbers don't match" failure;
            * `ASSIGNEE` only: the member has no email to address them by (the
              fragment uses email, which is unique in a workspace; a display name
              is not, and would silently widen to every match).


            A `null` here is therefore information — "this bar is not safely
            clickable" — rather than a gap to fill in.

    InsightsSlice:
      type: object
      description: >-
        One bar: a bucket of the slice dimension plus its **exact** totals.


        Exact **even when the breakdown is truncated**, which is the whole reason
        this record exists rather than letting a client sum the cells. These
        totals come from their own `GROUP BY` over the slice alone, so a bar is
        right whatever happened to `cells`; a bar whose height was the sum of its
        surviving cells would silently shrink when `cellCap` bit — a wrong number
        with no symptom.


        All three numbers are populated regardless of the requested `measure`.
      properties:
        bucket: { $ref: '#/components/schemas/InsightsBucket' }
        count: { type: integer, format: int64, example: 42, description: Distinct issues in this bucket. }
        points:
          type: number
          example: 118
          description: >-
            Sum of `issues.story_points`; unestimated issues contribute `0`.
            **Never null** — an all-unestimated bucket is `0`, which is a fact,
            with `unestimatedCount` beside it saying how much of that zero is
            missing data rather than free work.
        unestimatedCount:
          type: integer
          format: int64
          example: 7
          description: How many of `count` carry no estimate. Read it with `points`, never without.

    InsightsCell:
      type: object
      description: >-
        One (slice, segment) intersection — a stack in a stacked bar, or a cell of
        the table. Present only on a segmented request; an unsegmented response
        ships an empty list.


        Cells reference their buckets **by id** rather than repeating them: a
        segmented response is a product of two axes, and inlining both buckets
        into every cell is where a 1 000-cell response stops being small. `null`
        is a real id (the no-value bucket), so match it as one.


        **The cells of one bar can sum to more than that bar** — only when the
        segment dimension is many-valued (`segmentMultiValued`, today `LABEL`
        alone): an issue with three labels contributes to three cells of the same
        bar while counting once in the bar. And when `cellsTruncated` is set they
        can sum to **less**. Both directions are disclosed on the response, and
        neither is a defect in the bar, whose total is computed independently.
      properties:
        sliceId:
          type: string
          format: uuid
          nullable: true
          description: Id of the slice bucket, or `null` for its no-value bucket.
        segmentId:
          type: string
          format: uuid
          nullable: true
          description: Id of the segment bucket, or `null` for its no-value bucket.
        count: { type: integer, format: int64, example: 12 }
        points: { type: number, example: 34 }
        unestimatedCount: { type: integer, format: int64, example: 2 }

    InsightsResponse:
      type: object
      description: >-
        `POST …/search/insights`. Shaped as a small pivot rather than one flat
        array for a single reason: **a bar's height and its breakdown are capped
        separately, so they are computed separately.** `slices` are exact;
        `cells` may be partial. Deriving the bars by summing the cells would make
        every truncated response quietly understate its own chart.
      properties:
        measure:
          allOf:
            - $ref: '#/components/schemas/InsightsMeasure'
          description: >-
            Echo of the requested measure. **It ranked the buckets; it did not
            filter them** — every bucket carries both numbers.
        slice: { $ref: '#/components/schemas/InsightsDimension' }
        segment:
          allOf:
            - $ref: '#/components/schemas/InsightsDimension'
          nullable: true
          description: Echo of the colour dimension, or `null` when unsegmented.
        slices:
          type: array
          description: >-
            The bars, ordered by `measure` descending then label ascending, at
            most `sliceCap`. **Totals are exact.**
          items: { $ref: '#/components/schemas/InsightsSlice' }
        segments:
          type: array
          description: >-
            The legend: every segment value appearing in `cells`, ordered the same
            way. Empty when unsegmented.
          items: { $ref: '#/components/schemas/InsightsBucket' }
        cells:
          type: array
          description: >-
            The (slice, segment) intersections, at most `cellCap`. Empty when
            unsegmented — the bars already are the answer. A cell is only ever
            emitted for a bar that survived `sliceCap`: a stack belonging to no
            bar is unrenderable, not merely useless, and dropping one also sets
            `cellsTruncated`.
          items: { $ref: '#/components/schemas/InsightsCell' }
        sliceMultiValued:
          type: boolean
          description: >-
            Whether one issue can occupy several bars (`LABEL` only). When `true`
            **the bars sum to more than `meta.basedOnIssues`** — arithmetic rather
            than a defect, but it is published so the panel can label its total
            honestly instead of letting the reader discover the mismatch.
        segmentMultiValued:
          type: boolean
          description: The same for the colour dimension — when `true`, a bar's stacks can sum to more than the bar.
        slicesTruncated:
          type: boolean
          description: >-
            Whether there were more slice buckets than `sliceCap`. The ones you
            got are the **largest by `measure`**. This means *bars are missing
            from the x axis* — a different picture from `cellsTruncated`, and a
            client should be able to say which happened.
        cellsTruncated:
          type: boolean
          description: >-
            Whether the breakdown is partial — either there were more cells than
            `cellCap`, or a cell belonged to a bar that did not survive
            `sliceCap`. **The bars are still exact**; only the stacking is
            incomplete.
        sliceCap:
          type: integer
          example: 200
          description: >-
            The bar cap that would bite — a fixed constant, not an operator
            setting. Always reported, so a client never has to guess what a
            truncation was measured against (the `ReportMeta.cap` convention,
            applied to the axis this report can actually truncate).
        cellCap: { type: integer, example: 1000, description: 'The cell cap that would bite; likewise a fixed constant.' }
        meta:
          allOf:
            - $ref: '#/components/schemas/ReportMeta'
          description: >-
            Provenance, with three of its fields carrying report-specific values
            that are **facts here, not stubs**:


            `basedOnIssues` is the distinct issues matching the query — the same
            number the search result list reports — counted independently of every
            cap above and **deliberately not the sum of the series** (see
            `sliceMultiValued`).


            `truncated` is always `false` and `cap` is `app.reports.max-rows`,
            because this report materialises **no issue rows at all**: PostgreSQL
            aggregates and returns buckets, so the row cap cannot bite. What can
            truncate is buckets, and that is what `slicesTruncated` /
            `cellsTruncated` are for.


            `firstIssueAt` is **`null`** — it is a per-*project* property and this
            report spans a workspace, so inventing a fourth meaning for it was
            refused. `unmatchedFilters` is always empty: it belongs to id-shaped
            filter parameters, and an HQL name that matches nothing is a `422`
            from the resolver long before it could be reported as unmatched.

    SearchSchemaInsights:
      type: object
      description: >-
        What the Insights panel on this page may be **offered** — the measures and
        grouping dimensions worth putting in front of this caller.


        **Suggestions, not a contract** — the same sentence that governs `fields`,
        meaning the same thing. `SPRINT` is dropped when no visible project plans
        in sprints and `POINTS` when none estimates, mirroring how the `sprint`
        and `storyPoints` *fields* are dropped. **What is omitted still
        resolves**: `POST …/search/insights` answers `200` for a dimension that is
        not in this list, because a capability is a presentation preference and
        may never change a status code — so a saved panel state cannot break
        because a curator flipped a project toggle.


        Published here rather than hardcoded in the client precisely because it is
        capability-narrowed, and built by filtering the enums, so a dimension
        added later is offered without a second edit.
      properties:
        measures:
          type: array
          items: { $ref: '#/components/schemas/InsightsMeasure' }
          example: [COUNT, POINTS, NONE]
          description: '`POINTS` is present only when at least one visible project has `estimation` on.'
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/InsightsDimension' }
          example: [STATUS, TYPE, PRIORITY, ASSIGNEE, COMPONENT, LABEL, PROJECT]
          description: >-
            One list serves both `slice` and `segment` — grouping is symmetric —
            with the single rule that the two must differ. `SPRINT` is present
            only when at least one visible project has `board: SCRUM`.
    SearchField:
      type: object
      description: A queryable HQL field's public schema
      properties:
        name: { type: string, description: 'HQL field name — a system field name or a custom field `key`', example: assignee }
        type:
          type: string
          description: >-
            The field's data-type family. System fields use the internal family
            (`ENUM_REF`/`USER_REF`/`LABEL_REF`/`VERSION_REF`/…); custom fields
            (M2) report their `FieldType` (`TEXT`/`TEXTAREA`/`NUMBER`/`DATE`/
            `SELECT`/`MULTI_SELECT`/`USER`/`CHECKBOX`/`URL`).
          enum: [ENUM_REF, USER_REF, ISSUE_REF, LABEL_REF, VERSION_REF, TEXT, TEXTAREA, DATE, TIMESTAMP, NUMBER, SELECT, MULTI_SELECT, USER, CHECKBOX, URL]
          example: USER_REF
        operators:
          type: array
          description: The operator tokens legal on this field (comparison ops, then `IN`, then `IS EMPTY` / `IS NOT EMPTY`)
          items: { type: string }
          example: ['=', '!=', IN, IS EMPTY, IS NOT EMPTY]
        nullable: { type: boolean, description: 'Whether `IS [NOT] EMPTY` is allowed' }
        sortable: { type: boolean, description: 'Whether the field may appear in ORDER BY' }
        valueSuggest:
          type: string
          nullable: true
          description: >-
            The value-source token
            (`STATUS`/`TYPE`/`PRIORITY`/`USER`/`LABEL`/`COMPONENT`/`VERSION`/
            `SPRINT`/`PROJECT`/…), `CUSTOM:<key>` for a SELECT/MULTI_SELECT
            custom field,
            or null when there is no picklist (e.g. `storyPoints`).
          example: USER
        functions:
          type: array
          description: Zero-arg functions offered for this field
          items: { type: string }
          example: ['currentUser()']

    SearchValueOption:
      type: object
      description: A picklist entry — a display label and an optional resolvable value
      properties:
        label: { type: string, example: In Progress }
        value: { type: string, nullable: true, description: 'Resolvable value when applicable (e.g. the email for USER, the project key for PROJECT); null for name-resolved picklists' }

    SuggestResponse:
      type: object
      description: >-
        Typeahead result (`GET /search/suggest`) — for a user-valued field
        (`assignee`/`reporter` or a USER-typed custom field, M2), for
        `label`/`labels`, `component`/`components`,
        `fixVersion`/`affectsVersion`, or `project`.
      properties:
        field: { type: string, description: 'The queried field, echoed back', example: assignee }
        suggestions:
          type: array
          description: >-
            Matching workspace members — or non-archived label names for
            `label`, component names for `component`, version names (from the
            visible projects with `releases` on) for
            `fixVersion`/`affectsVersion`, or the caller's visible non-archived
            projects for `project` — capped at 20, most relevant first
          items:
            type: object
            properties:
              label: { type: string, description: 'Display name shown in the dropdown', example: Ada Lovelace }
              value: { type: string, description: 'The resolvable value the client inserts — never necessarily the same string as the label: the member email, the label/component/version name, or the project KEY for `project` (whose label carries the human name)', example: ada@example.com }

    SavedFilterResponse:
      type: object
      description: A saved HQL filter. `mine` is caller-relative — `true` when the authenticated actor owns it.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: My open bugs }
        hql: { type: string, description: 'The stored HQL (may be empty = all issues)', example: type = Bug AND assignee = currentUser() }
        shared: { type: boolean, description: 'Whether other workspace members can see it (read-only)' }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string, example: Ada Lovelace }
        mine: { type: boolean, description: 'True when the caller is the owner (drives edit/delete affordances)' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateSavedFilterRequest:
      type: object
      required: [name]
      description: Body of `POST /workspaces/{workspaceId}/filters`. The owner is always the caller — never taken from the body.
      properties:
        name:
          type: string
          maxLength: 120
          description: Required, non-blank; unique per `(workspace, owner)` — `409` on a dup.
          example: My open bugs
        hql:
          type: string
          maxLength: 2000
          description: >-
            The HQL to store (may be empty = all issues). Validated at save time
            (parse + structural) — a bad query → `422`. Over 2000 chars → `400`.
          example: type = Bug AND assignee = currentUser()
        shared:
          type: boolean
          default: false
          description: Whether the filter is visible read-only to other workspace members.

    UpdateSavedFilterRequest:
      type: object
      description: >-
        Body of `PATCH /workspaces/{workspaceId}/filters/{filterId}` — a partial
        update; every field is optional and `null`/omitted is a no-op. Owner only.
      properties:
        name: { type: string, maxLength: 120, description: 'New name if present; re-checked for `(workspace, owner)` uniqueness (`409` on dup, `400` if blank).' }
        hql: { type: string, maxLength: 2000, description: 'New HQL if present; re-validated at save time (`422` on a bad query).' }
        shared: { type: boolean, description: 'New sharing flag if present.' }

    SavedFilterUsageResponse:
      type: object
      description: >-
        Delete-warning payload (`GET …/filters/{filterId}/usage`). Forward-looking:
        no board/report consumes a filter in the current release, so `usages` is
        always `[]`.
      properties:
        usages:
          type: array
          description: The places referencing this filter (empty in the current release)
          items: { $ref: '#/components/schemas/SavedFilterUsage' }

    SavedFilterUsage:
      type: object
      description: One consumer of a saved filter (a board or report, when those land)
      properties:
        type: { type: string, description: 'Consumer kind — `BOARD` or `REPORT` (open string)', example: BOARD }
        id: { type: string, format: uuid }
        name: { type: string, description: 'The consumer''s display name for the confirm dialog' }

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, description: '`@DisplayName` mentions notify workspace members' }

    CommentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AttachmentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string, example: screenshot.png }
        sizeBytes: { type: integer, format: int64 }
        contentType: { type: string, example: image/png }
        uploadedById: { type: string, format: uuid }
        uploadedByName: { type: string }
        createdAt: { type: string, format: date-time }

    LabelResponse:
      type: object
      description: A workspace label — a free-form colored tag reusable across every project of the workspace.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60, example: needs-design, description: 'Display name (casing preserved); unique per workspace case-insensitively' }
        color: { type: string, example: '#0EA5A4', description: '`#RRGGBB` or `#RRGGBBAA`; auto-derived from the name when none was given' }
        description: { type: string, nullable: true, maxLength: 200 }
        archived: { type: boolean, description: 'Archived labels stay attached to their issues but can no longer be added' }
        createdById: { type: string, format: uuid, nullable: true }
        createdByName: { type: string, nullable: true, example: Ada Lovelace }
        issueCount:
          type: integer
          nullable: true
          description: >-
            Issues currently carrying this label — only filled by
            `GET …/labels?withUsage=true`; `null` otherwise.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LabelRef:
      type: object
      description: A label's display summary as embedded in an issue — deliberately minimal.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: needs-design }
        color: { type: string, example: '#0EA5A4' }
        archived: { type: boolean, description: 'True when the label is archived (render it dimmed)' }

    CreateLabelRequest:
      type: object
      required: [name]
      description: Body of `POST /workspaces/{workspaceId}/labels`. Any workspace member may create a label.
      properties:
        name:
          type: string
          maxLength: 200
          description: >-
            Required, non-blank. Normalized server-side (NFC, invisible
            control/format characters stripped, whitespace collapsed; spaces are
            allowed) and then limited to 60 characters — a longer or blank
            result is a `400`. Unique per workspace, case-insensitively,
            archived labels included (`409` + `existingId`).
          example: needs-design
        color:
          type: string
          nullable: true
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          description: '`#RRGGBB` or `#RRGGBBAA`. Omitted → a deterministic swatch derived from the name.'
          example: '#0EA5A4'
        description: { type: string, nullable: true, maxLength: 200, description: 'Optional note; blank is stored as null.' }

    UpdateLabelRequest:
      type: object
      description: >-
        Body of `PATCH /workspaces/{workspaceId}/labels/{labelId}` — partial;
        `null`/omitted means "leave unchanged". Requires `label.manage` — the
        label's creator.
      properties:
        name: { type: string, maxLength: 200, description: 'New name if present — same normalization, 60-char limit and case-insensitive uniqueness as create (`409` + `existingId`; a pure casing change is allowed).' }
        color: { type: string, pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$', description: 'New color if present (`#RRGGBB`/`#RRGGBBAA`).' }
        description: { type: string, maxLength: 200, description: 'New description if present; a blank string clears it.' }

    MergeLabelsRequest:
      type: object
      required: [sourceIds]
      description: Body of `POST /workspaces/{workspaceId}/labels/{labelId}/merge` — the labels to absorb into the path label.
      properties:
        sourceIds:
          type: array
          minItems: 1
          maxItems: 50
          description: >-
            The labels to merge into the target and then delete. Must be
            non-empty (`400`), at most 50 (`400`), all inside this workspace and
            none equal to the target (`422`).
          items: { type: string, format: uuid }

    MergeLabelsResponse:
      type: object
      description: Outcome of a merge. No per-issue history is written — this response plus the target's bumped `updatedAt` are the record.
      properties:
        targetId: { type: string, format: uuid, description: The surviving label }
        mergedLabelCount: { type: integer, description: How many source labels were absorbed and deleted }
        reassignedIssueCount: { type: integer, description: 'How many issue attachments now point at the target (collapsed duplicates are not counted twice)' }

    LabelUsageResponse:
      type: object
      description: How many issues currently carry a label.
      properties:
        issueCount: { type: integer, example: 12 }

    ComponentResponse:
      type: object
      description: >-
        A project component — a curated module of one project, with an optional
        lead and an optional create-time auto-assign.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80, example: Billing, description: 'Display name (casing preserved); unique per project case-insensitively' }
        description: { type: string, nullable: true, maxLength: 500 }
        leadId: { type: string, format: uuid, nullable: true, description: 'The component lead, or null' }
        leadName: { type: string, nullable: true, example: Ada Lovelace }
        leadAvatarUrl: { type: string, nullable: true }
        autoAssign:
          type: boolean
          description: >-
            When true, an issue created with this component and no explicit
            `assigneeId` is assigned to the lead. Cannot be true without a lead.
        archived: { type: boolean, description: 'Archived components stay on their issues but can no longer be attached' }
        issueCount:
          type: integer
          nullable: true
          description: >-
            Issues currently carrying this component — only filled by
            `GET …/components?withUsage=true` and `GET …/components/{id}/usage`;
            `null` otherwise.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ComponentRef:
      type: object
      nullable: true
      description: A component's display summary as embedded in an issue — deliberately minimal.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Billing }
        archived: { type: boolean, description: 'True when the component is archived (render it dimmed)' }

    CreateComponentRequest:
      type: object
      required: [name]
      description: >-
        Body of `POST /workspaces/{workspaceId}/projects/{projectId}/components`.
        Same permission as the create/update endpoints above (built-in project
        `MANAGER`, or a workspace `OWNER`/`ADMIN` across their workspace).
      properties:
        name:
          type: string
          maxLength: 200
          description: >-
            Required, non-blank. Normalized server-side (NFC, invisible
            control/format characters stripped, whitespace collapsed; spaces are
            allowed) and then limited to 80 characters — a longer or blank
            result is a `400`. The 200-char schema limit is only a payload
            guard. Unique per project, case-insensitively, archived components
            included (`409`).
          example: Billing
        description: { type: string, nullable: true, maxLength: 500, description: 'Optional note; blank is stored as null.' }
        leadId:
          type: string
          format: uuid
          nullable: true
          description: 'The component lead. Must be a member of this workspace — anything else is a `422` "Unknown lead".'
        autoAssign:
          type: boolean
          default: false
          description: >-
            Assign new issues filed under this component to its lead. Requires
            `leadId` (a `422` otherwise).

    UpdateComponentRequest:
      type: object
      description: >-
        Body of `PATCH …/components/{componentId}` — partial; `null`/omitted
        means "leave unchanged". Project curator only.
      properties:
        name: { type: string, maxLength: 200, description: 'New name if present — same normalization, 80-char limit and per-project case-insensitive uniqueness as create (`409`; a pure casing change is allowed).' }
        description: { type: string, maxLength: 500, description: 'New description if present; a blank string clears it.' }
        leadId: { type: string, format: uuid, description: 'New lead if present; must be a workspace member (`422` otherwise).' }
        clearLead: { type: boolean, default: false, description: 'Unset the lead (a null leadId cannot be distinguished from "not sent"); ignored when leadId is also given.' }
        autoAssign: { type: boolean, description: 'Toggle create-time auto-assign. Turning it on while the component ends up with no lead is a `422`.' }

    ComponentUsageResponse:
      type: object
      description: How many issues currently carry a component.
      properties:
        issueCount: { type: integer, example: 12 }

    VersionResponse:
      type: object
      description: >-
        A project version — one entry of the release plan, with a fully
        reversible release lifecycle. The three counters are **always** present
        (unlike `ComponentResponse.issueCount`/`LabelResponse.issueCount`, which
        are opt-in): they cost one grouped query for the whole list, so this is
        the Releases page's data source without a second round-trip.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60, example: 2.4.0, description: 'Display name (casing preserved); unique per project case-insensitively' }
        description: { type: string, nullable: true, maxLength: 500 }
        releaseDate:
          type: string
          format: date
          nullable: true
          description: >-
            The planned (or, once released, the effective) release date. Kept
            across an un-release — it simply goes back to being the plan.
          example: '2026-09-01'
        released: { type: boolean, description: 'Moved only by POST …/release and POST …/unrelease, never by PATCH' }
        releasedAt:
          type: string
          format: date-time
          nullable: true
          description: When the release was actually performed; `null` while unreleased.
        archived: { type: boolean, description: 'Archived versions stay linked to their issues but can no longer be linked' }
        issueCount: { type: integer, description: 'Issues with a **fix** link to this version (affects links are not counted)' }
        doneIssueCount: { type: integer, description: 'Of those fix-linked issues, the ones in a DONE-category status — the progress bar numerator' }
        affectsIssueCount: { type: integer, description: 'Issues with an **affects** link (triage, not progress)' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    VersionRef:
      type: object
      description: A version's display summary as embedded in an issue — deliberately minimal.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 2.4.0 }
        released: { type: boolean, description: 'True once shipped (pickers mark released options)' }
        archived: { type: boolean, description: 'True when the version is archived (render it dimmed)' }

    CreateVersionRequest:
      type: object
      required: [name]
      description: >-
        Body of `POST /workspaces/{workspaceId}/projects/{projectId}/versions`.
        Same permission as the create/update endpoints above (built-in project
        `MANAGER`, or a workspace `OWNER`/`ADMIN` across their workspace).
      properties:
        name:
          type: string
          maxLength: 200
          description: >-
            Required, non-blank. Normalized server-side (NFC, invisible
            control/format characters stripped, whitespace collapsed; spaces are
            allowed) and then limited to 60 characters — a longer or blank
            result is a `400`. The 200-char schema limit is only a payload
            guard. Unique per project, case-insensitively, archived versions
            included (`409`).
          example: 2.4.0
        description: { type: string, nullable: true, maxLength: 500, description: 'Optional note; blank is stored as null.' }
        releaseDate:
          type: string
          format: date
          nullable: true
          description: >-
            The **planned** release date. It does not release anything — a new
            version is always created unreleased. Must fall within
            `1000-01-01`…`9999-12-31` (a `422`, not a `400`, beyond that).
          example: '2026-09-01'

    UpdateVersionRequest:
      type: object
      description: >-
        Body of `PATCH …/versions/{versionId}` — partial; `null`/omitted means
        "leave unchanged". Project curator only. There is deliberately no
        `released` field: the lifecycle moves only through `POST …/release` and
        `POST …/unrelease`.
      properties:
        name: { type: string, maxLength: 200, description: 'New name if present — same normalization, 60-char limit and per-project case-insensitive uniqueness as create (`409`; a pure casing change is allowed).' }
        description: { type: string, maxLength: 500, description: 'New description if present; a blank string clears it.' }
        releaseDate: { type: string, format: date, description: 'New planned date if present. Must fall within `1000-01-01`…`9999-12-31` (`422` beyond that).' }
        clearReleaseDate: { type: boolean, default: false, description: 'Unset the planned date (a null releaseDate cannot be distinguished from "not sent"); ignored when releaseDate is also given.' }

    ReleaseVersionRequest:
      type: object
      description: >-
        Body of `POST …/versions/{versionId}/release` — **entirely optional**,
        both fields included, so `{}` (or no body at all) is a valid "just
        release it".
      properties:
        releaseDate:
          type: string
          format: date
          nullable: true
          description: >-
            Overrides the stored plan date. When neither this nor the stored
            `releaseDate` is set, the server stamps today's UTC date. Must fall
            within `1000-01-01`…`9999-12-31` (`422` beyond that).
          example: '2026-09-01'
        moveUnresolvedToVersionId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Re-point the **fix** links of every issue in a non-DONE status to
            this version instead. It must be another version of the same
            project, **unreleased** and non-archived (`422` otherwise). Omit it
            and unresolved issues simply keep the released version — releasing
            with open work is allowed on purpose.

    VersionUsageResponse:
      type: object
      description: >-
        What a version is used for — backs the delete-confirmation dialog and
        the release dialog's "move N unresolved issues to →" prompt.
      properties:
        fixIssueCount: { type: integer, example: 24, description: 'Issues with a fix link' }
        affectsIssueCount: { type: integer, example: 3, description: 'Issues with an affects link' }
        unresolvedFixIssueCount: { type: integer, example: 6, description: 'Fix-linked issues NOT in a DONE-category status — what `moveUnresolvedToVersionId` would move' }

    SprintState:
      type: string
      enum: [FUTURE, ACTIVE, COMPLETED]
      description: >-
        The sprint lifecycle, one-way: `FUTURE` (a planning bucket) →
        `ACTIVE` (at most one per project, enforced in the database) →
        `COMPLETED` (terminal — there is **no re-open**).

    SprintResponse:
      type: object
      description: >-
        A project sprint. The counters are **always** present (like
        `VersionResponse`'s progress): they cost one grouped query for the whole
        page, so there is nothing to opt out of.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60, example: Sprint 7, description: 'Display name (casing preserved); unique per project case-insensitively, completed sprints included' }
        goal: { type: string, nullable: true, maxLength: 500, example: Ship billing v2 }
        state: { $ref: '#/components/schemas/SprintState' }
        sequence: { type: integer, example: 7, description: '1-based, per project — drives the default name and the FUTURE/COMPLETED ordering' }
        startAt: { type: string, format: date-time, nullable: true, description: 'Planned while FUTURE; stamped when the sprint is started' }
        endAt: { type: string, format: date-time, nullable: true, description: 'Planned end; defaults at start to startAt + app.agile.default-sprint-length-days' }
        completedAt: { type: string, format: date-time, nullable: true, description: 'Non-null exactly when state is COMPLETED' }
        daysRemaining:
          type: integer
          nullable: true
          example: 6
          description: >-
            Whole days from today (UTC) to `endAt`, for an **ACTIVE** sprint
            with an end date only — `0` means it ends today and a **negative**
            value means it is overdue. `null` otherwise: a FUTURE or COMPLETED
            sprint has nothing to count down.
        issueCount: { type: integer, example: 12 }
        doneIssueCount: { type: integer, example: 7, description: 'Of those, the ones in a DONE-category status' }
        points: { type: number, example: 34.5, description: 'Sum of the sprint''s story points; unestimated issues contribute nothing (they are counted separately, not as zero)' }
        donePoints: { type: number, example: 21, description: 'Sum of story points over the DONE-category issues' }
        unestimatedCount: { type: integer, example: 2, description: 'Issues with no storyPoints' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SprintRef:
      type: object
      description: >-
        A sprint's display summary as embedded in an issue and in the completion
        dialog's target list — deliberately minimal, but it carries `state` so a
        client can badge the active sprint differently without a second fetch.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Sprint 7 }
        state: { $ref: '#/components/schemas/SprintState' }

    SectionStats:
      type: object
      description: >-
        Roll-up of one planning section — a sprint or the backlog. **Always
        computed over the whole section**, never over the truncated page, so a
        capped section still shows honest totals.
      properties:
        issueCount: { type: integer, example: 12, description: 'Issues in the section after the request''s filters' }
        doneIssueCount: { type: integer, example: 7 }
        points: { type: number, example: 34.5 }
        donePoints: { type: number, example: 21 }
        unestimatedCount: { type: integer, example: 2, description: '"We didn''t estimate it" is a different statement from "it''s free"' }

    BacklogSection:
      type: object
      description: >-
        One planning section's body — its rows plus the fields that say what was
        withheld. **Every planning surface that returns a section returns this
        shape**, so a section fetched on its own and the same section inside the
        whole view cannot describe themselves differently.


        `truncated` means *the section holds more matching issues than
        `sectionCap`* — never "more exist than the rows you received" — and
        `totalAvailable` and every `stats` figure are computed over the **whole**
        section with the request's filters applied, never over the rows below
        them. A truncated section still shows honest totals.
      properties:
        issues:
          type: array
          description: >-
            The section's rows in the shared rank order (`position`, then newest
            first) — the same order the board uses — capped at `sectionCap`.
          items: { $ref: '#/components/schemas/IssueResponse' }
        truncated: { type: boolean, description: 'True when the section holds more than `sectionCap` matching issues' }
        totalAvailable: { type: integer, format: int64, description: 'Full filtered count of the whole section (equals the length of `issues` when not truncated)' }
        stats: { $ref: '#/components/schemas/SectionStats' }

    PlanningCaps:
      type: object
      description: >-
        The caps every planning response carries at its top level, whether it
        returns the whole view or a single section. They are **independent**
        operator knobs with deliberately different defaults, and a client holds
        neither: it reads them off whatever response it last received, so an
        operator may retune either between a render and a refresh.
      properties:
        sectionCap: { type: integer, example: 300, description: 'The per-section cap in force for this response (app.agile.section-max-issues)' }
        bulkMoveCap:
          type: integer
          example: 100
          description: >-
            The cap on ONE `POST …/sprints/{sprintId}/issues` call
            (`app.agile.max-issues-per-bulk-move`, default 100). Echoed here
            because it is a **different** operator knob from `sectionCap`
            (default 300): a "move everything to…" action is driven by the
            rendered section, so a client that derives one number from the other
            `400`s on every section above the bulk cap. Chunk bulk moves at this
            value instead of hardcoding it.

    BacklogViewResponse:
      description: >-
        The whole planning view of one project in a single round trip. Sections
        are independently truncatable at `sectionCap` and independently
        refreshable — each one can be re-fetched on its own under
        `…/backlog/sections/…`, which answers with that same section plus these
        caps.
      allOf:
        - type: object
          properties:
            sprints:
              type: array
              description: 'The project''s OPEN sprint sections — ACTIVE first, then FUTURE by sequence. `[]` for a project with no open sprint.'
              items:
                allOf:
                  - type: object
                    properties:
                      sprint: { $ref: '#/components/schemas/SprintResponse' }
                  - $ref: '#/components/schemas/BacklogSection'
            backlog:
              allOf:
                - $ref: '#/components/schemas/BacklogSection'
              description: The ranked backlog — the same section without a sprint header.
        - $ref: '#/components/schemas/PlanningCaps'

    BacklogSectionResponse:
      description: >-
        ONE planning section, fetched on its own — the answer to
        `GET …/backlog/sections/backlog` and `…/backlog/sections/{sprintId}`.


        It is the aggregate's section (`BacklogSection`) with the section's
        sprint header in front of it and the view's caps (`PlanningCaps`) behind
        it — **by construction, not by restatement**, so a client patches a
        refreshed section into a cached view without translating anything and
        the two surfaces cannot drift into describing a section differently.
        Both caps ride on a single-section response for that reason too: a view
        whose sections have each been refreshed must still carry them, and must
        adopt a newer value if an operator retuned in between.


        The request carries **no page size** — a section is bounded by
        `sectionCap`, which the server owns.
      allOf:
        - type: object
          properties:
            sprint:
              allOf:
                - $ref: '#/components/schemas/SprintResponse'
              nullable: true
              description: >-
                The section's sprint, with its filter-aware counters — or `null`
                for the BACKLOG section, which is the encoding this domain
                already uses everywhere (an issue's `sprint` is `null` when it
                sits in the backlog).
        - $ref: '#/components/schemas/BacklogSection'
        - $ref: '#/components/schemas/PlanningCaps'

    SprintCompletionPreview:
      type: object
      description: >-
        What `POST …/sprints/{sprintId}/complete` would report, computed before
        the fact — off the same query, so the dialog and the result cannot
        drift.
      properties:
        totalIssueCount: { type: integer, example: 12 }
        doneIssueCount: { type: integer, example: 7 }
        unfinishedIssueCount: { type: integer, example: 5, description: 'Issues whose status category is NOT DONE — exactly what the completion will move' }
        totalPoints: { type: number, example: 34.5 }
        donePoints: { type: number, example: 21 }
        unfinishedPoints: { type: number, example: 13.5 }
        targetCandidates:
          type: array
          description: >-
            The `FUTURE` sprints of this project the unfinished work may be
            carried over to (the sprint being completed is excluded). An empty
            list means the dialog must offer "create a sprint" instead.
          items: { $ref: '#/components/schemas/SprintRef' }

    CompleteSprintRequest:
      type: object
      required: [moveUnfinishedTo]
      description: >-
        Body of `POST …/sprints/{sprintId}/complete` — **required**, unlike the
        optional start body: the disposition of the unfinished work is a real
        decision, and defaulting it silently would move issues nobody asked to
        move.
      properties:
        moveUnfinishedTo:
          type: string
          enum: [BACKLOG, SPRINT]
          description: >-
            `BACKLOG` clears the sprint of every unfinished issue (the rank is
            preserved, so they keep their order); `SPRINT` carries them over to
            `targetSprintId`.
        targetSprintId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Required exactly when `moveUnfinishedTo` is `SPRINT`. Must be a
            `FUTURE` sprint of **this** project and not the sprint being
            completed — `422` otherwise. Deliberately not an ACTIVE one (there
            is none — this sprint is it) and not a COMPLETED one.

    SprintCompletionResult:
      type: object
      description: The honest done-vs-carried-over report of a completed sprint.
      properties:
        sprint: { $ref: '#/components/schemas/SprintResponse' }
        completedIssueCount: { type: integer, example: 7, description: 'Issues that ended the sprint in a DONE-category status — they KEEP their sprint, which is the sprint''s record of what it delivered' }
        carriedOverIssueCount: { type: integer, example: 5, description: 'Unfinished issues moved to the chosen destination' }
        carriedOverToSprintId: { type: string, format: uuid, nullable: true, description: 'The target sprint, or null when the unfinished work went back to the backlog' }
        donePoints: { type: number, example: 21 }
        carriedOverPoints: { type: number, example: 13.5 }

    CreateSprintRequest:
      type: object
      description: >-
        Body of `POST …/projects/{projectId}/sprints`. Project curator only.
        Everything is optional — the empty object `{}` creates the next
        `"Sprint N"`.
      properties:
        name:
          type: string
          maxLength: 60
          example: Sprint 7
          description: >-
            Blank or absent → `"Sprint " + sequence`, which is why default names
            can never collide. Normalized server-side (NFC, invisible
            control/format characters stripped, whitespace collapsed) and then
            limited to 60 characters — a longer result is a `400`. Unique per
            project, case-insensitively, **completed sprints included** (`409`).
        goal: { type: string, nullable: true, maxLength: 500, example: Ship billing v2 }
        startAt: { type: string, format: date-time, nullable: true, description: 'The **plan** only — filling it in does NOT start the sprint (that is POST …/start)' }
        endAt: { type: string, format: date-time, nullable: true, description: 'Must be after `startAt` (`422` otherwise)' }

    UpdateSprintRequest:
      type: object
      description: >-
        Body of `PATCH …/sprints/{sprintId}` — partial; omitted means "leave
        unchanged". Project curator only. There is deliberately no `state`
        field: the lifecycle moves only through `POST …/start` and
        `POST …/complete`, and there is no re-open.
      properties:
        name: { type: string, maxLength: 60, description: 'Same normalization, 60-char limit and per-project case-insensitive uniqueness as create (`409`; a pure casing change is allowed).' }
        goal: { type: string, maxLength: 500, description: 'New goal if present; a blank string clears it.' }
        startAt: { type: string, format: date-time, description: 'Editable only while the sprint is FUTURE; changing it on an ACTIVE or COMPLETED sprint is a 422. Compared by instant, so the same moment re-sent in another UTC offset is not a change.' }
        endAt: { type: string, format: date-time }
        clearStartAt: { type: boolean, default: false, description: 'Unset the start date (a null startAt cannot be distinguished from "not sent"); ignored when startAt is also given. A 422 on an ACTIVE sprint (which must keep a start date) and on a COMPLETED one (whose start is frozen).' }
        clearEndAt: { type: boolean, default: false, description: 'Unset the end date; ignored when endAt is also given.' }

    StartSprintRequest:
      type: object
      description: >-
        Body of `POST …/sprints/{sprintId}/start` — **entirely optional**, so no
        body at all (or `{}`) means "start it now with the default length".
      properties:
        startAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Defaults to **now** (UTC). A date in the past is allowed on purpose:
            backfilling a sprint that actually began on Monday is normal. A date
            in the **future** is a `422` — plan the sprint instead, leave it
            `FUTURE` (its dates stay editable) and start it when it begins,
            which stamps the start for you. Up to five minutes ahead of the
            server's clock is accepted but **recorded as `now`** — a fast client
            clock is treated as now, so the stored and returned `startAt` is the
            clamped instant rather than the one sent. Tolerance for
            unsynchronised client clocks, not a configurable policy.
        endAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Defaults to `startAt` + `app.agile.default-sprint-length-days`
            (default 14). `endAt <= startAt` is a `422`.
        goal: { type: string, nullable: true, maxLength: 500, description: 'An optional last-minute goal; omitted leaves the stored one.' }

    AddIssuesToSprintRequest:
      type: object
      required: [issueIds]
      description: Body of `POST …/sprints/{sprintId}/issues`.
      properties:
        issueIds:
          type: array
          minItems: 1
          maxItems: 500
          description: >-
            The issues to move, by **id** (the established convention for
            references — only the rank endpoint's moved issue travels by
            number). Duplicates are de-duped; an issue already in this sprint is
            a silent no-op. More than `app.agile.max-issues-per-bulk-move`
            (default 100) distinct ids is a `400` — chunk the request. The
            500-entry schema limit is only a payload guard.
          items: { type: string, format: uuid }
        position:
          type: string
          enum: [TOP, BOTTOM]
          default: BOTTOM
          description: >-
            Where the moved issues land in the target sprint's slice of the
            shared rank space; they keep their relative order among themselves.
            `BOTTOM` is the default — adding work to a sprint is not a priority
            statement.

    RankIssueRequest:
      type: object
      description: >-
        Body of `POST …/issues/{number}/rank`. **The client never sends a rank
        value** — it sends the neighbours it dropped between and the server
        computes the placement, which is why `position` is not exposed anywhere.
      properties:
        afterIssueId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The issue the moved one should land **after** (below it). Must
            already be in the target section (`422` otherwise) and may not be
            the moved issue itself (`422`).
        beforeIssueId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The issue it should land **before** (above it), same rules.
            Whichever anchor is omitted is filled in server-side; **both**
            omitted means "append to the end of the target section" and is only
            valid together with a sprint change.
        sprintId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Move the issue into this sprint in the same request. Unknown,
            foreign-project or `COMPLETED` → `422`; so is moving the issue out
            of a sprint that is already `COMPLETED`. Mutually exclusive with
            `clearSprint` (`400` when both are set).
        clearSprint:
          type: boolean
          default: false
          description: >-
            Move the issue back to the backlog. **Mutually exclusive with
            `sprintId`** (`400` when both are set). Clearing a `COMPLETED`
            sprint is a `422`.
        version:
          type: integer
          nullable: true
          description: >-
            **Optional** optimistic check: sent → `409` when stale, omitted →
            the move simply applies. Ranking is a positional, last-drag-wins
            operation, so a mandatory version round trip would produce a `409`
            storm during a planning meeting.

    ReportInterval:
      type: string
      enum: [DAY, WEEK]
      default: WEEK
      description: >-
        Bucket width of a time-series report. Every boundary is a **UTC**
        boundary, and `WEEK` buckets start on **Monday** (ISO-8601) — not
        configurable.

    ReportMeta:
      type: object
      description: >-
        The provenance block carried by **every** report response. It exists for
        one reason: the recurring complaint about reporting features is "these
        numbers don't match what I expected", and the mechanism behind it is a
        report that quietly left data out. A response that states when it was
        computed, how many issues it saw, whether a cap bit, how far back its
        data goes and whether a filter it was given matched nothing cannot fail
        that way silently.
      properties:
        computedAt:
          type: string
          format: date-time
          description: >-
            When the server computed these numbers. Reports are live reads, so
            two tabs opened at different times legitimately disagree — this is
            how a reader tells which is which.
        basedOnIssues:
          type: integer
          format: int64
          example: 1842
          description: >-
            How many **distinct issues** the numbers were computed from. Which
            population that is follows from the report's own question, so each
            report says: on `/flow` the issues *touching* the window — created
            in it **or** closed in it, deliberately **not**
            `created + resolved`, since an issue created and closed inside the
            same window appears on both lines but is one issue of evidence, not
            two; on `/cycle-time` the completed issues in the window after
            filters (i.e. `sampleSize`); on `/aging` the project's open issues;
            on `/sprint-burnup` and `/sprint-review` the distinct issues that
            have ever been in that sprint; on `/velocity` the distinct issues the
            sampled sprints' ledgers hold, an issue that appeared in two of them
            counted once; on `/search/insights` the distinct issues matching the
            query — the same number the search result list reports, and
            **deliberately not the sum of the series**, since a many-valued
            dimension puts one issue in several buckets.


            **On every report it is counted independently of the row cap**, which
            is what lets it be the larger number when truncation bites.


            It is never `items.length`: when the cap bites this is deliberately
            the larger number, because it must state how many issues the report
            was *about* — which is exactly what the reader can no longer see.
        truncated:
          type: boolean
          description: >-
            Whether `cap` actually bit; when `true` the report is a partial view
            and the client must say so. **Always `false` on `/flow`**, which
            aggregates in SQL and returns at most one row per bucket, so the row
            row cap physically cannot bite there. **Always `false` on
            `/search/insights` too, and for the same reason** — it aggregates in
            PostgreSQL and materialises no issue row at all. What truncates there
            is buckets, disclosed by its own `slicesTruncated` / `cellsTruncated`
            rather than by this flag.


            It does bite on the row-level reports, and **which end survives
            differs by report, on purpose**: `/cycle-time` keeps the **most
            recent** rows (its reader wants the latest work) and `/aging` keeps
            the **oldest** (its reader wants the most rotten item). A client that
            assumes the wrong end draws a wrong chart from a correct response.
            On both, the aggregates — percentiles, counts — are computed over the
            *whole* matching set, so truncation shortens the list and never moves
            a line.


            **On the two sprint reports it caps ledger EVENT rows, not issues**,
            and the surviving end is the **oldest**: the ledger is read oldest
            first, so what a truncated sprint keeps is its commitment and its
            earliest changes — the head of the chart stays exact and its tail
            goes missing, which is the recoverable failure. The opposite ordering
            would lose the commitment batch and make every number wrong. (In
            practice it cannot bite: one sprint's ledger is hundreds of rows
            against a cap of 20 000.) **`seriesTruncatedAt` on `/sprint-burnup`
            is a different limit and does not set this flag** — that one clips the
            day series against `app.reports.max-window-days` and names the day it
            stopped on; this one means the row cap printed beside it in `cap`.


            **On `/velocity` this flag also changes what the response is willing
            to say.** Its sweep reads up to twelve sprints' ledgers at once, so a
            cap that bites removes whole sprints rather than shaving one; those
            sprints are dropped from `sprints` instead of being drawn as
            all-zero bars, **and `forecast` is suppressed**, because a band over
            the bars that happened to fit is not the band the caller asked for. So
            here `truncated: true` means "this chart is shorter than you asked for
            and its forecast is withheld", not merely "a list was cut".
        cap:
          type: integer
          example: 20000
          description: >-
            The row cap that *would* bite (`app.reports.max-rows`). Reported by
            every report **including those that cannot hit it**, so a client
            never has to guess which budget a number was measured against.
        firstIssueAt:
          type: string
          format: date-time
          nullable: true
          example: '2024-11-04T08:31:00Z'
          description: >-
            When the earliest issue **the project holds that this report's
            filters admit** was created, or `null` when there is none. This is
            what "we only have N days of history" must be measured from — the
            project's own `createdAt` is a different date, often years off, and
            fetching it took a second request for a number that was never the
            right one.


            **Filters yes, window never — on every report, without exception.**
            It is a property of the *project*, not of the sample a given report
            happens to be describing, so it is **not bounded by `from`/`to` and
            routinely predates `from`**. That is the whole use of it: it is what
            tells a reader whether the window they chose is wider than the data
            behind it. Computing it over the window would not merely be
            inconsistent between reports, it would be **circular** — the earliest
            issue inside a 14-day window is at most 14 days old, so a five-year-old
            project asking for a fortnight would report a fortnight of history and
            a client's thin-data warning would fire on every project. A number
            read over the window can only ever return the window.


            **Filters do still apply**, so on a filtered chart it reads "the first
            issue this chart could ever have shown" — with `typeId` set it is the
            first issue *of that type*, and with a `componentId` or `labelId` the
            first issue carrying it. A filter that matches **nothing** therefore
            makes this `null`, beside that filter's name in `unmatchedFilters`.
            It is the first *issue*, not the project's own creation date.


            **`null` on any report that spans a workspace rather than a project**
            — today that is `/search/insights`. This is a per-project property,
            and inventing a workspace-wide meaning for it would give one field
            name two definitions.
        unmatchedFilters:
          type: array
          items: { type: string }
          example: [typeId]
          description: >-
            Which of the supplied filter parameters match **no issue in this
            project at all** — never `null`, empty when every filter matched
            something or none was sent. Entries are the query-parameter names
            themselves (`typeId`, `componentId`, `labelId`), so a client can map
            one straight back to the control the user touched. Always empty on
            `/aging`, `/sprint-burnup`, `/sprint-review` and `/velocity`, which
            take no filters — `sprintId` is a **subject**, so an id that matches nothing
            is a `404` there rather than an entry here. Always empty on
            `/search/insights` as well: it belongs to id-shaped filter parameters,
            and an HQL name matching nothing is a `422` from the resolver long
            before it could be reported as unmatched.


            It exists because a typo'd or stale filter id otherwise renders a
            complete, plausible, all-zero chart: "no bugs were created in Q1" and
            "your filter matched nothing" are the same picture without it.


            **Note the deliberately weak and exact claim**: *no issue in this
            project carries this id* — **not** "this id does not exist". A
            perfectly valid issue type that nobody in this project has ever used
            is reported here too, and saying nothing about whether the id exists
            elsewhere in the taxonomy is what keeps the disclosure free of
            anything the caller cannot already see.

    FlowBucket:
      type: object
      description: One point on the flow chart.
      properties:
        date:
          type: string
          format: date
          example: 2026-05-21
          description: >-
            The bucket's **start** date, on a UTC boundary (a Monday when
            `interval=WEEK`). For an unaligned window the first bucket's date
            may lie **before** `from` — that bucket is partial and counts only
            what happened inside the window.
        created:
          type: integer
          format: int64
          description: Issues whose `created_at` falls in this bucket.
        resolved:
          type: integer
          format: int64
          description: >-
            Issues whose `closed_at` falls in this bucket — read as "issues
            **closed now**, dated by their most recent closure". Reopening an
            issue clears `closed_at` and removes it from this bucket, so past
            buckets are mutable.
        openAtEnd:
          type: integer
          format: int64
          description: >-
            How many issues were open at the **end** of this bucket: the count
            open when the window started, plus every `created` minus every
            `resolved` up to and including this bucket. Inherits the same
            "as of now" caveat as `resolved`.
        partial:
          type: boolean
          description: >-
            Whether this bucket covers **less calendar than a full interval**,
            because the requested window opens or closes inside it. Its bar is
            legitimately shorter than its neighbours' and a reader comparing them
            is being misled unless the UI says so.


            **The server's flag is authoritative — do not compute it in the
            client.** Deriving it browser-side means re-implementing Monday
            truncation in a second language, and the first time the two disagree
            the chart footnotes the wrong bar. It is computed from the same
            interval definition that produced the boundaries, so it cannot drift
            from them. At `interval=DAY` nothing is ever partial.

    FlowTotals:
      type: object
      description: The three window-wide numbers under the chart — the whole window, not a bucket.
      properties:
        created: { type: integer, format: int64, description: Issues created inside the window. }
        resolved: { type: integer, format: int64, description: Issues closed inside the window. }
        net:
          type: integer
          format: int64
          description: >-
            `created - resolved`. Signed on purpose: positive means the backlog
            grew over the window.

    FlowReportResponse:
      type: object
      description: >-
        `GET …/reports/flow`. The window is echoed back **exactly as
        requested** — an over-long one is refused with a `400` naming the cap
        rather than narrowed, so these are always the caller's own numbers.
      properties:
        from: { type: string, format: date, example: 2026-05-21 }
        to: { type: string, format: date, example: 2026-08-19 }
        interval: { $ref: '#/components/schemas/ReportInterval' }
        buckets:
          type: array
          description: >-
            One entry per bucket in the window, ascending and **zero-filled** —
            a bucket in which nothing happened is present with zeros rather than
            absent. The first and last bucket may be **partial** when the window
            does not start/end on a bucket boundary; each bucket carries its own
            `partial` flag, which is the authoritative answer.
          items: { $ref: '#/components/schemas/FlowBucket' }
        totals: { $ref: '#/components/schemas/FlowTotals' }
        meta: { $ref: '#/components/schemas/ReportMeta' }

    ReportPercentiles:
      type: object
      description: >-
        A p50/p85 pair in **days** — percentiles, never a rolling average, and
        both fields may legitimately be `null`.


        **The pair is always present as an object, even when suppressed.** Below
        **five** samples both fields are `null` and the client prints "not
        enough completed work to compute percentiles (need 5, have 3)" rather
        than drawing a line: a p85 over three issues is arithmetically defined
        and informationally worthless. Suppression is a fact about the data, not
        a change of response shape — read `p50 == null`, never test the parent
        for existence. The threshold is not configurable, deliberately: it is a
        statement about what is meaningful, and a line whose threshold differs
        between installs is worse than a missing one.
      properties:
        p50:
          type: number
          format: double
          nullable: true
          example: 4.1
          description: The median, in days to two decimals, or `null` when suppressed for want of samples.
        p85:
          type: number
          format: double
          nullable: true
          example: 12.6
          description: >-
            The 85th percentile, in days to two decimals, or `null` on the same
            terms. 85 rather than 90 or 95 because it is the number the
            flow-metrics literature uses for a "most work finishes within"
            statement, and because at realistic team sample sizes a p95 is two
            issues wide.

    CycleTimePercentiles:
      type: object
      description: >-
        The two reference lines of `/cycle-time`, one pair per measure. **Both
        containers are always present**; either may hold `null`s.


        **They are suppressed independently, and that is not an oversight.**
        They are computed over different sample sets — `lead` over every
        completed issue in the window (`sampleSize`), `cycle` over only those
        that also have a `started_at` (`sampleSize - missingStartCount`) — and
        on an install whose history predates the `started_at` backfill the
        second set can be a small fraction of the first. So a window can
        legitimately produce a usable `lead` pair and a suppressed `cycle` pair.
        Suppressing both when either is thin would hide a number we have;
        suppressing neither would print a p85 drawn from two issues.
      properties:
        cycle:
          allOf:
            - $ref: '#/components/schemas/ReportPercentiles'
          description: >-
            p50/p85 of `closed_at - started_at`, over the completed issues in
            the window that **have a start**. Never over a substituted
            `created_at`.
        lead:
          allOf:
            - $ref: '#/components/schemas/ReportPercentiles'
          description: p50/p85 of `closed_at - created_at`, over every completed issue in the window.

    CycleTimeItem:
      type: object
      description: >-
        One dot on the finished-work scatter: x = `closedAt`, y = `cycleDays` or
        `leadDays` depending on the page's toggle.
      properties:
        issueId:
          type: string
          format: uuid
          description: The issue, so the dot links through to the issue detail.
        key: { type: string, example: DEMO-14, description: The project-scoped issue key. }
        title: { type: string, example: Search returns stale results }
        typeId:
          type: string
          format: uuid
          description: >-
            The issue type, so a client can shape or colour by type without a
            second request. The id only — this response carries no taxonomy, and
            the project config endpoint already resolves it.
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When work began, or `null` when unknown — the provenance of
            `cycleDays`, and the reason that field can be `null`.
        closedAt:
          type: string
          format: date-time
          description: >-
            When the issue was closed. Never `null`: the window is a range on
            this column.
        cycleDays:
          type: number
          format: double
          nullable: true
          example: 4.2
          description: >-
            `closedAt - startedAt` in days to two decimals, or **`null` when the
            issue has no recorded start** — not `0`, and not the lead time.
            `created_at` is never substituted; such issues are counted in
            `missingStartCount` instead. A client must not coerce this to `0`,
            which would put a dot on the floor of the chart for every issue we
            simply do not know about.
        leadDays:
          type: number
          format: double
          example: 11.7
          description: >-
            `closedAt - createdAt` in days to two decimals. Defined for every
            completed issue, which is why this page is never empty even on an
            install that upgraded yesterday.

    CycleTimeReportResponse:
      type: object
      description: >-
        `GET …/reports/cycle-time`. The window is a range on `closed_at` and is
        echoed back **exactly as requested** — an over-long one is refused with a
        `400` naming the cap rather than narrowed.


        **Three counts, three different questions — read them together.**
        `sampleSize` is the completed issues in the window after filters and is
        what the `lead` percentiles were computed from; `missingStartCount` is
        how many of those have no start, so the `cycle` percentiles came from
        `sampleSize - missingStartCount`; `items.length` is how many dots were
        actually shipped, which equals `sampleSize` unless `meta.truncated`, in
        which case it is `meta.cap` and the client must say so above the chart.
      properties:
        from: { type: string, format: date, example: 2026-05-21 }
        to: { type: string, format: date, example: 2026-08-19 }
        items:
          type: array
          description: >-
            One entry per completed issue in the window, **most recently closed
            first** (ties broken by id, so a truncated report is deterministic).
            That order is what gives truncation a meaning a reader can state:
            what survives the cap is *the most recent N*.
          items: { $ref: '#/components/schemas/CycleTimeItem' }
        percentiles: { $ref: '#/components/schemas/CycleTimePercentiles' }
        sampleSize:
          type: integer
          format: int64
          example: 214
          description: >-
            Completed issues in the window after filters — the population the
            percentiles were computed over, **not** `items.length`. When the cap
            bites, the dots are a recent sample and the lines still describe the
            whole set; comparing these two numbers is how a client knows.
        missingStartCount:
          type: integer
          format: int64
          example: 128
          description: >-
            How many issues in `sampleSize` have no recorded `started_at`. They
            contribute to lead time, to `sampleSize` and to this count — and to
            nothing else. Never zero because a fallback filled the gap; there is
            no fallback. Surface it: "cycle time available for 812 of 940
            completed issues" is the sentence it exists for.
        meta:
          allOf:
            - $ref: '#/components/schemas/ReportMeta'
          description: >-
            Provenance. Here `basedOnIssues` equals `sampleSize`. `firstIssueAt`
            is the family's, unchanged by this report: the project's earliest
            issue that the filters admit, **not** windowed — so it routinely
            predates `from`, which is exactly how a client tells that the window
            asked for is wider than the history behind it.

    AgingItem:
      type: object
      description: >-
        One open issue in an aging column — **the named rotting item**, which is
        why this report exists instead of a cumulative flow diagram. A CFD shades
        an area and asks the reader to infer a queue; this names DEMO-31, says it
        has been open 19.4 days, and lets the p85 line say that is longer than
        85% of everything the team has ever finished.
      properties:
        issueId: { type: string, format: uuid }
        key: { type: string, example: DEMO-31 }
        title: { type: string, example: Flaky import on large CSVs }
        ageDays:
          type: number
          format: double
          example: 19.4
          description: >-
            How long this issue has been in flight, in days to two decimals,
            measured from `startedAt` when it exists and from `created_at` when
            it does not. **Never `null`** — and the fallback is correct *here*
            precisely because it is wrong on `/cycle-time`: "filed 40 days ago,
            never picked up" is a true and materially different fact from "in
            progress for 40 days", and both belong on this board. Every item in
            one response is aged against the same instant, which is
            `meta.computedAt`.
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Who holds it, or `null`. An id only: this report labels each item so
            somebody can be asked about it, and it deliberately never aggregates
            by assignee — no percentile here is per-person.
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When work began, or `null` for an item never started — the
            provenance of `ageDays`, returned precisely so a client can
            distinguish "19 days in progress" from "19 days sitting in To Do".

    AgingColumn:
      type: object
      description: >-
        One column of the aging board: a non-DONE status of the project's
        effective workflow, holding its open issues oldest-first. **Empty columns
        are present** — a status nobody is in is a fact about the board, and a
        report that draws only the columns it found rows for redraws its own axis
        every day.
      properties:
        statusId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The status, or **`null` for the trailing "Not on this board"
            column** that gathers issues whose status has left the project's
            workflow. The `null` is the client's signal that this column has no
            workflow position — it is the one column that cannot be dragged to,
            and it must still be rendered.
        name:
          type: string
          example: In Progress
          description: >-
            The status name, or `"Not on this board"`. Deliberately one trailing
            column rather than one per off-workflow status: the reader's question
            is "what is stranded", not "which retired status is it stranded in",
            and per-status columns would let a workflow swap add a dozen columns
            to a chart.
        category:
          allOf:
            - $ref: '#/components/schemas/StatusCategory'
          nullable: true
          description: >-
            The status category, or `null` for the trailing column (whose members
            may come from several statuses of different categories, so there is
            no single honest answer). `DONE` is never a column here — this report
            is about unfinished work.
        items:
          type: array
          description: >-
            The column's open issues, **oldest first**, so the item most in need
            of attention is the first one a reader's eye lands on and the last one
            the row cap would drop.
          items: { $ref: '#/components/schemas/AgingItem' }

    AgingReportResponse:
      type: object
      description: >-
        `GET …/reports/aging`. No window and no parameters — "what is rotting
        now" is a current-state question — which makes this the one report on
        this base path whose question takes no input, so it has no `400` of its
        own — as does its `.csv` sibling (a malformed path UUID still
        `400`s here, as it does on every endpoint, while binding).
      properties:
        columns:
          type: array
          description: >-
            One column per non-DONE status of the effective workflow, in board
            order, followed by at most one trailing `"Not on this board"` column
            when anything is stranded outside the workflow. Empty columns
            included.
          items: { $ref: '#/components/schemas/AgingColumn' }
        percentiles:
          allOf:
            - $ref: '#/components/schemas/ReportPercentiles'
          description: >-
            The lines drawn across the columns: **cycle time over the project's
            whole completed history** — unwindowed, and the cycle measure only,
            whatever the page's toggle says. That is what makes the report
            actionable ("older than 85% of everything the team has ever
            finished") and it means these two field names mean something
            different here than on `/cycle-time`, where they belong to the
            requested window and come in one pair per measure. Computed from
            completed issues that have a `started_at`, so a project whose history
            predates the backfill can have full columns and suppressed (`null`)
            lines — the columns still render; the lines are an overlay, not a
            precondition.
        meta:
          allOf:
            - $ref: '#/components/schemas/ReportMeta'
          description: >-
            Provenance. Here `basedOnIssues` is the number of **open** issues the
            report was about — larger than the number of items shipped when
            `truncated` — and `unmatchedFilters` is always empty because this
            endpoint takes no filters. `firstIssueAt` is the family's: the
            project's earliest issue, **not** the earliest open one. The earliest
            open issue is not lost by that — items come back oldest-first, so it
            is literally the first item of the first non-empty column, with its
            key, title and age, which is strictly more than a bare timestamp in
            `meta`. The depth of the project's **completed** history is not
            derivable from this response at all, and it is the provenance this
            report actually needs, since its `percentiles` are computed over
            precisely that history.

    ReportCsvFile:
      type: string
      description: >-
        **The plotted series, one row per data point — not a list of issues.**
        That distinction is the whole feature. Where an export like this exists at
        all it usually hands back a flat issue list, which is the documented
        disappointment: people ask for the chart and get a spreadsheet, so they go
        back to screenshotting. Every row in these files is a point that was
        drawn, and every point that was drawn is a row.


        `cycle-time.csv` and `aging.csv` look like the exception and are not:
        their charts are scatter plots **of issues**, so one dot is one issue and
        the key and title identify the dot a reader is pointing at. Neither
        carries a description, a status history or a component list — the columns
        an issue export would have and a chart does not plot.


        **There is no "matching issues" export.** Do not read these files as one.
        See the `Reports` tag for the current state of that gap.


        ## Structure

        A UTF-8 file with **CRLF** line endings (RFC 4180), opening with a
        **UTF-8 BOM**, then a `#`-comment header, then exactly one column row,
        then the data rows. **Every line is CSV cells — the comment header and
        the column row included**, so the whole file parses with one reader.

        ```

        <BOM>"# Hamstrack report: velocity"

        "# Project: DEMO - Demo Project"

        "# Project id: 0192a0…"

        "# Measure: COUNT"

        "# Window: 6 completed sprints"

        "# Forecast: p50=18, p85=23, sample size=6 - a range to plan the next sprint with, …"

        "# Computed at: 2026-08-20T09:14:22Z"

        "# Based on issues: 142"

        "# Truncated: no (row cap 20000)"

        "sprintId","name","startAt","completedAt","committed","completed","addedAfterStart","carriedOver","unestimatedCount"

        0192cc…,"Sprint 6",2026-05-01T09:00Z,2026-05-15T16:02:41Z,19,14,2,5,0

        ```


        **The header is part of the contract, not decoration** — it is what makes
        a file mailed on, renamed and opened three weeks later still say what it
        is. It carries the report name, the project key + name + id, the window,
        the measure or sprint or interval **where the report has one**, the
        percentiles **or the reason they were suppressed**, `computedAt`,
        `basedOnIssues`, and whether truncation bit.


        **A parser must not require a fixed header block.** Only the lines that
        apply to a given report are emitted: four of the six reports have no
        measure at all, `aging` states that it has no window rather than printing
        one, and the suppression, truncation, unmatched-filter and no-sprint lines
        appear only when they are true. Match on the `# key: value` shape, not on
        position or count — and **unquote the line first**: each header line is
        **one quoted CSV cell**, `#` included.


        That quoting is a security control, not tidiness. A comment line emitted
        raw is still split on commas, so only its *first* cell begins with `#` —
        a project or sprint name containing a comma ends that cell and opens a
        new one, which is free to begin with `=`. Neither name restricts commas
        or equals signs, so wrapping the whole line in quotes is what closes the
        breakout. The column row is quoted for the same reason.


        **Consequence worth knowing if you already parse these files:** because
        `#` now sits *inside* the quotes, a reader configured to drop comment
        lines by a leading `#` — `pandas.read_csv(..., comment="#")` and its
        equivalents — **no longer skips the header**, and sees one-column rows
        instead. That trade was taken deliberately: there is no format in which a
        line both starts with a bare `#` and is a single cell. Match the header
        and read it, or skip lines whose first cell starts with `"#` after
        unquoting; do not filter on a bare leading `#`.


        ## Cell conventions

        * **`null` is an empty, unquoted field** — never `""` and never `null`.
          Report gaps are real (a cycle time with no recorded start, a suppressed
          band, a sprint with no completion date), and an empty field is what every
          spreadsheet and dataframe library reads back as *missing*.
        * **Text cells are always quoted**, with inner quotes doubled — so a comma,
          quote or newline in a title can never shift a row's remaining columns. The
          **comment-header lines and the column-name row take the same path**, so
          they are quoted too: every line in the file is cells.
        * **Text cells beginning `=`, `+`, `-`, `@`, tab or CR are prefixed with an
          apostrophe** (`'`) against spreadsheet formula injection: an issue titled
          `=HYPERLINK(...)` would otherwise become a live link in the reader's
          spreadsheet, and quoting does not help because the CSV parser strips
          quotes before the formula engine sees the value. **Expect that leading
          apostrophe when parsing text columns.**
        * **Numeric, date, enum, UUID and boolean cells are NOT prefixed**, and
          that asymmetry is deliberate: a negative `net` or `delta` legitimately
          starts with `-`, and guarding it would turn the column into text that
          will not sum. Those cells are server-generated and cannot carry attacker
          input.
        * The **BOM is deliberate**. Without it Excel on Windows decodes the file
          as the system code page and mangles every non-ASCII title. It costs a
          strict RFC 4180 parser three bytes on the first line; Excel, LibreOffice,
          Sheets, `pandas` (`encoding="utf-8-sig"`) and R all strip it.
    ReportMeasure:
      type: string
      enum: [COUNT, POINTS]
      default: COUNT
      description: >-
        What a sprint report counts: whole issues, or story points. The toggle
        exists on `/sprint-burnup`; `/sprint-review` reports **both** for every
        list and needs no parameter.


        `COUNT` is the default because it is the measure every project has: one
        issue is one unit, and no estimation is required. Under `POINTS` an
        **unestimated issue contributes `0`** to the series *and* is counted in
        `unestimatedCount` beside it — "we didn't estimate it" is not "it's
        free", and reporting the zero without the count is the documented failure
        this pair exists to prevent.


        **No status code depends on the delivery capabilities.** A project with
        `estimation: false` still answers `measure=POINTS` with a points series:
        the UI hides the toggle, the API does not hide the data, and points the
        project already recorded still render.


        **Which points, exactly, differs between the two sprint reports on
        purpose** — `/sprint-burnup` reads each issue's CURRENT estimate,
        `/sprint-review` reads the ledger's entry SNAPSHOT. The asymmetry is a
        decision, not an inconsistency, and "fixing" either to match the other
        breaks the question that one answers.

    SprintScopeEventType:
      type: string
      enum: [ADDED, REMOVED]
      description: >-
        The two things that can happen to a sprint's **scope**: an issue joined
        it, or an issue left it. `REMOVED` covers a manual removal, a move to
        another sprint or to the backlog, a completion's carry-over and a
        force-delete's detach.


        Deliberately closed at two values — "scope at time T" is the arithmetic
        `count(ADDED ≤ T) - count(REMOVED ≤ T)`, so a third member would not be a
        new feature, it would be a wrong number in every burn-up ever drawn.


        **What is NOT an event: re-estimating an issue.** A scope change is a
        membership change only. A re-estimate changes the height of the scope
        line from that point on and is never drawn as a step, and no
        `ScopeChange` row is ever written for one.

    BurnupPoint:
      type: object
      description: >-
        One day of the burn-up: how much work was in the sprint at the end of
        that day, and how much of it was finished.


        **Both values are "as at the end of `date`"**, computed at the following
        UTC midnight — the same UTC day boundaries every report in this family
        buckets on. The first point is the sprint's start day and carries the
        committed scope; the last is the day the line stops (today for a running
        sprint, the completion day for a finished one). There is no point after
        that.
      properties:
        date: { type: string, format: date, example: 2026-08-14 }
        scope:
          type: number
          example: 23
          description: >-
            Total work in the sprint at the end of that day, in the requested
            `measure`. Steps up on adds and down on removes, and on **nothing
            else** — a re-estimate is not a scope event, which is the whole
            reason this line can be trusted where a burndown's cannot. (Under
            `POINTS` a re-estimate does move the line, including its past,
            because points are read *currently*; it simply is not a step with a
            date and an author.)
        completed:
          type: number
          example: 18
          description: >-
            The part of `scope` that was closed by the end of that day. **Bounded
            above by `scope` by construction**: an issue that leaves the sprint
            takes its completion with it, so the two lines can meet but cannot
            cross. Do not draw a client-side guard for the crossing case; it
            cannot happen, and a guard would hide a real bug if it ever did.

    ScopeChange:
      type: object
      description: >-
        One entry of the burn-up's **scope-change log**: an issue joined or left
        a running sprint, when, moved by whom, and by how much the scope line
        stepped. This is the answer to "what happened to the plan", and it is why
        a burn-up is worth building where a burndown is not — every step in the
        line is hoverable and names the issue, so a scope increase is a fact with
        an author instead of an unexplained jump.


        **The commitment is not a change.** The `ADDED` rows a sprint's start
        writes — one per member, all stamped exactly `startAt` — are the sprint's
        committed scope and appear as `committedAtStart` and as the height of the
        first point, never as N log entries. Only events strictly after `startAt`
        are listed here.


        Ordered oldest first, ties broken by `key` so two issues moved in the
        same batch cannot swap places between requests.
      properties:
        at:
          type: string
          format: date-time
          description: When it happened (the ledger's `occurred_at`, UTC).
        issueId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The issue, or **`null` if it has since been deleted**. The event
            survives the issue by design, because a sprint's record must not be
            quietly rewritten by a later delete — so a client must be able to
            render this row **without a link**. `key` is always present.
        key:
          type: string
          example: DEMO-77
          description: >-
            The issue key as the ledger snapshotted it at the moment of the
            event — a snapshot rather than a join, so the row still reads as a
            line of a sprint's history after the issue is gone.
        event: { $ref: '#/components/schemas/SprintScopeEventType' }
        delta:
          type: number
          example: 5
          description: >-
            The signed step **in the requested `measure`** — `+1`/`-1` under
            `COUNT`, the issue's current estimate under `POINTS` (its entry
            snapshot for an issue that no longer has a current one). Always the
            same weight the series used for this issue, so the log and the line
            cannot disagree.
        actorId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Who moved it, or `null` in two cases. The ordinary one: the account
            has since been deleted — the event is a fact about the sprint and
            must outlive the account that caused it.


            The second is a decision rather than a foreign key: **a row belonging
            to a deleted issue names nobody**, even though the database still
            holds the actor. An issue's own history is cascade-deleted with it,
            so keeping the actor here would leave this log as the only surviving
            place in the product saying who moved a since-deleted issue — a wider
            survival than was ever argued for. The step, its instant, its
            direction and the key all survive; only the person does not.
        storyPoints:
          type: number
          nullable: true
          example: 5
          description: >-
            What the issue weighed **when it entered this sprint** — the ledger's
            own snapshot, `null` when it entered unestimated. Independent of
            `delta`, and carrying both is the point: `delta` is in the requested
            measure, so under `COUNT` it is ±1 and no point value would otherwise
            reach this log at all. A project with `estimation` switched off is
            shown exactly that measure, and a value the project already recorded
            stays visible when a capability is switched off — so the estimate
            travels with the row rather than being inferred client-side from a
            number that means something else.

    SprintBurnupResponse:
      type: object
      description: >-
        `GET …/reports/sprint-burnup`. Two lines and a log: `series` carries the
        scope and completed values per UTC day, and `scopeChanges` explains every
        step in the first of them. The ideal guide is **not** in the response —
        the client draws it from `(startAt, 0)` to `(endAt, committedAtStart)`,
        i.e. to the **committed** scope, not the current one.
      properties:
        sprint:
          allOf:
            - $ref: '#/components/schemas/SprintRef'
          nullable: true
          description: >-
            The subject. **`null` when the project has no ACTIVE sprint and the
            caller named none** — an empty answer to a well-formed question, not
            a missing resource, so it is a `200` with an empty series rather than
            a `404`. A named `sprintId` that does not resolve inside this project
            is always a `404`; it is the report's *subject*, not a filter.
        startAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the sprint started, or `null` for one that never has — a
            `FUTURE` sprint has no burn-up, because commitment is an event and it
            has not happened yet.
        endAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            The sprint's **planned** end. May be *before* the last series point:
            a sprint that overran is drawn to today, and the guide simply ends
            earlier than the lines do. It bounds nothing.
        measure:
          allOf:
            - $ref: '#/components/schemas/ReportMeasure'
          description: >-
            The measure actually applied, echoed so a client can never mislabel a
            chart it did not explicitly parameterise.
        committedAtStart:
          type: number
          example: 23
          description: >-
            The scope at `startAt`: the sum over the commitment batch the
            sprint's start wrote. `0` for a sprint that never started, and the
            anchor of the ideal guide.
        unestimatedCount:
          type: integer
          example: 4
          description: >-
            Issues in the sprint at the **last plotted point** that carry no
            estimate. They contribute `0` to a `POINTS` series and are counted
            here, never silently treated as zero alone. **Always populated,
            including under `COUNT`**, where it is the honest footnote for the
            toggle the reader is about to flip. Measured at `seriesTruncatedAt`
            when the series was clipped, so it describes the same span as the
            chart.
        series:
          type: array
          description: >-
            One point per UTC day, start day first. Empty when the sprint never
            started or when there is no sprint at all.
          items: { $ref: '#/components/schemas/BurnupPoint' }
        scopeChanges:
          type: array
          description: >-
            Every membership change **after** the start, oldest first. **Empty is
            a real and common answer**: it means the plan held.
          items: { $ref: '#/components/schemas/ScopeChange' }
        seriesTruncatedAt:
          type: string
          format: date
          nullable: true
          example: 2026-08-13
          description: >-
            **The last day the chart covers when the sprint is longer than
            `app.reports.max-window-days`**, and `null` — the ordinary case —
            when the whole sprint is drawn. The **first** days are the ones kept,
            because they carry the commitment, without which every later number
            means nothing. It is not a `400`: the caller stated no window, the
            sprint did, so there is nothing for them to correct. The bound exists
            because `startAt` may be arbitrarily **backdated** when a sprint is
            started, which makes the day count caller-influenced.


            **Its own field rather than `meta.truncated`, and the asymmetry
            matters.** `meta.truncated` means one specific thing — the
            `app.reports.max-rows` ledger-row cap bit, the number printed beside
            it in `meta.cap`. Folding the day clip into that flag made a
            twelve-issue sprint answer `basedOnIssues: 12`, `truncated: true`,
            `cap: 20000` and put "20 000" in a banner about a report that dropped
            no rows at all. Two limits, two signals; this one names the day it
            stopped on so the UI can say it.


            **`scopeChanges` is clipped to this same boundary — but only when the
            chart is clipped.** When this is `null` the log runs to the end of the
            ledger, deliberately: a completed sprint's carry-over rows are stamped
            a moment *after* `completed_at`, so bounding the log at the last point
            would silently drop the completion's own moves — the ones that explain
            where the remaining scope went. `/sprint-review` has no such bound at
            all (it returns lists, not a day series), so on a clipped sprint the
            two reports legitimately describe different spans, which is exactly
            what this field announces.
        meta:
          allOf:
            - $ref: '#/components/schemas/ReportMeta'
          description: >-
            Provenance. Here `basedOnIssues` is every distinct issue that has
            ever been in this sprint, counted in the database **above** the row cap
            — so when `truncated` bites it is deliberately larger than what came
            back, because its job is to say how many issues the report was
            *about*. And
            `unmatchedFilters` is always empty, because this endpoint takes no
            filters. `firstIssueAt` is the family's, unchanged: the **project's**
            earliest issue, not the sprint's, and never scoped to the sprint.

    SprintReviewIssue:
      type: object
      description: >-
        One row of a sprint-review list — the issue, as the retro needs to read
        it. Ids rather than names for the taxonomy, exactly as `CycleTimeItem`
        and `AgingItem` do: the client already holds the project's types,
        statuses and members from the config endpoint, so resolving them here
        would be three joins per report to re-send what the caller has.


        **A departed issue still gets a row.** When an issue is deleted its ledger
        entries survive with the issue id nulled, which is the whole reason a
        completed sprint's record cannot be rewritten by a later delete. Such a
        row arrives with `deleted: true`, its snapshotted `key` and `points`, and
        `null` for everything only the live issue could answer. **Render it as the
        line it is — "DEMO-77 (deleted)" — rather than dropping it**, because
        dropping it would silently change what the sprint delivered.
      properties:
        issueId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The issue, or `null` if it no longer exists. Also the only field a
            client can link from.
        key:
          type: string
          example: DEMO-14
          description: >-
            The key the ledger snapshotted when the issue entered the sprint —
            present for every row, deleted or not.
        title:
          type: string
          nullable: true
          example: Search returns stale results
          description: >-
            `null` for a deleted issue. Never snapshotted: a title is edited far
            too often for a copy of it to be a fact about the sprint, and the
            ledger deliberately stores only what identifies the row.
        typeId: { type: string, format: uuid, nullable: true, description: '`null` for a deleted issue' }
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The issue's **current** assignee, `null` when unassigned or deleted.
            Never a per-person breakdown: it is one field on a row, and no list,
            count, filter or sum in this feature groups by it.
        statusId: { type: string, format: uuid, nullable: true, description: 'The issue''s current status; `null` for a deleted issue' }
        points:
          type: number
          nullable: true
          example: 5
          description: >-
            What the issue weighed **when it entered this sprint** — the ledger's
            snapshot, **not** today's estimate, which is the opposite of what
            `/sprint-burnup` weighs with and is deliberate on both sides.
            `null` means it was unestimated at that moment, which is a different
            statement from zero.
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the issue was closed, or `null` if it is still open (or was
            reopened, which clears the stamp). Always `null` on a `deleted` row —
            see `carriedOver` on `SprintReviewResponse` for what that implies.
        deleted:
          type: boolean
          description: Whether the issue is gone and this row is all that is left of it.

    SprintReviewList:
      type: object
      description: >-
        One of the sprint review's five labelled lists, with the count and point
        sum its heading prints. The label is the **field name** on
        `SprintReviewResponse` — a `label` string inside the object would be a
        second name for the same thing, and the two would eventually disagree.
      properties:
        count: { type: integer, example: 23 }
        points:
          type: number
          nullable: true
          example: 55
          description: >-
            Sum of the rows' points, unestimated issues contributing nothing.
            **`null` when NOTHING in the list carried an estimate — including for
            an empty list.** "This list has no points to show" and "these issues
            are worth zero points" are different statements, and a sum of nothing
            rendered as `0` is the same silent zero `unestimatedCount` exists to
            refuse one row at a time. Structural rather than derived: the
            alternative left every client inferring emptiness from
            `count > unestimatedCount`, i.e. re-deriving a fact the server already
            knew, in each of the five places a list is rendered.
        unestimatedCount:
          type: integer
          example: 6
          description: >-
            How many of `count` carried no estimate. Stated **per list**, because
            "committed 55 points" means something quite different when six of the
            twenty-three issues were never estimated.
        issues:
          type: array
          description: >-
            The rows, in the order they first entered the sprint — chronological
            for `addedAfterStart`, deterministic for the rest, and never
            dependent on a key's lexicographic accident (`DEMO-10` sorts before
            `DEMO-9`).
          items: { $ref: '#/components/schemas/SprintReviewIssue' }

    SprintReviewTotals:
      type: object
      description: >-
        The sprint review's one header line, as data — *"Sprint 12 · 14 Aug –
        28 Aug · completed 18 of 25 issues (41 of 60 points) · 5 added after
        start."* Every number here is also derivable from the five lists; it is
        restated in one place so the sentence has a single source, because
        composing it from five separate objects is how a header ends up quoting
        one list and a subtitle another.


        **The denominator is what the sprint held at its END, not what it
        committed to.** `completedCount` of `atEndCount` — completed plus carried
        over — are two cuts of one population, so the numerator is a subset of
        its own denominator. Against the commitment it is not: work added after
        the start can be completed, so a sprint that took late work on and
        finished it could report "completed 25 of 23". The commitment keeps its
        own list beside the outcome, and `addedAfterStartCount` is the clause
        that turns "we missed the plan" into "the plan changed".


        The nullable point sums follow `SprintReviewList.points` exactly: `null`
        means "nothing here was estimated", never zero.
      properties:
        committedCount:
          type: integer
          example: 23
          description: >-
            Issues in the sprint when it started — the plan, shown beside the
            outcome rather than used as its denominator.
        committedPoints:
          type: number
          nullable: true
          example: 60
          description: What they weighed on entry (the ledger's snapshot), or `null` when none of them was estimated.
        atEndCount:
          type: integer
          example: 25
          description: 'Everything the sprint held when it stopped: completed plus carried over. **The denominator.**'
        atEndPoints: { type: number, nullable: true, example: 60, description: 'And what that weighed, or `null` when nothing in it was estimated' }
        completedCount: { type: integer, example: 18, description: How much of `atEndCount` was closed by then }
        completedPoints: { type: number, nullable: true, example: 41, description: 'And what that weighed, or `null` when none of it was estimated' }
        addedAfterStartCount:
          type: integer
          example: 5
          description: >-
            Issues that joined after the commitment — the disclosure of how far
            the sprint drifted from its plan.

    SprintReviewResponse:
      type: object
      description: >-
        `GET …/reports/sprint-review`. Five labelled lists plus one header line's
        worth of totals. **Not a chart.**


        For a COMPLETED sprint this is a permanent, exact record: the ledger is
        append-only and id-keyed, so it survives renames and re-estimates, and it
        survives the deletion of the issues themselves — those arrive as rows with
        `deleted: true` rather than vanishing.
      properties:
        sprint:
          allOf:
            - $ref: '#/components/schemas/SprintRef'
          nullable: true
          description: >-
            The subject, or `null` when the project has no ACTIVE sprint and the
            caller named none (a `200` with five empty lists — same rule as
            `SprintBurnupResponse.sprint`).
        startAt: { type: string, format: date-time, nullable: true, description: 'When the sprint started; `null` if it never did' }
        endAt:
          type: string
          format: date-time
          nullable: true
          description: The **planned** end. Informational — it bounds nothing in this record.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When it was actually completed, `null` while it is still running.
            **This is the boundary every list below is measured against** (the
            instant of the request for a running sprint).
        committed:
          allOf:
            - $ref: '#/components/schemas/SprintReviewList'
          description: >-
            What was in the sprint when it started — the commitment batch the
            start wrote, one `ADDED` per member dated exactly `startAt`.
        addedAfterStart:
          allOf:
            - $ref: '#/components/schemas/SprintReviewList'
          description: >-
            What joined afterwards. The number that makes a missed sprint
            legible. Together with `committed` it covers everything the sprint
            ever held, and the two are disjoint.
        removedBeforeEnd:
          allOf:
            - $ref: '#/components/schemas/SprintReviewList'
          description: >-
            What was pulled out while the sprint was running. **Distinct from
            `carriedOver`**: this is work someone took *off* the sprint, not work
            the sprint ran out of time for. The two are told apart without a
            timestamp comparison — a completion stamps `completedAt` before it
            writes the ledger rows for the issues it moves out, so at that instant
            those issues are still members.
        completed:
          allOf:
            - $ref: '#/components/schemas/SprintReviewList'
          description: >-
            What was in the sprint at its end and closed by then. **Identical in
            membership to the last point of the burn-up's completed line**, on
            purpose: two reports over one ledger that disagreed about what "done
            in this sprint" means would discredit both.
        carriedOver:
          allOf:
            - $ref: '#/components/schemas/SprintReviewList'
          description: >-
            What was in the sprint at its end and not closed — for a completed
            sprint, exactly what the completion moved to the backlog or to the
            next sprint; for a running one, what is still open right now.


            **A deleted issue out of a COMPLETED sprint always lands here, with a
            null `closedAt`.** Completion lives on the issue, the issue is gone,
            and removing an issue from a frozen sprint writes no ledger row — so
            the record cannot prove it was finished. It is neither dropped (which
            would shrink what the sprint committed to) nor claimed as completed
            (which a report may not do for something it cannot show).
        totals: { $ref: '#/components/schemas/SprintReviewTotals' }
        meta:
          allOf:
            - $ref: '#/components/schemas/ReportMeta'
          description: >-
            Provenance. `basedOnIssues` is every distinct issue that has ever been
            in this sprint, counted in the database **above** the row cap, so it is
            deliberately larger than what came back when `truncated` bites. And
            `unmatchedFilters` is always empty, because this endpoint takes no
            filters. `firstIssueAt` is the family's: the **project's** earliest
            issue, never scoped to the sprint.

    VelocitySprint:
      type: object
      description: >-
        One completed sprint's output — one bar of the velocity chart. Four
        numbers, **all in the requested `measure`**: what the sprint committed to,
        what it delivered, what arrived after the start, and what carried over.


        They are the sprint review's headline figures for a sprint nobody has to
        open, which is what lets velocity be a forecast input rather than a
        scoreboard: a bar reading 18 beside a commitment marker reading 21 and a
        note that four issues arrived late is a *description of what happened*,
        not a score.


        **The four share one measure deliberately.** Under `POINTS` all four are
        point sums; under `COUNT` all four are issue counts. A tooltip mixing "41
        points delivered" with "4 issues added" would carry two units with no way
        for a reader to tell which is which.


        **Nothing here is keyed by a person, and nothing here may become so** — no
        assignee, no actor, no owner, not as a field, a nested breakdown, a
        tooltip extra or a later CSV column.
      properties:
        sprintId:
          type: string
          format: uuid
          description: >-
            The sprint, so a client can link to its **sprint review** —
            the report that shows the issues behind these four numbers, and the
            only per-issue breakdown velocity offers.
        name: { type: string, example: Sprint 7, description: The bar's label. }
        startAt:
          type: string
          format: date-time
          nullable: true
          description: When it started — the instant `committed` is measured at.
        completedAt:
          type: string
          format: date-time
          description: >-
            When it was completed. **Never null**: only COMPLETED sprints are
            sampled. This is the instant every other number here is measured at,
            and what orders the bars.
        committed:
          type: number
          example: 21
          description: >-
            What was in the sprint at `startAt` — the commitment batch its start
            wrote. Marked **on** the bar rather than drawn as a second bar: it is
            the plan, and the plan is context for the outcome, not a competing
            outcome.
        completed:
          type: number
          example: 18
          description: >-
            What was still in the sprint at `completedAt` and closed by then.
            **The bar's height, and the only number the forecast band is computed
            from.**
        addedAfterStart:
          type: number
          example: 4
          description: >-
            Everything that entered after `startAt`. The clause that turns "we
            missed the plan" into "the plan changed" — without it a bar below its
            own commitment marker reads as a failure whatever actually happened.
            With `committed` it partitions everything the sprint ever held.
        carriedOver:
          type: number
          example: 3
          description: >-
            What was still in the sprint at `completedAt` and not closed. With
            `completed` it partitions what the sprint **held at its end** — which
            is the denominator the sprint review's headline uses, never
            `committed`, since that counts a different population.
        unestimatedCount:
          type: integer
          example: 2
          description: >-
            How many of the issues the sprint **held at its end** (i.e. the
            `completed` + `carriedOver` population) carried no estimate.


            **Reported under BOTH measures, and this is the field that keeps the
            chart honest.** Under `POINTS` an unestimated issue contributes `0` to
            the bar, so a sprint where nine of twenty-three issues were never
            estimated is a silent zero nine times over — the bar **and the band
            derived from it** are quietly biased low, with nothing in the response
            to notice. Under `COUNT` it is the same disclosure a reader needs
            before flipping the toggle.

    VelocityForecast:
      type: object
      description: >-
        The band — *"plan for ~18 (p50) and treat 23 (p85) as a stretch. Based on
        6 sprints."* This object **is** the refusal the report is built around: a
        p50/p85 pair that always arrives with its own sample size has no single
        value to quote, is explicitly a range, and says how little it rests on.


        **Percentiles, never a rolling average and never a mean.** A mean lets one
        washed-out sprint drag the forecast somewhere no sprint ever was, and a
        forecast naming an outcome the team has never had is exactly the "these
        numbers don't match what I expected" failure the `meta` convention exists
        to prevent.


        **Always present, even when suppressed** — read `forecast.p50 === null`
        and never test the parent for existence. Suppression is a fact about the
        data, not a change of response shape.


        **There are TWO reasons the percentiles are null, and a client that
        assumes only the first will explain the second wrongly to its user:**

        * **fewer than three completed sprints** — "not enough history yet", which
          time fixes; or
        * **`meta.truncated` is true** — the row cap bit, so the surviving bars
          are no longer the sample anybody asked for, and a p85 over a subset the
          reader did not choose is exactly the number this report may not stand
          behind. Time does not fix this one; it is a bound being hit.

        `meta.truncated` is what tells the two apart, and `sampleSize` is stated
        in both cases.
      properties:
        p50:
          type: number
          format: double
          nullable: true
          example: 18
          description: >-
            The **median of the sampled sprints' `completed` values**, in the
            requested measure — *plan for about this* — or `null` when suppressed.


            Interpolated with PostgreSQL's `percentile_cont` definition, the same
            one `/cycle-time` uses, so a "p85" means one thing across this
            product. One consequence to render for: **the band is fractional even
            under `COUNT`**, where every bar is a whole number — a six-sprint
            sample can legitimately answer `p50: 18.5`. It is a `double` where the
            bars are exact decimals, and the difference is meant: a bar is an exact
            sum of things that happened, a percentile is an interpolated estimate
            of something that has not.
        p85:
          type: number
          format: double
          nullable: true
          example: 23
          description: >-
            The 85th percentile — *a stretch, not a target* — on the same terms.
            85 rather than 90 or 95 because it is the number the flow-metrics
            literature uses for a "most work finishes within" statement, and at
            six-to-twelve samples a p95 is one sprint wide.
        sampleSize:
          type: integer
          example: 6
          description: >-
            How many completed sprints these numbers came from. **Always stated,
            including when the band is suppressed** — it is the sentence's last
            clause, and a band whose sample size a reader has to go and count is
            the scoreboard this object exists not to be.


            It is the number of bars actually returned, so it can be **smaller
            than `sprints`** for the ordinary reason — the project has not
            completed that many — and, when `meta.truncated` is true, because
            every sprint whose ledger rows fell past the cap was dropped, which can
            be most of them. See `VelocityReportResponse.sprints`.


            It is stated whenever the band is suppressed, under **both** causes:
            below **3** completed sprints, and on a truncated read whatever the
            count.

    VelocityReportResponse:
      type: object
      description: >-
        `GET …/reports/velocity`. The last N completed sprints as bars, and beside
        them the band to plan the next one with.


        What this response **cannot** say is as much a part of it as what it does:
        nothing is keyed by a person, nothing aggregates above the project, and
        there is no single headline number. See the endpoint description for why
        each is a decision rather than a gap.
      properties:
        measure:
          allOf:
            - $ref: '#/components/schemas/ReportMeasure'
          description: >-
            What the numbers count — `COUNT` by default, the measure every project
            has. Echoed so a cached or shared response always says what it is
            measuring.
        sprints:
          type: array
          description: >-
            The sampled sprints in **chronological order, oldest first**, so a
            client renders them left to right in time without sorting. **Empty for
            a project that has never completed a sprint** — a `200` with an empty
            list and a suppressed band, never a `404` and never an error.


            **When `meta.truncated` is true this list can be substantially
            shorter than the sprints you asked for**, and a client must read it as
            "some bars are missing" rather than as a quiet quarter. Once the cap
            has bitten, every sampled sprint with no shipped ledger rows is
            dropped — not merely the one cut in half.


            The reason it is whole sprints rather than a shaved tail: the sweep
            reads the ledgers ordered by sprint id, and those ids are **UUID v7**,
            i.e. time-ordered — so a cap that bites removes the later-created
            sampled sprints' rows *entirely*. An absent sprint is then
            indistinguishable from the legitimate "nobody ever put anything in
            this sprint", and read as the latter it would be drawn as a bar of four
            zeros **and those zeros would enter the forecast as real samples**,
            dragging the band toward zero. A truncated report would understate the
            team's output with nothing but `meta.truncated` to hint at it. So the
            conservative reading wins: a sprint that really was empty vanishes from
            a truncated report, which is the cheaper error.


            The bars that do ship are each complete, so they are facts and they
            render — but the forecast is suppressed (see `VelocityForecast`),
            `meta.truncated` says the cap bit, and `meta.basedOnIssues` (counted
            above the cap) still states how many issues the report was about, so a
            reader can see how much is missing. Unreachable on real data — twelve
            sprints of hundreds of events against a cap of 20 000 — and handled
            anyway.
          items: { $ref: '#/components/schemas/VelocitySprint' }
        forecast: { $ref: '#/components/schemas/VelocityForecast' }
        meta:
          allOf:
            - $ref: '#/components/schemas/ReportMeta'
          description: >-
            Provenance. `basedOnIssues` is the distinct issues the sampled
            sprints' ledgers hold, counted in the database **above** the row cap
            and counted **once** for an issue that appeared in two of the sampled
            sprints. `firstIssueAt` is the family's — the **project's** earliest
            issue, never the sample's — and `unmatchedFilters` is always empty,
            because this endpoint takes no filters.

    NotificationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspaceId:
          type: string
          format: uuid
          description: >-
            The workspace this notification came from. Always present: every
            notification belongs to exactly one workspace, and you only receive
            one while you are a member of it. Read the tenant from here rather
            than parsing it out of `link` — that string's shape is a rendering
            detail of whichever producer raised the notification, and a producer
            whose link is shaped differently, or absent, would silently yield
            "no workspace" to a parsing client.
        type:
          type: string
          example: MENTIONED
          description: >-
            What kind of event raised this notification. Values are added as
            producers are added, so a client must tolerate one it does not
            recognise — render `title`/`body` and follow `link`.
            `MENTIONED` (someone `@`-mentioned you in an issue comment) is
            one such value.
        title: { type: string, example: Jane Doe mentioned you }
        body:
          type: string
          nullable: true
          description: >-
            A denormalised excerpt of the source content, captured at delivery
            time — for `MENTIONED`, the first 120 characters of the comment.
            It is a copy, not a live view: editing the source does not rewrite
            it.
          example: Can you take a look at the rate limiter before Friday?
        link: { type: string, nullable: true, example: /w/…/p/…?issue=18 }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
