# Cloud-specific overrides
app.storage.type=${STORAGE_TYPE:s3}

# Structured (JSON) logs to stdout for the observability pipeline (Alloy -> Loki).
# Profile-gated: only cloud/dc emit JSON; local/default keep the readable console.
# Boot 4 native structured logging (logstash schema) — no extra dependency.
logging.structured.format.console=logstash
logging.structured.json.add.application=hamstrack
logging.structured.json.add.deployment=cloud

# First-login onboarding is a Cloud feature (choose to create or join a team)
app.onboarding.enabled=${ONBOARDING_ENABLED:true}

# Workspace storage quota (HD-191). Same mechanism, same table, same trigger and the same
# 409 as dc — only the NUMBER differs, and it differs by property rather than by branch,
# exactly as app.storage.type is profile-defaulted above.
#
# 10GB against the base default of 100GB because what the ceiling protects is different
# here: signup is public, the backend is S3 where every byte stored AND every request made
# is billed, and a workspace is the unit a stranger gets for the price of one disposable
# mailbox. On dc the operator owns the disk and there are no strangers, so the number is a
# safety net rather than a bill.
#
# PROVISIONAL (OQ-D1): there is no billing model, no tier and no measured distribution
# behind it. hamstrack.storage.quota_fill_max will say within a week whether it is wrong,
# and it is one env var.
app.storage.quota.workspace-bytes=${STORAGE_QUOTA_WORKSPACE_BYTES:10GB}
