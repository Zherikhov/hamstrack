# DC (self-hosted) overrides
app.storage.type=${STORAGE_TYPE:local}

# Structured (JSON) logs to stdout for the observability pipeline (Alloy -> Loki).
# Profile-gated: only cloud/dc emit JSON; local/default keep the readable console.
# Boot 4 native structured logging (logstash schema) — no extra dependency.
logging.structured.format.console=logstash
logging.structured.json.add.application=hamstrack
logging.structured.json.add.deployment=dc

# Self-registration is closed on DC: only the system admin creates accounts
# (Admin console → Users → generate a setup link). The initial admin comes
# from SEED_ADMIN_EMAIL/SEED_ADMIN_PASSWORD. Operators may re-open it.
app.registration.public-signup-enabled=${PUBLIC_SIGNUP_ENABLED:false}

# CSP report sink (HD-264). OFF on dc, and that is a complete answer rather than a gap: the
# report-only header still ships (app.csp.report-only-enabled defaults true in both modes),
# so a self-hoster's evidence is their own browser console — an adequate instrument for a
# single-instance install, and the thing they would read anyway. Two reasons the default is
# off: an unauthenticated public endpoint should not arrive with an upgrade nobody asked
# for, and the per-IP budget needs a real client IP, which behind a proxy means turning on
# RATE_LIMIT_TRUST_FORWARDED_FOR at the same time (docs/self-hosting.md pairs them).
app.csp.sink-enabled=${CSP_REPORT_SINK_ENABLED:false}
