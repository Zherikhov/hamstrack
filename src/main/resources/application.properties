spring.application.name=hamstrack
# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Batch every lazy @ManyToOne left after our fetch joins into a single IN(...)
# load instead of one SELECT per row — collapses list-endpoint N+1 fan-out
# (board/backlog, members, comments) without needing a fetch join everywhere.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Connection pool. With open-in-view=false, a connection is held only for the
# duration of a transaction, so the pool can stay small; tune per instance for
# scale (bounded by Postgres max_connections across all app replicas).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
# KEEP THIRD-PARTY PII OUT OF THE LOGS, AND THE PLACE TO DO IT IS THE DRIVER, NOT THE HANDLERS.
# PgJDBC folds PostgreSQL's DETAIL line into the exception MESSAGE, and Hibernate's
# SqlExceptionHelper logs that message at ERROR before any application catch block runs — so no
# amount of care in a service can keep it out. On a 23505 the DETAIL spells the colliding key
# VALUES: `Key (workspace_id, lower(email))=(<uuid>, victim@example.com) already exists` on the
# invite path (HD-133), where the address belongs to a third party who is not even the caller.
# This project's own rule for mail logging is DOMAIN ONLY, never the local part, and the log
# shipper has no way to redact what the driver already concatenated.
# WHAT IT DOES NOT BREAK, all verified against PostgreSQL rather than assumed: it masks only the
# MESSAGE. getServerErrorMessage() still carries detail, the constraint NAME stays in the primary
# message (so Hibernate's dialect still extracts it and the 409 translations still fire), and a
# foreign-key violation still says which direction it went — "update or delete on table X" versus
# "insert or update on table X" — because that half is the primary message, not the DETAIL.
#
# WHAT IT DOES COST, because the paragraph above lists only what survives, and the loss is wider
# than the invite path that motivated it. getNonSensitiveErrorMessage() drops DETAIL, HINT,
# POSITION, WHERE and INTERNAL QUERY from EVERY server error raised on this pool. Named rather
# than characterised, worst first: FLYWAY SHARES THIS DATASOURCE (there is no separate
# spring.flyway.url), so a failed migration now reports no POSITION on a syntax error and no
# DETAIL on a data-dependent one — a failing CREATE UNIQUE INDEX names the index and not the
# rows that collided. (Two locales are in play and they are NOT the same lever. The LABEL
# "Detail:" is rendered by the DRIVER from the app JVM's locale — Dockerfile pins
# -Duser.language=en, so it is English in every deployment made from the image, and only a
# locally run JVM sees anything else. The DETAIL TEXT is the server's and follows lc_messages.
# An earlier revision of this comment blamed the server for the label, from a measurement that
# showed a Russian label around an English body — which is precisely what a Russian JVM against
# an English server produces, and what a Russian server cannot. The identifier PostgreSQL quotes
# is verbatim in every locale, which is why the constraint-name path survives the mask and the
# key values do not.) That is the one
# path where the error is read by a human at 2am during a
# deploy, which is why the variable below exists and why docs/self-hosting.md's troubleshooting
# table carries a row for it. Also lost: PL/pgSQL context from the updated_at triggers, 23502's
# `Failing row contains (...)`, and the colliding key on every 23505 — including the ones that
# carry no PII at all, such as issues_project_id_number_key, where the issue number was a useful
# breadcrumb.
#
# THE HATCH IS A VARIABLE AND NOT A URL PARAMETER. `?logServerErrorDetail=true` on the JDBC URL
# does win at the driver (pgjdbc's parseURL ranks URL parameters above data-source-properties),
# but that route is unreachable on a real deployment: docker-compose.prod.yml sets DB_URL as a
# compose `environment:` literal precisely so .env cannot override it, and that file is in
# ops/deploy/synced-paths.txt — replaced wholesale by apply-config.sh and by git pull. An
# operator who edited it would lose the edit on the next deploy without being told, which is the
# silent-revert trap HD-122 fixed once already. So the supported hatch is the variable below,
# set in .env for one debugging session and removed afterwards. And it has to be threaded
# through ${...} like this rather than left to relaxed binding: pgjdbc matches
# logServerErrorDetail case-sensitively, while binding a bare environment variable to a
# data-source property lowercases the key, so the plain spelling would be accepted and ignored.
#
# The FLOOR stays false, identically in dc and cloud, because it is a privacy default and not a
# tuning knob — and the asymmetry runs the other way for a self-hoster: the address we would
# leak is a third party's, the one they would leak is their own user's, in their own logs,
# together with their own lost diagnostic. Same code, same default, one documented variable.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=${DB_LOG_SERVER_ERROR_DETAIL:false}
# How long a transaction may wait for a row lock. Applied by the transaction manager
# to EVERY transaction the app opens (HD-151), and re-asserted explicitly by
# LockTimeout on the paths that lock deliberately — NOT as a Hikari
# connection-init-sql, because Flyway shares this datasource and a migration
# legitimately waits for a lock that a member removal must not. It is issued in the
# same round trip as the statement bound below and cannot be separated from it:
# statement_timeout counts lock-wait time, so without this every contended ordinary
# write would be cancelled by that bound and answered a 422 that forbids the retry
# which would have worked. Exceeding it is a 409 + Retry-After, never a 500. Valid
# range 100–60000 — PostgreSQL reads 0 as "disabled", so an out-of-range value fails
# startup instead of silently restoring the unbounded wait this exists to delete.
app.locking.lock-timeout-ms=${DB_LOCK_TIMEOUT_MS:3000}
# How long ANY ONE STATEMENT of an application transaction may run before PostgreSQL
# cancels it. Applied with SET LOCAL by the transaction manager to every transaction
# the app opens, in one round trip with the lock bound above — deliberately not per
# call site: a lock wait is structural and can be found by reading the code, a slow
# statement is volumetric and cannot. NOT a Hikari
# connection-init-sql, because Flyway shares this datasource and a migration (an index
# build, a table rewrite) legitimately runs for minutes; the transaction manager is the
# line between app work and Flyway's, so migrations are unbounded by construction.
# Exceeding it is a 422 with errorType STATEMENT_BUDGET_EXCEEDED and NO Retry-After —
# an identical retry costs identical time. What it does NOT bound is how long a
# connection is held: this is per statement, not per transaction.
# Must be >= 2x DB_LOCK_TIMEOUT_MS or startup fails: statement_timeout counts lock-wait
# time too, so a smaller value would fire first and silently replace the retryable 409
# lock contract with a 422. Valid range 1000-600000 — PostgreSQL reads 0 as "no bound",
# the exact state this exists to delete, so an out-of-range value fails startup instead.
# Identical in dc and cloud, no profile override: the env var IS the per-deployment knob.
app.persistence.statement-timeout-ms=${DB_STATEMENT_TIMEOUT_MS:10000}
# Render framework exceptions (ResponseStatusException etc.) as RFC 7807
# ProblemDetail JSON so their reason reaches the client's `detail` field
spring.mvc.problemdetails.enabled=true
# Logging levels (env-overridable). Structured JSON output for the observability
# pipeline is profile-gated in application-{cloud,dc}.properties — local/default
# keep the readable colored console.
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.hamstrack=${LOG_LEVEL_APP:INFO}
# Flyway
spring.flyway.enabled=true
# Observability — Actuator + Micrometer Prometheus on a SEPARATE internal
# management port. Identical instrumentation for dc and cloud; the only per-mode
# difference is the `deployment` tag value (reuses SPRING_PROFILES_ACTIVE).
# NOTE: MANAGEMENT_PORT (9090) is internal-only — it must NEVER get a compose
# `ports:` mapping. Only in-network Prometheus reaches it; Caddy never proxies it.
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,prometheus,info}
management.prometheus.metrics.export.enabled=${METRICS_EXPORT_ENABLED:true}
management.metrics.tags.application=hamstrack
management.metrics.tags.deployment=${SPRING_PROFILES_ACTIVE:cloud}
management.metrics.distribution.percentiles-histogram[http.server.requests]=true
management.metrics.distribution.slo[http.server.requests]=50ms,100ms,200ms,500ms,1s
# show-details= never: don't leak DB/disk/component internals on the health
# endpoint (defence-in-depth — the mgmt port is internal, but this decouples
# "is the port private" from "is health safe"). Prometheus carries the detail.
management.endpoint.health.show-details=never
management.info.env.enabled=false
# Don't let SMTP reachability drive the app's health: the mail health indicator
# opens an SMTP connection on every check and flaps /actuator/health to DOWN (503)
# whenever the mail server is unreachable (e.g., CI with no MailHog). Email is
# async/best-effort and already covered by the email metric + EmailFailures alert.
management.health.mail.enabled=false

# JWT
jwt.secret=${JWT_SECRET}
# Short access-token TTL: a leaked bearer (SSE query-param, proxy log, browser
# history) is replayable only briefly. The 30-day rotating refresh cookie renews
# it transparently, so a short access token costs nothing in UX.
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_TTL:PT30M}
jwt.refresh-token-expiration=P30D
# Mail (MailHog for local dev)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# SMTP timeouts (ms). A black-holed mail host must fail a worker in <=10s rather
# than hang indefinitely; generous enough for MailHog/real SMTP under normal load.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECT_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}
# Bounded mail executor (mailExecutor) — mail can't starve other async work or spawn
# a thread-per-task under an SMTP stall. A FULL QUEUE DROPS AND DEAD-LETTERS; it does
# NOT run the send on the request thread (HD-208 removed CallerRunsPolicy — no Tomcat
# worker ever performs SMTP, and forgot-password stops having a timing oracle).
app.mail.async.core-pool-size=${MAIL_ASYNC_CORE_POOL:2}
app.mail.async.max-pool-size=${MAIL_ASYNC_MAX_POOL:5}
app.mail.async.queue-capacity=${MAIL_ASYNC_QUEUE_CAPACITY:100}
# READ THESE TWO TOGETHER (HD-207). Shutdown waits the drain for in-flight sends, THEN
# writes whatever is still queued to failed_email as one batch — so nothing is lost
# silently and raising the queue capacity alone is safe (it costs at most more
# dead-letter rows on a deploy). What must hold is that BOTH steps fit inside the
# container's stop grace: drain + residue write <= stop_grace_period (30s in
# docker-compose.prod.yml). MailAsyncProperties.Async asserts that at startup and the
# boot fails if the pair breaks it. Docker's OWN default grace is 10s — shorter than
# this drain — which is why every compose file here states the grace explicitly.
app.mail.async.shutdown-drain-seconds=${MAIL_ASYNC_SHUTDOWN_DRAIN_SECONDS:15}
# THE SAME VARIABLE the compose files read for `stop_grace_period` — that is the whole
# point of it being a variable. The app has to KNOW its grace to assert the line above,
# and while it was a constant in Java, (a) lowering the compose value left the app
# certifying a budget it no longer had, and (b) an operator who wanted a longer drain was
# refused at boot with no edit available to them short of rebuilding the image.
app.mail.async.stop-grace-seconds=${APP_STOP_GRACE_SECONDS:30}
# CRITICAL mail (verification + reset) retries with backoff, then dead-letters to
# failed_email on final failure. Invite mail stays best-effort (no retry).
# What keeps failed_email bounded. Nothing had to before: a row cost one exhausted retry
# cycle, so the pool was the throttle. A never-attempted row (HD-207/HD-208) costs one
# refused dispatch, so the write rate is now the request rate. Retention bounds the table
# in time, the per-hour cap bounds it in rate, and it takes both — retention alone deletes
# the flood three months later, which is three months too late for the disk.
app.mail.dead-letter.retention-days=${MAIL_FAILED_EMAIL_RETENTION_DAYS:90}
app.mail.dead-letter.max-never-attempted-per-hour=${MAIL_NEVER_ATTEMPTED_MAX_PER_HOUR:500}
app.mail.critical.max-attempts=${MAIL_CRITICAL_MAX_ATTEMPTS:3}
app.mail.critical.retry-backoff-ms=${MAIL_CRITICAL_RETRY_BACKOFF_MS:2000}
# App
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail-from=${MAIL_FROM:noreply@example.com}
# Default (Cloud) allows public self-registration; the dc profile flips the
# default to false. Env var overrides either.
app.registration.public-signup-enabled=${PUBLIC_SIGNUP_ENABLED:true}
# Legal / compliance: DC operators may disable the public landing page and the
# terms-acceptance requirement at registration
app.legal.public-landing-enabled=${PUBLIC_LANDING_ENABLED:true}
app.legal.terms-acceptance-required=${TERMS_ACCEPTANCE_REQUIRED:true}
# Privacy contact: the address the Account page tells a user to write to when they
# want their account deleted (HD-193, docs/design/account-deletion-proposal.md).
# Served on the UNAUTHENTICATED GET /api/meta, so an operator who sets it PUBLISHES
# it to anyone who can reach this instance. That is theirs to decide, which is why
# the default is empty rather than a placeholder address.
# Empty means "not configured", never "there is no way to ask": the Account page
# still renders the deletion section and points at the installation's administrator.
# Identical in dc and cloud, and deliberately not profile-defaulted: it is one
# address per install either way, and baking the Cloud one in as the cloud-profile
# default would make every self-hoster running that profile (which
# docker-compose.prod.yml selects by default) publish OUR address as their own.
# Validated at binding time (AppProperties is @Validated): a plain address of at most
# 255 characters, or empty. A value carrying a mailto: separator (? & # % , ; < >,
# whitespace, quote, backslash) aborts startup, because the SPA pastes this into a
# mailto: where those introduce extra headers rather than addressing the mailbox.
app.privacy.contact-email=${PRIVACY_CONTACT_EMAIL:}
# First-login onboarding (create-or-join-a-team screen). Off by default; the
# cloud profile turns it on. DC creates accounts via the admin console instead.
app.onboarding.enabled=${ONBOARDING_ENABLED:false}
# File storage (attachments): local (host filesystem) | s3.
# Profiles override the type: dc -> local, cloud -> s3.
app.storage.type=${STORAGE_TYPE:local}
app.storage.local.base-dir=${STORAGE_LOCAL_DIR:./data/attachments}
app.storage.s3.bucket=${STORAGE_S3_BUCKET:}
app.storage.s3.region=${STORAGE_S3_REGION:}
# endpoint + path-style-access only for S3-compatible stores (MinIO etc.); leave empty for AWS
app.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
app.storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE:false}
# Empty -> AWS SDK default credentials chain (env vars, ~/.aws, instance/task role)
app.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
# S3 timeouts (ms). Bound a hung S3 to <=api-call-ms total; read-ms is the ceiling
# per socket read (a 25MB attachment streams through one socket, not one read).
# Only take effect when app.storage.type=s3; local FS ignores them.
app.storage.s3.timeouts.connect-ms=${STORAGE_S3_CONNECT_TIMEOUT_MS:3000}
app.storage.s3.timeouts.read-ms=${STORAGE_S3_READ_TIMEOUT_MS:20000}
app.storage.s3.timeouts.api-call-ms=${STORAGE_S3_API_CALL_TIMEOUT_MS:30000}
app.storage.s3.timeouts.api-call-attempt-ms=${STORAGE_S3_API_CALL_ATTEMPT_TIMEOUT_MS:10000}
# Upload limits. Two layers:
#  - the servlet multipart cap is the HARD ceiling (DoS guard, rejects at parse
#    time); it must stay >= the app-level business limit below.
#  - app.attachments.* is the business policy (per-file size + file-type
#    allow-list) enforced in AttachmentService. Kept at the app layer so a future
#    global-admin runtime setting can tune it without a redeploy.
spring.servlet.multipart.max-file-size=${ATTACHMENT_MAX_UPLOAD_SIZE:25MB}
spring.servlet.multipart.max-request-size=${ATTACHMENT_MAX_UPLOAD_SIZE:25MB}
app.attachments.max-file-size=${ATTACHMENT_MAX_FILE_SIZE:20MB}
app.attachments.allowed-extensions=${ATTACHMENT_ALLOWED_EXTENSIONS:png,jpg,jpeg,gif,webp,bmp,svg,pdf,txt,csv,log,md,json,doc,docx,xls,xlsx,ppt,pptx,zip}
# Demo data: seed a demo workspace/project/issues for each user on first login
app.demo.seed-on-first-login=${DEMO_SEED_ON_FIRST_LOGIN:true}
# THE master switch for every limiter that HAS an off switch. It is not the auth one the
# app.rate-limit.* lines below tune; it is all of these, and the list is deliberately not
# introduced by a count, because a count goes stale one entry before the list does:
#   1. auth abuse protection — per-IP budget on sensitive auth endpoints + per-account
#      exponential backoff on failed logins (the properties immediately below);
#   2. the per-principal reports budget (app.reports.requests-per-minute), which also
#      covers the Insights panel — a report that lives on the search path;
#   3. the per-principal search budget (app.search.requests-per-minute), which also
#      covers saved filters — creating/editing one validates its HQL;
#   4. the invitation ceilings (app.invites.*) — per-sender volume (hour + day),
#      per-recipient cooldown and the global per-recipient daily cap;
#   5. the auth-mail ceilings (app.auth-mail.*) — per-recipient cooldown and per-window
#      cap on forgot-password, resend-verification and register mail. Same mechanism and
#      same table as 4. A limiter here can refuse invisibly, which none of the others can:
#      forgot-password and resend-verification answer one sentence to everybody, so a
#      throttled request there is DROPPED rather than refused, and only the refusal METERS
#      say so. Register spends the same budget and does answer 429, because it already
#      discloses address existence through its own 409.
# There is no per-family off switch and no "unlimited" value on any of them (0 fails
# startup), so this line is the only way to turn any of these off — and it turns off
# every one. It does NOT reach the backlog-rebalance cooldown in IssueRankService, a fixed
# internal safety valve with no environment variable and no switch (docs/api-dc.md); a
# limiter that protects the database from a rewrite storm is not something an operator
# asks to remove. Most limiters are in-memory (budgets per node, not per cluster); the
# RECIPIENT-keyed ceilings — 4 and 5 — are the exception: their state is in PostgreSQL,
# so they are cluster-wide and exact, and N replicas allow the configured number rather
# than N times it. See app.invites.* and app.auth-mail.* below.
# Turning limiting off does NOT stop mail_send_events being written or swept: the rows
# are the operator's forensic trail, and a table that only grows while a switch is off
# would be a worse trade than one insert on a low-frequency write.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth-ip-requests-per-minute=${RATE_LIMIT_AUTH_IP_PER_MINUTE:15}
app.rate-limit.login-failure-threshold=${RATE_LIMIT_LOGIN_FAILURE_THRESHOLD:5}
app.rate-limit.login-backoff-base-seconds=${RATE_LIMIT_LOGIN_BACKOFF_BASE_SECONDS:30}
app.rate-limit.login-backoff-max-seconds=${RATE_LIMIT_LOGIN_BACKOFF_MAX_SECONDS:900}
# Trust the rightmost X-Forwarded-For entry for per-IP keying. Default false
# (DC-safe): enable ONLY behind a trusted proxy that strips client-supplied XFF
# (prod Caddy does). With a directly-reachable app port, leaving this false
# prevents clients spoofing XFF to bypass the per-IP auth limit.
app.rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
# Board issue-list cap: GET .../issues with NO size param returns the board's
# cards. Capped server-side (not client-overridable) to bound OOM/latency on large
# projects; the response reports truncation so the SPA can nudge to filters/backlog.
app.board.max-issues=${BOARD_MAX_ISSUES:500}
# Classification caps (labels, components, version links). DoS guards,
# NOT mode switches — identical defaults in dc and cloud, no profile override.
# Exceeding a cap is a 422 business-rule rejection, not a silent truncation. All are
# validated (@Min/@Max): an out-of-range value fails startup instead of silently
# bricking label attachment or being clamped behind the operator's back.
app.classification.max-labels-per-issue=${MAX_LABELS_PER_ISSUE:20}
# Size of a workspace's label catalog. Any member may create labels (self-serve
# tagging), so this bounds the catalog every picker, /schema and HQL name
# resolution has to load.
app.classification.max-labels-per-workspace=${MAX_LABELS_PER_WORKSPACE:1000}
# Size of a project's component catalog. Creation is curator-gated, which is not a
# volume barrier — any user can create their own workspace and is OWNER (hence
# curator) of every project in it. HQL name resolution loads every visible project's
# whole component catalog on each /search, /search/schema and /search/suggest, so on
# shared Cloud infrastructure an unbounded catalog is a cost other tenants pay.
app.classification.max-components-per-project=${MAX_COMPONENTS_PER_PROJECT:500}
# Versions linked to ONE issue, enforced PER LINK TYPE: up to this many fix versions
# AND up to this many affects versions. Independent budgets — "ships in 2.4.0 and
# 2.3.1" and "affects three releases" are unrelated statements about one issue.
app.classification.max-version-links-per-issue=${MAX_VERSION_LINKS_PER_ISSUE:20}
# Size of a project's version catalog. Same threat model as components: creation is
# curator-gated, which is not a volume barrier (any user owns their own workspace),
# and HQL name resolution loads every visible project's version names on each /search,
# /search/schema and /search/suggest. GET .../versions has no page size either, so an
# unbounded catalog is one GET that costs hundreds of round-trips. Archived and
# released versions count toward the cap — they keep their unique name slot.
app.classification.max-versions-per-project=${MAX_VERSIONS_PER_PROJECT:500}
# Agile caps and defaults (sprints, backlog ranking — HD-22). Same posture as the
# classification caps: DoS guards and defaults, NOT mode switches — identical values in
# dc and cloud, no profile override, no feature flag. All are validated (@Min/@Max): an
# out-of-range value fails startup instead of being clamped behind the operator's back.
#
# Issues rendered per section in GET .../backlog. A planning view is
# (max-open-sprints + 1) sections wide, so these two together bound the response
# (6300 rows at the defaults). A truncated section still reports honest whole-section
# totals plus truncated/totalAvailable, so nothing is silently hidden.
app.agile.section-max-issues=${AGILE_SECTION_MAX_ISSUES:300}
# FUTURE + ACTIVE sprints per project (COMPLETED ones are history and cannot be started,
# so they don't count). 422 on POST /sprints when full.
app.agile.max-open-sprints-per-project=${AGILE_MAX_OPEN_SPRINTS:20}
# Default iteration length: the endAt a sprint start assumes when the caller sends none.
app.agile.default-sprint-length-days=${AGILE_DEFAULT_SPRINT_LENGTH_DAYS:14}
# Issue ids accepted by one POST .../sprints/{id}/issues. Beyond it the request is
# malformed (400) and the client is expected to chunk; bounds one transaction's writes.
app.agile.max-issues-per-bulk-move=${AGILE_MAX_BULK_MOVE:100}

# --- Custom roles (HD-127) --------------------------------------------------
# Custom roles per workspace, counted across BOTH scopes with built_in = false;
# the built-in templates belong to no workspace and never count. Creating past it
# is 409 ROLE_LIMIT_REACHED.
#
# A SPRAWL GUARD, NEVER A LICENCE CHECK: custom roles are a product feature and
# not a plan feature, so this value is identical in dc and cloud and must never
# become profile-gated. If custom roles were ever limited per deployment it would
# be by lowering this number, never by a second code path.
#
# There is deliberately no cache knob here. The roleView TTL is a security window
# (how long a revoked permission survives on a node that did not serve the edit)
# and is pinned in CacheConfig at 10s; see RolePermissionCache's javadoc.
app.roles.max-custom-per-workspace=${ROLES_MAX_CUSTOM_PER_WORKSPACE:50}

# --- Workspace defaults (HD-130) --------------------------------------------
# The project-access mode a NEWLY CREATED workspace starts in: OPEN (everyone in
# the workspace can work in every project, through each project's default role) or
# STRICT (only people added to a project can change anything in it; everyone can
# still SEE every project).
#
# It NEVER changes an existing workspace. V14 set every workspace OPEN and no
# property may retroactively move one — the only way is PATCH /api/workspaces/{ws}.
#
# NOT profile-gated and it must never become so: access modes are a product
# feature, not a plan feature, so this default is identical in dc and cloud.
# Demo seeding goes through the same WorkspaceService.create, so an operator who
# sets STRICT gets a strict demo workspace, which is correct and is not
# special-cased. An invalid value fails fast at startup.
app.workspace.default-project-access-mode=${DEFAULT_PROJECT_ACCESS_MODE:OPEN}

# --- Reports (HD-5) ---------------------------------------------------------
# Bounds on every report. Same posture as the agile/classification caps: guards and
# product defaults, NOT mode switches — identical values in dc and cloud, no profile
# override, no feature flag. Reporting depth is a product property; if it were ever
# limited per deployment it would be by lowering a number, never by a second code path.
# All three are validated (@Min/@Max): an out-of-range value fails startup instead of being
# clamped behind the operator's back.
#
# Widest window one report may span, in days, counting BOTH endpoints. A wider request
# is refused with 400 and the cap named in the message — it is NEVER silently narrowed,
# because a chart of a window nobody asked for is how a report earns "these numbers
# don't match what I expected". Valid range 1-3650; at interval=DAY the window length IS
# the number of points in the response, which is what the upper bound guards.
app.reports.max-window-days=${REPORTS_MAX_WINDOW_DAYS:365}
# Most issue ROWS one report may materialise before it declares itself truncated
# (meta.truncated / meta.cap in every report response). It does not bite on the flow
# report, which aggregates in PostgreSQL and returns one row per bucket; it is the
# budget for the row-level reports (cycle time, aging WIP). Valid range 1-50000: the
# number is ROWS but what constrains it is BYTES — a shipped row costs ~1.9 KB of
# transient heap at worst because the JDBC row, the DTO and the buffered JSON are all
# alive at once, so 50000 is ~95 MB for ONE request where the old 200000 ceiling was
# ~380 MB. That ceiling is sized against a 512 MB reference heap, which since HD-152
# the deployment supplies rather than assumes: the image runs -XX:MaxRAMPercentage=50
# and docker-compose.prod.yml limits the app container to 1g (APP_MEMORY_LIMIT). The
# heap follows the CONTAINER limit, so a bigger limit makes this ceiling conservative,
# no limit at all takes the percentage against host RAM, and an operator at 4g or more is
# told to pin -Xmx instead (the 50% split over-reserves at a large limit, because most
# non-heap cost is constant). So 512 MB is the figure this is stated against, not a
# guarantee - re-read the arithmetic in ReportProperties whenever either end moves.
app.reports.max-rows=${REPORTS_MAX_ROWS:20000}
# How many report requests ONE USER may make per minute across the whole reports surface
# (every .../projects/*/reports/** endpoint, not per report) PLUS POST .../search/insights,
# the Insights panel — a report that does NOT live under the reports path (its dataset is an
# HQL query, so it hangs off /search) and is bound to this limiter explicitly rather than by
# prefix. For the project-scoped reports this is the only bound on the WORK a report does —
# max-window-days bounds the response array, not the cost of producing it, and the opening
# balance is O(project history) by design. Insights is the one exception to "only bound":
# it is ALSO inside app.search.requests-per-minute below, so it spends both budgets and the
# lower configured value binds — lowering EITHER property lowers the panel. Past the budget
# the answer is 429 + Retry-After, never a narrowed or wrong report. Valid range 1-10000;
# there is no "unlimited" value (0 fails startup) — the off switch is RATE_LIMIT_ENABLED,
# the master switch for every limiter that HAS an off switch. Not "every limiter": the
# backlog-rebalance cooldown in IssueRankService is outside it, deliberately and permanently
# (see the app.rate-limit.enabled block above).
app.reports.requests-per-minute=${REPORTS_REQUESTS_PER_MINUTE:60}

# ---- Search ----------------------------------------------------------------
# How many SEARCH-surface requests ONE USER may make per minute: POST .../search,
# GET .../search/schema, GET .../search/suggest, POST .../search/insights (which
# also spends the reports budget above — it is a report that happens to live on the
# search path, so the lower configured value binds) and the saved-filter endpoints
# under .../filters, which are not on the /search path and are on this budget anyway:
# creating or editing a filter validates its HQL, and that builds the same
# ResolutionContext that GET .../search/schema pays for. Search is not the cheap surface it
# looks like: one query may carry up to 50 leaf predicates, a `text ~ "..."` leaf is
# two unanchored unindexable LIKEs over a TEXT column, and the search endpoint runs
# the whole predicate TWICE per request (count + page) — more expensive than the
# heaviest insights shape, which was already throttled. Its own budget rather than the
# reports one because a person typing in a search box legitimately fires several
# requests a minute while nobody types a chart; 120 is ~10x ordinary SPA use. Past the
# budget: 429 + Retry-After. Valid range 1-10000; there is no "unlimited" value (0
# fails startup) — the off switch is RATE_LIMIT_ENABLED, the master switch for every
# limiter that HAS an off switch. Not "every limiter": the backlog-rebalance cooldown in
# IssueRankService is outside it, deliberately and permanently (see the
# app.rate-limit.enabled block above).
app.search.requests-per-minute=${SEARCH_REQUESTS_PER_MINUTE:120}

# ---- Invitations (HD-190) --------------------------------------------------
# Ceilings on the invitation MAILER. Without them any account that can log in can make
# Hamstrack send mail to any address on the internet, without limit, by typing that
# address into the invite box of a workspace it created seconds earlier — public signup
# is on and nothing bounds how many workspaces one user creates, so the account costs one
# throwaway mailbox and the mail carries our SPF/DKIM.
#
# THREE WINDOWS AND NO PER-MINUTE ONE. The quota at risk is 3000 messages a MONTH, and any
# per-minute ceiling loose enough for a human is ~28800/day — a rate window and a quota are
# different units. Hour bounds a burst, DAY IS THE QUOTA CONTROL, cooldown bounds the
# harassment. Past any of them: 429 + Retry-After, spent AFTER the workspace is resolved,
# so unlike every other 429 in this API it is only ever seen by a proven member.
#
# All five are validated (@Min/@Max): an out-of-range value fails startup instead of being
# clamped behind the operator's back. THERE IS NO "UNLIMITED" VALUE — 0 is out of range on
# every one of them; the off switch is RATE_LIMIT_ENABLED, and an operator who wants no
# practical ceiling writes the top of the range.
#
# Identical in dc and cloud and they must never become profile-gated. A DC install with
# public signup switched on has exactly the Cloud abuse profile, so a profile-keyed default
# would protect Cloud and leave the actually exposed install on the loose numbers. The
# escape hatch is a number, not a code path: an admin onboarding 300 people raises one env
# var for a day.
#
# Invitations ONE PRINCIPAL may send per hour / per day. Independent windows, not multiples:
# spending the hourly allowance five times over ends the day. Counted IN MEMORY, per node
# (N replicas allow N x these) — the volume budget protects a spend, not a person, so the
# usual degradation is acceptable. 100/day against a 3000/month quota is ~1/30 of the month:
# a condition an operator has a month to notice. Deliberately the first number an operator
# raises — a DC admin onboarding 300 people on install day WILL hit it.
app.invites.max-per-sender-per-hour=${INVITE_MAX_PER_SENDER_PER_HOUR:20}
app.invites.max-per-sender-per-day=${INVITE_MAX_PER_SENDER_PER_DAY:100}
# THE ONE THAT CLOSES THE ATTACK: how long one principal must wait before inviting THE SAME
# ADDRESS again, ACROSS EVERY WORKSPACE IN THE INSTANCE. The abuse is one victim and a
# succession of workspaces the abuser creates, so a per-workspace bound (and HD-133's
# workspace_invites_pending_email_uk) inspects the wrong dimension entirely. Keyed on the PAIR
# rather than on the recipient alone, so the refusal only ever describes the caller's own
# past action. Its state is PERSISTED in mail_send_events and NOT for durability: derived
# from workspace_invites it would be cleared by three existing paths, one of which is the
# victim's own decline button (declineInvite does a DELETE). See ADR-0015.
app.invites.recipient-cooldown-minutes=${INVITE_RECIPIENT_COOLDOWN_MINUTES:60}
# INVITATIONS one address may receive per day from senders other than you, plus how many of
# your own you may send to it — one number, spent on both. Counted as "my own sends one
# each, every OTHER sender once": counting raw sends let ONE account spend a named person's
# whole daily allowance and lock every workspace on the instance out of inviting them, and
# counting only distinct senders would let one account ring the doorbell all day. This way
# five throwaway accounts inviting one victim once each still trip it at the sixth, while
# any single account is capped at this many sends to one inbox and at one slot as far as
# everybody else is concerned. Per KIND of mail, so HD-202's reset/verification caps are
# separate buckets — a stranger's invitations must not suppress a victim's own reset.
# The key counted is the INBOX (+tags and Gmail dots folded), not the spelling.
# RAISING THIS COSTS MORE THAN IT LOOKS, because the bound on one INBOX is quadratic in it and
# not equal to it: both caps above are per-ACCOUNT, so N colluding accounts each sending until
# own + (N-1) reaches the cap deliver floor((cap+1)^2/4) messages to one address in a day - nine
# at the default of 5, thirty at 10. Doubling this knob roughly triples the harassment ceiling.
# (Argued on RecipientMailThrottle and on InviteProperties.maxPerRecipientPerDay; repeated here
# because this file is where the DEFAULT is changed, and a deployment only overrides it.)
# Accepted trade-off: at the sixth invitation an innocent admin learns this address was
# invited from workspaces they cannot see — one bit, only reachable by someone who already
# holds workspace.member.manage and already knows the address. The refusal's WORDING is what
# keeps it at one bit. Its Retry-After names a DEADLINE rounded up to a coarse quantum (not a
# duration rounded to one — rounding the duration re-anchors the quantum to "now" and lets a
# repeat caller watch it step down onto the true instant), so every probe reports the same
# moment and the number itself decreases one per second. That raises the price of the
# stranger's send instant from one cheap 429 to continuous polling; a caller who simply waits
# for the refusal to lift still learns it, which is inherent to any retryable window.
# This and the cooldown are CLUSTER-WIDE AND EXACT (state in PostgreSQL).
app.invites.max-per-recipient-per-day=${INVITE_MAX_PER_RECIPIENT_PER_DAY:5}
# How long mail_send_events rows are kept. It must outlast EVERY ceiling window, because a
# swept row is a row no ceiling can count — set it below one and that ceiling silently
# shortens to it, with no error. SOME OF THOSE WINDOWS ARE NOT SETTABLE FROM HERE: the
# cooldown above is a property, but every per-recipient volume cap in the product counts over
# a width fixed in code, those widths differ per kind of mail, and a new kind adds another —
# so startup does NOT compare against a list of today's windows. It compares against
# max(cooldown, MailThrottlePolicy.MAX_CEILING_WINDOW), i.e. the widest width any ceiling is
# ALLOWED to declare (24h, enforced on every policy at bean creation). That is where the valid
# range starting at 2 comes from: one day would be exactly that bound, and exactly is not
# cover — a replica whose sweep clock runs a second ahead deletes a row another replica's
# count still needs, and the only symptom is a send that should have been refused.
# ROWS NOBODY SIGNED FOR LIVE FOR min(2 days, this value), not for this value: the anonymous
# auth-mail sweep has its own 2-day cutoff (their forensic value is a sender id they do not
# have, and they are the only rows an unauthenticated stranger can make you write), while the
# sweep below carries no sender predicate and reaches them too. At the default of 7 the
# anonymous cutoff gets there first; at 2 the two coincide exactly.
# The rest of the window is forensic: after the MailDailyVolumeHigh alert fires this table is
# the only place that can answer WHO and WHICH ADDRESSES — the metrics deliberately cannot
# (bounded cardinality). The sweep runs whether or not RATE_LIMIT_ENABLED is true.
app.invites.event-retention-days=${INVITE_EVENT_RETENTION_DAYS:7}

# ---- Anonymous auth mail (HD-202) ------------------------------------------
# Ceilings on the mailers ANYBODY on the internet can aim at a stranger:
# POST /api/auth/forgot-password, POST /api/auth/resend-verification and
# POST /api/auth/register. All were
# "look the address up and send", bounded only by the per-IP window above — and a
# budget keyed on where a request came from can always be widened by coming from
# somewhere else, so the thing under attack (the address) is what has to be counted.
# That gap was survivable only while RATE_LIMIT_TRUST_FORWARDED_FOR never reached the
# production container and every request in the world shared one bucket; HD-199 fixed
# the flag, correctly, and the bucket became one per VISITOR. A proxy pool therefore
# has unlimited buckets, all of which can be pointed at one address, and every message
# goes out from our domain with the victim's address in To.
#
# SAME MECHANISM AND SAME TABLE AS app.invites.* — RecipientMailThrottle over
# mail_send_events — so these are CLUSTER-WIDE AND EXACT (N replicas allow this many,
# not N x this many), and they need no migration. Counts are per KIND of mail, so one
# address may receive the reset cap AND the verification cap AND the invitation cap: a
# shared bucket would let a stranger's traffic suppress the one piece of mail the
# victim actually asked for.
#
# THE REFUSAL IS SILENT ON TWO OF THE THREE, AND THAT IS THE CONTRACT, NOT AN OMISSION.
# forgot-password and resend-verification answer one sentence whether or not the address is
# registered; that uniformity is what stops them being an account-enumeration oracle. A 429
# would not leak existence (the ceiling is spent BEFORE the account lookup and recorded
# either way) but it would leak, to anybody, for free, that somebody asked for a reset at
# this address in the last minute. So a refused request there sends no mail, returns the
# usual 200 and the usual sentence, and shows up ONLY on the password_reset_recipient_* /
# verification_recipient_* refusal meters. Register is the exception: it already discloses
# address existence through its own 409, so it answers 429 and its refusals also land on the
# registration_verification_recipient_* pair. If you are diagnosing "my users stopped getting
# reset links", ALL THREE PAIRS are where to look — nothing else will say so for the first two.
#
# Both are validated (@Min/@Max): out of range fails startup rather than being clamped.
# There is no "unlimited" value — 0 is out of range; the off switch is RATE_LIMIT_ENABLED.
# Identical in dc and cloud and must never become profile-gated. forgot-password and
# resend-verification are open in both modes regardless of PUBLIC_SIGNUP_ENABLED, which is
# what makes the argument stronger here than for the invite ceilings; register is NOT — DC
# defaults that flag off — and it needs the same numbers anyway, because a DC install with
# public signup switched on has exactly the Cloud abuse profile.
#
# How long ONE ADDRESS waits before another link of the same kind can be sent to it,
# whoever asks — the flows are anonymous, so every request shares one bucket per address.
# One minute is what a person who mistyped their address twice needs and what a script
# cannot use. Capped at 14 = one minute INSIDE the narrowest of the fixed windows below (15,
# password reset), because one property feeds every policy here. A cooldown AS WIDE AS the
# window it sits inside already makes that window's cap unreachable — the first send starts a
# cooldown running to the far edge — so the bound is exclusive and startup refuses to build
# such a policy. It was 14-versus-15 the wrong way round until review: the guard rejected only
# a strictly wider cooldown, so exactly 15 was settable, in range, and unreachable.
app.auth-mail.recipient-cooldown-minutes=${AUTH_MAIL_RECIPIENT_COOLDOWN_MINUTES:1}
# How many of EACH kind one address may receive per WINDOW, counted across everybody who
# asked. THE WINDOWS ARE FIXED, NOT CONFIGURABLE, AND THEY ARE NOT THE SAME WIDTH:
# 15 minutes for password reset, 1 hour for verification and 1 hour for registration. The
# width is a security decision, not a capacity one.
#
# THERE ARE THREE BUCKETS, NOT TWO, AND EACH IS SPENT OVER ITS OWN WINDOW — so the bound on
# one inbox is not a multiple of this number, it is a sum of rates. At the default of 5:
# 5 per quarter-hour of reset mail (= 20/h), 5 an hour of resend-verification, 5 an hour of
# registration mail. THIRTY an hour into one inbox, not fifteen, because the reset bucket
# refills four times inside the hour. Register holds its own (registration_verification) rather than
# sharing resend-verification's: resend records BEFORE the account lookup and unconditionally
# — it must, or the row itself says whether the account exists — so at an address with no
# pending account it sends NO mail, logs nothing above DEBUG, and still filled register's
# ceiling. Five such requests an hour denied signup to every spelling of a stranger's inbox,
# free, silent and refillable for ever. The split cost the third bucket in the sum above.
#
# Why they differ: a ceiling on a RECOVERY flow is also a denial of it. Anybody can type a
# victim's address into forgot-password, so whoever fills that window decides how long the
# person cannot reset their own password — silently. But SUSTAINED denial is achievable at
# every width (no per-address ceiling can be built that cannot be filled), so a wide window
# buys no prevention; it only lowers the attacker's effort. What it really buys is the mail
# bound, and what it costs is the length of a HIT-AND-RUN lockout, which is the common case:
# five requests fired once buy the whole window. 20 reset mails/hour is a nuisance and stays
# a factor of 3 under the deliverability number; 60 minutes of silent lockout is not.
# Verification keeps the hour because it locks nobody out of an account they hold. Registration
# keeps it too, and there for the mail-bomb reason: it is the flow most exposed to one inbox
# reached through many spellings, so the tighter mail bound is the better half of the trade.
#
# RAISING THIS MOVES TWO THINGS IN OPPOSITE DIRECTIONS: more mail one address can be sent in
# a window, and less ability for somebody to withhold that address's own recovery for the
# rest of it. Move it in small steps. The refusal meters named above see a BURST; they do
# NOT see the sustained attack, which is never refused — hamstrack_mail_anonymous_recipient_max
# and the mail_send_events query in docs/self-hosting.md are what see that one.
app.auth-mail.max-per-recipient-per-window=${AUTH_MAIL_MAX_PER_RECIPIENT_PER_WINDOW:5}
