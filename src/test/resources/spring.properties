# HD-343. THE SPRING TEST CONTEXT CACHE IS BOUNDED HERE, FOR EVERY RUNNER.
#
# This file is read by org.springframework.core.SpringProperties, whose static
# initialiser loads the classpath resource literally named `spring.properties`
# (read from spring-core 7.0.8 bytecode). It is therefore in force for anything
# that puts src/test/resources on its classpath: `mvnw test`, a single class run
# from IntelliJ, a VS Code run, a `-Dtest=` narrowing. That reach is the reason
# the setting lives here and not in the Surefire <systemPropertyVariables> block
# of pom.xml next to its sibling dials.
#
# THE TWO HALVES OF HD-343 DO NOT HAVE THE SAME REACH, AND THAT IS NOT A
# TIDINESS PROBLEM TO BE FIXED LATER. The heap and metaspace bounds are in
# pom.xml's `argLine` property and reach ONLY the Maven fork -- an IDE builds its
# own command line and passes neither, exactly as the <enableAssertions> comment
# in that file has said about -ea since before this ticket. So a developer
# running one class from the editor gets a bounded context cache (this file) and
# the JVM's ergonomic default heap (1/4 of physical RAM; 3.84 GiB on the box
# below). Of the two, this is the half worth having everywhere: the cache is the
# lever that decides how much is held, and the heap bound only decides whether a
# breach arrives as an OutOfMemoryError or as a kill with no output.
#
# PRECEDENCE, AND THE TRAP IN IT. SpringProperties.getProperty consults this
# file FIRST and falls back to System.getProperty only when the key is absent
# here (measured, spring-core 7.0.8 bytecode: localProperties.getProperty, then
# ifnonnull, then System.getProperty). That is the reverse of the usual Spring
# ordering, so a `-Dspring.test.context.cache.maxSize=32` on the command line is
# SILENTLY IGNORED while this line exists. To try another value -- for a
# negative control, or because the trade below has moved -- edit this file.
# JvmBoundsTest#anIgnoredSystemPropertyOverrideIsNotSilent turns that silence
# into a red test rather than a puzzling afternoon.
#
# WHY 8. MEASURED 2026-10-09 on the development box this ticket was filed from:
# Windows 11, 15.37 GiB physical RAM, 12 logical processors, OpenJDK 21.0.12.1.
# One Surefire fork (forkCount=1, reuseForks=true -- one JVM for the whole
# suite), -Xmx3500m so that the heap was never the constraint, GC and metaspace
# logged, and the SAME 114 test classes / 641 tests each time
# (`-Dtest=com.hamstrack.common.**`), so the only variable is this number:
#
#   maxSize   wall clock   peak heap used   peak heap committed   metaspace
#      4        4:31           1125 MiB          1210 MiB         163 MiB
#      8        4:26           1111 MiB          1188 MiB         163 MiB
#     16        4:24           1246 MiB          1324 MiB         163 MiB
#     32        4:25           1336 MiB          1508 MiB         162 MiB
#   (32 = Spring's default, ContextCacheUtils.retrieveMaxCacheSize)
#
# THE TRADE, in the only terms that decide it: contexts rebuilt against memory
# held. Across the four values the wall clock moves 7 seconds over a 4.5-minute
# subset -- less than the spread between two runs of the same command -- while
# the committed heap moves 320 MiB. So the cache buys almost no time here and
# costs a third of a gigabyte, and 8 is the knee: 16 and 32 pay 136 MiB and
# 320 MiB for nothing measurable, and 4 is both marginally slower (4:31, the
# rebuilds starting to show) and no smaller (1210 MiB).
#
# WHY IT BUYS SO LITTLE TIME, which is the part that would otherwise look too
# good to be true: the cache only pays off when several classes SHARE a context
# configuration. Approximated over the tree on 2026-10-09 (a signature built
# from the context-affecting annotations, so treat it as an estimate and not a
# count): 223 classes boot a context, they ask for about 74 distinct
# configurations, and 59 of those 74 are asked for by exactly ONE class -- those
# are built once and used once at any cache size. One configuration is shared by
# ~93 classes, and keeping that one resident is most of what a cache of 8 is
# for.
#
# NOTE ON THE OTHER COPY OF THESE NUMBERS. docs/project-state.md states
# 61/48/119 for what reads like the same thing on the same day, and the
# difference is the POPULATION, not a contradiction: that one counts distinct
# `@SpringBootTest` ARGUMENT SIGNATURES, this one counts a wider signature that
# also folds in @ActiveProfiles, @TestPropertySource, @ContextConfiguration,
# @Import, @AutoConfigureMockMvc and the mocked bean names -- i.e. more of what
# Spring's own cache key actually contains, which is why it finds more distinct
# configurations (74) than the annotation alone does (61). Both are estimates of
# the same quantity from different distances; neither is the cache's real key,
# which only a run can report.
#
# THE FULL SUITE AT THIS VALUE, measured on the same box, unfiltered, with the
# [test-tree] arm armed and the frontend skipped: 310 test classes, 2064 tests,
# 0 failures, 45-47 minutes. The cache bound is not what makes that slow -- one
# ops class that drives real shell scripts (ApplyConfigVerifyPhaseTest, 698 s)
# is 26% of it on its own -- and the subset A/B above puts this setting's own
# wall-clock effect inside the noise between two runs of the same command. The
# wall clock and whether forkCount should rise above 1 are deliberately out of
# scope here: parallel forks multiply the memory problem rather than solve it,
# and would need these bounds in place first. README.md carries the number for
# somebody deciding whether to start a run.
spring.test.context.cache.maxSize=8
